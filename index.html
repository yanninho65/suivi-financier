        <div class="txn-line">${U.escHtml(txnLine3(t))}</div>
      </div>
      <div class="txn-amt ${cls}">${t.type==="Transfer" ? U.fmtMoney(t.montant) : U.fmtMoneySigned(t.montant)}</div>
    </div>
  `;
  el.onclick = ()=> openTxnDetail(t.id, navIds);
  return el;
}

function capitalize(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }

/* Determine the group key/label/sort value for a transaction, given the active group-by mode */
function getGroupInfo(t, groupBy){
  if(groupBy==="day"){
    return {key:t.dateISO, label:U.fmtDateLong(t.date), sortVal:t.date.getTime()};
  }
  if(groupBy==="month_indiquee"){
    const y=t.date.getFullYear(), m=t.date.getMonth();
    return {key:y+"-"+U.pad2(m+1), label:capitalize(U.fmtMonthYear(y,m)), sortVal:y*12+m};
  }
  if(groupBy==="month_transformee"){
    const ym = AGG.getCalcMonthYM(t);
    const y=ym.y, m=ym.m;
    return {key:"t"+y+"-"+U.pad2(m+1), label:capitalize(U.fmtMonthYear(y,m)), sortVal:y*12+m};
  }
  // dimension-based grouping: groupe / categorie / compte / personne
  const v = AGG.dimDisplayValue(t, groupBy);
  return {key:v, label:v};
}
const CHRONO_MODES = ["day","month_indiquee","month_transformee"];

/* Regroupe les transactions filtrées selon le mode actif (chronologique ou par dimension), avec
   totaux par groupe et tri approprié. Fonction commune à tous les modes d'affichage. */
function computeTxnGroups(filtered, groupBy){
  const isChrono = CHRONO_MODES.includes(groupBy);
  const groups = new Map(); // key -> {key, label, sortVal, items:[], income, expense, count}
  filtered.forEach(t=>{
    const g = getGroupInfo(t, groupBy);
    if(!groups.has(g.key)) groups.set(g.key, {key:g.key, label:g.label, sortVal:g.sortVal, items:[], income:0, expense:0, count:0});
    const o = groups.get(g.key);
    o.items.push(t);
    if(t.type==="Income") o.income += t.montant;
    else if(t.type==="Expense") o.expense += t.montant;
    o.count++;
  });
  const arr = Array.from(groups.values());
  arr.forEach(g=> g.items.sort((a,b)=>b.date-a.date));
  if(isChrono){
    arr.sort((a,b)=> b.sortVal - a.sortVal);
  } else if(groupBy==="categorie"){
    // Range catégorie par Revenu puis Dépense, puis ordre alphabétique
    const typeMap = AGG.classifyCategoryTypes(filtered);
    arr.sort((a,b)=>{
      const ka = typeMap.get(a.key) || "Expense", kb = typeMap.get(b.key) || "Expense";
      if(ka!==kb) return ka==="Income" ? -1 : 1;
      return a.key.localeCompare(b.key, 'fr');
    });
  } else if(groupBy==="type"){
    // Ordre fixe : Revenus, Dépenses, Transferts
    const rank = {"Revenus":0, "Dépenses":1, "Transferts":2};
    arr.sort((a,b)=> (rank[a.key]??99) - (rank[b.key]??99));
  } else {
    arr.sort((a,b)=> (Math.abs(b.income)+Math.abs(b.expense)) - (Math.abs(a.income)+Math.abs(a.expense)));
  }
  return arr;
}

/* Ordre "à plat" (toutes les transactions filtrées, tous groupes confondus, dans l'ordre visuel exact —
   groupes puis éléments triés comme dans computeTxnGroups) : sert de base à la navigation précédent/suivant
   de la fiche transaction, indépendamment des groupes repliés ou du nombre d'éléments actuellement affichés
   (pagination/scroll infini n'en tronquent pas la portée). */
function flattenTxnGroupIds(arr){
  const ids = [];
  arr.forEach(g=> g.items.forEach(t=> ids.push(t.id)));
  return ids;
}

let txnScrollObserver = null;

function renderTransactions(){
  if(txnScrollObserver){ txnScrollObserver.disconnect(); txnScrollObserver=null; }
  const view = document.getElementById("view-transactions");
  if(Store.transactions.length===0){
    view.innerHTML = `<div class="section" style="margin-top:10px;">${emptyStateHtml({
      title:"Aucune transaction", text:"Importez vos données pour voir la liste de vos transactions ici.", showDemo:true
    })}</div>`;
    wireEmptyState(view);
    return;
  }
  const filtered = AGG.applyFilters(Store.transactions);
  const totals = AGG.computeTotals(filtered);
  const groupBy = APP.state.txnGroupBy;
  const allExpanded = !!Store.settings.txnGroupsExpanded;

  let html = `<div class="section" style="padding-top:14px;padding-left:12px;padding-right:12px;">
    <div style="display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;gap:8px;">
      <span style="font-size:13px;color:var(--text-sub);font-weight:600;">${filtered.length.toLocaleString('fr-FR')} transaction${filtered.length>1?"s":""}</span>
      <span style="font-size:13px;font-weight:800;color:${totals.net>=0?'var(--income)':'var(--expense)'}">${U.fmtMoneySigned(totals.net)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <button type="button" class="txn-view-pill" id="txn-view-indicator">
        ${ICONS.layers}<span>${U.escHtml(APP.GROUPBY_LABEL[groupBy])}</span>
        <span class="tvp-chev" style="display:flex;transform:rotate(180deg);">${ICONS.arrowLeft}</span>
      </button>
      <button type="button" class="txn-view-pill" id="txn-expand-toggle">
        <span style="display:flex;transform:rotate(${allExpanded?90:-90}deg);">${ICONS.arrowLeft}</span>
        <span>${allExpanded?"Tout replier":"Tout déplier"}</span>
      </button>
    </div>
  </div>`;

  if(filtered.length===0){
    html += `<div class="section"><div class="empty-state">${ICONS.search}<h3>Aucun résultat</h3><p>Essayez d'ajuster vos filtres ou votre recherche.</p></div></div>`;
    view.innerHTML = html;
    wireViewIndicator();
    return;
  }

  html += `<div class="section" id="txn-list-section" style="padding-left:12px;padding-right:12px;"></div>
  <div id="txn-scroll-sentinel" style="height:1px;"></div>`;
  view.innerHTML = html;
  wireViewIndicator();

  const listSection = document.getElementById("txn-list-section");
  const sentinel = document.getElementById("txn-scroll-sentinel");

  const arr = computeTxnGroups(filtered, groupBy);
  const navIds = flattenTxnGroupIds(arr);
  renderTxnGroupCards(listSection, arr, navIds);
  setupTxnInfiniteScroll(sentinel, arr);
}

function wireViewIndicator(){
  const btn = document.getElementById("txn-view-indicator");
  if(btn) btn.onclick = ()=> window.__SF_VIEWS.openDisplayMenu();
  const expandBtn = document.getElementById("txn-expand-toggle");
  if(expandBtn) expandBtn.onclick = ()=>{
    // Réglage global persistant ("se rappeler quand je quitte la page ou change d'onglet") : on
    // efface les dépassements individuels pour repartir d'un état homogène (tout ouvert ou tout fermé).
    const next = !Store.settings.txnGroupsExpanded;
    Store.settings.txnGroupsExpanded = next;
    Store.saveSettings();
    APP.state.txnOpenGroups.clear();
    renderTransactions();
  };
}

/* Affiche les groupes (Jour / Mois / Compte / Groupe / Catégorie / Personne) sous forme de cartes
   repliables identiques dans tous les modes, avec le total du groupe dans son en-tête. Par défaut,
   l'état d'ouverture de chaque groupe suit le réglage global "Tout déplier / Tout replier"
   (Store.settings.txnGroupsExpanded, persistant) ; un dépassement individuel (clic sur un groupe
   précis) est mémorisé le temps de la session (APP.state.txnOpenGroups) afin de survivre aux
   re-rendus déclenchés par "Afficher plus" ou par le chargement automatique au scroll. */
function renderTxnGroupCards(listSection, arr, navIds){
  const groupsShown = APP.state.txnGroupsShown;
  const shownGroups = arr.slice(0, groupsShown);
  const perGroupMap = APP.state.txnPerGroupShown;
  const openGroups = APP.state.txnOpenGroups;
  const allExpanded = !!Store.settings.txnGroupsExpanded;

  shownGroups.forEach(g=>{
    const net = g.income + g.expense;
    const details = document.createElement("details");
    details.className = "card txn-group-card";
    details.dataset.gkey = g.key;
    details.style.padding = "0";
    details.style.marginBottom = "10px";
    const isOpen = openGroups.has(g.key) ? openGroups.get(g.key) : allExpanded;
    if(isOpen) details.open = true;
    details.addEventListener("toggle", ()=>{
      openGroups.set(g.key, details.open);
    });

    const perShown = perGroupMap[g.key] || 10;
    const itemsToShow = g.items.slice(0, perShown);

    const summary = document.createElement("summary");
    summary.style.cssText = "list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;";
    summary.innerHTML = `
      <span style="font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;">${U.escHtml(g.label)}</span>
      <span style="display:flex;align-items:center;gap:10px;flex:0 0 auto;">
        <span style="font-size:12px;color:var(--text-sub);font-weight:600;">${g.count}</span>
        <span style="font-weight:800;font-size:13.5px;color:${net>=0?'var(--income)':'var(--expense)'}">${U.fmtMoneySigned(net)}</span>
      </span>
    `;
    details.appendChild(summary);

    const body = document.createElement("div");
    body.style.cssText = "padding:0 0 10px;";
    itemsToShow.forEach(t=>{
      const el = makeTxnItemEl(t, navIds);
      el.style.margin = "6px 6px 0";
      body.appendChild(el);
    });
    if(g.items.length > perShown){
      const more = document.createElement("button");
      more.className = "btn btn-ghost btn-sm";
      more.style.cssText = "display:block;width:calc(100% - 12px);margin:8px 6px 0;";
      more.textContent = "Afficher tout ("+(g.items.length-perShown)+" restantes)";
      more.onclick = (ev)=>{
        ev.preventDefault();
        const rectBefore = details.getBoundingClientRect().top;
        const prevKey = APP.state.txnFullyShownGroup;
        if(prevKey && prevKey!==g.key) delete perGroupMap[prevKey]; // un seul groupe "Afficher tout" à la fois (perf)
        perGroupMap[g.key] = g.items.length;
        APP.state.txnFullyShownGroup = g.key;
        renderTransactions();
        // Le groupe cliqué doit rester au même endroit à l'écran, même si un autre groupe s'est
        // replié au-dessus entre-temps (repli croisé ci-dessus) et a fait glisser tout le reste.
        const newListSection = document.getElementById("txn-list-section");
        const newDetails = newListSection && Array.from(newListSection.children).find(el=>el.dataset && el.dataset.gkey===g.key);
        if(newDetails){
          const delta = newDetails.getBoundingClientRect().top - rectBefore;
          if(delta) window.scrollBy(0, delta);
        }
      };
      body.appendChild(more);
    }
    details.appendChild(body);
    listSection.appendChild(details);
  });
}

function setupTxnInfiniteScroll(sentinel, arr){
  if(txnScrollObserver){ txnScrollObserver.disconnect(); txnScrollObserver=null; }
  const groupsShown = APP.state.txnGroupsShown;
  if(arr.length <= groupsShown) return;
  txnScrollObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        txnScrollObserver.disconnect();
        txnScrollObserver = null;
        APP.state.txnGroupsShown += 20;
        renderTransactions();
      }
    });
  }, {root:null, rootMargin:"600px"});
  txnScrollObserver.observe(sentinel);
}

/* ================= TRANSACTION DETAIL ================= */
/* ================= FICHE TRANSACTION (détail + édition unifiées) =================
   Chaque champ se modifie au tap direct — plus de mode "Modifier" séparé : toucher Catégorie ouvre le
   picker Catégorie, toucher Montant ouvre un éditeur compact, etc. (cf. openInlineEditor / openPicker).
   Pour une transaction existante, chaque changement de champ est enregistré immédiatement ; l'id étant
   dérivé du contenu (cf. buildTxnId), il change à chaque édition — suivi via `currentId` le temps que la
   fiche reste ouverte. Pour une nouvelle transaction (id=null, y compris "Dupliquer"), les champs sont
   d'abord accumulés dans un brouillon local puis validés en un seul geste via "Enregistrer". */
const TYPE_LABEL_FR = {Income:"Revenu", Expense:"Dépense", Transfer:"Transfert"};
const TYPE_LABEL_FR_TO_CODE = {"Revenu":"Income", "Dépense":"Expense", "Transfert":"Transfer"};
const TAP_CHEVRON = `<span style="color:var(--text-faint);display:inline-flex;vertical-align:middle;margin-left:4px;flex:0 0 auto;">${ICONS.arrowLeft.replace('<svg ','<svg style="width:12px;height:12px;transform:rotate(180deg);" ')}</span>`;

function openTxnDetail(id, navIds){ renderTxnDetail(id, null, navIds||null); }
function openTxnNew(){ renderTxnDetail(null, null); }
function openTxnEdit(id){ renderTxnDetail(id, null); } // alias conservé (compat)

function renderTxnDetail(id, seed, navList){
  const isNew = !id;
  let currentId = id;
  const draft = !isNew ? null : Object.assign({
    type:"Expense", categorie:"", personne:"", compte:"", compteCible:"", groupe:"", remarque:"",
    montant:0, montantSet:false, dateISO:U.toISO(new Date())
  }, seed ? {
    type:seed.type, categorie:seed.categorie||"", personne:seed.personne||"", compte:seed.compte||"",
    compteCible:seed.compteCible||"", groupe:seed.groupe||"", remarque:seed.remarque||"",
    montant:seed.montant, montantSet:true, dateISO:seed.dateISO
  } : {});

  /* Navigation précédent/suivant : `nav` est un instantané figé (copie) de l'ordre d'affichage au moment
     de l'ouverture — jamais recalculé depuis les filtres tant que la fiche reste ouverte. Ainsi, changer un
     champ qui ferait sortir la transaction du filtre actif (ex. changer de groupe alors qu'on est filtré sur
     un groupe) ne la fait pas disparaître de la séquence de navigation, et plusieurs modifications à la
     suite restent naviguables. `nav[navIndex]` est mis à jour avec le nouvel id à chaque modification
     (l'id est dérivé du contenu, cf. buildTxnId) pour que la position suive la transaction éditée. */
  let nav = (!isNew && Array.isArray(navList) && navList.length>1 && navList.indexOf(id)!==-1) ? navList.slice() : null;
  let navIndex = nav ? nav.indexOf(id) : -1;

  function current(){ return isNew ? draft : Store.transactions.find(x=>x.id===currentId); }

  function goToNavIndex(newIndex){
    if(!nav || newIndex<0 || newIndex>=nav.length) return;
    navIndex = newIndex;
    currentId = nav[navIndex];
    render();
  }
  function goPrev(){ goToNavIndex(navIndex-1); }
  function goNext(){ goToNavIndex(navIndex+1); }

  /* Fusionne `patch` (un ou plusieurs champs) dans la transaction et enregistre. Pour une transaction
     existante, reconstruit une ligne complète (rowToTxn a besoin de tous les champs à la fois) et remplace
     l'entrée dans Store.transactions — son id change forcément (dérivé du contenu). */
  function commit(patch){
    if(isNew){ Object.assign(draft, patch); render(); return; }
    const cur = current();
    if(!cur) return;
    const nextType = patch.type || cur.type;
    const row = {
      date: patch.dateISO!=null ? patch.dateISO : cur.dateISO,
      montant: patch.montant!=null ? patch.montant : cur.montant,
      type: nextType,
      categorie: nextType==="Transfer" ? "" : (patch.categorie!=null ? patch.categorie : cur.categorie),
      personne: nextType==="Transfer" ? "" : (patch.personne!=null ? patch.personne : cur.personne),
      compte: patch.compte!=null ? patch.compte : cur.compte,
      "compte cible": nextType==="Transfer" ? (patch.compteCible!=null ? patch.compteCible : cur.compteCible) : "",
      groupe: patch.groupe!=null ? patch.groupe : cur.groupe,
      remarque: patch.remarque!=null ? patch.remarque : cur.remarque,
    };
    const updated = DATA.rowToTxn(row);
    if(!updated){ APP.showToast("Valeur invalide"); return; }
    const idx = Store.transactions.findIndex(x=>x.id===currentId);
    if(idx===-1) return;
    Store.transactions[idx] = updated;
    currentId = updated.id;
    APP.state.detailTxnId = currentId;
    if(nav && navIndex>=0) nav[navIndex] = currentId;
    render();
    APP.refreshCurrentTab();
    Store.saveTransactions().then(ok=>{
      if(!ok) APP.showToast("Modifiée, mais la sauvegarde a échoué");
    });
  }

  function render(){
    const cur = current();
    if(!cur){ APP.closeOverlay("overlay-detail"); return; }
    APP.state.detailTxnId = currentId;
    const modal = document.getElementById("modal-detail");
    const isTransfer = cur.type==="Transfer";
    const hasMontant = !isNew || cur.montantSet;
    const montantDisplay = hasMontant ? (isTransfer ? U.fmtMoney(cur.montant) : U.fmtMoneySigned(cur.montant)) : null;
    const dateObj = isNew ? new Date(cur.dateISO+"T00:00:00") : cur.date;

    modal.innerHTML = `
      <div style="display:flex;justify-content:${isNew?'space-between':'flex-end'};align-items:center;margin-bottom:2px;">
        ${isNew?`<span class="u-title-lg">Nouvelle transaction</span>`:""}
        <button class="icon-btn" id="td-close">${ICONS.close}</button>
      </div>

      <div id="td-remarque" class="txn-tap-row" style="cursor:pointer;padding:8px 2px 16px;">
        <div style="font-weight:800;font-size:19px;line-height:1.3;${cur.remarque?'':'color:var(--text-faint);'}">${U.escHtml(cur.remarque||"(Sans titre)")}</div>
      </div>

      <div class="field-label" style="margin-top:0;">Détails</div>
      <div class="card" style="box-shadow:none;background:var(--card-alt);padding:4px 14px;">
        <div id="td-montant" class="detail-row txn-tap-row" style="cursor:pointer;padding:14px 2px;">
          <span>Montant</span>
          <span style="display:flex;align-items:center;gap:6px;">
            <span style="font-size:21px;font-weight:900;${montantDisplay?`color:${isTransfer?'var(--text)':(cur.montant<0?'var(--expense)':'var(--income)')};`:'color:var(--text-faint);font-weight:700;font-size:15px;'}">${montantDisplay || "Toucher pour ajouter"}</span>
            ${TAP_CHEVRON}
          </span>
        </div>
        <div id="td-date" class="detail-row txn-tap-row" style="cursor:pointer;"><span>Date</span><span>${U.escHtml(U.fmtDateLong(dateObj))}${TAP_CHEVRON}</span></div>
        <div id="td-type" class="detail-row txn-tap-row" style="cursor:pointer;"><span>Type</span><span>${TYPE_LABEL_FR[cur.type]}${TAP_CHEVRON}</span></div>
        ${isTransfer ? `
          <div id="td-compte" class="detail-row txn-tap-row" style="cursor:pointer;"><span>Compte source</span><span>${U.escHtml(cur.compte||"—")}${TAP_CHEVRON}</span></div>
          <div id="td-compte-cible" class="detail-row txn-tap-row" style="cursor:pointer;"><span>Compte cible</span><span>${U.escHtml(cur.compteCible||"—")}${TAP_CHEVRON}</span></div>
        ` : `
          <div id="td-compte" class="detail-row txn-tap-row" style="cursor:pointer;"><span>Compte</span><span>${U.escHtml(cur.compte||"—")}${TAP_CHEVRON}</span></div>
          <div id="td-categorie" class="detail-row txn-tap-row" style="cursor:pointer;"><span>Catégorie</span><span>${U.escHtml(cur.categorie||"—")}${TAP_CHEVRON}</span></div>
          <div id="td-personne" class="detail-row txn-tap-row" style="cursor:pointer;"><span>Personne</span><span>${U.escHtml(cur.personne||"—")}${TAP_CHEVRON}</span></div>
        `}
        <div id="td-groupe" class="detail-row txn-tap-row" style="cursor:pointer;"><span>Groupe</span><span>${U.escHtml(cur.groupe||"—")}${TAP_CHEVRON}</span></div>
      </div>

      <div style="display:flex;gap:10px;margin-top:16px;">
        ${isNew ? `
          <button class="btn btn-ghost" id="td-cancel" style="flex:1;">Annuler</button>
          <button class="btn btn-primary" id="td-save" style="flex:1;">Enregistrer</button>
        ` : `
          ${nav ? `<button type="button" class="icon-btn" id="td-nav-prev" title="Transaction précédente" aria-label="Transaction précédente" ${navIndex<=0?'disabled':''} style="flex:0 0 auto;width:44px;height:44px;${navIndex<=0?'opacity:.35;':''}">${ICONS.arrowLeft}</button>` : ""}
          <button class="btn btn-ghost" id="td-duplicate" title="Dupliquer" aria-label="Dupliquer" style="flex:1;justify-content:center;">${ICONS.copy}</button>
          <button class="btn btn-ghost" id="td-delete" title="Supprimer" aria-label="Supprimer" style="flex:1;justify-content:center;color:var(--expense);">${ICONS.trash}</button>
          ${nav ? `<button type="button" class="icon-btn" id="td-nav-next" title="Transaction suivante" aria-label="Transaction suivante" ${navIndex>=nav.length-1?'disabled':''} style="flex:0 0 auto;width:44px;height:44px;${navIndex>=nav.length-1?'opacity:.35;':''}">${ICONS.arrowLeft.replace('<svg ','<svg style="transform:rotate(180deg);" ')}</button>` : ""}
        `}
      </div>
    `;

    document.getElementById("td-close").onclick = ()=>APP.closeOverlay("overlay-detail");

    document.getElementById("td-montant").onclick = ()=>{
      openInlineEditor({
        title:"Montant", inputType:"number", min:0, step:0.01,
        value: hasMontant ? Math.abs(cur.montant) : "",
        placeholder:"0,00",
        onSave:(v)=>{
          const abs = Math.abs(Number(v));
          if(v===""||isNaN(abs)||abs<=0){ APP.showToast("Merci de renseigner un montant valide"); return; }
          const montant = cur.type==="Expense" ? -abs : abs;
          commit({montant, montantSet:true});
        }
      });
    };

    document.getElementById("td-date").onclick = ()=>{
      openInlineEditor({
        title:"Date", inputType:"date", value:cur.dateISO,
        onSave:(v)=>{
          if(!v){ APP.showToast("Merci de renseigner une date valide"); return; }
          commit({dateISO:v});
        }
      });
    };

    document.getElementById("td-remarque").onclick = ()=>{
      openInlineEditor({
        title:"Remarque", multiline:true, value:cur.remarque||"", placeholder:"Ex. Lieu (25-01)",
        onSave:(v)=> commit({remarque:v.trim()})
      });
    };

    document.getElementById("td-type").onclick = ()=>{
      openPicker({
        title:"Type", options:["Revenu","Dépense","Transfert"], value:TYPE_LABEL_FR[cur.type], noEmpty:true,
        onSelect:(v)=>{
          const newType = TYPE_LABEL_FR_TO_CODE[v];
          const abs = hasMontant ? Math.abs(cur.montant) : 0;
          const montant = newType==="Expense" ? -abs : abs;
          commit({type:newType, montant, montantSet:hasMontant});
        }
      });
    };

    const comptes = AGG.distinctValues(Store.transactions, "compte").map(x=>x.value);
    document.getElementById("td-compte").onclick = ()=> openPicker({
      title: isTransfer?"Compte source":"Compte", options:comptes, value:cur.compte, allowNew:true,
      newLabel:"+ Nouveau compte…", newPlaceholder:"Nom du compte",
      onSelect:(v)=> commit({compte:v})
    });
    if(isTransfer){
      document.getElementById("td-compte-cible").onclick = ()=> openPicker({
        title:"Compte cible", options:comptes, value:cur.compteCible, allowNew:true,
        newLabel:"+ Nouveau compte…", newPlaceholder:"Nom du compte",
        onSelect:(v)=> commit({compteCible:v})
      });
    } else {
      document.getElementById("td-categorie").onclick = ()=> openPicker({
        title:"Catégorie", hierarchy: categoriePickerHierarchy(), value:cur.categorie, allowNew:true,
        newLabel:"+ Nouvelle catégorie…", newPlaceholder:"Nom de la catégorie",
        onSelect:(v)=> commit({categorie:v})
      });
      document.getElementById("td-personne").onclick = ()=> openPicker({
        title:"Personne", hierarchy: AGG.personneHierarchy(Store.transactions), value:cur.personne, allowNew:true,
        newLabel:"+ Nouvelle personne…", newPlaceholder:"Nom de la personne",
        onSelect:(v)=> commit({personne:v})
      });
    }
    document.getElementById("td-groupe").onclick = ()=> openPicker({
      title:"Groupe", hierarchy: AGG.groupeHierarchyChrono(Store.transactions), value:cur.groupe, allowNew:true,
      newLabel:"+ Nouveau groupe…", newPlaceholder:"Nom du groupe (ex. Lieu (25-01))",
      onSelect:(v)=> commit({groupe:v})
    });

    if(isNew){
      document.getElementById("td-cancel").onclick = ()=>APP.closeOverlay("overlay-detail");
      document.getElementById("td-save").onclick = ()=>{
        const montantAbs = draft.montantSet ? Math.abs(Number(draft.montant)) : NaN;
        if(!draft.dateISO || isNaN(montantAbs) || montantAbs<=0){
          APP.showToast("Merci de renseigner une date et un montant valides");
          return;
        }
        const row = {
          date: draft.dateISO, montant: draft.montant, type: draft.type,
          categorie: draft.type==="Transfer" ? "" : draft.categorie,
          personne: draft.type==="Transfer" ? "" : draft.personne,
          compte: draft.compte,
          "compte cible": draft.type==="Transfer" ? draft.compteCible : "",
          groupe: draft.groupe, remarque: (draft.remarque||"").trim(),
        };
        const updated = DATA.rowToTxn(row);
        if(!updated){ APP.showToast("Impossible d'enregistrer : données invalides"); return; }
        let toAdd = updated;
        if(Store.transactions.some(x=>x.id===toAdd.id)){
          // Évite toute collision d'id (peu probable : id dérivé des champs) si une transaction strictement
          // identique existe déjà — l'id doit rester unique pour que recherche/édition/suppression ciblent
          // la bonne ligne.
          toAdd = Object.assign({}, updated, {id: updated.id+"|"+U.uid()});
        }
        Store.transactions.push(toAdd);
        APP.closeOverlay("overlay-detail");
        APP.refreshCurrentTab();
        Store.saveTransactions().then(ok=>{
          APP.showToast(ok ? "Transaction ajoutée" : "Ajoutée, mais la sauvegarde a échoué");
        });
      };
    } else {
      document.getElementById("td-duplicate").onclick = ()=>{
        const source = current();
        APP.closeOverlay("overlay-detail");
        renderTxnDetail(null, source);
      };
      document.getElementById("td-delete").onclick = ()=>{
        APP.confirmAction({
          title:"Supprimer cette transaction ?",
          text:"Cette action est définitive.",
          confirmLabel:"Supprimer",
          onConfirm:()=>{
            Store.transactions = Store.transactions.filter(x=>x.id!==currentId);
            APP.closeOverlay("overlay-detail");
            APP.refreshCurrentTab();
            Store.saveTransactions().then(ok=>{
              APP.showToast(ok ? "Transaction supprimée" : "Supprimée, mais la sauvegarde a échoué");
            });
          }
        });
      };
      if(nav){
        const prevBtn = document.getElementById("td-nav-prev");
        const nextBtn = document.getElementById("td-nav-next");
        if(prevBtn) prevBtn.onclick = goPrev;
        if(nextBtn) nextBtn.onclick = goNext;
      }
    }
  }

  if(nav){
    // Navigation clavier globale (cf. buildShell) : lit prev()/next() tant que la fiche est ouverte.
    APP.state.txnNavActive = {prev:goPrev, next:goNext};
    // Balayage tactile gauche/droite sur la fiche (comme une pile de photos : on glisse vers la gauche
    // pour avancer, vers la droite pour reculer). Affecté en propriété (.ontouchstart/.ontouchend) plutôt
    // qu'avec addEventListener pour que la prochaine fiche réutilisant modal-detail écrase proprement ces
    // gestionnaires sans les cumuler ; ils sont aussi explicitement effacés par closeOverlay("overlay-detail").
    const modalEl = document.getElementById("modal-detail");
    let touchStartX=0, touchStartY=0, touchActive=false;
    modalEl.ontouchstart = (e)=>{
      const t = e.touches[0];
      touchStartX = t.clientX; touchStartY = t.clientY; touchActive = true;
    };
    modalEl.ontouchend = (e)=>{
      if(!touchActive) return;
      touchActive = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
      if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){
        if(dx>0) goPrev(); else goNext();
      }
    };
  }

  render();
  APP.openOverlay("overlay-detail");
}

/* ================= PICKER PLEIN ÉCRAN (sélection en un seul appui) ================= */
/* Remplace les <select> natifs (qui exigent un second appui "OK" sur mobile) par une liste
   dans laquelle taper une valeur la sélectionne immédiatement et referme l'écran.
   opts.hierarchy (optionnel) : {sections: Map(nom du groupe de groupe -> [{base, count}]), flat: [{base, count}]}
   Si fourni, affiche les groupes de groupe (triés alphabétiquement) en en-tête dépliable —
   taper l'en-tête sélectionne le groupe de groupe, taper un élément à l'intérieur sélectionne ce groupe précis —
   puis les groupes non classés (triés alphabétiquement) en dessous. */
function renderPickerList(opts){
  const sheet = document.getElementById("sheet-picker");
  const options = opts.options || [];
  const hasHierarchy = !!opts.hierarchy;

  function hierarchyListHtml(){
    const h = opts.hierarchy;
    const sectionNames = h.preSorted ? Array.from(h.sections.keys()) : Array.from(h.sections.keys()).sort((a,b)=>a.localeCompare(b,'fr'));
    const headerSelectable = h.selectableHeaders !== false;
    const openByDefault = !!h.expandedByDefault;
    let html = sectionNames.map((sup,idx)=>{
      const children = h.preSorted ? h.sections.get(sup).slice() : h.sections.get(sup).slice().sort((a,b)=>a.base.localeCompare(b.base,'fr'));
      return `<div class="groupe-section">
        <div class="check-item groupe-section-head ${headerSelectable && sup===opts.value?'selected':''}" ${headerSelectable?`data-pv="${U.escHtml(sup)}"`:''}>
          <span class="lbl" style="font-weight:800;">${U.escHtml(sup)}</span>
          <span class="cnt">${children.length}</span>
          <button type="button" class="icon-btn pk-expand-btn" data-expand="pk-hsec-${idx}" style="width:30px;height:30px;flex:0 0 auto;${openByDefault?'transform:rotate(180deg);':''}">${ICONS.arrowLeft.replace('<svg ','<svg style="width:14px;height:14px;transform:rotate(-90deg);" ')}</button>
        </div>
        <div class="groupe-section-children" id="pk-hsec-${idx}" style="display:${openByDefault?'block':'none'};">
          ${children.map(c=>`
            <div class="check-item ${c.base===opts.value?'selected':''}" data-pv="${U.escHtml(c.base)}">
              <span class="lbl">${U.escHtml(c.base)}</span><span class="cnt">${c.count}</span>
            </div>
          `).join("")}
        </div>
      </div>`;
    }).join("");
    const flat = h.flat.slice().sort((a,b)=>a.base.localeCompare(b.base,'fr'));
    html += flat.map(f=>`
      <div class="check-item ${f.base===opts.value?'selected':''}" data-pv="${U.escHtml(f.base)}">
        <span class="lbl">${U.escHtml(f.base)}</span><span class="cnt">${f.count}</span>
      </div>
    `).join("");
    return html;
  }

  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h2>${U.escHtml(opts.title)}</h2><button class="icon-btn" id="pk-close">${ICONS.close}</button></div>
    <div class="sheet-body">
      ${(hasHierarchy || options.length>6) ? `<input type="text" class="search-mini" id="pk-search" placeholder="Rechercher…">` : ""}
      <div class="check-list" style="max-height:none;" id="pk-list">
        ${opts.noEmpty ? "" : `
        <div class="check-item ${!opts.value?'selected':''}" data-pv="">
          <span class="lbl" style="color:var(--text-faint);">— Aucun(e) —</span>
        </div>`}
        ${hasHierarchy ? hierarchyListHtml() : options.map(v=>`
          <div class="check-item ${v===opts.value?'selected':''}" data-pv="${U.escHtml(v)}">
            <span class="lbl">${U.escHtml(v)}</span>
          </div>
        `).join("")}
        ${opts.allowNew ? `
        <div class="check-item" data-pv="__new__" style="color:var(--primary);font-weight:700;">
          <span class="lbl">${U.escHtml(opts.newLabel || "+ Nouveau…")}</span>
        </div>` : ""}
      </div>
    </div>
  `;
  document.getElementById("pk-close").onclick = ()=>APP.closeOverlay("overlay-picker");
  document.querySelectorAll(".pk-expand-btn").forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const target = document.getElementById(btn.dataset.expand);
      const open = target.style.display!=="none";
      target.style.display = open ? "none" : "block";
      btn.style.transform = open ? "" : "rotate(180deg)";
    };
  });
  const search = document.getElementById("pk-search");
  if(search){
    search.oninput = ()=>{
      const q = U.normalize(search.value);
      document.querySelectorAll("#pk-list [data-pv]").forEach(el=>{
        if(el.dataset.pv==="" || el.dataset.pv==="__new__"){ return; }
        const match = U.normalize(el.dataset.pv).includes(q);
        el.style.display = match ? "flex" : "none";
        if(match && q && el.closest(".groupe-section-children")){
          el.closest(".groupe-section-children").style.display = "block";
        }
      });
    };
  }
  document.querySelectorAll("#pk-list [data-pv]").forEach(el=>{
    el.onclick = ()=>{
      const v = el.dataset.pv;
      if(v==="__new__"){ renderPickerNew(opts); return; }
      APP.closeOverlay("overlay-picker");
      opts.onSelect(v);
    };
  });
}

/* Éditeur compact (popup centrée, réutilise modal-confirm/overlay-confirm) pour un champ à valeur libre
   (Montant, Date, Remarque) : un seul input, Annuler / Enregistrer. opts: {title, inputType:'text'|'number'
   |'date', multiline, value, placeholder, min, step, onSave(value)}. Utilisé par la fiche transaction pour
   éditer un champ au simple tap, sans passer par un mode "Modifier" séparé. */
function openInlineEditor(opts){
  const modal = document.getElementById("modal-confirm");
  const inputHtml = opts.multiline
    ? `<textarea class="search-mini" id="ie-input" style="margin:0 0 16px;min-height:90px;resize:vertical;font-family:inherit;" placeholder="${U.escHtml(opts.placeholder||'')}">${U.escHtml(opts.value||'')}</textarea>`
    : `<input type="${opts.inputType||'text'}" class="search-mini" id="ie-input" style="margin:0 0 16px;" value="${U.escHtml(opts.value||'')}" placeholder="${U.escHtml(opts.placeholder||'')}" ${opts.min!=null?`min="${opts.min}"`:''} ${opts.step!=null?`step="${opts.step}"`:''}>`;
  modal.innerHTML = `
    <div style="font-weight:800;font-size:16.5px;margin-bottom:14px;">${U.escHtml(opts.title)}</div>
    ${inputHtml}
    <div style="display:flex;gap:8px;">
      <button type="button" class="btn btn-ghost" style="flex:1;justify-content:center;" id="ie-cancel">Annuler</button>
      <button type="button" class="btn btn-primary" style="flex:1;justify-content:center;" id="ie-confirm">Enregistrer</button>
    </div>
  `;
  document.getElementById("ie-cancel").onclick = ()=>APP.closeOverlay("overlay-confirm");
  const input = document.getElementById("ie-input");
  input.focus();
  if(!opts.multiline && input.select) input.select();
  const confirm = ()=>{
    const v = input.value;
    APP.closeOverlay("overlay-confirm");
    opts.onSave(v);
  };
  document.getElementById("ie-confirm").onclick = confirm;
  if(!opts.multiline) input.onkeydown = (e)=>{ if(e.key==="Enter") confirm(); };
  APP.openOverlay("overlay-confirm");
}

/* Hiérarchie pour le picker Catégorie de la fiche transaction : groupée par type (Revenus/Dépenses),
   toujours dans cet ordre (jamais alphabétique) — d'où `preSorted`, cf. renderPickerList. Une catégorie a
   toujours un type, il n'y a donc jamais d'entrée "dégroupée" (flat vide). */
function categoriePickerHierarchy(){
  const items = AGG.distinctValuesCategorieSorted(Store.transactions); // [{value,count,kind}], Income puis Expense, alpha au sein de chaque type
  const sections = new Map();
  const inc = items.filter(i=>i.kind==="Income").map(i=>({base:i.value, count:i.count}));
  const exp = items.filter(i=>i.kind==="Expense").map(i=>({base:i.value, count:i.count}));
  if(inc.length) sections.set("Revenus", inc);
  if(exp.length) sections.set("Dépenses", exp);
  return {sections, flat: [], preSorted:true, selectableHeaders:false, expandedByDefault:true};
}

    <span class="u-faint-fixed">${ICONS.arrowLeft.replace('<svg ','<svg style="transform:rotate(-90deg);width:15px;height:15px;" ')}</span>
  </button>`;
}

/* Construit un texte tabulé (TSV) "Compte / Solde" — collé dans Excel, il forme deux colonnes : le nom
   du compte, et son solde avec 2 décimales (virgule comme séparateur décimal, sans séparateur de
   milliers, pour être reconnu comme nombre par Excel FR quelle que soit sa locale). Une ligne "Total"
   termine le récapitulatif. */
function buildAccountsClipboardText(typeGroups, total){
  const lines = ["Compte\tSolde"];
  typeGroups.forEach(g=>{
    g.accounts.forEach(a=>{
      lines.push(a.name + "\t" + a.balance.toFixed(2).replace(".", ","));
    });
  });
  lines.push("Total\t" + total.toFixed(2).replace(".", ","));
  return lines.join("\n");
}
/* Copie un texte dans le presse-papiers — API moderne d'abord (nécessite un contexte sécurisé https),
   avec repli sur la méthode historique (textarea + execCommand) si elle échoue ou est indisponible
   (ex. ouverture locale en file://). Retourne true/false selon le succès. */
async function copyTextToClipboard(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){  }
  try{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e2){ return false; }
}

/* Ordonne les groupes de type de compte (Courant/Épargne/types libres) selon l'ordre choisi par
   l'utilisateur (Store.settings.accountTypeOrder). Les types absents de cet ordre (nouveaux comptes,
   première utilisation) sont ajoutés à la fin, en respectant l'ordre par défaut (Courant, Épargne, puis
   alphabétique) — jamais perdus, juste positionnés après les types déjà classés. */
function orderAccountTypeGroups(groups){
  const savedOrder = Store.settings.accountTypeOrder || [];
  const DEFAULT_ORDER = {"Courant":0, "Épargne":1};
  const byDefault = groups.slice().sort((a,b)=>{
    const oa = DEFAULT_ORDER[a.type]!=null ? DEFAULT_ORDER[a.type] : 2;
    const ob = DEFAULT_ORDER[b.type]!=null ? DEFAULT_ORDER[b.type] : 2;
    if(oa!==ob) return oa-ob;
    return a.type.localeCompare(b.type,'fr');
  });
  if(!savedOrder.length) return byDefault;
  const rank = new Map(savedOrder.map((t,i)=>[t,i]));
  return byDefault.slice().sort((a,b)=>{
    const ra = rank.has(a.type) ? rank.get(a.type) : savedOrder.length + byDefault.indexOf(a);
    const rb = rank.has(b.type) ? rank.get(b.type) : savedOrder.length + byDefault.indexOf(b);
    return ra-rb;
  });
}

/* L'onglet Budget affiche toujours les montants sans décimales, quel que soit le réglage global de
   l'application (Store.settings.decimals, utilisé ailleurs) — ces deux fonctions remplacent U.fmtMoney /
   U.fmtMoneySigned partout dans cet onglet, sans toucher au réglage global ni aux autres onglets. */
function bgFmtMoney(n){
  if(n==null || isNaN(n)) n=0;
  const sign = n<0 ? "-" : "";
  return sign + Math.abs(n).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0}) + " €";
}
function bgFmtMoneySigned(n){
  if(n==null || isNaN(n)) n=0;
  return (n>0? "+ " : (n<0? "- " : "")) + Math.abs(n).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0}) + " €";
}
