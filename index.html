  };
  APP.openOverlay("overlay-detail");
}

/* Sépare une liste (catégories ou voyages) en deux sous-listes Revenus (net ≥ 0) / Dépenses (net < 0). */
function splitIncomeExpense(list){
  const income = [], expense = [];
  list.forEach(c=> (c.income+c.expense) < 0 ? expense.push(c) : income.push(c));
  return {income, expense};
}
/* Bloc <details> Revenus/Dépenses/Voyages, repliable, pour une liste de lignes catégorie/voyage. Le total
   de la section est toujours la somme des lignes listées (list) ; si compareVal est fourni (comparaison
   active), ce total est affiché sous forme de ligne comparée (Résultat/Comparé/Variation) au lieu du
   simple montant cliquable. Si detailInfo est fourni (vue détail active, comparaison inactive), le total est
   affiché sous forme de ligne 3 colonnes (Réel+ajout/Amorti/Total ou Brut/Ajout/Total selon le mode). */
function collapsibleRowsHtml(sectionKey, label, color, list, rowsHtml, dv, clickAttrs, compareVal, detailInfo){
  if(!list.length) return "";
  const total = dv(list.reduce((s,c)=>s+c.income+c.expense, 0));
  const open = isGroupSectionOpen(sectionKey);
  if(compareVal!=null){
    return `
      <details class="bg-cv-section" data-section-key="${U.escHtml(sectionKey)}" style="margin-top:8px;" ${open?'open':''}>
        <summary style="list-style:none;cursor:pointer;padding:4px 0;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">
            <span style="font-size:12px;font-weight:700;color:${color};">${label} (${list.length})</span>
            <svg class="chev-rot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          <div class="bg-section-total" data-supergroupe="${U.escHtml(clickAttrs.supergroupe)}" data-type="${U.escHtml(clickAttrs.type||"")}" style="cursor:pointer;">
            ${compareRowHtml("Total "+label.toLowerCase(), total, compareVal, {big:false}, {sheet:"group", supergroupe:clickAttrs.supergroupe, type:clickAttrs.type||""})}
          </div>
        </summary>
        ${rowsHtml(list)}
      </details>
    `;
  }
  if(detailInfo){
    const cellAttrs = {sheet:"group", supergroupe: clickAttrs.supergroupe, type: clickAttrs.type||""};
    return `
      <details class="bg-cv-section" data-section-key="${U.escHtml(sectionKey)}" style="margin-top:8px;" ${open?'open':''}>
        <summary style="list-style:none;cursor:pointer;padding:4px 0;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">
            <span style="font-size:12px;font-weight:700;color:${color};">${label} (${list.length})</span>
            <svg class="chev-rot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          ${detailRowHtml("Total "+label.toLowerCase(), detailInfo.mode, dv(detailInfo.real), dv(detailInfo.amort), dv(detailInfo.adj), {big:false}, cellAttrs)}
        </summary>
        ${rowsHtml(list)}
      </details>
    `;
  }
  const totalAttrs = clickAttrs ? `class="bg-section-total" data-supergroupe="${U.escHtml(clickAttrs.supergroupe)}" data-type="${U.escHtml(clickAttrs.type||"")}" style="font-size:12px;font-weight:700;color:${color};cursor:pointer;"` : `style="font-size:12px;font-weight:700;color:${color};"`;
  return `
    <details class="bg-cv-section" data-section-key="${U.escHtml(sectionKey)}" style="margin-top:6px;" ${open?'open':''}>
      <summary style="list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:4px 0;">
        <span style="font-size:12px;font-weight:700;color:${color};">${label} (${list.length})</span>
        <span style="display:flex;align-items:center;gap:6px;">
          <span ${totalAttrs}>${bgFmtMoneySigned(total)}</span>
          <svg class="chev-rot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;"><path d="M6 9l6 6 6-6"/></svg>
        </span>
      </summary>
      ${rowsHtml(list)}
    </details>
  `;
}
/* Construit la carte d'un groupe (principal ou additionnel). Retourne {html, cmp} : cmp (présent seulement
   si la comparaison est active) contient {income, expense, voyage, total}, la somme des valeurs comparées
   des lignes affichées dans la carte — utilisé par renderBudget pour construire le grand total, qui est
   lui-même toujours une somme (jamais une valeur indépendante). Les voyages ne sont jamais comparés voyage
   par voyage : un seul total "Voyages" pour l'ensemble de la section, sans distinction entre eux. */

function fmtBoundMonth(ym){
  if(!ym) return null;
  const parts = ym.split("-").map(Number);
  return fmtMonthYearShort(parts[0], parts[1]-1);
}
function groupCardHtml(title, res, isMain, divisor, compareCtx){
  const cfg = Store.settings.budget;
  divisor = divisor || 1;
  const dv = n => n/divisor;
  const detailOn = cfg.detailView && !compareCtx;
  const mode = cfg.mode;
  const catRowsHtml = list=>list.map(c=>{
    const val = dv(c.income+c.expense);
    if(compareCtx){
      return `
      <div class="detail-row budget-cat-row" data-cat="${U.escHtml(c.key)}" data-supergroupe="${U.escHtml(title)}" style="cursor:pointer;display:block;padding:6px 2px;">
        ${compareRowHtml(c.label||c.key, val, compareCategoryTotal(compareCtx, title, c.key), {big:false}, {sheet:"cat", supergroupe:title, cat:c.key})}
      </div>`;
    }
    if(detailOn){
      const real = c.realIncome+c.realExpense, amort = c.amortIncome+c.amortExpense, adj = c.adjIncome+c.adjExpense;
      return `
      <div class="detail-row" style="display:block;padding:6px 2px;">
        ${detailRowHtml(c.label||c.key, mode, dv(real), dv(amort), dv(adj), {big:false}, {sheet:"cat", supergroupe:title, cat:c.key})}
      </div>`;
    }
    return `
    <div class="detail-row budget-cat-row" data-cat="${U.escHtml(c.key)}" data-supergroupe="${U.escHtml(title)}" style="cursor:pointer;">
      <span>${U.escHtml(c.label||c.key)}</span>
      <span style="color:${val<0?'var(--expense)':'var(--income)'}">${bgFmtMoneySigned(val)}</span>
    </div>
  `;}).join("");
  const voyRowsHtml = list=>list.map(c=>{
    if(detailOn){
      const real = c.realIncome+c.realExpense, amort = c.amortIncome+c.amortExpense, adj = c.adjIncome+c.adjExpense;
      return `
      <div class="detail-row" style="display:block;padding:6px 2px;">
        ${detailRowHtml(c.label||c.key, mode, dv(real), dv(amort), dv(adj), {big:false}, {sheet:"voy", supergroupe:title, voy:c.key})}
      </div>`;
    }
    return `
    <div class="detail-row budget-voy-row" data-voy="${U.escHtml(c.key)}" data-supergroupe="${U.escHtml(title)}" style="cursor:pointer;">
      <span>${U.escHtml(c.label||c.key)}</span>
      <span style="color:${(c.income+c.expense)<0?'var(--expense)':'var(--income)'}">${bgFmtMoneySigned(dv(c.income+c.expense))}</span>
    </div>
  `;}).join("");
  const catSplit = splitIncomeExpense(res.categories);
  if(compareCtx){
    const mainCatKeys = new Set(res.categories.map(c=>c.key));
    compareOnlyCategories(compareCtx, title, mainCatKeys).forEach(c=>{
      (c.__compareOnlyType==="Income" ? catSplit.income : catSplit.expense).push(c);
    });
    catSplit.income.sort((a,b)=>a.key.localeCompare(b.key,'fr'));
    catSplit.expense.sort((a,b)=>a.key.localeCompare(b.key,'fr'));
  }
  const cardNet = dv(res.net);
  let cmp = null;
  let cmpIncome = null, cmpExpense = null, cmpVoyage = null;
  if(compareCtx){
    cmpIncome = catSplit.income.reduce((s,c)=>s+compareCategoryTotal(compareCtx, title, c.key), 0);
    cmpExpense = catSplit.expense.reduce((s,c)=>s+compareCategoryTotal(compareCtx, title, c.key), 0);
    cmpVoyage = compareVoyageTotal(compareCtx, title);
    cmp = {income: cmpIncome, expense: cmpExpense, voyage: cmpVoyage, total: cmpIncome+cmpExpense+cmpVoyage};
  }
  // Sommes réel/amorti/ajout par section (Revenus, Dépenses, Voyages), utilisées uniquement en vue détail.
  function sumBreakdown(list){
    return list.reduce((s,c)=>({
      real: s.real + c.realIncome + c.realExpense,
      amort: s.amort + c.amortIncome + c.amortExpense,
      adj: s.adj + c.adjIncome + c.adjExpense
    }), {real:0, amort:0, adj:0});
  }
  const incomeBreak = detailOn ? sumBreakdown(catSplit.income) : null;
  const expenseBreak = detailOn ? sumBreakdown(catSplit.expense) : null;
  const voyBreak = detailOn ? sumBreakdown(res.voyages) : null;
  const cardBreak = detailOn ? {
    real: (incomeBreak?incomeBreak.real:0)+(expenseBreak?expenseBreak.real:0)+(voyBreak?voyBreak.real:0),
    amort: (incomeBreak?incomeBreak.amort:0)+(expenseBreak?expenseBreak.amort:0)+(voyBreak?voyBreak.amort:0),
    adj: (incomeBreak?incomeBreak.adj:0)+(expenseBreak?expenseBreak.adj:0)+(voyBreak?voyBreak.adj:0)
  } : null;
  const headerHtml = compareCtx ? compareHeaderRowHtml() : detailOn ? detailHeaderRowHtml(mode) : "";

  const groupSelectorHtml = `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;">
      <button type="button" class="bg-group-swap-btn" data-group="${U.escHtml(title)}" data-ismain="${isMain?1:0}" style="display:flex;align-items:center;gap:4px;background:none;border:none;padding:0;cursor:pointer;min-width:0;flex:1;">
        <span style="font-weight:800;font-size:15.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${U.escHtml(title)}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex:0 0 auto;color:var(--text-sub);"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      ${!isMain ? `
      <button type="button" class="bg-group-remove-btn" data-group="${U.escHtml(title)}" title="Retirer ce groupe" style="display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--card-alt);border:none;cursor:pointer;color:var(--text-sub);flex:0 0 auto;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>` : ""}
    </div>
  `;
  const totalRowHtml = compareCtx ? `
      ${headerHtml}
      <div class="detail-row bg-typetxn-row" data-supergroupe="${U.escHtml(title)}" data-type="" style="cursor:pointer;display:block;padding:0 0 6px;">
        ${compareRowHtml("Total", cardNet, cmp.total, {big:true}, {sheet:"group", supergroupe:title, type:""})}
      </div>
  ` : detailOn ? `
      ${headerHtml}
      <div style="display:block;padding:0 0 6px;">
        ${detailRowHtml("Total", mode, dv(cardBreak.real), dv(cardBreak.amort), dv(cardBreak.adj), {big:true}, {sheet:"group", supergroupe:title, type:""})}
      </div>
  ` : `
      <div class="detail-row bg-typetxn-row" data-supergroupe="${U.escHtml(title)}" data-type="" style="cursor:pointer;padding:0 0 4px;">
        <span style="font-size:9.5px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:.3px;">Total</span>
        <span style="font-weight:800;font-size:15.5px;color:${res.net<0?'var(--expense)':'var(--income)'}">${bgFmtMoneySigned(cardNet)}</span>
      </div>
  `;
  const titleRowHtml = groupSelectorHtml + totalRowHtml;
  /* Voyages : jamais détaillés voyage par voyage en vue comparaison — un total unique, toujours affiché
     (même à 0/0), pour permettre d'éditer le budget prédéfini des voyages même hors saison. Hors vue
     comparaison, comportement inchangé : liste détaillée, uniquement si des voyages existent sur la
     période affichée. */
  const voyagesHtml = compareCtx ? `
      <div class="bg-section-total" data-supergroupe="${U.escHtml(title)}" data-type="Voyage" style="cursor:pointer;margin-top:8px;">
        ${compareRowHtml("Total voyages", dv(res.voyNet), cmpVoyage, {big:false}, {sheet:"group", supergroupe:title, type:"Voyage"})}
      </div>
  ` : (res.voyages.length ? collapsibleRowsHtml(title+"::voy::all", "Voyages", (res.voyNet<0?'var(--expense)':'var(--income)'), res.voyages, voyRowsHtml, dv, {supergroupe:title, type:"Voyage"}, null, detailOn?{mode, real:voyBreak.real, amort:voyBreak.amort, adj:voyBreak.adj}:null) : "");
  const html = `
    <div class="card" style="margin-bottom:12px;">
      ${titleRowHtml}
      ${catSplit.income.length ? collapsibleRowsHtml(title+"::cat::income", "Revenus", "var(--income)", catSplit.income, catRowsHtml, dv, {supergroupe:title, type:"Income"}, compareCtx?cmpIncome:null, detailOn?{mode, real:incomeBreak.real, amort:incomeBreak.amort, adj:incomeBreak.adj}:null) : ""}
      ${catSplit.expense.length ? collapsibleRowsHtml(title+"::cat::expense", "Dépenses", "var(--expense)", catSplit.expense, catRowsHtml, dv, {supergroupe:title, type:"Expense"}, compareCtx?cmpExpense:null, detailOn?{mode, real:expenseBreak.real, amort:expenseBreak.amort, adj:expenseBreak.adj}:null) : ""}
      ${voyagesHtml}
    </div>
  `;
  return {html, cmp};
}

function openGroupSwapPicker(groupName, isMain){
  const cfg = Store.settings.budget;
  if(isMain){
    PICKER.openPicker({
      title:"Groupe principal", hierarchy: groupPickerHierarchy(new Set()), value: cfg.mainGroup,
      onSelect:(v)=>{
        if(!v || v===cfg.mainGroup) return;
        cfg.mainGroup = v;
        cfg.extraGroups = (cfg.extraGroups||[]).filter(g=>g!==v);
        Store.saveSettings();
        renderBudget();
      }
    });
    return;
  }
  const exclude = new Set([cfg.mainGroup].concat((cfg.extraGroups||[]).filter(g=>g!==groupName)));
  PICKER.openPicker({
    title:"Changer ce groupe", hierarchy: groupPickerHierarchy(exclude), value: groupName,
    onSelect:(v)=>{
      if(!v || v===groupName) return;
      const idx = (cfg.extraGroups||[]).indexOf(groupName);
      if(idx>=0) cfg.extraGroups[idx] = v; else cfg.extraGroups = (cfg.extraGroups||[]).concat([v]);
      Store.saveSettings();
      renderBudget();
    }
  });
}

const EMPTY_MAP = new Map();
/* Ligne <tr> de la vue "mois par mois", avec le même style visuel que les lignes de la vue détail à 3
   colonnes (cf. detailRowHtml plus haut : mêmes tailles/graisses de police, mêmes règles de couleur —
   .bgm-group-row/.bgm-item-row portent ces tailles via CSS), simplement avec une colonne par mois au lieu
   de 3 colonnes fixes. Seule différence : la colonne "Total" (comme le libellé) est figée à gauche
   (.bgm-label-cell/.bgm-total-cell, cf. CSS — même mécanisme que .evo-col-label/.evo-col-total de l'onglet
   Évolution) pour permettre de faire défiler les mois. clickAttrs (optionnel) rend chaque valeur
   individuellement cliquable, comme pour les autres vues. */
function bgmRowHtml(label, total, monthly, months, opts, clickAttrs){
  opts = opts || {};
  const rowClass = opts.big ? "bgm-group-row" : "bgm-item-row";
  function cell(v, cls, extraDataAttrs){
    const sign = v>0 ? "pos" : (v<0 ? "neg" : "");
    const text = v ? bgFmtMoneySigned(v) : "—";
    const clickable = clickAttrs ? " clickable bg-detail-cell" : "";
    const attrs = clickAttrs ? `${clickAttrs} ${extraDataAttrs||""}` : "";
    return `<td class="${cls} ${sign}${clickable}" ${attrs}>${text}</td>`;
  }
  return `
    <tr class="${rowClass}">
      <td class="bgm-label-cell">${U.escHtml(label)}</td>
      ${cell(total, "bgm-total-cell", "")}
      ${months.map(m=> cell(monthly.get(m)||0, "bgm-val-cell", `data-month="${m}"`)).join("")}
    </tr>
  `;
}
function bgmHeaderRowHtml(months){
  return `
    <tr class="bgm-head">
      <th class="bgm-label-cell"></th>
      <th class="bgm-total-cell">Total</th>
      ${months.map(m=>{ const [y,mm]=m.split("-").map(Number); return `<th class="bgm-val-cell">${fmtMonthYearShort(y,mm-1)}</th>`; }).join("")}
    </tr>
  `;
}
/* Construit la vue "mois par mois" du Budget (bouton calendrier, entre "Ajouts" et "Colonnes") : même style
   que la vue détail à 3 colonnes (cf. bgmRowHtml ci-dessus) et EXACTEMENT les mêmes lignes que la vue par
   carte habituelle — "Total tous groupes", puis pour chaque groupe (principal puis additionnels) sa ligne
   Total suivie d'une ligne par catégorie et d'une ligne par voyage (mêmes libellés que dans la carte du
   groupe, cf. groupCardHtml) — simplement ventilées mois par mois au lieu d'un total unique sur la période.
   Seule différence avec la vue détail : la colonne "Total" est figée à gauche (comme le libellé) pour
   permettre de faire défiler les mois vers la droite — via un <table> avec colonnes sticky, le même
   mécanisme, déjà éprouvé, que celui de l'onglet Évolution. Chaque valeur (Total ou mois) est cliquable et
   ouvre la liste des transactions correspondante, comme les autres vues. */
function buildBudgetMonthlyTableHtml(months, cfg, mainRes, extraResults, allGroupNames){
  const mainDetail = computeGroupBudgetDetailByMonth(cfg.mainGroup, months, {});
  const extraDetail = extraResults.map(e=>({name:e.name, res:e.res, detail: computeGroupBudgetDetailByMonth(e.name, months, {forceBrut:true})}));

  const grandMonthly = new Map();
  months.forEach(m=>{
    let v = mainDetail.net.get(m) || 0;
    extraDetail.forEach(e=> v += (e.detail.net.get(m) || 0));
    grandMonthly.set(m, v);
  });
  const grandTotal = mainRes.net + extraResults.reduce((s,e)=>s+e.res.net, 0);

  function groupRowsHtml(name, res, detail){
    const groupAttr = `data-groups="${U.escHtml(name)}"`;
    const headerRow = bgmRowHtml(name, res.net, detail.net, months, {big:true}, groupAttr);
    const catRows = res.categories.map(c=>
      bgmRowHtml(c.label||c.key, c.income+c.expense, detail.categories.get(c.key)||EMPTY_MAP, months, {},
        `data-kind="cat" data-group="${U.escHtml(name)}" data-key="${U.escHtml(c.key)}"`)
    ).join("");
    const voyRows = res.voyages.map(v=>
      bgmRowHtml(v.label||v.key, v.income+v.expense, detail.voyages.get(v.key)||EMPTY_MAP, months, {},
        `data-kind="voy" data-group="${U.escHtml(name)}" data-key="${U.escHtml(v.key)}"`)
    ).join("");
    return headerRow + catRows + voyRows;
  }

  const grandRow = bgmRowHtml("Total tous groupes", grandTotal, grandMonthly, months, {big:true}, `data-groups="${U.escHtml(allGroupNames.join("||"))}"`);
  const groupRows = groupRowsHtml(cfg.mainGroup, mainRes, mainDetail)
    + extraDetail.map(e=> groupRowsHtml(e.name, e.res, e.detail)).join("");

  return `<div class="bgm-wrap" id="bg-monthly-table-wrap"><table class="bgm-table"><thead>${bgmHeaderRowHtml(months)}</thead><tbody>${grandRow}${groupRows}</tbody></table></div>`;
}

function renderBudget(){
  ensurePeriod();
  const view = document.getElementById("view-budget");
  const cfg = Store.settings.budget;
  const months = monthsInRange(periodFrom, periodTo);

  if(Store.transactions.length===0){
    view.innerHTML = `<div class="section"><div class="empty-state">
      ${ICONS.inbox}<h3>Pas encore de données</h3><p>Importez vos transactions pour utiliser l'onglet Budget.</p>
    </div></div>`;
    return;
  }
  if(!cfg.mainGroup){
    view.innerHTML = `<div class="section">
      <div class="empty-state">
        ${ICONS.budget}<h3>Configurez votre budget</h3>
        <p>Choisissez un groupe de groupe principal pour commencer.</p>
        <div style="width:100%;max-width:320px;margin-top:6px;">${PICKER.fieldPickerBtnHtml("bg-main-btn", "Choisir un groupe principal", cfg.mainGroup)}</div>
      </div>
    </div>`;
    document.getElementById("bg-main-btn").onclick = ()=> PICKER.openPicker({
      title:"Groupe principal", hierarchy: groupPickerHierarchy(new Set()), value: cfg.mainGroup,
      onSelect:(v)=>{ cfg.mainGroup = v || null; Store.saveSettings(); renderBudget(); }
    });
    return;
  }

  const mainRes = computeGroupBudget(cfg.mainGroup, months);
  const extraResults = (cfg.extraGroups||[]).filter(g=>g!==cfg.mainGroup).map(g=>({name:g, res:computeGroupBudget(g, extraGroupEffectiveMonths(g, months), {forceBrut:true})}));
  const grandCatIncome = mainRes.catIncome + extraResults.reduce((s,e)=>s+e.res.catIncome,0);
  const grandCatExpense = mainRes.catExpense + extraResults.reduce((s,e)=>s+e.res.catExpense,0);
  const grandVoyIncome = mainRes.voyIncome + extraResults.reduce((s,e)=>s+e.res.voyIncome,0);
  const grandVoyExpense = mainRes.voyExpense + extraResults.reduce((s,e)=>s+e.res.voyExpense,0);
  const grandVoyNet = grandVoyIncome + grandVoyExpense;
  const grandNet = grandCatIncome + grandCatExpense + grandVoyNet;

  const selectedExtra = (cfg.extraGroups||[]).filter(g=>g!==cfg.mainGroup);
  const allGroupNames = [cfg.mainGroup].concat(selectedExtra);
  // Moyenne = totaux divisés par le nombre de mois de la période affichée compris dans la borne
  // chronologique de l'amortissement (voir amortBoundedMonths) — quel que soit le mode. N'affecte que les
  // vues d'ensemble (cartes/lignes ci-dessous) ; les feuilles de détail (catégorie, voyage, transactions)
  // continuent d'afficher le total réel de la période, jamais une moyenne.
  const divisor = cfg.displayMode==="moyenne" ? (amortBoundedMonths(months).length || 1) : 1;
  const dv = n => n/divisor;
  const compareCtx = computeCompareContext(months);

  const mainCard = groupCardHtml(cfg.mainGroup, mainRes, true, divisor, compareCtx);
  const extraCards = extraResults.map(e=>groupCardHtml(e.name, e.res, false, divisor, compareCtx));
  const grandCmp = compareCtx ? [mainCard].concat(extraCards).reduce((acc, c)=>({
    income: acc.income + (c.cmp?c.cmp.income:0),
    expense: acc.expense + (c.cmp?c.cmp.expense:0),
    voyage: acc.voyage + (c.cmp?c.cmp.voyage:0),
    total: acc.total + (c.cmp?c.cmp.total:0)
  }), {income:0, expense:0, voyage:0, total:0}) : null;

  // Sommes réel/amorti/ajout agrégées sur tous les groupes (principal + additionnels), par section — pour
  // la carte "Total tous groupes" en vue détail (mêmes principes que dans groupCardHtml).
  const detailOn = cfg.detailView && !compareCtx;
  let grandBreak = null;
  if(detailOn){
    const allRes = [mainRes].concat(extraResults.map(e=>e.res));
    const sumList = list=>list.reduce((s,c)=>({real:s.real+c.realIncome+c.realExpense, amort:s.amort+c.amortIncome+c.amortExpense, adj:s.adj+c.adjIncome+c.adjExpense}), {real:0,amort:0,adj:0});
    const inc = {real:0,amort:0,adj:0}, exp = {real:0,amort:0,adj:0}, voy = {real:0,amort:0,adj:0};
    allRes.forEach(res=>{
      const split = splitIncomeExpense(res.categories);
      const si = sumList(split.income), se = sumList(split.expense), sv = sumList(res.voyages);
      inc.real+=si.real; inc.amort+=si.amort; inc.adj+=si.adj;
      exp.real+=se.real; exp.amort+=se.amort; exp.adj+=se.adj;
      voy.real+=sv.real; voy.amort+=sv.amort; voy.adj+=sv.adj;
    });
    grandBreak = {
      inc, exp, voy,
      total: {real: inc.real+exp.real+voy.real, amort: inc.amort+exp.amort+voy.amort, adj: inc.adj+exp.adj+voy.adj}
    };
  }

  const cmp = cfg.compare;
  const cmpSublabel = !cmp.enabled ? "Désactivée"
    : cmp.mode==="predefined" ? "Budget prédéfini"
    : (cmp.periodFrom && cmp.periodTo) ? (fmtBoundMonth(cmp.periodFrom)+" → "+fmtBoundMonth(cmp.periodTo))
    : "Autre période";

  // En-tête de colonnes (Résultat/Comparé/Variation, ou Réel+ajout/Amorti/Total) : rendu comme une barre
  // séparée, en dehors de la carte "Total tous groupes", et directement enfant de la section — sa "boîte
  // englobante" pour le calcul du sticky est donc toute la section (total + cartes de groupes), pas
  // seulement la petite carte de total. Elle reste ainsi figée en haut de l'écran tant que l'utilisateur
  // n'a pas dépassé la fin de la liste des cartes, au lieu de disparaître dès la fin de la carte de total.
  const grandHeaderInner = compareCtx ? compareHeaderRowHtml() : detailOn ? detailHeaderRowHtml(cfg.mode) : "";
  const grandHeaderStickyHtml = grandHeaderInner ? `
      <div style="position:sticky;top:0;z-index:10;margin:0 4px 8px;">
        <div class="card" style="padding:8px 16px;box-shadow:var(--shadow-2);">
          ${grandHeaderInner}
        </div>
      </div>
  ` : "";

  // Vue "mois par mois" (bouton calendrier) : remplace la liste de cartes par un tableau à colonne Total
  // figée + une colonne par mois défilante — voir buildBudgetMonthlyTableHtml.
  const monthlyOn = !!cfg.monthlyView;
  const monthlyTableHtml = monthlyOn ? buildBudgetMonthlyTableHtml(months, cfg, mainRes, extraResults, allGroupNames) : "";

  view.innerHTML = `
    <div class="section" style="padding-top:2px;">
      <div class="card" style="margin:0 4px 14px;padding:14px;">
        <div style="display:flex;gap:14px;margin:0 0 10px;align-items:stretch;">
          <div class="seg seg-sm" id="bg-mode-seg" style="flex:1;">
            <button data-m="amorti" class="${cfg.mode==='amorti'?'active':''}">Amort. + ajouts</button>
            <button data-m="brut_ajout" class="${cfg.mode==='brut_ajout'?'active':''}">Ajouts</button>
          </div>
          <button type="button" id="bg-monthly-toggle-btn" title="${cfg.monthlyView?'Revenir à la vue par groupe':'Voir le budget mois par mois'}" style="flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:40px;border:none;border-radius:100px;cursor:pointer;background:${cfg.monthlyView?'var(--primary)':'var(--card-alt)'};color:${cfg.monthlyView?'#fff':'var(--text-sub)'};">
            <span style="width:17px;height:17px;display:flex;">${ICONS.calendar}</span>
          </button>
          <button type="button" id="bg-detail-toggle-btn" title="${cfg.detailView?'Masquer le détail (Réel / Amorti / Ajout)':'Afficher le détail (Réel / Amorti / Ajout)'}" style="flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:40px;border:none;border-radius:100px;cursor:pointer;background:${cfg.detailView?'var(--primary)':'var(--card-alt)'};color:${cfg.detailView?'#fff':'var(--text-sub)'};">
            <span style="width:17px;height:17px;display:flex;">${ICONS.columns}</span>
          </button>
        </div>
        <div style="display:flex;gap:8px;margin:0 0 10px;">
          <div class="seg seg-sm" id="bg-scope-seg" style="flex:1;">
            <button data-v="perso" class="${cfg.scope==='perso'?'active':''}">Perso</button>
            <button data-v="couple" class="${cfg.scope==='couple'?'active':''}">Couple</button>
          </div>
          <div class="seg seg-sm" id="bg-display-seg" style="flex:1;">
            <button data-d="total" class="${cfg.displayMode!=='moyenne'?'active':''}">Total</button>
            <button data-d="moyenne" class="${cfg.displayMode==='moyenne'?'active':''}">Moyenne</button>
          </div>
        </div>
        ${periodPickerHtml()}
      </div>
      <div style="display:flex;gap:6px;margin:0 4px 14px;">
        ${budgetToolButtonHtml("bg-amort-open-btn", "Amortissement", cfg.mode==="amorti" ? ((cfg.amortCategories||[]).length+" catégorie"+((cfg.amortCategories||[]).length>1?"s":"")) : "Inactif (mode Ajouts)")}
        ${budgetToolButtonHtml("bg-adj-open-btn", "Ajustements", adjustmentsInPeriod().length ? (adjustmentsInPeriod().length+" sur la période") : "Aucun")}
        ${budgetToolButtonHtml("bg-cmp-open-btn", "Comparaison", cmpSublabel)}
        ${budgetToolButtonHtml("bg-acctexcl-open-btn", "Comptes exclus", (cfg.excludedAccounts||[]).length ? (cfg.excludedAccounts.length+" exclu"+(cfg.excludedAccounts.length>1?"s":"")) : "Aucun")}
      </div>
      ${monthlyOn ? `
      <div style="padding:0 4px 14px;">${monthlyTableHtml}</div>
      ` : `
      ${grandHeaderStickyHtml}
      <div class="card" style="margin-bottom:14px;">
        ${compareCtx ? `
        <div class="detail-row bg-typetxn-all-row" data-type="" style="cursor:pointer;display:block;padding:0 0 6px;">
          ${compareRowHtml("Total tous groupes", dv(grandNet), grandCmp.total, {big:true}, {sheet:"group", groups:allGroupNames.join("||"), type:""})}
        </div>
        <div class="detail-row bg-typetxn-all-row" data-type="Income" style="cursor:pointer;display:block;padding:6px 0;">
          ${compareRowHtml("Revenus", dv(grandCatIncome), grandCmp.income, {big:false}, {sheet:"group", groups:allGroupNames.join("||"), type:"Income"})}
        </div>
        <div class="detail-row bg-typetxn-all-row" data-type="Expense" style="cursor:pointer;display:block;padding:6px 0;">
          ${compareRowHtml("Dépenses", dv(grandCatExpense), grandCmp.expense, {big:false}, {sheet:"group", groups:allGroupNames.join("||"), type:"Expense"})}
        </div>
        <div class="detail-row bg-typetxn-all-row" data-type="Voyage" style="cursor:pointer;display:block;padding:6px 0;">
          ${compareRowHtml("Voyages", dv(grandVoyNet), grandCmp.voyage, {big:false}, {sheet:"group", groups:allGroupNames.join("||"), type:"Voyage"})}
        </div>
        ` : detailOn ? `
        <div style="display:block;padding:0 0 6px;">
          ${detailRowHtml("Total tous groupes", cfg.mode, dv(grandBreak.total.real), dv(grandBreak.total.amort), dv(grandBreak.total.adj), {big:true}, {sheet:"group", supergroupe:allGroupNames[0], groups:allGroupNames.join("||"), type:""})}
        </div>
        <div style="padding:6px 0;">
          ${detailRowHtml("Revenus", cfg.mode, dv(grandBreak.inc.real), dv(grandBreak.inc.amort), dv(grandBreak.inc.adj), {big:false}, {sheet:"group", supergroupe:allGroupNames[0], groups:allGroupNames.join("||"), type:"Income"})}
        </div>
        <div style="padding:6px 0;">
          ${detailRowHtml("Dépenses", cfg.mode, dv(grandBreak.exp.real), dv(grandBreak.exp.amort), dv(grandBreak.exp.adj), {big:false}, {sheet:"group", supergroupe:allGroupNames[0], groups:allGroupNames.join("||"), type:"Expense"})}
        </div>
        <div style="padding:6px 0;">
          ${detailRowHtml("Voyages", cfg.mode, dv(grandBreak.voy.real), dv(grandBreak.voy.amort), dv(grandBreak.voy.adj), {big:false}, {sheet:"group", supergroupe:allGroupNames[0], groups:allGroupNames.join("||"), type:"Voyage"})}
        </div>
        ` : `
        <div class="detail-row bg-typetxn-all-row" data-type="" style="cursor:pointer;padding:0 0 4px;">
          <span style="font-weight:800;font-size:16px;">Total tous groupes</span>
          <span style="display:flex;align-items:baseline;gap:6px;">
            <span style="font-size:9.5px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:.3px;">Total</span>
            <span style="font-weight:800;font-size:16px;color:${grandNet<0?'var(--expense)':'var(--income)'}">${bgFmtMoneySigned(dv(grandNet))}</span>
          </span>
        </div>
        <div class="detail-row bg-typetxn-all-row" data-type="Income" style="cursor:pointer;"><span>Revenus</span><span style="color:var(--income);">${bgFmtMoneySigned(dv(grandCatIncome))}</span></div>
        <div class="detail-row bg-typetxn-all-row" data-type="Expense" style="cursor:pointer;"><span>Dépenses</span><span style="color:var(--expense);">${bgFmtMoneySigned(dv(grandCatExpense))}</span></div>
        <div class="detail-row bg-typetxn-all-row" data-type="Voyage" style="cursor:pointer;"><span>Voyages</span><span style="color:${grandVoyNet<0?'var(--expense)':'var(--income)'}">${bgFmtMoneySigned(dv(grandVoyNet))}</span></div>
        `}
      </div>
      ${mainCard.html}
      ${extraCards.map(c=>c.html).join("")}
      <button type="button" class="btn btn-ghost btn-block" id="bg-newgroup-btn" style="margin:0 4px 14px;">${ICONS.plus} Nouveau groupe</button>
      `}
      <div style="height:10px;"></div>
    </div>
  `;

  document.querySelectorAll("#bg-mode-seg button").forEach(b=>{
    b.onclick = ()=>{
      cfg.mode = b.dataset.m;
      Store.saveSettings();
      renderBudget();
    };
  });
  document.getElementById("bg-detail-toggle-btn").onclick = ()=>{
    cfg.detailView = !cfg.detailView;
    Store.saveSettings();
    renderBudget();
  };
  document.getElementById("bg-monthly-toggle-btn").onclick = ()=>{
    cfg.monthlyView = !cfg.monthlyView;
    Store.saveSettings();
    renderBudget();
  };
  document.querySelectorAll("#bg-scope-seg button").forEach(b=>{
    b.onclick = ()=>{
      cfg.scope = b.dataset.v;
      Store.saveSettings();
      renderBudget();
    };
  });
  document.querySelectorAll("#bg-display-seg button").forEach(b=>{
    b.onclick = ()=>{
      cfg.displayMode = b.dataset.d;
      Store.saveSettings();
      renderBudget();
    };
  });
  document.getElementById("bg-amort-open-btn").onclick = openAmortSheet;
  document.getElementById("bg-adj-open-btn").onclick = ()=>{
    const inPeriod = adjustmentsInPeriod();
    if(inPeriod.length) openAdjustmentsListSheet();
    else openAdjustmentForm(null);
  };
  document.getElementById("bg-cmp-open-btn").onclick = openCompareSheet;
  document.getElementById("bg-acctexcl-open-btn").onclick = openAccountExcludeSheet;
  const newGroupBtn = document.getElementById("bg-newgroup-btn");
  if(newGroupBtn) newGroupBtn.onclick = ()=>{
    const exclude = new Set([cfg.mainGroup].concat(selectedExtra));
    PICKER.openPicker({
      title:"Nouveau groupe", hierarchy: groupPickerHierarchy(exclude), value: null,
      onSelect:(v)=>{
        if(!v) return;
        const set = new Set(cfg.extraGroups||[]);
        set.add(v);
        cfg.extraGroups = Array.from(set);
        Store.saveSettings();
        renderBudget();
      }
    });
  };
  // Vue "mois par mois" : chaque cellule (Total ou mois), qu'elle appartienne à une ligne groupe, catégorie
  // ou voyage, ouvre la même liste de transactions que le clic correspondant dans la vue par carte ; le
  // tableau se fait glisser à la souris sur ordinateur (voir enableDragScroll).
  const monthlyTableWrap = document.getElementById("bg-monthly-table-wrap");
  if(monthlyTableWrap){
    U.enableDragScroll(monthlyTableWrap);
    monthlyTableWrap.querySelectorAll("td.bg-detail-cell").forEach(el=>{
      el.onclick = ()=>{
        const kind = el.dataset.kind;
        const monthOpt = el.dataset.month ? {month: el.dataset.month} : {};
        if(kind==="cat"){
          if(isSalaryCategory(el.dataset.key)) openSalaryEditor(el.dataset.group, el.dataset.key);
          else openCategoryTxnSheet(el.dataset.group, el.dataset.key, monthOpt);
        } else if(kind==="voy"){
          openVoyageTxnSheet(el.dataset.group, el.dataset.key, monthOpt);
        } else if(el.dataset.groups){
          const groups = el.dataset.groups.split("||");
          if(el.dataset.month) openGroupMonthTxnSheet(groups, el.dataset.month);
          else openGroupTypeTxnSheet(groups, null);
        }
      };
    });
  }
  document.querySelectorAll(".bg-group-swap-btn[data-group]").forEach(el=>{
    el.onclick = ()=> openGroupSwapPicker(el.dataset.group, el.dataset.ismain==="1");
  });
  document.querySelectorAll(".bg-group-remove-btn[data-group]").forEach(el=>{
    el.onclick = ()=>{
      const g = el.dataset.group;
      cfg.extraGroups = (cfg.extraGroups||[]).filter(x=>x!==g);
      Store.saveSettings();
      renderBudget();
    };
  });
  const bgFromEl = document.getElementById("bg-from");
  if(bgFromEl) bgFromEl.onchange = (e)=>{
    periodFrom = e.target.value || null;
    if(periodFrom && periodTo && periodFrom>periodTo) periodTo = periodFrom;
    persistPeriod(); renderBudget();
  };
  const bgFromClear = document.getElementById("bg-from-clear");
  if(bgFromClear) bgFromClear.onclick = ()=>{ periodFrom = null; persistPeriod(); renderBudget(); };
  const bgFromUndef = document.getElementById("bg-from-undef");
  if(bgFromUndef) bgFromUndef.onclick = ()=>{
    const now = new Date();
    periodFrom = periodTo || (now.getFullYear()+"-"+U.pad2(now.getMonth()+1));
    persistPeriod(); renderBudget();
  };
  const bgToEl = document.getElementById("bg-to");
  if(bgToEl) bgToEl.onchange = (e)=>{
    periodTo = e.target.value || null;
    if(periodFrom && periodTo && periodTo<periodFrom) periodFrom = periodTo;
    persistPeriod(); renderBudget();
  };
  const bgToClear = document.getElementById("bg-to-clear");
  if(bgToClear) bgToClear.onclick = ()=>{ periodTo = null; persistPeriod(); renderBudget(); };
  const bgToUndef = document.getElementById("bg-to-undef");
  if(bgToUndef) bgToUndef.onclick = ()=>{
    const now = new Date();
    periodTo = periodFrom || (now.getFullYear()+"-"+U.pad2(now.getMonth()+1));
    persistPeriod(); renderBudget();
  };
  document.querySelectorAll(".budget-cat-row[data-cat]").forEach(el=>{
    el.onclick = ()=>{
      if(isSalaryCategory(el.dataset.cat)) openSalaryEditor(el.dataset.supergroupe, el.dataset.cat);
      else openCategoryTxnSheet(el.dataset.supergroupe, el.dataset.cat);
    };
  });
  document.querySelectorAll(".budget-voy-row[data-voy]").forEach(el=>{
    el.onclick = ()=> openVoyageTxnSheet(el.dataset.supergroupe, el.dataset.voy);
  });
  document.querySelectorAll(".bg-typetxn-row[data-supergroupe]").forEach(el=>{
    el.onclick = ()=> openGroupTypeTxnSheet(el.dataset.supergroupe, el.dataset.type || null);
  });
  document.querySelectorAll(".bg-typetxn-all-row[data-type]").forEach(el=>{
    el.onclick = ()=> openGroupTypeTxnSheet(allGroupNames, el.dataset.type || null);
  });
  document.querySelectorAll(".bg-section-total[data-supergroupe]").forEach(el=>{
    el.onclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      openGroupTypeTxnSheet(el.dataset.supergroupe, el.dataset.type || null);
    };
  });
  /* Vue détail (3 colonnes cliquables) : chaque valeur (Réel+ajout/Brut, Amorti/Ajout, Total) ouvre la
     feuille de détail appropriée (catégorie, voyage, ou groupe/type) avec le filtre correspondant à la
     colonne cliquée — data-filter="" (ou absent) pour la colonne Total affiche tout, sans filtre. */
  document.querySelectorAll(".bg-detail-cell[data-sheet]").forEach(el=>{
    el.onclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const filterKind = el.dataset.filter || null;
      const sheet = el.dataset.sheet;
      if(sheet==="cat"){
        if(isSalaryCategory(el.dataset.cat)) openSalaryEditor(el.dataset.supergroupe, el.dataset.cat);
        else openCategoryTxnSheet(el.dataset.supergroupe, el.dataset.cat, {filterKind});
      } else if(sheet==="voy"){
        openVoyageTxnSheet(el.dataset.supergroupe, el.dataset.voy, {filterKind});
      } else if(sheet==="group"){
        const names = el.dataset.groups ? el.dataset.groups.split("||") : [el.dataset.supergroupe];
        openGroupTypeTxnSheet(names, el.dataset.type || null, {filterKind});
      }
    };
  });
  /* Cellule "Comparé" (colonne du milieu des lignes de comparaison) : ouvre exactement la même feuille de
     détail que le scénario principal (mêmes badges Réel/Amorti/Ajouts, même liste filtrable), mais avec les
     montants de la période comparée — voir opts.periodOverride dans openCategoryTxnSheet/openVoyageTxnSheet/
     openGroupTypeTxnSheet. En mode "Budget prédéfini" (pas de transactions sous-jacentes), ouvre à la place
     l'éditeur du budget prédéfini, seule source réelle de ce montant. */
  document.querySelectorAll(".bg-cmp-cell[data-sheet]").forEach(el=>{
    el.onclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const cmpNow = Store.settings.budget.compare;
      if(!cmpNow || !cmpNow.enabled) return;
      if(cmpNow.mode==="predefined"){ openPredefinedBudgetSheet(); return; }
      if(!cmpNow.periodFrom || !cmpNow.periodTo) return;
      const periodOverride = {from: cmpNow.periodFrom, to: cmpNow.periodTo};
      const sheet = el.dataset.sheet;
      if(sheet==="cat"){
        if(isSalaryCategory(el.dataset.cat)) openSalaryEditor(el.dataset.supergroupe, el.dataset.cat);
        else openCategoryTxnSheet(el.dataset.supergroupe, el.dataset.cat, {periodOverride});
      } else if(sheet==="voy"){
        openVoyageTxnSheet(el.dataset.supergroupe, el.dataset.voy, {periodOverride});
      } else if(sheet==="group"){
        const names = el.dataset.groups ? el.dataset.groups.split("||") : [el.dataset.supergroupe];
        openGroupTypeTxnSheet(names, el.dataset.type || null, {periodOverride});
      }
    };
  });
  document.querySelectorAll(".bg-cv-section[data-section-key]").forEach(el=>{
    el.addEventListener("toggle", function(){
      allSectionsOpen = this.open;
      document.querySelectorAll(".bg-cv-section[data-section-key]").forEach(other=>{
        if(other!==this) other.open = this.open;
      });
    });
  });
}

/* ---------------- Détail des transactions d'une catégorie (Amorti / Réel) ---------------- */
function openCategoryTxnSheet(superGroupeName, catKey, opts){
  opts = opts || {};
  let filterKind = opts.filterKind || null; // null | "reel" | "amorti" | "ajout" | "reel_ajout"
  const cfg = Store.settings.budget;
  // boundsMonths = période affichée complète (pour le calcul de fenêtre d'amortissement, cf.
  // amortWindowMonths/computeAmortPeriodMonths) ; months = soit cette même période (comportement d'origine),
  // soit un seul mois quand opts.month est fourni (clic sur une cellule de la vue "mois par mois").
  // opts.periodOverride ({from, to}) : clic sur la cellule "Comparé" d'une ligne de comparaison — la feuille
  // s'ouvre alors sur la période comparée au lieu de la période principale affichée, avec exactement le même
  // comportement (badges Réel/Amorti/Ajouts, filtrage, amortissement) que pour le scénario principal.
  const boundsMonths = opts.periodOverride ? monthsInRange(opts.periodOverride.from, opts.periodOverride.to) : monthsInRange(periodFrom, periodTo);
  const months = opts.month ? [opts.month] : boundsMonths;
  const monthSet = new Set(months);
  const amortSet = new Set(cfg.amortCategories||[]);
  const isAmorti = cfg.mode==="amorti" && superGroupeName===cfg.mainGroup;
  const periodMonths = computeAmortPeriodMonths(months, boundsMonths);
  const windowN = amortWindowMonths(months, periodMonths, boundsMonths).length;
  // Montant "utilisé" par le budget : les transactions réelles sont doublées en vue Couple (comme dans
  // computeGroupBudget) ; les ajustements manuels restent en montant brut, non multipliés (§5.3 doc).
  const scopeMult = cfg.scope==="couple" ? 2 : 1;

  const items = [];
  Store.transactions.forEach(t=>{
    if(t.type==="Transfer") return;
    if(!groupSelectionMatches(t, superGroupeName)) return;
    if(isAccountExcluded(t.compte)) return;
    const base = t.groupeBase || U.baseGroupe(t.groupe);
    if(AGG.getGroupKind(t.groupe)==="voyage") return;
    const cat = t.categorie || "(Non renseigné)";
    if(cat !== catKey) return;
    const tr = t.transform;
    const effMonthKey = tr.mode==="month" ? (tr.year+"-"+U.pad2(tr.month+1)) : (t.date.getFullYear()+"-"+U.pad2(t.date.getMonth()+1));
    const beforeStart = cfg.startMonth && effMonthKey < cfg.startMonth;
    const afterEnd = cfg.endMonth && effMonthKey > cfg.endMonth;
    const amortized = isAmorti && (amortSet.has(cat) || beforeStart || afterEnd);
    if(amortized){
      // Toute transaction éligible (même très ancienne) alimente l'amortissement, mais sa contribution
      // affichée est nulle si la période actuellement affichée ne recoupe pas la fenêtre d'amortissement
      // [Mois de début → + période - 1] — jamais avant ni après cette fenêtre (cf. computeGroupBudget).
      if(windowN<=0) return;
      const displayAmount = (t.montant/periodMonths)*windowN*scopeMult;
      items.push({kind:"amorti", date: t.date, txnId: t.id, remarque: t.remarque||t.categorie||"—", displayAmount, rawAmount: t.montant, effMonthKey, yearsplit:false});
      return;
    }
    // Dépense non amortie : prise en compte seulement si son mois (corrigé) tombe dans la période affichée.
    const inPeriod = monthSet.has(effMonthKey) || (tr.mode==="yearsplit" && String(tr.year)>=months[0].slice(0,4) && String(tr.year)<=months[months.length-1].slice(0,4));
    if(!inPeriod) return;
    let displayAmount = tr.mode==="yearsplit" ? (t.montant/12) * yearsplitMonthsInPeriod(tr.year, monthSet) : t.montant;
    displayAmount *= scopeMult;
    items.push({kind:"reel", date: t.date, txnId: t.id, remarque: t.remarque||t.categorie||"—", displayAmount, rawAmount: t.montant, effMonthKey, yearsplit: tr.mode==="yearsplit", yearsplitCount: tr.mode==="yearsplit"?yearsplitMonthsInPeriod(tr.year, monthSet):null});
  });

  // Ajustements manuels ciblant cette catégorie pour ce groupe, sur la période affichée. Montant converti
  // à l'échelle du scope courant (Perso/Couple), comme pour les transactions réelles ci-dessus, afin que
  // la somme des montants affichés corresponde bien au total de la carte. En mode "Sans amort, avec ajout",
  // les ajustements amortis (case "Amortir ce montant...") sont exclus (ni entrée immédiate, ni lissage) —
  // seuls les ajustements simples restent pris en compte.
  const applyAdjustments = (cfg.mode==="amorti" || cfg.mode==="brut_ajout") && superGroupeName===cfg.mainGroup;
  if(applyAdjustments){
    (cfg.adjustments||[]).forEach((adj, adjIdx)=>{
      if(adj.groupe !== superGroupeName) return;
      if((adj.categorie||"") !== catKey) return;
      if(!isAmorti && adj.amorti) return;
      const amt = adjustmentScopedAmount(adj);
      if(monthSet.has(adj.month)){
        const [ay,am] = adj.month.split("-").map(Number);
        items.push({kind:"ajout", date: new Date(ay, (am||1)-1, 1), txnId:null, adjIdx, remarque: adj.remarque||"Ajustement", displayAmount: amt});
      }
      if(adj.amorti && isAmorti && amt && windowN>0){
        const [ay,am] = adj.month.split("-").map(Number);
        items.push({kind:"amorti", date: new Date(ay, (am||1)-1, 1), txnId:null, adjIdx, remarque: "Amortissement : "+(adj.remarque||"Ajustement"), displayAmount: -amt/periodMonths*windowN});
      }
    });
  }

  items.sort((a,b)=> b.date - a.date);

  // Totaux cohérents avec ceux affichés sur la carte du groupe (calcul identique à computeGroupBudget).
  const budgetRes = computeGroupBudget(superGroupeName, months, {forceBrut: superGroupeName!==cfg.mainGroup, boundsMonths});
  const catEntry = budgetRes.categories.find(c=>c.key===catKey);
  const realTotal = catEntry ? (catEntry.realIncome||0)+(catEntry.realExpense||0) : 0;
  const amortTotal = catEntry ? (catEntry.amortIncome||0)+(catEntry.amortExpense||0) : 0;
  const adjTotal = catEntry ? (catEntry.adjIncome||0)+(catEntry.adjExpense||0) : 0;
  const monthSubtitle = opts.month ? (()=>{ const [my,mm] = opts.month.split("-").map(Number); const l = U.fmtMonthYear(my, mm-1); return " · "+l.charAt(0).toUpperCase()+l.slice(1); })() : "";

  const KIND_STYLE = {
    reel:   {label:"Réel",   bg:"var(--primary-soft)",  fg:"var(--primary)"},
    amorti: {label:"Amorti", bg:"var(--transfer-soft)", fg:"var(--transfer)"},
    ajout:  {label:"Ajout",  bg:"var(--card-alt)",      fg:"var(--text-sub)"},
  };

  function renderModal(){
    const shown = items.filter(x=>bgKindIncluded(filterKind, x.kind));
    const modal = document.getElementById("modal-detail");
    modal.innerHTML = `
      <div class="u-row-between-sm">
        <span class="u-title-lg">${U.escHtml(catKey)}</span>
        <button class="icon-btn" id="cattxn-close">${ICONS.close}</button>
      </div>
      <div class="u-subtitle">${U.escHtml(superGroupeName)}${monthSubtitle} · ${shown.length} élément${shown.length>1?"s":""}</div>
      <div class="u-badge-row">
        <span class="cattxn-badge" data-kind="reel" style="cursor:pointer;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:${KIND_STYLE.reel.bg};color:${KIND_STYLE.reel.fg};${filterKind&&!bgKindIncluded(filterKind,'reel')?'opacity:.45;':''}${filterKind==='reel'?'box-shadow:0 0 0 2px '+KIND_STYLE.reel.fg+';':''}">Réel : ${bgFmtMoneySigned(realTotal)}</span>
        ${amortTotal!==0 ? `<span class="cattxn-badge" data-kind="amorti" style="cursor:pointer;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:${KIND_STYLE.amorti.bg};color:${KIND_STYLE.amorti.fg};${filterKind&&!bgKindIncluded(filterKind,'amorti')?'opacity:.45;':''}${filterKind==='amorti'?'box-shadow:0 0 0 2px '+KIND_STYLE.amorti.fg+';':''}">Amorti : ${bgFmtMoneySigned(amortTotal)}</span>` : ""}
        ${adjTotal!==0 ? `<span class="cattxn-badge" data-kind="ajout" style="cursor:pointer;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:${KIND_STYLE.ajout.bg};color:${KIND_STYLE.ajout.fg};${filterKind&&!bgKindIncluded(filterKind,'ajout')?'opacity:.45;':''}${filterKind==='ajout'?'box-shadow:0 0 0 2px '+KIND_STYLE.ajout.fg+';':''}">Ajouts : ${bgFmtMoneySigned(adjTotal)}</span>` : ""}
      </div>
      <div class="u-scroll-56">
        ${shown.length===0 ? `<div class="u-empty-note">Aucun élément${filterKind?" pour ce filtre":""} sur la période affichée.</div>` :
        shown.map((x,i)=>`
          <div class="detail-row cattxn-row" ${x.txnId?`data-txnid="${U.escHtml(x.txnId)}"`:""} ${x.adjIdx!=null?`data-adjidx="${x.adjIdx}"`:""} style="align-items:center;${(x.txnId||x.adjIdx!=null)?'cursor:pointer;':''}">
            <span class="u-col-shrink">
              <span style="font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${(x.txnId||x.adjIdx!=null)?'text-decoration:underline;text-decoration-color:var(--divider);':''}">${U.escHtml(x.remarque)}</span>
              <span class="u-note-11">${x.kind==="ajout"||x.adjIdx!=null ? fmtMonthYearShort(x.date.getFullYear(),x.date.getMonth()) : U.fmtDateShort(x.date)}${x.kind==="amorti"?" · "+windowN+"/"+periodMonths+" mois":""}${x.yearsplit?" · "+x.yearsplitCount+"/12 mois":""}</span>
            </span>
            <span class="u-row-gap8-fixed">
              ${x.kind==="reel" ? `<button type="button" class="btn btn-ghost btn-sm cattxn-amortize" data-txnid="${U.escHtml(x.txnId)}" data-month="${U.escHtml(x.effMonthKey)}" data-amount="${x.rawAmount}" data-remarque="${U.escHtml(x.remarque)}" style="padding:3px 9px;font-size:10.5px;">Amortir</button>` : ""}
              <span style="font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;background:${KIND_STYLE[x.kind].bg};color:${KIND_STYLE[x.kind].fg};">${KIND_STYLE[x.kind].label}</span>
              <span style="font-weight:700;font-size:13.5px;color:${x.displayAmount<0?'var(--expense)':'var(--income)'}">${bgFmtMoneySigned(x.displayAmount)}</span>
            </span>
          </div>
        `).join("")}
      </div>
    `;
    document.getElementById("cattxn-close").onclick = ()=>APP.closeOverlay("overlay-detail");
    document.querySelectorAll(".cattxn-badge[data-kind]").forEach(el=>{
      el.onclick = ()=>{
        const k = el.dataset.kind;
        filterKind = (filterKind===k) ? null : k;
        renderModal();
      };
    });
    document.querySelectorAll(".cattxn-amortize[data-txnid]").forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        openAdjustmentForm(null, {
          month: btn.dataset.month,
          groupe: superGroupeName,
          categorie: catKey,
          montant: -Number(btn.dataset.amount),
          remarque: "Amortissement : "+(btn.dataset.remarque||catKey),
          amorti: true,
          montantScope: "perso"
        });
      };
    });
    document.querySelectorAll(".cattxn-row[data-txnid]").forEach(el=>{
      el.onclick = ()=> window.__SF_VIEWS.openTxnDetail(el.dataset.txnid);
    });
    document.querySelectorAll(".cattxn-row[data-adjidx]").forEach(el=>{
      if(el.dataset.txnid) return;
      el.onclick = ()=>{
        const idx = Number(el.dataset.adjidx);
        const a = Object.assign({__idx:idx}, (cfg.adjustments||[])[idx]);
        openAdjustmentForm(a);
      };
    });
  }

  renderModal();
  APP.openOverlay("overlay-detail");
}

/* ---------------- Salaire : édition manuelle Moi / Ma femme, mois par mois ---------------- */
function openSalaryEditor(superGroupeName, catKey){
  const cfg = Store.settings.budget;
  const months = monthsInRange(periodFrom, periodTo);

  function computeRow(m){
    const b = salaryMonthBreakdown(superGroupeName, catKey, m);
    const entry = salaryEntryFor(m);
    const fallback = salaryRealMonthAmount(superGroupeName, catKey, m);
    return {entry, fallback, total: b.total, real: b.real, adj: b.adj};
  }

  function periodTotal(){
    return months.reduce((s,m)=> s+computeRow(m).total, 0);
  }

  function renderModal(){
    const modal = document.getElementById("modal-detail");
    const rowsHtml = months.map(m=>{
      const r = computeRow(m);
      const [y,mm] = m.split("-").map(Number);
      const label = fmtMonthYearShort(y, mm-1);
      return `
        <div class="detail-row" style="align-items:center;gap:6px;flex-wrap:nowrap;padding:8px 0;">
          <span style="flex:0 0 62px;font-size:12px;font-weight:600;">${U.escHtml(label)}</span>
          <input type="number" step="0.01" inputmode="decimal" class="search-mini salf-moi" data-month="${m}" placeholder="${r.fallback?bgFmtMoney(r.fallback):'0,00 €'}" value="${r.entry.moi!=null?r.entry.moi:''}" style="flex:1;min-width:0;margin:0;">
          <input type="number" step="0.01" inputmode="decimal" class="search-mini salf-femme" data-month="${m}" placeholder="0,00 €" value="${r.entry.femme!=null?r.entry.femme:''}" style="flex:1;min-width:0;margin:0;">
          <span class="salf-total" data-month="${m}" style="flex:0 0 76px;text-align:right;font-weight:700;font-size:13px;color:${r.total<0?'var(--expense)':'var(--income)'}">${bgFmtMoneySigned(r.total)}</span>
        </div>`;
    }).join("");
    modal.innerHTML = `
      <div class="u-row-between-sm">
        <span class="u-title-lg">${U.escHtml(catKey)}</span>
        <button class="icon-btn" id="salf-close">${ICONS.close}</button>
      </div>
      <div style="color:var(--text-sub);font-size:12.5px;margin-bottom:10px;">${U.escHtml(superGroupeName)} · saisie manuelle · vue ${cfg.scope==="couple"?"Couple":"Perso"}</div>
      <div style="font-size:11.5px;color:var(--text-sub);margin-bottom:10px;line-height:1.4;">
        Laisser "Moi" vide pour utiliser le montant des transactions du mois. En vue Couple, le total additionne mon salaire et celui de ma femme (0 € si non saisi). En vue Perso, seul mon salaire compte.
        <br><strong>Brut / Ajout :</strong> le montant des transactions est toujours le "Brut" de mon salaire ; si je saisis une valeur "Moi" différente, l'écart apparaît comme "Ajout" dans la vue détaillée du Budget. Le salaire de ma femme est, lui, entièrement considéré comme "Brut" (sa saisie n'est jamais comparée à des transactions).
      </div>
      <div class="detail-row" style="align-items:center;gap:6px;padding:2px 0 6px;font-size:10.5px;color:var(--text-sub);font-weight:700;">
        <span style="flex:0 0 62px;">Mois</span>
        <span style="flex:1;">Moi</span>
        <span style="flex:1;">Ma femme</span>
        <span style="flex:0 0 76px;text-align:right;">Total</span>
      </div>
      <div style="max-height:48vh;overflow-y:auto;">${rowsHtml}</div>
      <div class="detail-row" style="align-items:center;margin-top:6px;padding-top:10px;border-top:2px solid var(--divider);">
        <span style="font-weight:800;font-size:13.5px;">Total période</span>
        <span style="font-weight:800;font-size:15px;color:var(--income);" id="salf-period-total">${bgFmtMoneySigned(periodTotal())}</span>
      </div>
      <button class="btn btn-ghost btn-block" id="salf-realtxn" style="margin-top:14px;">Voir les transactions réelles</button>
    `;
    document.getElementById("salf-close").onclick = ()=>APP.closeOverlay("overlay-detail");
    document.getElementById("salf-realtxn").onclick = ()=> openCategoryTxnSheet(superGroupeName, catKey);
    function saveField(month, field, val){
      cfg.salaryEntries = cfg.salaryEntries || {};
      const cur = Object.assign({}, cfg.salaryEntries[month]);
      cur[field] = (val==null || val==="") ? null : Number(val);
      cfg.salaryEntries[month] = cur;
      Store.saveSettings();
      const r = computeRow(month);
      const totalEl = modal.querySelector(`.salf-total[data-month="${month}"]`);
      if(totalEl){
        totalEl.textContent = bgFmtMoneySigned(r.total);
        totalEl.style.color = r.total<0 ? 'var(--expense)' : 'var(--income)';
      }
      const periodEl = document.getElementById("salf-period-total");
      if(periodEl) periodEl.textContent = bgFmtMoneySigned(periodTotal());
      renderBudget();
    }
    modal.querySelectorAll(".salf-moi").forEach(inp=>{
      inp.onchange = (e)=> saveField(e.target.dataset.month, "moi", e.target.value);
    });
    modal.querySelectorAll(".salf-femme").forEach(inp=>{
      inp.onchange = (e)=> saveField(e.target.dataset.month, "femme", e.target.value);
    });
  }

  renderModal();
  APP.openOverlay("overlay-detail");
}

function openVoyageTxnSheet(superGroupeName, voyKey, opts){
  opts = opts || {};
  let filterKind = opts.filterKind || null; // null | "reel" | "amorti" | "ajout" | "reel_ajout"
  const cfg = Store.settings.budget;
  // boundsMonths = période affichée complète ; months = cette même période, ou un seul mois si opts.month
  // est fourni (clic sur une cellule de la vue "mois par mois"), ou la période comparée si opts.periodOverride
  // est fourni (clic sur la cellule "Comparé") — voir openCategoryTxnSheet ci-dessus.
  const boundsMonths = opts.periodOverride ? monthsInRange(opts.periodOverride.from, opts.periodOverride.to) : monthsInRange(periodFrom, periodTo);
  const months = opts.month ? [opts.month] : boundsMonths;
  const monthSet = new Set(months);
  const scopeMult = cfg.scope==="couple" ? 2 : 1;

  const items = [];
  if(voyKey === "__ajustement__"){
    const isAmorti = cfg.mode==="amorti" && superGroupeName===cfg.mainGroup;
    const applyAdjustments = (cfg.mode==="amorti" || cfg.mode==="brut_ajout") && superGroupeName===cfg.mainGroup;
    const periodMonths = computeAmortPeriodMonths(months, boundsMonths);
    const windowN = amortWindowMonths(months, periodMonths, boundsMonths).length;
    if(applyAdjustments){
      (cfg.adjustments||[]).forEach(adj=>{
        if(adj.groupe !== superGroupeName) return;
        if(adj.categorie) return;
        if(!isAmorti && adj.amorti) return;
        const amt = adjustmentScopedAmount(adj);
        if(monthSet.has(adj.month)){
          const [ay,am] = adj.month.split("-").map(Number);
          items.push({kind:"ajout", date: new Date(ay, (am||1)-1, 1), txnId:null, remarque: adj.remarque||"Ajustement", displayAmount: amt});
        }
        if(adj.amorti && isAmorti && amt && windowN>0){
          const [ay,am] = adj.month.split("-").map(Number);
          items.push({kind:"amorti", date: new Date(ay, (am||1)-1, 1), txnId:null, remarque: "Amortissement : "+(adj.remarque||"Ajustement"), displayAmount: -amt/periodMonths*windowN});
        }
      });
    }
  } else {
    Store.transactions.forEach(t=>{
      if(t.type==="Transfer") return;
      if(!groupSelectionMatches(t, superGroupeName)) return;
      if(isAccountExcluded(t.compte)) return;
      const base = t.groupeBase || U.baseGroupe(t.groupe);
      if(AGG.getGroupKind(t.groupe)!=="voyage") return;
      if(t.groupe !== voyKey) return;
      const tr = t.transform;
      let inPeriod;
      if(tr.mode==="yearsplit"){
        inPeriod = String(tr.year) >= months[0].slice(0,4) && String(tr.year) <= months[months.length-1].slice(0,4);
      } else {
        const forced = AGG.getGroupVoyageMonth(t.groupe);
        let targetMonth = forced;
        if(!targetMonth){
          if(tr.mode==="month") targetMonth = tr.year+"-"+U.pad2(tr.month+1);
          else targetMonth = t.date.getFullYear()+"-"+U.pad2(t.date.getMonth()+1);
        }
        inPeriod = monthSet.has(targetMonth);
      }
      if(!inPeriod) return;
      const displayAmount = (tr.mode==="yearsplit" ? (t.montant/12) * yearsplitMonthsInPeriod(tr.year, monthSet) : t.montant) * scopeMult;
      items.push({kind:"reel", date: t.date, txnId: t.id, remarque: t.remarque||t.categorie||"—", displayAmount, yearsplit: tr.mode==="yearsplit", yearsplitCount: tr.mode==="yearsplit"?yearsplitMonthsInPeriod(tr.year, monthSet):null});
    });
  }

  items.sort((a,b)=> b.date - a.date);

  const budgetRes = computeGroupBudget(superGroupeName, months, {forceBrut: superGroupeName!==cfg.mainGroup, boundsMonths});
  const voyEntry = budgetRes.voyages.find(v=>v.key===voyKey);
  const realTotal = voyEntry ? (voyEntry.realIncome||0)+(voyEntry.realExpense||0) : 0;
  const amortTotal = voyEntry ? (voyEntry.amortIncome||0)+(voyEntry.amortExpense||0) : 0;
  const adjTotal = voyEntry ? (voyEntry.adjIncome||0)+(voyEntry.adjExpense||0) : 0;
  const label = voyEntry ? (voyEntry.label||voyEntry.key) : voyKey;
  const monthSubtitle = opts.month ? (()=>{ const [my,mm] = opts.month.split("-").map(Number); const l = U.fmtMonthYear(my, mm-1); return " · "+l.charAt(0).toUpperCase()+l.slice(1); })() : "";

  const KIND_STYLE = {
    reel:   {label:"Réel",   bg:"var(--primary-soft)",  fg:"var(--primary)"},
    amorti: {label:"Amorti", bg:"var(--transfer-soft)", fg:"var(--transfer)"},
    ajout:  {label:"Ajout",  bg:"var(--card-alt)",      fg:"var(--text-sub)"},
  };

  function renderModal(){
    const shown = items.filter(x=>bgKindIncluded(filterKind, x.kind));
    const modal = document.getElementById("modal-detail");
    modal.innerHTML = `
      <div class="u-row-between-sm">
        <span class="u-title-lg">${U.escHtml(label)}</span>
        <button class="icon-btn" id="voytxn-close">${ICONS.close}</button>
      </div>
      <div class="u-subtitle">${U.escHtml(superGroupeName)}${monthSubtitle} · ${shown.length} élément${shown.length>1?"s":""}</div>
      <div class="u-badge-row">
        <span class="voytxn-badge" data-kind="reel" style="cursor:pointer;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:${KIND_STYLE.reel.bg};color:${KIND_STYLE.reel.fg};${filterKind&&!bgKindIncluded(filterKind,'reel')?'opacity:.45;':''}${filterKind==='reel'?'box-shadow:0 0 0 2px '+KIND_STYLE.reel.fg+';':''}">Réel : ${bgFmtMoneySigned(realTotal)}</span>
        ${amortTotal!==0 ? `<span class="voytxn-badge" data-kind="amorti" style="cursor:pointer;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:${KIND_STYLE.amorti.bg};color:${KIND_STYLE.amorti.fg};${filterKind&&!bgKindIncluded(filterKind,'amorti')?'opacity:.45;':''}${filterKind==='amorti'?'box-shadow:0 0 0 2px '+KIND_STYLE.amorti.fg+';':''}">Amorti : ${bgFmtMoneySigned(amortTotal)}</span>` : ""}
        ${adjTotal!==0 ? `<span class="voytxn-badge" data-kind="ajout" style="cursor:pointer;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:${KIND_STYLE.ajout.bg};color:${KIND_STYLE.ajout.fg};${filterKind&&!bgKindIncluded(filterKind,'ajout')?'opacity:.45;':''}${filterKind==='ajout'?'box-shadow:0 0 0 2px '+KIND_STYLE.ajout.fg+';':''}">Ajouts : ${bgFmtMoneySigned(adjTotal)}</span>` : ""}
      </div>
      <div class="u-scroll-56">
        ${shown.length===0 ? `<div class="u-empty-note">Aucun élément${filterKind?" pour ce filtre":""} sur la période affichée.</div>` :
        shown.map((x,i)=>`
          <div class="detail-row cattxn-row" ${x.txnId?`data-txnid="${U.escHtml(x.txnId)}"`:""} style="align-items:center;${x.txnId?'cursor:pointer;':''}">
            <span class="u-col-shrink">
              <span style="font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${x.txnId?'text-decoration:underline;text-decoration-color:var(--divider);':''}">${U.escHtml(x.remarque)}</span>
              <span class="u-note-11">${x.kind==="ajout"||x.kind==="amorti" ? fmtMonthYearShort(x.date.getFullYear(),x.date.getMonth()) : U.fmtDateShort(x.date)}${x.yearsplit?" · "+x.yearsplitCount+"/12 mois":""}</span>
            </span>
            <span class="u-row-gap8-fixed">
              <span style="font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;background:${KIND_STYLE[x.kind].bg};color:${KIND_STYLE[x.kind].fg};">${KIND_STYLE[x.kind].label}</span>
              <span style="font-weight:700;font-size:13.5px;color:${x.displayAmount<0?'var(--expense)':'var(--income)'}">${bgFmtMoneySigned(x.displayAmount)}</span>
            </span>
          </div>
        `).join("")}
      </div>
    `;
    document.getElementById("voytxn-close").onclick = ()=>APP.closeOverlay("overlay-detail");
    document.querySelectorAll(".voytxn-badge[data-kind]").forEach(el=>{
      el.onclick = ()=>{
        const k = el.dataset.kind;
        filterKind = (filterKind===k) ? null : k;
        renderModal();
      };
    });
    document.querySelectorAll(".cattxn-row[data-txnid]").forEach(el=>{
      el.onclick = ()=> window.__SF_VIEWS.openTxnDetail(el.dataset.txnid);
    });
  }

  renderModal();
  APP.openOverlay("overlay-detail");
}

/* Détail Réel/Amorti/Ajout des transactions menant aux totaux Revenus/Dépenses/Voyages/Total affichés pour
   un ou plusieurs groupes — cohérent avec computeGroupBudget (amortissement + ajustements pris en compte
   pour le groupe principal selon le mode budget (Amort. + ajouts ou Ajouts) ; les groupes additionnels restent toujours en brut).
   typeFilter : null (tout, catégories+voyages) | "Income" | "Expense" (catégories/quotidien uniquement) |
   "Voyage" (voyages + ajustements sans catégorie uniquement, quel que soit le signe). */
function collectGroupTypeItemsDetailed(superGroupeNames, typeFilter, months, boundsMonths){
  const names = Array.isArray(superGroupeNames) ? superGroupeNames : [superGroupeNames];
  const cfg = Store.settings.budget;
  const monthSet = new Set(months);
  const scopeMult = cfg.scope==="couple" ? 2 : 1;
  const amortSet = new Set(cfg.amortCategories||[]);
  const periodMonths = computeAmortPeriodMonths(months, boundsMonths);
  const windowN = amortWindowMonths(months, periodMonths, boundsMonths).length;
  const multiName = names.length>1;
  const items = [];

  function isAmortForName(name){ return cfg.mode==="amorti" && name===cfg.mainGroup; }
  function adjustForName(name){ return (cfg.mode==="amorti" || cfg.mode==="brut_ajout") && name===cfg.mainGroup; }

  Store.transactions.forEach(t=>{
    if(t.type==="Transfer") return;
    if(isAccountExcluded(t.compte)) return;
    const matchedName = names.find(n=>groupSelectionMatches(t, n));
    if(!matchedName) return;
    const base = t.groupeBase || U.baseGroupe(t.groupe);
    const kind = AGG.getGroupKind(t.groupe);
    const isVoyage = kind==="voyage";
    if(typeFilter==="Voyage" && !isVoyage) return;
    if((typeFilter==="Income" || typeFilter==="Expense") && isVoyage) return;
    const subLabel = isVoyage ? (t.groupe||"") : (t.categorie||"(Non renseigné)");
    const sub = multiName ? [subLabel, matchedName].filter(Boolean).join(" · ") : subLabel;

    if(isVoyage){
      const forced = AGG.getGroupVoyageMonth(t.groupe);
      const tr = t.transform;
      if(tr.mode==="yearsplit" && !forced){
        const inYear = String(tr.year) >= months[0].slice(0,4) && String(tr.year) <= months[months.length-1].slice(0,4);
        if(!inYear) return;
        const displayAmount = (t.montant/12) * yearsplitMonthsInPeriod(tr.year, monthSet) * scopeMult;
        items.push({kind:"reel", date: t.date, txnId: t.id, remarque: t.remarque||t.categorie||"—", sub, displayAmount, yearsplit:true, yearsplitCount: yearsplitMonthsInPeriod(tr.year, monthSet)});
        return;
      }
      let targetMonth = forced;
      if(!targetMonth){
        if(tr.mode==="month") targetMonth = tr.year+"-"+U.pad2(tr.month+1);
        else targetMonth = t.date.getFullYear()+"-"+U.pad2(t.date.getMonth()+1);
      }
      if(!monthSet.has(targetMonth)) return;
      const displayAmount = t.montant*scopeMult;
      items.push({kind:"reel", date: t.date, txnId: t.id, remarque: t.remarque||t.categorie||"—", sub, displayAmount, yearsplit:false});
      return;
    }

    // "quotidien"
    if((typeFilter==="Income" || typeFilter==="Expense") && t.type!==typeFilter) return;
    const cat = t.categorie || "(Non renseigné)";
    const tr = t.transform;
    const effMonthKey = tr.mode==="month" ? (tr.year+"-"+U.pad2(tr.month+1)) : (t.date.getFullYear()+"-"+U.pad2(t.date.getMonth()+1));
    const beforeStart = cfg.startMonth && effMonthKey < cfg.startMonth;
    const afterEnd = cfg.endMonth && effMonthKey > cfg.endMonth;
    const amortized = isAmortForName(matchedName) && (amortSet.has(cat) || beforeStart || afterEnd);
    if(amortized){
      if(windowN<=0) return;
      const displayAmount = (t.montant/periodMonths)*windowN*scopeMult;
      items.push({kind:"amorti", date: t.date, txnId: t.id, remarque: t.remarque||cat||"—", sub, displayAmount, yearsplit:false, catKey:cat, matchedName, effMonthKey, rawAmount:t.montant});
      return;
    }
    const inPeriod = monthSet.has(effMonthKey) || (tr.mode==="yearsplit" && String(tr.year)>=months[0].slice(0,4) && String(tr.year)<=months[months.length-1].slice(0,4));
    if(!inPeriod) return;
    let displayAmount = tr.mode==="yearsplit" ? (t.montant/12) * yearsplitMonthsInPeriod(tr.year, monthSet) : t.montant;
    displayAmount *= scopeMult;
    items.push({kind:"reel", date: t.date, txnId: t.id, remarque: t.remarque||cat||"—", sub, displayAmount, yearsplit: tr.mode==="yearsplit", yearsplitCount: tr.mode==="yearsplit"?yearsplitMonthsInPeriod(tr.year, monthSet):null, catKey:cat, matchedName, effMonthKey, rawAmount:t.montant});
  });

  // Ajustements manuels : uniquement pour le groupe principal, en mode "Amort. + ajouts" ou "Sans amort,
  // avec ajout" (les groupes additionnels restent toujours en brut, cf. computeGroupBudget/forceBrut).
  names.forEach(name=>{
    if(!adjustForName(name)) return;
    const amortiOk = isAmortForName(name);
    (cfg.adjustments||[]).forEach((adj, adjIdx)=>{
      if(adj.groupe !== name) return;
      if(!amortiOk && adj.amorti) return; // "Sans amort, avec ajout" : exclut les ajustements amortis
      const isVoyAdj = !adj.categorie;
      if(typeFilter==="Voyage" && !isVoyAdj) return;
      if((typeFilter==="Income" || typeFilter==="Expense") && isVoyAdj) return;
      const amt = adjustmentScopedAmount(adj);
      const adjType = amt>=0 ? "Income" : "Expense";
      const sub = multiName ? [adj.categorie||"Ajustements", name].filter(Boolean).join(" · ") : (adj.categorie||"Ajustements");
      if(monthSet.has(adj.month) && amt){
        if(!typeFilter || typeFilter==="Voyage" || adjType===typeFilter){
          const [ay,am] = adj.month.split("-").map(Number);
          items.push({kind:"ajout", date: new Date(ay,(am||1)-1,1), txnId:null, adjIdx, remarque: adj.remarque||"Ajustement", sub, displayAmount: amt});
        }
      }
      if(adj.amorti && amortiOk && amt && windowN>0){
        const oppAmount = -amt/periodMonths*windowN;
        const oppType = oppAmount>=0 ? "Income" : "Expense";
        if(!typeFilter || typeFilter==="Voyage" || oppType===typeFilter){
          const [ay,am] = adj.month.split("-").map(Number);
          items.push({kind:"amorti", date: new Date(ay,(am||1)-1,1), txnId:null, adjIdx, remarque: "Amortissement : "+(adj.remarque||"Ajustement"), sub, displayAmount: oppAmount});
        }
      }
    });
  });

  items.sort((a,b)=> b.date - a.date);
  return items;
}
function openGroupTypeTxnSheet(superGroupeNames, type, opts){
  opts = opts || {};
  const names = Array.isArray(superGroupeNames) ? superGroupeNames : [superGroupeNames];
  // opts.periodOverride ({from, to}) : clic sur la cellule "Comparé" d'une ligne de comparaison — voir
  // openCategoryTxnSheet plus haut pour le même principe.
  const months = opts.periodOverride ? monthsInRange(opts.periodOverride.from, opts.periodOverride.to) : monthsInRange(periodFrom, periodTo);
  const items = collectGroupTypeItemsDetailed(names, type, months);
  let filterKind = opts.filterKind || null; // null | "reel" | "amorti" | "ajout" | "reel_ajout"

  const label = type==="Income" ? "Revenus" : type==="Expense" ? "Dépenses" : type==="Voyage" ? "Voyages" : "Total";

  const mainGroup = Store.settings.budget.mainGroup;

  const KIND_STYLE = {
    reel:   {label:"Réel",   bg:"var(--primary-soft)",  fg:"var(--primary)"},
    amorti: {label:"Amorti", bg:"var(--transfer-soft)", fg:"var(--transfer)"},

        ${adjTotal!==0 ? `<span class="grptxn-badge" data-kind="ajout" style="cursor:pointer;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:${KIND_STYLE.ajout.bg};color:${KIND_STYLE.ajout.fg};${filterKind&&!bgKindIncluded(filterKind,'ajout')?'opacity:.45;':''}${filterKind==='ajout'?'box-shadow:0 0 0 2px '+KIND_STYLE.ajout.fg+';':''}">Ajouts : ${bgFmtMoneySigned(adjTotal)}</span>` : ""}

        shown.map(x=>`
          <div class="detail-row grptxn-row" ${x.txnId?`data-txnid="${U.escHtml(x.txnId)}"`:""} ${x.adjIdx!=null?`data-adjidx="${x.adjIdx}"`:""} style="align-items:center;${(x.txnId||x.adjIdx!=null)?'cursor:pointer;':''}">

      </div>

        renderModal();
      };
    });
    document.querySelectorAll(".grptxn-amortize[data-txnid]").forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        openAdjustmentForm(null, {
          month: btn.dataset.month,
          groupe: btn.dataset.groupe,
          categorie: btn.dataset.cat,
          montant: -Number(btn.dataset.amount),
          remarque: "Amortissement : "+(btn.dataset.remarque||btn.dataset.cat),
          amorti: true,
          montantScope: "perso"

(function(){

/* ================= ONGLET ÉVOLUTION ================= */

let collapsedSections = new Set(); // clés de section repliées (par défaut : tout replié)

function evoCfg(){ return Store.settings.evolution; }

/* Toujours 0 décimale dans l'onglet Évolution, indépendamment du réglage global (Transactions/Comptes) */
function fmtVal(n){
  if(n==null || isNaN(n)) n=0;
  const sign = n>0 ? "+ " : (n<0 ? "- " : "");
  return sign + Math.round(Math.abs(n)).toLocaleString('fr-FR') + " €";
}
function valClass(n){ return n<0 ? "neg" : (n>0 ? "pos" : ""); }

/* ---------------- Rendu principal ---------------- */
function renderEvolution(){

function buildTableHtml(evoIndex, dimension, years, cumulative){
  const cols = drillYear!=null
    ? Array.from({length:12}, (_,m)=>({type:"month", year:drillYear, month:m, label:U.MONTHS_FR_SHORT[m]}))
    : years.map(y=>({type:"year", year:y, label:String(y)}));

  /* Valeur d'une colonne (année ou mois) pour une section/un item : brute par défaut, ou cumulée depuis le
     début des données jusqu'à cette colonne incluse en mode "Cumulé". La colonne "Total" (secTotal/itTotal/
     grandTotal ci-dessous) n'utilise jamais ces fonctions — elle reste toujours la somme brute. */
  function secColValue(sec, c){
    if(cumulative) return c.type==="year" ? AGG.sectionCumulativeYearValue(sec,c.year) : AGG.sectionCumulativeMonthValue(sec,c.year,c.month);
    return c.type==="year" ? AGG.sectionYearValue(sec,c.year) : AGG.sectionMonthValue(sec,c.year,c.month);
  }
  function itemColValue(it, c){
    if(cumulative) return c.type==="year" ? AGG.itemCumulativeYearValue(it,c.year) : AGG.itemCumulativeMonthValue(it,c.year,c.month);
    return c.type==="year" ? AGG.itemYearValue(it,c.year) : AGG.itemMonthValue(it,c.year,c.month);
  }

  const theadHtml = `
    <thead><tr>
      <th class="evo-col-label">${VIEW_LABEL[dimension]}</th>
      <th class="evo-col-total">Total</th>

        : `<th class="evo-col-val">${c.label}</th>`

    </tr></thead>
  `;

  const grandTotal = drillYear!=null
    ? evoIndex.sections.reduce((s,sec)=> s+AGG.sectionYearValue(sec, drillYear), 0)
    : evoIndex.sections.reduce((s,sec)=> s+AGG.sectionTotalValue(sec), 0);
  const totalRowHtml = `
    <tr class="evo-total-row">
      <td class="evo-col-label">Total</td>
      <td class="evo-col-total evo-val-cell ${valClass(grandTotal)}" data-global="1" ${drillYear!=null?`data-year="${drillYear}"`:""}>${grandTotal ? fmtVal(grandTotal) : "—"}</td>
      ${cols.map(c=>{
        const v = evoIndex.sections.reduce((s,sec)=> s + secColValue(sec,c), 0);
        const periodAttrs = c.type==="year" ? `data-year="${c.year}"` : `data-year="${c.year}" data-month="${c.month}"`;
        return `<td class="evo-col-val evo-val-cell ${valClass(v)}" data-global="1" ${periodAttrs}>${v ? fmtVal(v) : "—"}</td>`;
      }).join("")}
    </tr>
  `;

  const bodyRows = evoIndex.sections.map(sec=>{
    const secTotal = drillYear!=null ? AGG.sectionYearValue(sec, drillYear) : AGG.sectionTotalValue(sec);
    const secIsMerge = !!sec.__merged;
    const collapsed = collapsedSections.has(sec.key);
    const secCells = cols.map(c=>{
      const v = secColValue(sec, c);
      const dataAttrs = secIsMerge
        ? `data-section-members="${U.escHtml(sec.__members.join('||'))}"`
        : `data-section="${U.escHtml(sec.key)}"`;
      const periodAttrs = c.type==="year" ? `data-year="${c.year}"` : `data-year="${c.year}" data-month="${c.month}"`;
      return `<td class="evo-col-val evo-val-cell ${valClass(v)}" ${dataAttrs} ${periodAttrs}>${v ? fmtVal(v) : "—"}</td>`;
    }).join("");
    const totalAttrs = (secIsMerge ? `data-section-members="${U.escHtml(sec.__members.join('||'))}"` : `data-section="${U.escHtml(sec.key)}"`) + (drillYear!=null ? ` data-year="${drillYear}"` : "");
    const secRow = `
      <tr class="evo-section-row" data-section-toggle="${U.escHtml(sec.key)}">
        <td class="evo-col-label"><span class="evo-chev ${collapsed?'':'open'}">▸</span>${U.escHtml(sec.label)}</td>
        <td class="evo-col-total evo-val-cell ${valClass(secTotal)}" ${totalAttrs}>${secTotal ? fmtVal(secTotal) : "—"}</td>
        ${secCells}
      </tr>
    `;
    const itemRows = sec.items.map(it=>{
      const itTotal = drillYear!=null ? AGG.itemYearValue(it, drillYear) : AGG.itemTotalValue(it);
      const itCells = cols.map(c=>{
        const v = itemColValue(it, c);
        const periodAttrs = c.type==="year" ? `data-year="${c.year}"` : `data-year="${c.year}" data-month="${c.month}"`;
        return `<td class="evo-col-val evo-val-cell ${valClass(v)}" data-item="${U.escHtml(it.label)}" ${periodAttrs}>${v ? fmtVal(v) : "—"}</td>`;
      }).join("");
      const itTotalAttrs = `data-item="${U.escHtml(it.label)}"` + (drillYear!=null ? ` data-year="${drillYear}"` : "");
      return `
      <tr class="evo-item-row${collapsed?' hidden':''}" data-section-key="${U.escHtml(sec.key)}">
        <td class="evo-col-label" style="padding-left:22px;">${U.escHtml(it.label)}</td>
        <td class="evo-col-total evo-val-cell ${valClass(itTotal)}" ${itTotalAttrs}>${itTotal ? fmtVal(itTotal) : "—"}</td>
        ${itCells}
      </tr>`;
    }).join("");
    return secRow + itemRows;
  }).join("");

  return `<table class="evo-table">${theadHtml}<tbody>${totalRowHtml}${bodyRows}</tbody></table>`;

function wireEvolution(evoIndex, dimension, years){
  const cfg = evoCfg();
  const tableWrap = document.querySelector("#view-evolution .evo-table-wrap");
  if(tableWrap) U.enableDragScroll(tableWrap);

  document.querySelectorAll("#evo-view-seg button").forEach(b=>{
    b.onclick = ()=>{
      cfg.view = b.dataset.v;

  document.querySelectorAll("#evo-monthbasis-seg button").forEach(b=>{
