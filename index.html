(function(){
"use strict";
const U = window.__SF_UTILS;
const Store = window.__SF_STORE;
const AGG = window.__SF_AGG;
const APP = window.__SF_APP;
const PICKER = window.__SF_PICKER;
const ICONS = U.ICONS;

const LIST_KEYS = Store.SANTE_LIST_KEYS; // ["beneficiaires","devises","medecins","prestations","statuts","mutuelles"]
const LIST_LABELS = {beneficiaires:"Bénéficiaires", devises:"Devises", medecins:"Médecins / hôpitaux", prestations:"Types de prestation", statuts:"Statuts", mutuelles:"Mutuelles"};
const LIST_PLACEHOLDER = {beneficiaires:"Ex. Marie", devises:"Ex. $ (USD)", medecins:"Ex. Dr Martin", prestations:"Ex. Consultation", statuts:"Ex. Envoyé", mutuelles:"Ex. MGEN"};
const TAP_CHEVRON_S = `<span style="color:var(--text-faint);display:inline-flex;vertical-align:middle;margin-left:4px;flex:0 0 auto;">${ICONS.arrowLeft.replace('<svg ','<svg style="width:12px;height:12px;transform:rotate(180deg);" ')}</span>`;

function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }

/* ---------------- Modèle de données ---------------- */
function emptyItem(){
  return {
    dateSoin: U.toISO(new Date()),
    beneficiaire:"", devise:"€", montantEur:0, montantDevise:null,
    medecin:"", typePrestation:"", statut:"", statutDate:null,
    rembTiersMontant:0, rembTiersDate:null,
    rembSecuMontant:0, rembSecuDate:null,
    rembMutuelleMontant:0, rembMutuelleDate:null,
    groupe:"", mutuelle:"", partMoi:100, termine:false
  };
}
/* Clé de contenu (même principe que buildTxnId pour les transactions) : se recalcule à chaque
   modification, sert à dédupliquer lors d'un import (fusion) Excel/JSON. "termine" en est volontairement
   exclu : c'est un statut de suivi qu'on bascule souvent, pas un champ identifiant le soin lui-même —
   sinon chaque bascule "Terminé" créerait un nouvel id et casserait la déduplication à l'import. */
function buildSanteId(it){
  return ["s",it.dateSoin,it.beneficiaire||"",it.typePrestation||"",it.medecin||"",it.montantEur||0,it.groupe||"",it.statut||""].join("|");
}
/* Montant correspondant à "ma part" (montant total × part moi %), arrondi à la 2e décimale
   INFÉRIEURE (floor) — jamais un arrondi standard, à la demande explicite de l'utilisateur. */
function computeMaPart(it){
  const raw = (it.montantEur||0) * (it.partMoi||0) / 100;
  return Math.floor(raw*100)/100;
}
function sanitizeItem(raw){
  const it = Object.assign(emptyItem(), raw||{});
  if(!it.dateSoin) it.dateSoin = U.toISO(new Date());
  ["montantEur","rembTiersMontant","rembSecuMontant","rembMutuelleMontant","partMoi"].forEach(k=>{
    let raw = it[k];
    if(typeof raw === "string") raw = raw.replace(/\s/g,"").replace(",",".");
    const n = Number(raw); it[k] = isNaN(n) ? 0 : n;
  });
  it.partMoi = Math.max(0, Math.min(100, it.partMoi));
  it.termine = !!it.termine;
  ["beneficiaire","devise","medecin","typePrestation","statut","groupe","mutuelle"].forEach(k=>{ it[k] = String(it[k]||"").trim(); });
  if(!it.devise) it.devise = "€";
  if(it.devise!=="€" && it.montantDevise!=null && it.montantDevise!==""){
    let rawD = it.montantDevise;
    if(typeof rawD === "string") rawD = rawD.replace(/\s/g,"").replace(",",".");
    const n = Number(rawD);
    it.montantDevise = isNaN(n) ? null : n;
  } else {
    it.montantDevise = null;
  }
  ["dateSoin","statutDate","rembTiersDate","rembSecuDate","rembMutuelleDate"].forEach(k=>{
    it[k] = it[k] ? it[k] : (k==="dateSoin" ? it.dateSoin : null);
  });
  it.id = buildSanteId(it);
  return it;
}


/* ---------------- Filtres (état, persistance) ---------------- */
const SFilters = {
  search:"",
  beneficiaires:new Set(), prestations:new Set(), statuts:new Set(), devises:new Set(), groupes:new Set(),
  termine:new Set(), // valeurs possibles : "done" | "pending"
  reset(){
    this.search=""; this.beneficiaires.clear(); this.prestations.clear();
    this.statuts.clear(); this.devises.clear(); this.groupes.clear(); this.termine.clear();
  },
  persist(){
    Store.settings.santeFilters = {
      search:this.search,
      beneficiaires:Array.from(this.beneficiaires), prestations:Array.from(this.prestations),
      statuts:Array.from(this.statuts), devises:Array.from(this.devises), groupes:Array.from(this.groupes),
      termine:Array.from(this.termine)
    };
    Store.saveSettings();
  },
  restore(){
    const s = Store.settings.santeFilters;
    if(!s) return;
    this.search = s.search||"";
    this.beneficiaires = new Set(s.beneficiaires||[]);
    this.prestations = new Set(s.prestations||[]);
    this.statuts = new Set(s.statuts||[]);
    this.devises = new Set(s.devises||[]);
    this.groupes = new Set(s.groupes||[]);
    this.termine = new Set(s.termine||[]);
  },
  activeCount(){
    let c=0;
    if(this.beneficiaires.size) c++;
    if(this.prestations.size) c++;
    if(this.statuts.size) c++;
    if(this.devises.size) c++;
    if(this.groupes.size) c++;
    if(this.termine.size) c++;
    return c;
  },
  matches(it){
    if(this.beneficiaires.size && !this.beneficiaires.has(it.beneficiaire)) return false;
    if(this.prestations.size && !this.prestations.has(it.typePrestation)) return false;
    if(this.statuts.size && !this.statuts.has(it.statut)) return false;
    if(this.devises.size && !this.devises.has(it.devise)) return false;
    if(this.termine.size && !this.termine.has(it.termine ? "done" : "pending")) return false;
    if(this.groupes.size){
      const gBase = it.groupe ? U.baseGroupe(it.groupe) : "";
      if(!this.groupes.has(it.groupe) && !this.groupes.has(gBase)) return false;
    }
    if(this.search){
      const s = U.normalize(this.search);
      const hay = U.normalize([it.beneficiaire,it.medecin,it.typePrestation,it.statut,it.groupe,it.mutuelle].join(" "));
      if(!hay.includes(s)) return false;
    }
    return true;
  }
};
window.__SF_SANTE_FILTERS = SFilters;

function applySanteFilters(items){ return items.filter(it=>SFilters.matches(it)); }

/* ---------------- Agrégation ---------------- */
function distinctSante(field){
  const counts = new Map();
  Store.santeItems.forEach(it=>{
    const v = it[field];
    if(!v) return;
    counts.set(v, (counts.get(v)||0)+1);
  });
  return Array.from(counts.entries()).map(([value,count])=>({value,count})).sort((a,b)=>a.value.localeCompare(b.value,'fr'));
}
function reimbTotal(it){ return (it.rembTiersMontant||0)+(it.rembSecuMontant||0)+(it.rembMutuelleMontant||0); }
function reimbClass(it){
  const m = it.montantEur||0;
  const r = reimbTotal(it);
  if(m<=0) return "trf";
  if(r<=0) return "exp";
  if(r>=m) return "inc";
  return "trf";
}
function computeSanteTotals(items){
  let montant=0, remb=0, maPart=0;
  items.forEach(it=>{ montant += it.montantEur||0; remb += reimbTotal(it); maPart += computeMaPart(it); });
  return {montant, remb, reste: Math.max(0, montant-remb), maPart};
}

/* ---------------- Groupement (bouton Affichage) ---------------- */
const SANTE_GROUPBY_LABEL = {date:"Mois", beneficiaire:"Bénéficiaire", statut:"Statut", groupe:"Groupe", medecin:"Médecin / hôpital", prestation:"Type de prestation", termine:"Terminé"};
let santeGroupBy = "date";
function santeGroupInfo(it, groupBy){
  if(groupBy==="date"){
    const d = new Date(it.dateSoin+"T00:00:00");
    const y=d.getFullYear(), m=d.getMonth();
    return {key:y+"-"+U.pad2(m+1), label:cap(U.fmtMonthYear(y,m)), sortVal:y*12+m};
  }
  if(groupBy==="termine"){
    return it.termine ? {key:"done", label:"Terminé"} : {key:"pending", label:"Non terminé"};
  }
  const fieldMap = {beneficiaire:"beneficiaire", statut:"statut", groupe:"groupe", medecin:"medecin", prestation:"typePrestation"};
  const v = it[fieldMap[groupBy]] || "—";
  return {key:v, label:v};
}
function computeSanteGroups(items, groupBy){
  const groups = new Map();
  items.forEach(it=>{
    const g = santeGroupInfo(it, groupBy);
    if(!groups.has(g.key)) groups.set(g.key, {key:g.key, label:g.label, sortVal:g.sortVal, items:[], montant:0});
    const o = groups.get(g.key);
    o.items.push(it);
    o.montant += it.montantEur||0;
  });
  const arr = Array.from(groups.values());
  arr.forEach(g=> g.items.sort((a,b)=> b.dateSoin.localeCompare(a.dateSoin)));
  if(groupBy==="date") arr.sort((a,b)=> b.sortVal-a.sortVal);
  else if(groupBy==="termine"){ const rank={pending:0, done:1}; arr.sort((a,b)=> (rank[a.key]??9)-(rank[b.key]??9)); }
  else arr.sort((a,b)=> a.label.localeCompare(b.label,'fr'));
  return arr;
}

  let val = current;
  function render(){
    modal.innerHTML = `
      <div style="font-weight:800;font-size:16.5px;margin-bottom:14px;">Part moi</div>
      <div class="pill-toggle-wrap" style="margin-bottom:14px;">
        ${[0,50,100].map(p=>`<button type="button" class="pill-toggle ${val===p?'selected':''}" data-pm="${p}">${p}%</button>`).join("")}
      </div>
      <input type="number" class="search-mini" id="pm-input" style="margin:0 0 16px;" value="${val}" min="0" max="100" step="1">
      <div style="display:flex;gap:8px;">
        <button type="button" class="btn btn-ghost" style="flex:1;justify-content:center;" id="pm-cancel">Annuler</button>
        <button type="button" class="btn btn-primary" style="flex:1;justify-content:center;" id="pm-confirm">Enregistrer</button>
      </div>
    `;
    modal.querySelectorAll("[data-pm]").forEach(btn=>{
      btn.onclick = ()=>{ val = Number(btn.dataset.pm); render(); };
    });
    document.getElementById("pm-cancel").onclick = ()=>APP.closeOverlay("overlay-confirm");
    const input = document.getElementById("pm-input");
    input.oninput = ()=>{ const n = Number(input.value); if(!isNaN(n)) val = n; };
    document.getElementById("pm-confirm").onclick = ()=>{
      const n = Number(input.value);
      if(isNaN(n) || n<0 || n>100){ APP.showToast("Merci de renseigner un pourcentage entre 0 et 100"); return; }
      APP.closeOverlay("overlay-confirm");
      onSave(n);
    };
  }
  render();
  APP.openOverlay("overlay-confirm");
}

function addToList(key, value){
  if(!value) return;
  const list = Store.settings.sante.lists[key];
  if(!list.includes(value)){
    list.push(value);
    Store.saveSettings();
  }
}

/* ---------------- Fiche soin (détail + édition unifiées, sur le modèle de la fiche transaction) ---------------- */
function openSanteDetail(id){ renderSanteDetail(id, null); }
function openSanteNew(){ renderSanteDetail(null, null); }

function renderSanteDetail(id, seed){
  const isNew = !id;
  let currentId = id;
  const draft = !isNew ? null : Object.assign(emptyItem(), seed ? Object.assign({}, seed, {id:undefined}) : {});

  function current(){ return isNew ? draft : Store.santeItems.find(x=>x.id===currentId); }

  function commit(patch){
    if(isNew){ Object.assign(draft, patch); render(); return; }
    const cur = current();
    if(!cur) return;
    const merged = sanitizeItem(Object.assign({}, cur, patch));
    const idx = Store.santeItems.findIndex(x=>x.id===currentId);
    if(idx===-1) return;
    Store.santeItems[idx] = merged;
    currentId = merged.id;
    render();
    APP.refreshCurrentTab();
    Store.saveSanteItems().then(ok=>{
      if(!ok) APP.showToast("Modifié, mais la sauvegarde a échoué");
    });
  }

  function render(){
    const cur = current();
    if(!cur){ APP.closeOverlay("overlay-detail"); return; }
    const modal = document.getElementById("modal-detail");
    const dateObj = new Date(cur.dateSoin+"T00:00:00");
    const showDevise = cur.devise && cur.devise!=="€";
    const lists = Store.settings.sante.lists;

    modal.innerHTML = `
      ${isNew ? `<div class="u-title-lg" style="margin-bottom:10px;">Nouveau soin</div>` : ""}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
        <button type="button" class="pill-toggle ${cur.termine?'selected':''}" id="sd-termine" title="Marquer comme terminé / non terminé">${cur.termine?ICONS.check:""}${cur.termine?" Terminé":"Non terminé"}</button>
        <button class="icon-btn" id="sd-close">${ICONS.close}</button>
      </div>

      <div id="sd-prestation" class="txn-tap-row" style="cursor:pointer;padding:8px 2px 16px;">
        <div style="font-weight:800;font-size:19px;line-height:1.3;${cur.typePrestation?'':'color:var(--text-faint);'}">${U.escHtml(cur.typePrestation||"(Type de prestation)")}</div>
      </div>

      <div class="field-label" style="margin-top:0;">Soin</div>
      <div class="card" style="box-shadow:none;background:var(--card-alt);padding:4px 14px;">
        <div id="sd-montant" class="detail-row txn-tap-row" style="cursor:pointer;padding:14px 2px;">

        ${showDevise ? `<div id="sd-montant-devise" class="detail-row txn-tap-row" style="cursor:pointer;"><span>Montant (${U.escHtml(cur.devise)})</span><span>${cur.montantDevise!=null?cur.montantDevise.toLocaleString('fr-FR'):"—"}${TAP_CHEVRON_S}</span></div>` : ""}
        <div id="sd-date" class="detail-row txn-tap-row" style="cursor:pointer;"><span>Date du soin</span><span>${U.escHtml(U.fmtDateLong(dateObj))}${TAP_CHEVRON_S}</span></div>
        <div id="sd-beneficiaire" class="detail-row txn-tap-row" style="cursor:pointer;"><span>Bénéficiaire</span><span>${U.escHtml(cur.beneficiaire||"—")}${TAP_CHEVRON_S}</span></div>
        <div id="sd-medecin" class="detail-row txn-tap-row" style="cursor:pointer;"><span>Médecin / hôpital</span><span>${U.escHtml(cur.medecin||"—")}${TAP_CHEVRON_S}</span></div>

      <div style="display:flex;gap:10px;margin-top:16px;">

    document.getElementById("sd-termine").onclick = ()=> commit({termine: !cur.termine});

    document.getElementById("sd-prestation").onclick = ()=>{
      PICKER.openPicker({
        title:"Type de prestation", options:lists.prestations.slice(), value:cur.typePrestation, allowNew:true,
        newLabel:"+ Nouveau type…", newPlaceholder:"Ex. Consultation, Pharmacie…",
        onSelect:(v)=>{ addToList("prestations", v); commit({typePrestation:v}); }
      });
    };
    document.getElementById("sd-montant").onclick = ()=>{
      PICKER.openInlineEditor({
        title:"Montant (€)", inputType:"number", min:0, step:0.01, value: cur.montantEur||"", placeholder:"0,00",
        onSave:(v)=>{
          const n = Number(v);
          if(v===""||isNaN(n)||n<0){ APP.showToast("Merci de renseigner un montant valide"); return; }
          commit({montantEur:n});
        }
      });
    };
    document.getElementById("sd-devise").onclick = ()=>{
      PICKER.openPicker({
        title:"Devise", options:lists.devises.slice(), value:cur.devise, allowNew:true, noEmpty:true,
        newLabel:"+ Nouvelle devise…", newPlaceholder:"Ex. $ (USD)",
        onSelect:(v)=>{ addToList("devises", v); commit({devise:v, montantDevise: v==="€"?null:cur.montantDevise}); }
      });
    };
    if(showDevise){
      const mdBtn = document.getElementById("sd-montant-devise");
      if(mdBtn) mdBtn.onclick = ()=>{
        PICKER.openInlineEditor({
          title:"Montant ("+cur.devise+")", inputType:"number", min:0, step:0.01, value: cur.montantDevise!=null?cur.montantDevise:"", placeholder:"0,00",
          onSave:(v)=>{
            const n = v===""? null : Number(v);
            if(n!=null && isNaN(n)){ APP.showToast("Montant invalide"); return; }
            commit({montantDevise:n});
          }
        });
      };
    }
    document.getElementById("sd-date").onclick = ()=>{
      PICKER.openInlineEditor({
        title:"Date du soin", inputType:"date", value:cur.dateSoin,
        onSave:(v)=>{
          if(!v){ APP.showToast("Merci de renseigner une date valide"); return; }
          commit({dateSoin:v});
        }
      });
    };
    document.getElementById("sd-beneficiaire").onclick = ()=>{
      PICKER.openPicker({
        title:"Bénéficiaire", options:lists.beneficiaires.slice(), value:cur.beneficiaire, allowNew:true,
        newLabel:"+ Nouveau bénéficiaire…", newPlaceholder:"Nom",
        onSelect:(v)=>{ addToList("beneficiaires", v); commit({beneficiaire:v}); }
      });
    };
    document.getElementById("sd-medecin").onclick = ()=>{
      PICKER.openPicker({
        title:"Médecin / hôpital", options:lists.medecins.slice(), value:cur.medecin, allowNew:true,

        title:"Groupe", hierarchy: AGG.groupeHierarchyChrono(Store.transactions), value:cur.groupe, allowNew:true,

        onSave:(v)=> commit({statutDate:v||null})

      openReimbEditor("Tiers payant", cur.rembTiersMontant, cur.rembTiersDate, (montant,date)=>commit({rembTiersMontant:montant, rembTiersDate:date}));
    };
    document.getElementById("sd-remb-secu").onclick = ()=>{
      openReimbEditor("Sécu", cur.rembSecuMontant, cur.rembSecuDate, (montant,date)=>commit({rembSecuMontant:montant, rembSecuDate:date}));
    };
    document.getElementById("sd-remb-mutuelle").onclick = ()=>{
      openReimbEditor("Mutuelle", cur.rembMutuelleMontant, cur.rembMutuelleDate, (montant,date)=>commit({rembMutuelleMontant:montant, rembMutuelleDate:date}));
    };
    document.getElementById("sd-mutuelle").onclick = ()=>{
      PICKER.openPicker({
        title:"Mutuelle", options:lists.mutuelles.slice(), value:cur.mutuelle, allowNew:true,
        newLabel:"+ Nouvelle mutuelle…", newPlaceholder:"Nom de la mutuelle",
        onSelect:(v)=>{ addToList("mutuelles", v); commit({mutuelle:v}); }
      });
    };
    document.getElementById("sd-partmoi").onclick = ()=>{
      openPartMoiEditor(cur.partMoi, (v)=> commit({partMoi:v}));
    };

    if(isNew){
      document.getElementById("sd-cancel").onclick = ()=>APP.closeOverlay("overlay-detail");
      document.getElementById("sd-save").onclick = ()=>{
        if(!draft.dateSoin || !(Number(draft.montantEur)>0)){
          APP.showToast("Merci de renseigner une date et un montant valides");
          return;
        }
        const toAdd = sanitizeItem(draft);
        Store.santeItems.push(toAdd);
        APP.closeOverlay("overlay-detail");
        APP.refreshCurrentTab();
        Store.saveSanteItems().then(ok=>{
          APP.showToast(ok ? "Soin ajouté" : "Ajouté, mais la sauvegarde a échoué");
        });
      };
    } else {
      document.getElementById("sd-duplicate").onclick = ()=>{
        const source = current();
        APP.closeOverlay("overlay-detail");
        renderSanteDetail(null, source);
      };
      document.getElementById("sd-delete").onclick = ()=>{
        APP.confirmAction({
          title:"Supprimer ce soin ?", text:"Cette action est définitive.", confirmLabel:"Supprimer",
          onConfirm:()=>{
            Store.santeItems = Store.santeItems.filter(x=>x.id!==currentId);
            APP.closeOverlay("overlay-detail");
            APP.refreshCurrentTab();
            Store.saveSanteItems().then(ok=>{
              APP.showToast(ok ? "Soin supprimé" : "Supprimé, mais la sauvegarde a échoué");
            });
          }
        });
      };
    }
  }

  render();
  APP.openOverlay("overlay-detail");
}

/* ================= FILTRES SANTÉ (réutilise overlay-filter / sheet-filter) ================= */
function santeFilterSectionHtml(title, listId, options, selectedSet){
  if(options.length===0) return `<div class="field-label">${title}</div><div class="u-empty-note">Aucune valeur disponible</div>`;
  return `<div class="field-label">${title}</div>
    <div class="check-list" id="${listId}" style="max-height:none;margin-bottom:6px;">
      ${options.map(o=>`
        <div class="check-item ${selectedSet.has(o.value)?'selected':''}" data-val="${U.escHtml(o.value)}">
          <span class="cbox">${ICONS.check}</span>
          <span class="lbl">${U.escHtml(o.value)}</span>
          <span class="cnt">${o.count}</span>
        </div>
      `).join("")}
    </div>`;
}
function wireSanteChecklist(listId, set){
  const list = document.getElementById(listId);
  if(!list) return;
  list.querySelectorAll(".check-item[data-val]").forEach(el=>{
    el.onclick = ()=>{
      const v = el.dataset.val;
      if(set.has(v)) set.delete(v); else set.add(v);
      el.classList.toggle("selected");
      SFilters.persist();
      updateSanteApplyButton();
    };
  });
}
function santeGroupeFilterHtml(){
  const {sections, flat, preSorted} = AGG.groupeHierarchyChrono(Store.transactions);
  const sectionNames = preSorted ? Array.from(sections.keys()) : Array.from(sections.keys()).sort((a,b)=>a.localeCompare(b,'fr'));
  const filterSet = SFilters.groupes;
  let html = `<div class="field-label">Groupe</div><input type="text" class="search-mini" id="sf-search-groupe" placeholder="Rechercher un groupe…">
    <div id="sf-list-groupe" class="check-list" style="max-height:none;margin-bottom:6px;">`;
  sectionNames.forEach(sup=>{
    const children = sections.get(sup);
    const totalCount = children.reduce((s,c)=>s+c.count,0);
    const selected = filterSet.has(sup);
    html += `<div class="groupe-section" data-super="${U.escHtml(sup)}">
      <div class="check-item groupe-section-head ${selected?'selected':''}" data-val="${U.escHtml(sup)}">
        <span class="cbox">${ICONS.check}</span>
        <span class="lbl" style="font-weight:800;">${U.escHtml(sup)}</span>
        <span class="cnt">${totalCount}</span>
      </div>
      <div class="groupe-section-children">
        ${children.map(c=>`
          <div class="check-item groupe-child-item ${filterSet.has(c.base)?'selected':''}" data-val="${U.escHtml(c.base)}" data-childname="${U.escHtml(c.base)}">
            <span class="cbox">${ICONS.check}</span>
            <span class="lbl">${U.escHtml(c.base)}</span>
            <span class="cnt">${c.count}</span>
          </div>
        `).join("")}
      </div>
    </div>`;
  });
  flat.slice().sort((a,b)=>a.base.localeCompare(b.base,'fr')).forEach(f=>{
    const selected = filterSet.has(f.base);
    html += `<div class="check-item groupe-flat-item" data-val="${U.escHtml(f.base)}">
      <span class="cbox">${ICONS.check}</span><span class="lbl">${U.escHtml(f.base)}</span><span class="cnt">${f.count}</span>
    </div>`;
  });
  html += `</div>`;
  return html;
}
function wireSanteGroupeFilter(){
  const list = document.getElementById("sf-list-groupe");
  if(!list) return;
  list.querySelectorAll(".check-item[data-val]").forEach(el=>{
    el.onclick = ()=>{
      const v = el.dataset.val;
      if(SFilters.groupes.has(v)) SFilters.groupes.delete(v); else SFilters.groupes.add(v);
      el.classList.toggle("selected");
      SFilters.persist();
      updateSanteApplyButton();
    };
  });
  const search = document.getElementById("sf-search-groupe");
  if(search){
    search.oninput = ()=>{
      const q = U.normalize(search.value);
      list.querySelectorAll(".groupe-section").forEach(sec=>{
        const supMatch = U.normalize(sec.dataset.super).includes(q);
        let any=false;
        sec.querySelectorAll(".groupe-child-item").forEach(ch=>{
          const match = !q || U.normalize(ch.dataset.childname).includes(q);
          ch.style.display = match?"flex":"none";
          if(match) any=true;
        });
        sec.style.display = (!q||supMatch||any) ? "" : "none";
      });
      list.querySelectorAll(".groupe-flat-item").forEach(el=>{
        const match = !q || U.normalize(el.dataset.val).includes(q);
        el.style.display = match ? "flex" : "none";
      });
    };
  }
}
function updateSanteApplyButton(){
  document.querySelectorAll(".sante-filter-apply-btn").forEach(btn=>{
    const n = applySanteFilters(Store.santeItems).length;
    btn.textContent = "Voir " + n.toLocaleString('fr-FR') + " résultat" + (n>1?"s":"");
  });
}
function applySanteAndClose(){
  APP.closeOverlay("overlay-filter");
  APP.refreshCurrentTab();
}
function renderSanteFilterSheet(){
  const sheet = document.getElementById("sheet-filter");
  const beneficiaires = distinctSante("beneficiaire");
  const prestations = distinctSante("typePrestation");
  const statuts = distinctSante("statut");

      <div class="field-label" style="margin-top:0;">Terminé</div>
      <div class="chiprow" id="sf-termine">
        <div class="chip-opt ${SFilters.termine.has('pending')?'selected':''}" data-val="pending">Non terminé</div>
        <div class="chip-opt ${SFilters.termine.has('done')?'selected':''}" data-val="done">Terminé</div>
      </div>

    <div class="sheet-foot">
      <button class="btn btn-ghost" id="sf-reset">Réinitialiser tout</button>
      <button class="btn btn-primary sante-filter-apply-btn" id="sf-apply">Voir les résultats</button>
    </div>
  `;
  document.getElementById("sf-close").onclick = ()=>APP.closeOverlay("overlay-filter");
  document.querySelectorAll("#sf-termine .chip-opt").forEach(el=>{
    el.onclick = ()=>{
      const val = el.dataset.val;
      if(SFilters.termine.has(val)) SFilters.termine.delete(val); else SFilters.termine.add(val);
      el.classList.toggle("selected");
      SFilters.persist();
      updateSanteApplyButton();
    };
  });
  wireSanteChecklist("sf-list-benef", SFilters.beneficiaires);

  wireSanteChecklist("sf-list-statut", SFilters.statuts);
  wireSanteChecklist("sf-list-devise", SFilters.devises);
  wireSanteGroupeFilter();
  document.getElementById("sf-reset").onclick = ()=>{ SFilters.reset(); SFilters.persist(); applySanteAndClose(); };
  document.getElementById("sf-apply").onclick = applySanteAndClose;
  updateSanteApplyButton();

function openSanteFilterSheet(){
  renderSanteFilterSheet();
  APP.openOverlay("overlay-filter");
}
window.__SF_SANTE_FILTERSHEET = {openFilterSheet: openSanteFilterSheet};

  sheet.querySelectorAll("[data-del]").forEach(btn=>{

        title:"Retirer « "+v+" » ?",

        confirmLabel:"Retirer",
        onConfirm:()=>{
          Store.settings.sante.lists[key] = Store.settings.sante.lists[key].filter(x=>x!==v);
          Store.saveSettings();
          renderSanteListEditor(key);

/* ---------------- Excel dédié à l'onglet Santé (export/import propres, séparés du reste) ---------------- */
function isoToDateObjS(iso){
  if(!iso) return null;
  const [y,m,d] = String(iso).split("-").map(Number);
  if(!y||!m||!d) return null;
  return new Date(y,m-1,d);
}
function setDateColFormatS(ws, colIndex, startRow, rowCount){
  for(let r=startRow;r<startRow+rowCount;r++){
    const addr = XLSX.utils.encode_cell({r, c:colIndex});
    const cell = ws[addr];
    if(cell && cell.t==="d") cell.z = "dd/mm/yyyy";
  }
}
const SANTE_XLSX_HEADER = ["Date du soin","Bénéficiaire","Devise","Montant €","Montant devise","Médecin/hôpital","Type de prestation","Statut","Statut mis à jour le",
  "Remb. tiers payant €","Date remb. tiers","Remb. sécu €","Date remb. sécu","Remb. mutuelle €","Date remb. mutuelle","Groupe","Mutuelle","Part moi (%)","Terminé"];
const SANTE_DATE_COLS = [0,8,10,12,14]; // index des colonnes date dans SANTE_XLSX_HEADER

/* Construit les lignes (avec objets Date, pas encore de worksheet) de l'onglet Santé — factorisé pour être
   réutilisé à la fois par l'export dédié ci-dessous (exportSanteExcel) et par l'export unifié Transactions/
   Paramètres/Santé du module Menu (cf. window.__SF_MENU / exportExcel), qui compose son propre classeur. */
function buildSanteExportRows(){
  const rows = Store.santeItems.map(it=>[
    isoToDateObjS(it.dateSoin), it.beneficiaire, it.devise, it.montantEur, it.montantDevise,
    it.medecin, it.typePrestation, it.statut, isoToDateObjS(it.statutDate),
    it.rembTiersMontant, isoToDateObjS(it.rembTiersDate),
    it.rembSecuMontant, isoToDateObjS(it.rembSecuDate),
    it.rembMutuelleMontant, isoToDateObjS(it.rembMutuelleDate),
    it.groupe, it.mutuelle, it.partMoi, it.termine ? "Oui" : "Non"
  ]);
  return {header: SANTE_XLSX_HEADER.slice(), rows, dateCols: SANTE_DATE_COLS.slice()};
}

function exportSanteExcel(){
  if(Store.santeItems.length===0){ APP.showToast("Aucun soin à exporter"); return; }
  const {header, rows, dateCols} = buildSanteExportRows();
  const data = [header, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(data, {cellDates:true});
  dateCols.forEach(col=> setDateColFormatS(ws, col, 1, data.length-1));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Santé");
  const stamp = U.toISO(new Date());
  XLSX.writeFile(wb, "suivi_financier_sante_"+stamp+".xlsx");
  APP.showToast("Export Excel généré");
}


function rowToSanteItem(row){
  const norm = {};
  Object.keys(row).forEach(k=>{ norm[U.normalize(k)] = row[k]; });
  const dateRaw = norm["date du soin"];
  if(dateRaw==null || dateRaw==="") return null;
  const dateObj = U.parseDateValue(dateRaw);
  if(!dateObj) return null;
  const numOrNull = (v)=>{
    if(v==null || v==="") return null;
    let n = v;
    if(typeof n==="string") n = parseFloat(n.replace(/\s/g,"").replace(",","."));
    n = Number(n);
    return isNaN(n) ? null : n;
  };
  const dateOrNull = (v)=>{
    if(v==null || v==="") return null;
    const d = U.parseDateValue(v);
    return d ? U.toISO(d) : null;
  };
  const strOr = (v, fallback)=> v!=null && v!=="" ? String(v).trim() : fallback;
  const it = {
    dateSoin: U.toISO(dateObj),
    beneficiaire: strOr(norm["beneficiaire"], ""),
    devise: strOr(norm["devise"], "€"),
    montantEur: numOrNull(norm["montant €"]) || 0,
    montantDevise: numOrNull(norm["montant devise"]),
    medecin: strOr(norm["medecin/hopital"], ""),
    typePrestation: strOr(norm["type de prestation"], ""),
    statut: strOr(norm["statut"], ""),
    statutDate: dateOrNull(norm["statut mis a jour le"]),
    rembTiersMontant: numOrNull(norm["remb. tiers payant €"]) || 0,
    rembTiersDate: dateOrNull(norm["date remb. tiers"]),
    rembSecuMontant: numOrNull(norm["remb. secu €"]) || 0,
    rembSecuDate: dateOrNull(norm["date remb. secu"]),
    rembMutuelleMontant: numOrNull(norm["remb. mutuelle €"]) || 0,
    rembMutuelleDate: dateOrNull(norm["date remb. mutuelle"]),
    groupe: strOr(norm["groupe"], ""),
    mutuelle: strOr(norm["mutuelle"], ""),
    partMoi: numOrNull(norm["part moi (%)"]),
    termine: /^(oui|yes|true|1|x)$/i.test(String(norm["termine"]||"").trim())
  };
  if(it.partMoi==null) it.partMoi = 100;
  return sanitizeItem(it);
}

/* mode: "replace" | "merge" — même sémantique que DATA.importTxns (fusion mute Store.santeItems en place,
   le caller reste responsable de l'enregistrement via Store.saveSanteItems()). */
function importSanteItems(items, mode){
  const sanitized = items.map(sanitizeItem);
  if(mode === "replace"){
    Store.santeItems = sanitized;
    Store.santeItems.sort((a,b)=> a.dateSoin.localeCompare(b.dateSoin));
    return {added: sanitized.length, skippedDup:0, mode};
  }
  const existingIds = new Set(Store.santeItems.map(it=>it.id));
  let added=0, dup=0;
  sanitized.forEach(it=>{
    if(existingIds.has(it.id)){ dup++; return; }
    existingIds.add(it.id);
    Store.santeItems.push(it);
    added++;
  });
  Store.santeItems.sort((a,b)=> a.dateSoin.localeCompare(b.dateSoin));
  return {added, skippedDup:dup, mode};
}
function importSanteSettings(settings){
  if(!settings || !settings.lists) return;
  LIST_KEYS.forEach(k=>{
    if(Array.isArray(settings.lists[k])){
      const cur = Store.settings.sante.lists[k];
      settings.lists[k].forEach(v=>{ if(v && !cur.includes(v)) cur.push(v); });
    }
  });
  Store.saveSettings();
}
function registerNewListValuesFromItems(items){
  const s = Store.settings.sante.lists;
  items.forEach(it=>{
    if(it.beneficiaire && !s.beneficiaires.includes(it.beneficiaire)) s.beneficiaires.push(it.beneficiaire);
    if(it.devise && !s.devises.includes(it.devise)) s.devises.push(it.devise);
    if(it.medecin && !s.medecins.includes(it.medecin)) s.medecins.push(it.medecin);
    if(it.typePrestation && !s.prestations.includes(it.typePrestation)) s.prestations.push(it.typePrestation);
    if(it.statut && !s.statuts.includes(it.statut)) s.statuts.push(it.statut);
    if(it.mutuelle && !s.mutuelles.includes(it.mutuelle)) s.mutuelles.push(it.mutuelle);
  });
  Store.saveSettings();
}
window.__SF_SANTE_DATA = {importSanteItems, importSanteSettings, registerNewListValuesFromItems, rowToSanteItem, buildSanteId, sanitizeItem, buildSanteExportRows};

let santeParsedImport = null; // {items, skipped, total, fileName}

function renderSanteImportScreen(){
  const sheet = document.getElementById("sheet-santesettings");
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <button class="icon-btn" id="si-back">${ICONS.arrowLeft}</button>
      <h2 style="flex:1;text-align:center;">Importer (Santé)</h2>
      <button class="icon-btn" id="ss-close3">${ICONS.close}</button>
    </div>
    <div class="sheet-body">
      <label class="dropzone" id="si-dropzone">
        ${ICONS.upload}
        <p><b style="color:var(--text)">Choisir un fichier</b><br>Excel (.xlsx, .xls) ou CSV exporté depuis cet onglet</p>
        <input type="file" id="si-file-input" accept=".xlsx,.xls,.csv" style="display:none">
      </label>
      <div class="field-label">Colonnes attendues</div>
      <div class="card" style="box-shadow:none;background:var(--card-alt);padding:12px 14px;font-size:12px;color:var(--text-sub);line-height:1.7;">
        ${SANTE_XLSX_HEADER.join(" · ")}

  `;

  document.getElementById("ss-close3").onclick = ()=>APP.closeOverlay("overlay-santesettings");

    const file = e.target.files[0];
    if(file) handleSanteFile(file);
  };

function handleSanteFile(file){
  const statusEl = document.getElementById("si-status");
  statusEl.innerHTML = `<div style="text-align:center;color:var(--text-sub);font-size:13.5px;padding:14px;">Analyse du fichier…</div>`;
  const name = file.name.toLowerCase();
  const isCsv = name.endsWith(".csv");
  const reader = new FileReader();
  reader.onerror = ()=>{
    statusEl.innerHTML = `<div style="color:var(--expense);font-size:13.5px;padding:10px;">Lecture du fichier impossible.</div>`;
  };
  reader.onload = (e)=>{
    try{
      let wb;
      if(isCsv){
        wb = XLSX.read(e.target.result, {type:"binary", cellDates:true, raw:false});
      } else {
        const data = new Uint8Array(e.target.result);
        wb = XLSX.read(data, {type:"array", cellDates:true, raw:false});
      }
      const sheetName = wb.SheetNames.find(n=>U.normalize(n)==="sante") || wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {defval:null, raw:false, dateNF:"yyyy-mm-dd"});
      const items = [];
      rows.forEach(r=>{
        const it = rowToSanteItem(r);
        if(it) items.push(it);
      });
      santeParsedImport = {items, skipped: rows.length-items.length, total: rows.length, fileName: file.name};
      renderSanteImportSummary();
    }catch(err){
      statusEl.innerHTML = `<div style="color:var(--expense);font-size:13.5px;padding:10px;">Impossible de lire ce fichier : ${U.escHtml(err.message)}</div>`;
    }
  };
  if(isCsv) reader.readAsBinaryString(file);
  else reader.readAsArrayBuffer(file);
}

function renderSanteImportSummary(){
  const statusEl = document.getElementById("si-status");
  const r = santeParsedImport;
  if(r.items.length===0){
    statusEl.innerHTML = `<div style="color:var(--expense);font-size:13.5px;padding:10px;">Aucune ligne exploitable trouvée (vérifiez au minimum la colonne "Date du soin").</div>`;
    return;
  }
  const hasExisting = Store.santeItems.length>0;
  let mode = hasExisting ? "merge" : "replace";
  function render(){
    statusEl.innerHTML = `
      <div class="import-summary"><b>${U.escHtml(r.fileName)}</b><br>
        ${r.items.length.toLocaleString('fr-FR')} soin(s) valide(s) sur ${r.total.toLocaleString('fr-FR')} ligne(s)${r.skipped?` · ${r.skipped} ignorée(s)`:""}
      </div>
      ${hasExisting ? `
      <div class="field-label">Que faire de ces soins ?</div>
      <div class="radio-opt selected" data-mode="merge" id="sim-merge">
        <span class="rc"></span>
        <div><div class="rt">Ajouter aux soins existants</div><div class="rd">Les soins déjà enregistrés (identiques) seront ignorés automatiquement.</div></div>
      </div>
      <div class="radio-opt" data-mode="replace" id="sim-replace">
        <span class="rc"></span>
        <div><div class="rt">Remplacer tous les soins</div><div class="rd">Vos ${Store.santeItems.length.toLocaleString('fr-FR')} soins actuels seront supprimés et remplacés par ce fichier.</div></div>
      </div>` : ""}
      <button class="btn btn-primary btn-block" id="si-confirm" style="margin-top:18px;">Importer</button>
    `;
    if(hasExisting){
      document.getElementById("sim-merge").onclick = ()=>{ mode="merge"; document.getElementById("sim-merge").classList.add("selected"); document.getElementById("sim-replace").classList.remove("selected"); };
      document.getElementById("sim-replace").onclick = ()=>{ mode="replace"; document.getElementById("sim-replace").classList.add("selected"); document.getElementById("sim-merge").classList.remove("selected"); };
    }
    document.getElementById("si-confirm").onclick = ()=>{
      const stats = importSanteItems(r.items, mode);
      registerNewListValuesFromItems(r.items);
      Store.saveSanteItems().then(ok=>{
        APP.showToast(ok ? `${stats.added.toLocaleString('fr-FR')} soin(s) importé(s)${stats.skippedDup?` · ${stats.skippedDup} doublon(s) ignoré(s)`:""}` : "Import réussi, mais la sauvegarde a échoué");
        settingsView = "menu";
        renderSanteSettings();
        APP.refreshCurrentTab();
      });
    };
  }
  render();
}

function renderSanteSettings(){
  if(settingsView==="menu") renderSanteSettingsMenu();
  else if(settingsView==="import") renderSanteImportScreen();
  else renderSanteListEditor(settingsView);
}
function openSanteSettings(){
  settingsView = "menu";
  renderSanteSettings();
  APP.openOverlay("overlay-santesettings");
}
window.__SF_SANTE_SETTINGS = {open: openSanteSettings};

}

if(document.readyState==="loading"){

} else {
