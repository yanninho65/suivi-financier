  const existingAdj = Store.settings.budget.adjustments || [];
  mergeRuleList(existingAdj, budgetAdjustments, a=>[a.month,a.groupe,a.categorie||"",a.montant,a.remarque||""].join("|"));
  Store.settings.budget.adjustments = existingAdj;

  // Réglages du budget : on ne remplit que les champs pas encore configurés, sans écraser la config actuelle.
  if(budgetSettings){
    const b = Store.settings.budget;
    if(!b.mainGroup && budgetSettings.mainGroup) b.mainGroup = budgetSettings.mainGroup;
    if(!b.mode && budgetSettings.mode) b.mode = budgetSettings.mode;
    if(!b.scope && budgetSettings.scope) b.scope = budgetSettings.scope;
    if(!b.startMonth && budgetSettings.startMonth) b.startMonth = budgetSettings.startMonth;
    if(!b.endMonth && budgetSettings.endMonth) b.endMonth = budgetSettings.endMonth;
    if((!b.extraGroups || !b.extraGroups.length) && (budgetSettings.extraGroups||[]).length) b.extraGroups = budgetSettings.extraGroups.slice();
    if((!b.amortCategories || !b.amortCategories.length) && (budgetSettings.amortCategories||[]).length) b.amortCategories = budgetSettings.amortCategories.slice();
    if((!b.excludedAccounts || !b.excludedAccounts.length) && (budgetSettings.excludedAccounts||[]).length) b.excludedAccounts = budgetSettings.excludedAccounts.slice();
  }
  // Salaires saisis manuellement : par mois, on ne remplit que les mois pas encore renseignés localement
  // (ne remplace jamais une saisie existante avec une valeur importée).
  if(salaryEntries){
    Store.settings.budget.salaryEntries = Store.settings.budget.salaryEntries || {};
    const localSal = Store.settings.budget.salaryEntries;
    Object.keys(salaryEntries).forEach(month=>{
      if(!localSal[month]) localSal[month] = salaryEntries[month];
    });
  }
  // Comparaison : réglages (activé/mode/période comparée) uniquement s'ils ne sont pas déjà configurés
  // localement ; budget prédéfini fusionné clé par clé, sans écraser une valeur déjà saisie localement.
  if(compareSettings && compareSettings.enabled && !Store.settings.budget.compare.periodFrom && !Store.settings.budget.compare.enabled){
    const c = Store.settings.budget.compare;
    c.enabled = true;
    c.mode = compareSettings.mode==="predefined" ? "predefined" : "period";
    c.periodFrom = compareSettings.periodFrom || null;
    c.periodTo = compareSettings.periodTo || null;
  }
  if(comparePredefined){
    const localPredef = Store.settings.budget.compare.predefined || {};
    Object.keys(comparePredefined).forEach(key=>{
      if(localPredef[key]==null) localPredef[key] = comparePredefined[key];
    });
    Store.settings.budget.compare.predefined = localPredef;
  }
  // Revenus : n'adopte la configuration importée que si rien n'est encore configuré localement pour
  // aucune des deux personnes (cf. window.__SF_REVENUS.applyParamsImportPart) — jamais d'écrasement.
  if(revenus && window.__SF_REVENUS) window.__SF_REVENUS.applyParamsImportPart(revenus, "merge");

  // Sécurité : voir commentaire équivalent dans la branche "replace" ci-dessus.
  Store.normalizeSettings();
  return {rulesAdded, personRulesAdded, acctAdded};
}

let chosenImportScope = "both"; // "both" | "transactions" | "params"

function reconcileKey(nv){ return nv.field+"::"+U.normalize(nv.value); }

/* Écran affiché uniquement s'il existe des valeurs (Catégorie/Personne/Compte/Groupe) qui n'apparaissent
   dans aucune transaction déjà enregistrée, même en ignorant casse/accents (cf. buildReconciliation). Pour
   chacune, l'utilisateur choisit "Nouveau" (par défaut, créée telle quelle) ou "Remplacer par…" un élément
   déjà existant (faute de frappe, variante). Les choix sont appliqués à parsedResult.txns avant de passer
   à l'écran de résumé habituel. */
function renderImportReconcile(){
  const statusEl = document.getElementById("import-status");
  const r = parsedResult;
  reconcileChoices = {};
  r.reconcile.newValues.forEach(nv=>{ reconcileChoices[reconcileKey(nv)] = {action:"new", target:null}; });

  function existingValuesFor(fields){
    const set = new Set();
    Store.transactions.forEach(t=>{ fields.forEach(f=>{ if(t[f]) set.add(t[f]); }); });
    return Array.from(set).sort((a,b)=>a.localeCompare(b,'fr'));
  }

  function rowHtml(nv){
    const key = reconcileKey(nv);
    const choice = reconcileChoices[key];
    return `<div class="card" style="padding:12px 14px;margin-bottom:8px;box-shadow:none;background:var(--card-alt);" data-key="${U.escHtml(key)}">
      <div class="u-row-between-sm" style="margin-bottom:0;">
        <div style="font-weight:700;font-size:14px;">${U.escHtml(nv.value)}</div>
        <div style="color:var(--text-sub);font-size:12px;flex:0 0 auto;">${nv.count} occurrence${nv.count>1?"s":""}</div>
      </div>
      <div class="seg seg-sm" style="margin-top:8px;">
        <button type="button" data-choice="new" class="${choice.action==='new'?'active':''}">Nouveau</button>
        <button type="button" data-choice="existing" class="${choice.action==='existing'?'active':''}">Remplacer par…</button>
      </div>
      <div class="reconcile-target" style="margin-top:6px;font-size:12.5px;color:var(--primary);${choice.action==='existing'?'':'display:none;'}">→ ${U.escHtml(choice.target||"")}</div>
    </div>`;
  }

  function sectionsHtml(){
    const byField = {};
    r.reconcile.newValues.forEach(nv=>{ (byField[nv.field] = byField[nv.field]||[]).push(nv); });
    return Object.keys(byField).map(field=>{
      const group = byField[field];
      return `<div class="field-label" style="margin-top:14px;">${U.escHtml(group[0].label)} (${group.length} nouveau${group.length>1?"x":""})</div>
        ${group.map(rowHtml).join("")}`;
    }).join("");
  }

  const alignedCount = r.reconcile.autoAligned.length;
  statusEl.innerHTML = `
    <div class="u-desc-sm">
      Ces éléments n'apparaissent dans aucune de vos transactions actuelles. Laissez « Nouveau » pour les créer tels quels, ou choisissez « Remplacer par… » s'il s'agit en fait d'un élément déjà existant.
      ${alignedCount ? ` Par ailleurs, ${alignedCount} valeur${alignedCount>1?"s":""} ne différant que par la casse ou les accents ${alignedCount>1?"ont":"a"} déjà été aligné${alignedCount>1?"es":"e"} automatiquement sur l'existant.` : ""}
    </div>
    ${sectionsHtml()}
    <button class="btn btn-primary btn-block" id="reconcile-continue" style="margin-top:18px;">Continuer</button>
  `;

  function refreshRow(card, nv){
    const choice = reconcileChoices[reconcileKey(nv)];
    card.querySelector('[data-choice="new"]').classList.toggle("active", choice.action==="new");
    card.querySelector('[data-choice="existing"]').classList.toggle("active", choice.action==="existing");
    const targetEl = card.querySelector(".reconcile-target");
    if(choice.action==="existing"){ targetEl.style.display=""; targetEl.textContent = "→ "+choice.target; }
    else targetEl.style.display = "none";
  }
  statusEl.querySelectorAll("[data-key]").forEach(card=>{
    const key = card.dataset.key;
    const nv = r.reconcile.newValues.find(x=>reconcileKey(x)===key);
    card.querySelector('[data-choice="new"]').onclick = ()=>{
      reconcileChoices[key] = {action:"new", target:null};
      refreshRow(card, nv);
    };
    card.querySelector('[data-choice="existing"]').onclick = ()=>{
      PICKER.openPicker({
        title: "Remplacer « "+nv.value+" » par…",
        options: existingValuesFor(nv.fields),
        noEmpty: true,
        onSelect:(v)=>{
          reconcileChoices[key] = {action:"existing", target:v};
          refreshRow(card, nv);
        }
      });
    };
  });

  document.getElementById("reconcile-continue").onclick = ()=>{
    r.reconcile.newValues.forEach(nv=>{
      const choice = reconcileChoices[reconcileKey(nv)];
      if(choice.action==="existing" && choice.target){
        const n = U.normalize(nv.value);
        r.txns.forEach(t=>{
          nv.fields.forEach(f=>{
            if(t[f] && U.normalize(t[f])===n){
              t[f] = choice.target;
              if(f==="groupe") t.groupeBase = U.baseGroupe(choice.target);
            }
          });
        });
      }
    });
    renderImportSummary();
  };
}

function renderImportSummary(){
  const statusEl = document.getElementById("import-status");
  const r = parsedResult;
  const hasExisting = Store.transactions.length>0;
  const hasTxns = r.txns.length>0;
  function revenusHasContent(rv){
    if(!rv) return false;
    return ["moi","conjoint"].some(p=>{
      const person = rv[p]||{};
      const lineCount = (person.lines||[]).length;
      return lineCount || (person.transferOut||[]).length || (person.transferIn||[]).length;
    });
  }
  const hasParams = !!(r.params && ((r.params.groupRules||[]).length || (r.params.personRules||[]).length || Object.keys(r.params.accountTypes||{}).length ||
    Object.keys(r.params.groupKind||{}).length || (r.params.budgetAdjustments||[]).length || Object.keys(r.params.categoryTypeOverride||{}).length ||
    (r.params.budgetSettings && r.params.budgetSettings.mainGroup) || Object.keys(r.params.salaryEntries||{}).length ||
    (r.params.compareSettings && r.params.compareSettings.enabled) || Object.keys(r.params.comparePredefined||{}).length ||
    revenusHasContent(r.params.revenus)));
  const hasSante = !!(r.santeItems && r.santeItems.length);
  chosenMode = hasExisting ? "merge" : "replace";
  chosenParamsMode = "merge";
  chosenImportScope = "both";

  if(!hasTxns && !hasParams && !hasSante){
    statusEl.innerHTML = `<div style="color:var(--expense);font-size:13.5px;padding:10px;">Aucune donnée exploitable trouvée dans ce fichier (ni transactions, ni paramètres, ni soins). Vérifiez les noms de colonnes et le format des dates.</div>`;
    return;
  }

  const dMin = hasTxns ? r.txns.reduce((m,t)=>t.date<m?t.date:m, r.txns[0].date) : null;
  const dMax = hasTxns ? r.txns.reduce((m,t)=>t.date>m?t.date:m, r.txns[0].date) : null;
  const showBoth = hasTxns && hasParams;

  function scopeChoiceHtml(){
    if(!showBoth) return "";
    return `
      <div class="field-label">Que voulez-vous importer ?</div>
      <div class="radio-opt ${chosenImportScope==='both'?'selected':''}" data-iscope="both">
        <span class="rc"></span>
        <div><div class="rt">Transactions et Paramètres</div></div>
      </div>
      <div class="radio-opt ${chosenImportScope==='transactions'?'selected':''}" data-iscope="transactions">
        <span class="rc"></span>
        <div><div class="rt">Transactions seulement</div></div>
      </div>
      <div class="radio-opt ${chosenImportScope==='params'?'selected':''}" data-iscope="params">
        <span class="rc"></span>
        <div><div class="rt">Paramètres seulement</div></div>
      </div>
    `;
  }

  function txnSectionHtml(){
    if(!hasTxns) return "";
    const aligned = r.reconcile ? r.reconcile.autoAligned.length : 0;
    return `
      <div class="import-summary" style="margin-top:14px;">
        ${r.txns.length.toLocaleString('fr-FR')} transaction(s) valide(s) sur ${r.total.toLocaleString('fr-FR')} ligne(s)${r.skipped?` · ${r.skipped} ignorée(s)`:""}<br>
        Période : ${U.fmtDateShort(dMin)} – ${U.fmtDateShort(dMax)}
        ${aligned ? `<br>${aligned} valeur${aligned>1?"s":""} de casse/accents différente${aligned>1?"s":""} aligné${aligned>1?"es":"e"} automatiquement sur l'existant.` : ""}
      </div>
      ${hasExisting ? `
      <div class="field-label">Que faire de ces transactions ?</div>
      <div class="radio-opt selected" data-mode="merge" id="mode-merge">
        <span class="rc"></span>
        <div><div class="rt">Ajouter aux données existantes</div><div class="rd">Les transactions déjà enregistrées (identiques) seront ignorées automatiquement.</div></div>
      </div>
      <div class="radio-opt" data-mode="replace" id="mode-replace">
        <span class="rc"></span>
        <div><div class="rt">Remplacer toutes les données</div><div class="rd">Vos ${Store.transactions.length.toLocaleString('fr-FR')} transactions actuelles seront supprimées et remplacées par ce fichier.</div></div>
      </div>
      ` : ""}
    `;
  }

  function paramsSectionHtml(){
    if(!hasParams) return hasTxns ? `<div class="import-summary" style="margin-top:14px;">Aucun onglet/données Paramètres détecté — vos règles de groupe et types de compte actuels resteront inchangés.</div>` : "";
    return `
      <div class="import-summary" style="margin-top:14px;">
        <b>Paramètres détectés</b><br>
        ${(r.params.groupRules||[]).length} règle(s) de groupe · ${(r.params.personRules||[]).length} règle(s) de personne · ${Object.keys(r.params.accountTypes||{}).length} type(s) de compte<br>
        ${Object.keys(r.params.groupKind||{}).length} type(s) de groupe (budget) · ${(r.params.budgetAdjustments||[]).length} ajustement(s) de budget<br>
        ${Object.keys(r.params.categoryTypeOverride||{}).length} classement(s) de catégorie forcé(s)${r.params.budgetSettings && r.params.budgetSettings.mainGroup ? " · réglages du budget inclus" : ""}${Object.keys(r.params.salaryEntries||{}).length ? " · salaires inclus" : ""}${Object.keys(r.params.comparePredefined||{}).length || (r.params.compareSettings && r.params.compareSettings.enabled) ? " · comparaison incluse" : ""}${revenusHasContent(r.params.revenus) ? " · revenus inclus" : ""}
      </div>
      <div class="field-label">Que faire de ces paramètres ?</div>
      <div class="radio-opt selected" data-pmode="merge" id="pmode-merge">
        <span class="rc"></span>
        <div><div class="rt">Ajouter aux paramètres existants</div><div class="rd">Les règles déjà enregistrées sont conservées ; celles en commun avec un compte sont mises à jour.</div></div>
      </div>
      <div class="radio-opt" data-pmode="replace" id="pmode-replace">
        <span class="rc"></span>
        <div><div class="rt">Remplacer les paramètres</div><div class="rd">Toutes les règles de groupe et types de compte actuels seront remplacés par ceux de ce fichier.</div></div>
      </div>
    `;
  }

  function santeSectionHtml(){
    if(!hasSante) return "";
    return `
      <div class="import-summary" style="margin-top:14px;">
        <b>Onglet Santé détecté</b><br>
        ${r.santeItems.length.toLocaleString('fr-FR')} soin${r.santeItems.length>1?"s":""} — importé${r.santeItems.length>1?"s":""} indépendamment du choix ci-dessus, comme pour une sauvegarde JSON.
      </div>
    `;
  }

  function render(){
    const showTxnSection = hasTxns && (chosenImportScope==="both" || chosenImportScope==="transactions");
    const showParamsSection = hasParams && (chosenImportScope==="both" || chosenImportScope==="params");
    statusEl.innerHTML = `
      <div class="import-summary"><b>${U.escHtml(r.fileName)}</b></div>
      ${scopeChoiceHtml()}
      ${showTxnSection ? txnSectionHtml() : ""}
      ${showParamsSection ? paramsSectionHtml() : ""}
      ${santeSectionHtml()}
      <button class="btn btn-primary btn-block" id="import-confirm" style="margin-top:18px;">Importer</button>
    `;
    if(showBoth){
      statusEl.querySelectorAll("[data-iscope]").forEach(el=>{
        el.onclick = ()=>{ chosenImportScope = el.dataset.iscope; render(); };
      });
    }
    if(showTxnSection && hasExisting){
      document.getElementById("mode-merge").onclick = ()=>{ chosenMode="merge"; document.getElementById("mode-merge").classList.add("selected"); document.getElementById("mode-replace").classList.remove("selected"); };
      document.getElementById("mode-replace").onclick = ()=>{ chosenMode="replace"; document.getElementById("mode-replace").classList.add("selected"); document.getElementById("mode-merge").classList.remove("selected"); };
    }
    if(showParamsSection){
      document.getElementById("pmode-merge").onclick = ()=>{ chosenParamsMode="merge"; document.getElementById("pmode-merge").classList.add("selected"); document.getElementById("pmode-replace").classList.remove("selected"); };
      document.getElementById("pmode-replace").onclick = ()=>{ chosenParamsMode="replace"; document.getElementById("pmode-replace").classList.add("selected"); document.getElementById("pmode-merge").classList.remove("selected"); };
    }
    document.getElementById("import-confirm").onclick = ()=>{
      const doTxns = showTxnSection;
      const doParams = showParamsSection;
      const stats = doTxns ? DATA.importTxns(parsedResult.txns, chosenMode) : null;
      const pstats = doParams ? applyParamsImport(parsedResult.params, chosenParamsMode) : null;
      // Sauvegarde JSON (§ exportBackup) : les soins de l'onglet Santé, s'il y en a dans le fichier,
      // voyagent avec le reste — fusion/remplacement selon le même choix que pour les transactions.
      let santeStats = null;
      if(parsedResult.santeItems && parsedResult.santeItems.length && window.__SF_SANTE_DATA){
        santeStats = window.__SF_SANTE_DATA.importSanteItems(parsedResult.santeItems, chosenMode);
      }
      if(parsedResult.santeSettings && window.__SF_SANTE_DATA){
        window.__SF_SANTE_DATA.importSanteSettings(parsedResult.santeSettings);
      }
      if(pstats) Store.saveSettings();
      APP.closeOverlay("overlay-import");
      APP.refreshCurrentTab();
      APP.showToast("Enregistrement…");
      const finish = (ok)=>{
        if(!ok){
          const reason = Store.lastSaveError ? Store.lastSaveError : "raison inconnue";
          APP.showToast("Import réussi, mais l'enregistrement a échoué : " + reason + " Exportez une sauvegarde par sécurité.");
          return;
        }
        let msg;
        if(doTxns){
          msg = stats.mode==="replace" ? `${stats.added.toLocaleString('fr-FR')} transactions importées` :
            `${stats.added.toLocaleString('fr-FR')} ajoutée(s)` + (stats.skippedDup? `, ${stats.skippedDup} doublon(s) ignoré(s)`:"");
          if(doParams) msg += ` · paramètres mis à jour`;
        } else if(doParams){
          msg = "Paramètres mis à jour";
        } else {
          // Ni transactions ni paramètres (ex. classeur ne contenant qu'un onglet Santé) : le message se
          // construit entièrement à partir de santeStats juste en dessous.
          msg = "";
        }
        if(santeStats) msg += (msg ? ` · ` : ``) + `${santeStats.added.toLocaleString('fr-FR')} soin(s) importé(s)`;
        APP.showToast(msg || "Import terminé");
      };
      const afterTxnSave = (ok)=>{
        if(santeStats) Store.saveSanteItems().then(()=>finish(ok));
        else finish(ok);
      };
      if(doTxns) Store.saveTransactions().then(afterTxnSave);
      else if(santeStats) Store.saveSanteItems().then(afterTxnSave);
      else finish(true);
    };
  }
  render();
}

    customBalances: (Store.settings.customBalances || []).map(cb=>({title: cb.title || "", accounts: (cb.accounts||[]).slice()})),
    decimals: Store.settings.decimals === 2 ? 2 : 0,
    groupKind: Object.assign({}, Store.settings.groupKind || {}),
    groupVoyageMonth: Object.assign({}, Store.settings.groupVoyageMonth || {}),
    groupDateRange: Object.assign({}, Store.settings.groupDateRange || {}),
    categoryTypeOverride: Object.assign({}, Store.settings.categoryTypeOverride || {}),
    budgetAdjustments: (budget.adjustments || []).slice(),
    budgetSettings: {
      mode: budget.mode || null,
      scope: budget.scope || null,
      startMonth: budget.startMonth || null,
      endMonth: budget.endMonth || null,
      mainGroup: budget.mainGroup || null,
      extraGroups: (budget.extraGroups || []).slice(),
      amortCategories: (budget.amortCategories || []).slice(),
      periodFrom: budget.periodFrom || null,
      periodTo: budget.periodTo || null,
      excludedAccounts: (budget.excludedAccounts || []).slice(),
    },
    salaryEntries: Object.assign({}, budget.salaryEntries || {}),
    compareSettings: {
      enabled: !!(budget.compare && budget.compare.enabled),
      mode: (budget.compare && budget.compare.mode) || null,
      periodFrom: (budget.compare && budget.compare.periodFrom) || null,
      periodTo: (budget.compare && budget.compare.periodTo) || null,
    },
    comparePredefined: Object.assign({}, (budget.compare && budget.compare.predefined) || {}),
    evolutionSettings: {
      view: evo.view || null,
      monthBasis: evo.monthBasis || null,
      merges: {
        groupe: ((evo.merges && evo.merges.groupe) || []).slice(),
        categorie: ((evo.merges && evo.merges.categorie) || []).slice(),
        personne: ((evo.merges && evo.merges.personne) || []).slice(),
        compte: ((evo.merges && evo.merges.compte) || []).slice(),
      }
    },
    revenus: window.__SF_REVENUS ? window.__SF_REVENUS.buildParamsPayloadPart() : null
  };
}

/* scope: "both" | "transactions" | "params" */
function exportBackup(scope){
  scope = scope || "both";
  const payload = {version:2, exportedAt: new Date().toISOString()};
  if(scope==="both" || scope==="transactions"){
    payload.transactions = Store.transactions.map(t=>({...t, date:t.date.toISOString()}));
  }
  if(scope==="both" || scope==="params"){
    payload.params = buildParamsPayload();
  }
  // Les soins de l'onglet Santé voyagent toujours avec la sauvegarde JSON (quel que soit le
  // périmètre choisi ci-dessus), au même titre que la synchro Gist — cf. buildSyncPayload.
  if(Store.santeItems.length || Object.values((Store.settings.sante||{}).lists||{}).some(l=>l.length)){
    payload.santeItems = Store.santeItems.slice();
    payload.santeSettings = Store.settings.sante;
  }
  const blob = new Blob([JSON.stringify(payload)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = U.toISO(new Date());
  const suffix = scope==="transactions" ? "_transactions" : scope==="params" ? "_parametres" : "";
  a.href = url; a.download = "suivi_financier_sauvegarde"+suffix+"_"+stamp+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  APP.showToast("Sauvegarde exportée");
}

/* scope: "both" | "transactions" | "params" */
/* Convertit une date "YYYY-MM-DD" en objet Date (jour précis, pour écriture Excel en tant que vraie
   cellule date, pas du texte) ; null/"" → null. */
function isoToDateObj(iso){
  if(!iso) return null;
  const [y,m,d] = String(iso).split("-").map(Number);
  if(!y || !m || !d) return null;
  return new Date(y, m-1, d);
}
/* Convertit un mois "YYYY-MM" (mois voyage forcé d'un groupe) en objet Date au 1er du mois, pour écriture
   Excel en tant que vraie cellule date (affichée dd/mm/yyyy, donc toujours "01/MM/AAAA") plutôt qu'en texte
   "AAAA-MM" — le stockage interne (Store.settings.groupVoyageMonth) reste "YYYY-MM", seule la
   représentation Excel change (cf. parseParametresSheet pour la conversion inverse à l'import).
   null/"" → null. */
function voyageMonthToDateObj(ym){
  if(!ym) return null;
  const [y,m] = String(ym).split("-").map(Number);
  if(!y || !m) return null;
  return new Date(y, m-1, 1);
}
/* Applique le format d'affichage JJ/MM/AAAA aux cellules de type date (t==='d') d'une colonne donnée
   (0-indexée), sur toutes les lignes à partir de startRow (1 = sous l'en-tête). */
function setColumnDateFormatDDMMYYYY(ws, colIndex, startRow, rowCount){
  for(let r=startRow; r<startRow+rowCount; r++){
    const addr = XLSX.utils.encode_cell({r, c: colIndex});
    const cell = ws[addr];
    if(cell && cell.t==="d") cell.z = "dd/mm/yyyy";
  }
}
/* scope: {transactions:bool, params:bool, sante:bool} — au moins un true (cf. openExportExcelScopeChoice).
   Indépendant du format de scope utilisé par exportBackup (JSON), qui reste inchangé. */
function exportExcel(scope){
  scope = scope || {transactions:true, params:true, sante:false};
  const wb = XLSX.utils.book_new();

  if(scope.transactions){
    const header = ["Date","Type","Montant","Catégorie","Personne","Compte","Compte cible","Groupe","Remarque"];
    const typeLabelFr = {Income:"Revenu", Expense:"Dépense", Transfer:"Transfert"};
    const data = [header];
    Store.transactions.forEach(t=>{
      data.push([
        t.date, typeLabelFr[t.type]||t.type, t.montant, t.categorie, t.personne, t.compte, t.compteCible, t.groupe, t.remarque
      ]);
    });
    const wsTxn = XLSX.utils.aoa_to_sheet(data, {cellDates:true});
    setColumnDateFormatDDMMYYYY(wsTxn, 0, 1, data.length-1);
    XLSX.utils.book_append_sheet(wb, wsTxn, "Transactions");
  }

  if(scope.params){
    const pHeader = ["Groupe","Groupe de groupe",
      "Type budget (Quotidien/Voyage)","Mois voyage","Date début (jours)","Date fin (jours)","",
      "Compte","Type de compte","Acronyme","",
      "Personne","Groupe de personnes","",
      "Catégorie (classement forcé)","Type forcé (Revenus/Dépenses)"];
    const rules = Store.settings.groupAliasRules || [];
    const kindMap = Store.settings.groupKind || {};
    const voyageMonthMap = Store.settings.groupVoyageMonth || {};
    const dateRangeMap = Store.settings.groupDateRange || {};
    // Un seul bloc de colonnes "Groupe" contiguës (groupe de groupe + type budget + mois voyage + bornes
    // jours), au lieu de plusieurs blocs disjoints ailleurs dans la feuille. La colonne "Groupe" contient
    // TOUJOURS le libellé complet exact (suffixe de date inclus, ex. "France (26-06_07)") — jamais un nom
    // de base dérivé — sauf pour une règle "générique" volontairement créée sans occurrence précise dans
    // "Gérer les groupes" (rattache alors toute occurrence non classée individuellement ; cf. `full` dans
    // findGroupAliasRule), auquel cas "Groupe" montre simplement le nom tel quel, sans suffixe puisqu'il
    // n'y en a pas. Une ligne par règle de "groupe de groupe" (rules), enrichie du type budget/mois
    // voyage/bornes jours du même libellé s'ils existent ; les libellés qui n'ont NI règle de groupe de
    // groupe MAIS ont un type budget ou des bornes jours reçoivent une ligne dédiée pour ne rien perdre.
    const ruleKeys = new Set(rules.map(r=>r.full || r.groupe));
    const extraKeys = Array.from(new Set([...Object.keys(kindMap), ...Object.keys(dateRangeMap)]))
      .filter(k=>!ruleKeys.has(k));
    const groupRows = rules.map(r=>{
      const key = r.full || r.groupe;
      return {
        groupe: key, superGroupe: r.superGroupe,
        kind: kindMap[key]||"", voyageMonth: voyageMonthMap[key]||"",
        daysFrom: (dateRangeMap[key]||{}).dateFrom||null, daysTo: (dateRangeMap[key]||{}).dateTo||null
      };
    }).concat(extraKeys.map(k=>({
      groupe: k, superGroupe: "",
      kind: kindMap[k]||"", voyageMonth: voyageMonthMap[k]||"",
      daysFrom: (dateRangeMap[k]||{}).dateFrom||null, daysTo: (dateRangeMap[k]||{}).dateTo||null
    })));
    const acctTypesMap = Store.settings.accountTypes || {};
    const acctAcronymsMap = Store.settings.accountAcronyms || {};
    const acctNames = Array.from(new Set([...Object.keys(acctTypesMap), ...Object.keys(acctAcronymsMap)]));
    const acct = acctNames.map(name=>[name, acctTypesMap[name]||"", acctAcronymsMap[name]||""]);
    const personRules = Store.settings.personAliasRules || [];
    const catOverrideEntries = Object.entries(Store.settings.categoryTypeOverride || {});
    const n = Math.max(groupRows.length, acct.length, personRules.length, catOverrideEntries.length, 1);
    const pData = [pHeader];
    for(let i=0;i<n;i++){
      const g = groupRows[i], a = acct[i], p = personRules[i], co = catOverrideEntries[i];
      pData.push([
        g?g.groupe:"", g?g.superGroupe:"",
        g?(g.kind==="voyage"?"Voyage":(g.kind?"Quotidien":"")):"", (g&&g.voyageMonth)?voyageMonthToDateObj(g.voyageMonth):"",
        (g&&g.daysFrom)?isoToDateObj(g.daysFrom):"",
        (g&&g.daysTo)?(g.daysTo===AGG.GROUP_DATE_TODAY_SENTINEL ? "Aujourd'hui" : isoToDateObj(g.daysTo)):"",
        "",
        a?a[0]:"", a?a[1]:"", a?a[2]:"",
        "",
        p?p.personne:"", p?p.superPersonne:"",
        "",
        co?co[0]:"", co?(co[1]==="Income"?"Revenus":"Dépenses"):""
      ]);
    }
    const wsParams = XLSX.utils.aoa_to_sheet(pData, {cellDates:true});
    setColumnDateFormatDDMMYYYY(wsParams, 3, 1, pData.length-1);
    setColumnDateFormatDDMMYYYY(wsParams, 4, 1, pData.length-1);
    setColumnDateFormatDDMMYYYY(wsParams, 5, 1, pData.length-1);
    XLSX.utils.book_append_sheet(wb, wsParams, "Paramètres");

    const adj = (Store.settings.budget||{}).adjustments || [];
    const aHeader = ["Mois","Groupe","Catégorie","Montant","Remarque","Amorti","Vue","Vue uniquement"];
    const aData = [aHeader].concat(adj.map(a=>[a.month||"", a.groupe||"", a.categorie||"", a.montant||0, a.remarque||"", a.amorti?"Oui":"Non", a.montantScope==="both"?"Les deux":(a.montantScope==="couple"?"Couple":"Perso"), (a.montantViewOnly&&a.montantScope!=="both")?"Oui":"Non"]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aData), "Budget");

    const b = Store.settings.budget || {};
    const salEntries = Object.entries(b.salaryEntries || {}).sort((x,y)=>x[0].localeCompare(y[0]));
    const salHeader = ["Mois","Moi","Ma femme"];
    const salData = [salHeader].concat(salEntries.map(([month, e])=>[month, e.moi==null?"":e.moi, e.femme==null?"":e.femme]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(salData), "Budget_Salaires");

    const cmp = b.compare || {};
    const predefEntries = Object.entries(cmp.predefined || {}).sort((x,y)=>x[0].localeCompare(y[0]));
    const predefHeader = ["Clé","Groupe","Catégorie","Montant mensuel"];
    const predefData = [predefHeader].concat(predefEntries.map(([key, montant])=>{
      if(key.endsWith("::voyage")) return [key, key.slice(0, -"::voyage".length), "(Voyages)", montant];
      const parts = key.split("::cat::");
      return [key, parts[0]||"", parts.length>1?parts[1]:"", montant];
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(predefData), "Budget_Predefini");

    // Onglet Revenus (Moi / Ma femme) — lignes à plat (manuelles, récurrentes ou salaire synchronisé, plus
    // de regroupement par catégorie intermédiaire) dans l'ordre d'affichage, et montants des lignes
    // manuelles (les lignes "récurrent" et "salaire (budget)" ne stockent pas de montant : ils sont
    // recalculés depuis les transactions / Budget_Salaires à l'import) — deux onglets séparés (Lignes /
    // Montants, cardinalités différentes : une ligne par ligne définie vs une ligne par mois renseigné)
    // plutôt qu'un seul onglet à colonnes dupliquées (Personne/Catégorie/Ligne identiques dans les deux
    // blocs), qui serait fragile à l'édition manuelle dans Excel (insertion/suppression de colonne, tri)
    // et ambigu pour Excel/tableur lui-même (en-têtes en double) — période/filtre groupes de l'ex-onglet
    // "Revenus_Reglages" supprimés : gérés uniquement via la sauvegarde JSON / synchro Gist désormais.
    const revData = (window.__SF_REVENUS && window.__SF_REVENUS.buildParamsPayloadPart()) || null;
    const revTypeLabel = {manual:"Manuel", recurring:"Récurrent", budgetSalary:"Salaire (Budget)"};
    // Colonne "Catégorie" conservée uniquement pour porter les sentinelles de transfert (compatibilité avec
    // le format antérieur à la suppression du niveau "Catégorie", cf. parseParametresSheet) — vide pour une
    // ligne normale, qui n'appartient plus à aucun regroupement.
    const REV_TRANSFER_OUT_SENTINEL = "(Transfert - vers)";
    const REV_TRANSFER_IN_SENTINEL = "(Transfert - depuis)";
    const revLinesRows = [];
    const revMontantsRows = [];
    function exportRevLine(label, categorieCol, line){
      revLinesRows.push([label, categorieCol, line.label, revTypeLabel[line.type]||"Manuel",
        line.type==="recurring" ? (line.recurCategorie||"") : "", line.sign===-1 ? "-1" : "1"]);
      if(line.type==="manual"){
        Object.entries(line.values||{}).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([mois,montant])=>{
          revMontantsRows.push([label, categorieCol, line.label, mois, montant]);
        });
      }
    }
    [["moi","Moi"],["conjoint","Ma femme"]].forEach(([key,label])=>{
      const p = (revData && revData[key]) || {};
      (p.lines||[]).forEach(line=> exportRevLine(label, "", line));
      (p.transferOut||[]).forEach(line=> exportRevLine(label, REV_TRANSFER_OUT_SENTINEL, line));
      (p.transferIn||[]).forEach(line=> exportRevLine(label, REV_TRANSFER_IN_SENTINEL, line));
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Personne","Catégorie","Ligne","Type","Catégorie récurrente","Signe"], ...revLinesRows]), "Revenus_Lignes");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Personne","Catégorie","Ligne","Mois","Montant"], ...revMontantsRows]), "Revenus_Montants");
  }

  if(scope.sante && window.__SF_SANTE_DATA && window.__SF_SANTE_DATA.buildSanteExportRows && Store.santeItems.length){
    const s = window.__SF_SANTE_DATA.buildSanteExportRows();
    const sData = [s.header, ...s.rows];
    const wsSante = XLSX.utils.aoa_to_sheet(sData, {cellDates:true});
    s.dateCols.forEach(col=> setColumnDateFormatDDMMYYYY(wsSante, col, 1, sData.length-1));
    XLSX.utils.book_append_sheet(wb, wsSante, "Santé");
  }

  const parts = [];
  if(scope.transactions) parts.push("transactions");
  if(scope.params) parts.push("parametres");
  if(scope.sante) parts.push("sante");
  const suffix = parts.length===3 ? "" : "_"+parts.join("_");
  const stamp = U.toISO(new Date());
  XLSX.writeFile(wb, "suivi_financier"+suffix+"_"+stamp+".xlsx");
  APP.showToast("Export Excel généré");
}

/* ================= SYNCHRONISATION (GitHub Gist) ================= */
(function(){
"use strict";
const U = window.__SF_UTILS;
const Store = window.__SF_STORE;
const APP = window.__SF_APP;
const ICONS = U.ICONS;

let syncing = false;
let lastError = null;

function getConfig(){ return Store.settings.sync || {}; }
/* "Configuré" = jeton présent. L'ID du Gist est optionnel : s'il manque, le premier
   "Sauvegarder" crée automatiquement un nouveau Gist secret et mémorise son ID. */
function isConfigured(){ return !!(getConfig().token); }

function saveConfig(token, gistId){
  Store.settings.sync = Object.assign({}, Store.settings.sync, {token: token.trim(), gistId: (gistId||"").trim()});
  Store.saveSettings();
}

/* Construit le même payload que la sauvegarde .json (§ exportBackup), sans le champ exportedAt
   dans le calcul de hash (il change à chaque appel et ne reflète pas un changement de données). */
function buildSyncPayload(){
  return {
    version: 2,
    exportedAt: new Date().toISOString(),
    transactions: Store.transactions.map(t=>({...t, date:t.date.toISOString()})),
    params: window.__SF_MENU.buildParamsPayload(),
    santeItems: Store.santeItems.slice(),
    santeSettings: Store.settings.sante
  };
}
function hashPayload(payload){
  const str = JSON.stringify(payload.transactions) + "|" + JSON.stringify(payload.params)
    + "|" + JSON.stringify(payload.santeItems||[]) + "|" + JSON.stringify(payload.santeSettings||{});
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i))|0; }
  return String(h);
}

/* "unconfigured" | "syncing" | "error" | "synced" | "unsynced" */
function computeStatus(){
  if(syncing) return "syncing";
  const c = getConfig();
  if(!c.token) return "unconfigured";
  if(lastError) return "error";
  if(!c.gistId || !c.lastSyncedHash) return "unsynced";
  return hashPayload(buildSyncPayload())===c.lastSyncedHash ? "synced" : "unsynced";
}

async function fetchRemotePayload(c){
  const res = await fetch("https://api.github.com/gists/"+encodeURIComponent(c.gistId), {
    headers: {"Authorization": "token "+c.token, "Accept": "application/vnd.github+json"}
  });
  if(!res.ok) throw new Error("Erreur GitHub (" + res.status + ")");
  const data = await res.json();
  const fname = c.filename || "suivi_financier_sync.json";
  const files = data.files || {};
  const file = files[fname] || Object.values(files)[0];
  if(!file) throw new Error("Aucun fichier trouvé dans ce Gist");
  let content = file.content;
  if(file.truncated) content = await fetch(file.raw_url).then(r=>r.text());
  return JSON.parse(content);
}

/* Envoie un payload donné vers le Gist (création si aucun gistId encore connu, sinon mise à jour).
   Met à jour Store.settings.sync (gistId/lastSyncedAt/lastSyncedHash) sur succès. Ne gère ni
   `syncing` ni les toasts — laissé aux appelants (pushToGist, smartSync, résolution de conflit). */
async function pushPayloadToGist(c, payload, hash){
  const filename = c.filename || "suivi_financier_sync.json";
  const creating = !c.gistId;
  const res = creating
    ? await fetch("https://api.github.com/gists", {
        method: "POST",
        headers: {
          "Authorization": "token "+c.token,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          description: "Suivi financier — sauvegarde synchronisée",
          public: false,
          files: {[filename]: {content: JSON.stringify(payload)}}
        })
      })
    : await fetch("https://api.github.com/gists/"+encodeURIComponent(c.gistId), {
        method: "PATCH",
        headers: {
          "Authorization": "token "+c.token,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({files: {[filename]: {content: JSON.stringify(payload)}}})
      });
  if(!res.ok){
    const txt = await res.text().catch(()=>"");
    throw new Error("Erreur GitHub (" + res.status + ")" + (txt ? " : " + txt.slice(0,200) : ""));
  }
  const data = await res.json();
  Store.settings.sync = Object.assign({}, Store.settings.sync, {
    gistId: creating ? data.id : c.gistId,
    lastSyncedAt: new Date().toISOString(),
    lastSyncedHash: hash
  });
  Store.saveSettings();
  return creating;
}

/* Remplace les transactions/paramètres locaux par ceux d'un payload distant déjà récupéré.
   Ne gère ni la sauvegarde IndexedDB (Store.saveTransactions), ni lastSyncedHash/At, ni le
   rafraîchissement d'écran — laissé aux appelants. */
function applyRemotePayloadLocally(payload){
  const txns = (payload.transactions||[]).map(t=>({...t, date:new Date(t.date)})).filter(t=>t.date && !isNaN(t.date));
  window.__SF_DATA.importTxns(txns, "replace");
  if(payload.params) window.__SF_IMPORT.applyParamsImport(payload.params, "replace");
  // Onglet Santé : miroir complet comme pour les transactions (remplacement, pas de fusion —
  // cohérent avec le fonctionnement "replace" de la synchro Gist pour le reste des données).
  if(payload.santeItems) Store.santeItems = payload.santeItems.slice();
  if(payload.santeSettings) Store.settings.sante = payload.santeSettings;
  Store.normalizeSettings();
}

/* Sauvegarde FORCÉE vers le Gist (écrase le contenu distant avec l'état local actuel, quel que
   soit ce qu'il contenait). Utilisée par le bouton "Forcer la sauvegarde" et en résolution de
   conflit ; crée le Gist si aucun gistId n'est encore connu. */
async function pushToGist(){
  const c = getConfig();
  if(!c.token){ openSyncSheet(); return; }
  syncing = true; lastError = null; updateIndicator();
  try{
    const payload = buildSyncPayload();
    const hash = hashPayload(payload);
    const creating = await pushPayloadToGist(c, payload, hash);
    APP.showToast(creating ? "Gist créé et sauvegardé" : "Sauvegardé sur GitHub Gist");
  }catch(e){
    lastError = (e && e.message) ? e.message : String(e);
    APP.showToast("Échec de la sauvegarde : " + lastError);
  }finally{
    syncing = false;
    updateIndicator();
  }
}

/* Récupération FORCÉE depuis le Gist (écrase les données locales, quelles qu'elles soient).
   Utilisée par le bouton "Forcer la récupération" (après confirmation) et en résolution de conflit. */
async function pullFromGist(){
  const c = getConfig();
  if(!c.token || !c.gistId){ openSyncSheet(); return; }
  syncing = true; lastError = null; updateIndicator();
  try{
    const payload = await fetchRemotePayload(c);
    applyRemotePayloadLocally(payload);
    const newHash = hashPayload(buildSyncPayload());
    Store.settings.sync = Object.assign({}, Store.settings.sync, {lastSyncedAt: new Date().toISOString(), lastSyncedHash: newHash});
    Store.saveSettings();
    await Store.saveTransactions();
    await Store.saveSanteItems();
    APP.refreshCurrentTab();
    APP.showToast("Données récupérées depuis GitHub Gist");
  }catch(e){
    lastError = (e && e.message) ? e.message : String(e);
    APP.showToast("Échec de la récupération : " + lastError);
  }finally{
    syncing = false;
    updateIndicator();
  }
}

/* Synchronisation dans les deux sens (action de l'indicateur en haut et bouton principal de
   la feuille Synchronisation). Compare le hash local actuel, le hash distant, et le hash mémorisé
   lors de la dernière synchronisation réussie (`lastSyncedHash`) pour déterminer sans ambiguïté
   quel côté a changé :
   - seul le distant a changé depuis la dernière synchro → récupère automatiquement (le local n'a
     rien à perdre, rien n'a été modifié ici) ;
   - seul le local a changé → sauvegarde automatiquement (le distant n'a rien à perdre) ;
   - les deux ont changé indépendamment (ou identiques) → pas de fusion automatique possible avec
     un simple hash global : demande explicitement à l'utilisateur lequel garder. */
async function smartSync(){
  const c = getConfig();
  if(!c.token){ openSyncSheet(); return; }
  if(!c.gistId){ await pushToGist(); return; }
  syncing = true; lastError = null; updateIndicator();
  try{
    const localPayload = buildSyncPayload();
    const localHash = hashPayload(localPayload);
    const remotePayload = await fetchRemotePayload(c);
    const remoteHash = hashPayload(remotePayload);
    const lastHash = c.lastSyncedHash;

    if(remoteHash === localHash){
      Store.settings.sync = Object.assign({}, Store.settings.sync, {lastSyncedAt: new Date().toISOString(), lastSyncedHash: localHash});
      Store.saveSettings();
      APP.showToast("Déjà à jour");
      return;
    }
    const localChanged = localHash !== lastHash;
    const remoteChanged = remoteHash !== lastHash;
    if(remoteChanged && !localChanged){
      applyRemotePayloadLocally(remotePayload);
      const newHash = hashPayload(buildSyncPayload());
      Store.settings.sync = Object.assign({}, Store.settings.sync, {lastSyncedAt: new Date().toISOString(), lastSyncedHash: newHash});
      Store.saveSettings();
      await Store.saveTransactions();
      await Store.saveSanteItems();
      APP.refreshCurrentTab();
      APP.showToast("Données récupérées depuis GitHub Gist");
      return;
    }
    if(localChanged && !remoteChanged){
      await pushPayloadToGist(c, localPayload, localHash);
      APP.showToast("Sauvegardé sur GitHub Gist");
      return;
    }
    // Modifications des deux côtés (ou état de référence inconnu) : demander à l'utilisateur.
    showConflictModal(c, localPayload, localHash, remotePayload);
  }catch(e){
    lastError = (e && e.message) ? e.message : String(e);
    APP.showToast("Échec de la synchronisation : " + lastError);
  }finally{
    syncing = false;
    updateIndicator();
  }
}

function showConflictModal(c, localPayload, localHash, remotePayload){
  const modal = document.getElementById("modal-confirm");
  const rd = remotePayload.exportedAt ? new Date(remotePayload.exportedAt) : null;
  const remoteTxt = rd ? (U.fmtDateShort(rd)+" à "+U.pad2(rd.getHours())+":"+U.pad2(rd.getMinutes())) : "date inconnue";
  modal.innerHTML = `
    <h3 class="u-title-md">Modifications des deux côtés</h3>
    <p class="u-desc">Cet appareil et le Gist ont chacun des changements depuis la dernière synchronisation (dernière écriture du Gist : ${remoteTxt}). Choisissez lequel garder — l'autre sera écrasé.</p>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <button class="btn btn-primary btn-block" id="conflict-keep-local">Garder cet appareil</button>
      <button class="btn btn-ghost btn-block" id="conflict-keep-remote">Utiliser le Gist</button>
      <button class="btn btn-ghost btn-block" id="conflict-cancel">Annuler</button>
    </div>
  `;
  document.getElementById("conflict-cancel").onclick = ()=>APP.closeOverlay("overlay-confirm");
  document.getElementById("conflict-keep-local").onclick = async ()=>{
    APP.closeOverlay("overlay-confirm");
    syncing = true; lastError = null; updateIndicator();
    try{
      await pushPayloadToGist(c, localPayload, localHash);
      APP.showToast("Sauvegardé sur GitHub Gist (a écrasé le Gist)");
    }catch(e){
      lastError = (e && e.message) ? e.message : String(e);
      APP.showToast("Échec de la sauvegarde : " + lastError);
    }finally{
      syncing = false; updateIndicator();
    }
  };
  document.getElementById("conflict-keep-remote").onclick = async ()=>{
    APP.closeOverlay("overlay-confirm");
    syncing = true; lastError = null; updateIndicator();
    try{
      applyRemotePayloadLocally(remotePayload);
      const newHash = hashPayload(buildSyncPayload());
      Store.settings.sync = Object.assign({}, Store.settings.sync, {lastSyncedAt: new Date().toISOString(), lastSyncedHash: newHash});
      Store.saveSettings();
      await Store.saveTransactions();
      await Store.saveSanteItems();
      APP.refreshCurrentTab();
      APP.showToast("Données récupérées depuis GitHub Gist (a écrasé cet appareil)");
    }catch(e){
      lastError = (e && e.message) ? e.message : String(e);
      APP.showToast("Échec de la récupération : " + lastError);
    }finally{
      syncing = false; updateIndicator();
    }
  };
  APP.openOverlay("overlay-confirm");
}

function updateIndicator(){
  const btn = document.getElementById("btn-sync");
  if(!btn) return;
  const st = computeStatus();
  const configured = isConfigured();
  let icon, color, title;
  if(st==="syncing"){ icon=ICONS.refreshCw; color="var(--text-sub)"; title="Synchronisation en cours…"; }
  else if(st==="unconfigured"){ icon=ICONS.cloud; color="var(--text-faint)"; title="Configurer la synchronisation"; }
  else if(st==="synced"){ icon=ICONS.cloudCheck; color="var(--income)"; title="Synchronisé — appuyez pour vérifier les mises à jour"; }
  else if(st==="error"){ icon=ICONS.alertTriangle; color="var(--expense)"; title="Échec — appuyez pour réessayer"; }
  else { icon=ICONS.alertTriangle; color="var(--expense)"; title="Non synchronisé — appuyez pour synchroniser"; }
  btn.innerHTML = icon;
  btn.style.color = color;
  btn.classList.toggle("sync-spin", st==="syncing");
  btn.title = title;
  btn.onclick = ()=>{
    if(st==="syncing") return;
    if(!configured){ openSyncSheet(); return; }
    smartSync();
  };
}

/* ================= Générateur générique : gestion des alias (groupes / personnes) ================= */
function createAliasManager(cfg){
  const U = window.__SF_UTILS;
  const Store = window.__SF_STORE;
  const AGG = window.__SF_AGG;
  const APP = window.__SF_APP;
  const ICONS = U.ICONS;

  let view = "list"; // "list" | "edit" | "bulk"
  let editingBase = null;
  let editingFull = null;
  let searchTerm = "";
  let selectMode = false;
  let selected = new Set();

  function rules(){ return Store.settings[cfg.settingsKey] || []; }
  function rulesForBase(base){ return rules().filter(r=>r[cfg.baseField]===base); }
  function existingSuperNames(){
    return Array.from(new Set(rules().map(r=>r[cfg.superField]))).sort((a,b)=>a.localeCompare(b,'fr'));
  }
  function existingBaseNames(){
    return cfg.distinctBaseFn(Store.transactions).map(b=>b.base).sort((a,b)=>a.localeCompare(b,'fr'));
  }
  /* Règles devenues obsolètes : le groupe/la personne visé·e n'apparaît plus dans aucune transaction
     actuelle (transactions supprimées, ou libellé renommé lors d'un ré-import). Une règle "base" est
     obsolète si son nom de base ne figure plus parmi existingBaseNames() ; une règle `full` (occurrence
     datée précise, groupes uniquement) est obsolète si son libellé complet exact n'apparaît plus. */
  function obsoleteRules(){
    const bases = new Set(existingBaseNames());
    const fulls = cfg.hasDates ? new Set(AGG.distinctFullGroupes(Store.transactions).map(f=>f.full)) : null;
    return rules().filter(r=> r.full ? (fulls && !fulls.has(r.full)) : !bases.has(r[cfg.baseField]));
  }
  /* Identifiant réel utilisé pour les règles (nom de base, sans le suffixe de date entre parenthèses) —
     l'affichage, lui, montre toujours le libellé complet (avec la date) tel que fourni par hierarchyFn. */
  function trueBase(val){ return U.baseGroupe(val); }

  function kindIconHtml(base){
    if(!cfg.showKind) return "";
    const kind = AGG.getGroupKind(base);
    const icon = (kind==="voyage" ? ICONS.plane : ICONS.home).replace('<svg ', '<svg style="width:14px;height:14px;" ');
    const title = kind==="voyage" ? "Voyage" : "Vie quotidienne";
    return `<span title="${title}" style="display:inline-flex;align-items:center;margin-right:7px;color:var(--text-faint);vertical-align:-3px;">${icon}</span>`;
  }

  function childRowHtml(b){
    const realBase = trueBase(b.base);
    const isSel = selected.has(realBase);
    if(selectMode){
      return `<div class="check-item groupe-child-item ${isSel?'selected':''}" data-sel="${U.escHtml(realBase)}" style="cursor:pointer;">
        <span class="cbox">${ICONS.check}</span>
        <span class="lbl">${kindIconHtml(b.base)}${U.escHtml(b.base)} <span class="cnt" style="margin-left:6px;">${b.count}</span></span>
      </div>`;
    }
    return `<div class="check-item groupe-child-item" data-base="${U.escHtml(realBase)}" data-full="${U.escHtml(b.base)}" style="cursor:pointer;">
      <span class="lbl">${kindIconHtml(b.base)}${U.escHtml(b.base)} <span class="cnt" style="margin-left:6px;">${b.count}</span></span>
      <span class="u-faint-fixed">${ICONS.arrowLeft.replace('<svg ','<svg style="transform:rotate(180deg);width:16px;height:16px;" ')}</span>
    </div>`;
  }

  function flatRowHtml(b){
    const realBase = trueBase(b.base);
    const isSel = selected.has(realBase);
    if(selectMode){
      return `<div class="check-item ${isSel?'selected':''}" data-sel="${U.escHtml(realBase)}" style="cursor:pointer;">
        <span class="cbox">${ICONS.check}</span>
        <span class="lbl">${kindIconHtml(b.base)}${U.escHtml(b.base)} <span class="cnt" style="margin-left:6px;">${b.count}</span></span>
      </div>`;
    }
    return `<div class="check-item" data-base="${U.escHtml(realBase)}" data-full="${U.escHtml(b.base)}" style="cursor:pointer;">
      <span class="lbl">${kindIconHtml(b.base)}${U.escHtml(b.base)} <span class="cnt" style="margin-left:6px;">${b.count}</span></span>
    </div>`;
  }

  let openSections = new Set();

  function renderList(){
    const sheet = document.getElementById(cfg.sheetId);
    const prevBody = sheet.querySelector(".sheet-body");
    const prevScroll = prevBody ? prevBody.scrollTop : 0;
    sheet.querySelectorAll("details[data-sup]").forEach(d=>{
      if(d.open) openSections.add(d.dataset.sup); else openSections.delete(d.dataset.sup);
    });
    const {sections, flat} = cfg.hierarchyFn(Store.transactions);
    const q = U.normalize(searchTerm);
    const sectionNames = Array.from(sections.keys()).sort((a,b)=>a.localeCompare(b,'fr'));

    let sectionsHtml = sectionNames.map(sup=>{
      const children = sections.get(sup).filter(b=> !q || U.normalize(b.base).includes(q) || U.normalize(sup).includes(q));
      if(q && children.length===0) return "";
      const totalCount = sections.get(sup).reduce((s,c)=>s+c.count,0);
      const isOpen = openSections.has(sup) || (!!q && children.length>0);
      return `<details class="card" data-sup="${U.escHtml(sup)}" style="padding:0;margin-bottom:10px;" ${isOpen?'open':''}>
        <summary style="list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;">
          <span style="font-weight:800;font-size:14.5px;flex:1;">${U.escHtml(sup)}</span>
          <span style="color:var(--text-sub);font-size:12.5px;">${sections.get(sup).length} · ${totalCount}</span>
        </summary>
        <div style="padding:0 12px 12px;">${sections.get(sup).map(childRowHtml).join("")}</div>
      </details>`;
    }).join("");

    const flatFiltered = flat.filter(b=> !q || U.normalize(b.base).includes(q)).sort((a,b)=>a.base.localeCompare(b.base,'fr'));
    const obsolete = obsoleteRules();

    sheet.innerHTML = `
      <div class="sheet-handle"></div>
      <div class="sheet-head"><h2>${cfg.title}</h2><button class="icon-btn" id="am-close">${ICONS.close}</button></div>
      <div class="sheet-body">
        <div class="u-desc-sm">${cfg.helpText}</div>
        ${obsolete.length ? `<button class="btn btn-ghost btn-block" id="am-clean-obsolete" style="margin-bottom:12px;color:var(--expense);">${ICONS.trash} ${obsolete.length} règle${obsolete.length>1?"s":""} obsolète${obsolete.length>1?"s":""} · Nettoyer</button>` : ""}
        <div style="display:flex;gap:8px;margin-bottom:10px;">
          <input type="text" class="search-mini" id="am-search" style="margin-bottom:0;flex:1;" placeholder="Rechercher ${cfg.itemLabel}…" value="${U.escHtml(searchTerm)}">
          ${cfg.hasDates ? "" : `<button class="btn btn-ghost btn-sm" id="am-selectmode-btn" style="white-space:nowrap;">${selectMode ? "Terminer" : "Sélectionner"}</button>`}
        </div>
        ${sectionsHtml ? `<div class="field-label" style="margin-top:4px;">${cfg.superLabel.charAt(0).toUpperCase()+cfg.superLabel.slice(1)}s</div>${sectionsHtml}` : ""}
        <div class="field-label" style="margin-top:4px;">${sectionsHtml ? "Non classés" : "Tous les "+cfg.itemLabelPlural}</div>
        <div class="check-list" style="max-height:none;">
          ${flatFiltered.map(flatRowHtml).join("") || `<div style="padding:14px;color:var(--text-faint);font-size:13px;">Aucun élément non classé</div>`}
        </div>
        ${selectMode ? `<div style="height:70px;"></div>` : ""}
      </div>
      ${selectMode && selected.size>0 ? `
      <div class="sheet-foot">
        <button class="btn btn-ghost" id="am-clear-sel">${selected.size} sélectionné${selected.size>1?"s":""} · Effacer</button>
        <button class="btn btn-primary" id="am-bulk-move">Déplacer vers…</button>
      </div>` : ""}
    `;
    sheet.querySelector("#am-close").onclick = ()=>APP.closeOverlay(cfg.overlayId);
    const cleanBtn = sheet.querySelector("#am-clean-obsolete");
    if(cleanBtn) cleanBtn.onclick = ()=>{
      const n = obsolete.length;
      const shown = obsolete.slice(0,10);
      const list = shown.map(r=>"• "+(r.full||r[cfg.baseField])+" → "+r[cfg.superField]).join("\n");
      const more = n>shown.length ? "\n… et "+(n-shown.length)+" de plus" : "";
      APP.confirmAction({
        title:"Supprimer "+n+" règle"+(n>1?"s":"")+" obsolète"+(n>1?"s":"")+" ?",
        text:"Ces règles concernent des "+cfg.itemLabelPlural+" qui n'apparaissent plus dans vos transactions actuelles :\n"+list+more,
        confirmLabel:"Supprimer",
        onConfirm:()=>{
          const stillObsolete = new Set(obsoleteRules());
          Store.settings[cfg.settingsKey] = rules().filter(r=>!stillObsolete.has(r));
          Store.saveSettings();
          APP.showToast(n+" règle"+(n>1?"s supprimées":" supprimée"));
          renderList();
        }
      });
    };
    sheet.querySelector("#am-search").oninput = (e)=>{ searchTerm = e.target.value; renderList(); };
    const selModeBtn = sheet.querySelector("#am-selectmode-btn");
    if(selModeBtn) selModeBtn.onclick = ()=>{
      selectMode = !selectMode;
      if(!selectMode) selected.clear();
      renderList();
    };
    if(selectMode && !cfg.hasDates){
      sheet.querySelectorAll("[data-sel]").forEach(el=>{
        el.onclick = ()=>{
          const base = el.dataset.sel;
          if(selected.has(base)) selected.delete(base); else selected.add(base);
          renderList();
        };
      });
      const clearBtn = sheet.querySelector("#am-clear-sel");
      if(clearBtn) clearBtn.onclick = ()=>{ selected.clear(); renderList(); };
      const moveBtn = sheet.querySelector("#am-bulk-move");
      if(moveBtn) moveBtn.onclick = ()=>{ view="bulk"; renderBulk(); };
    } else {
      sheet.querySelectorAll("[data-base]").forEach(el=>{
        el.onclick = ()=>{ editingBase = el.dataset.base; editingFull = cfg.hasDates ? (el.dataset.full || null) : null; view="edit"; renderEdit(); };
      });
    }
    const newBody = sheet.querySelector(".sheet-body");
    if(newBody) newBody.scrollTop = prevScroll;
  }

  /* ---- Déplacement groupé : applique un même groupe de groupe / groupe de personnes à plusieurs éléments sélectionnés ---- */
  function renderBulk(){
    const sheet = document.getElementById(cfg.sheetId);
    const items = Array.from(selected).sort((a,b)=>a.localeCompare(b,'fr'));
    sheet.innerHTML = `
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <button class="icon-btn" id="am-back">${ICONS.arrowLeft}</button>
        <h2 style="flex:1;text-align:center;">Déplacer ${items.length} élément${items.length>1?"s":""}</h2>
        <button class="icon-btn" id="am-close">${ICONS.close}</button>
      </div>
      <div class="sheet-body">
        <div class="field-label" style="margin-top:0;">Éléments sélectionnés</div>
        <div class="chiprow" style="margin-bottom:18px;">
          ${items.map(b=>`<span class="chip-opt" style="cursor:default;">${U.escHtml(b)}</span>`).join("")}
        </div>
        <div class="field-label" style="margin-top:0;">Nom du ${cfg.superLabel}</div>
        ${datalistsHtml()}
        <input type="text" class="search-mini" id="am-bulk-super" list="am-super-list-${cfg.sheetId}" placeholder="Nom du ${cfg.superLabel}">
        <div style="font-size:12px;color:var(--text-sub);margin-top:14px;line-height:1.4;">
          Cette action remplace les règles existantes des éléments sélectionnés par cette nouvelle affectation.
        </div>
      </div>
      <div class="sheet-foot">
        <button class="btn btn-ghost" id="am-bulk-cancel">Annuler</button>
        <button class="btn btn-primary" id="am-bulk-apply">Appliquer</button>
      </div>
    `;
    sheet.querySelector("#am-close").onclick = ()=>APP.closeOverlay(cfg.overlayId);
    sheet.querySelector("#am-back").onclick = ()=>{ view="list"; renderList(); };
    sheet.querySelector("#am-bulk-cancel").onclick = ()=>{ view="list"; renderList(); };
    sheet.querySelector("#am-bulk-apply").onclick = ()=>{
      const sg = sheet.querySelector("#am-bulk-super").value.trim();
      if(!sg){ APP.showToast("Merci d'indiquer un nom de "+cfg.superLabel); return; }
      const selectedSet = new Set(items);
      const others = rules().filter(r=> !selectedSet.has(r[cfg.baseField]));
      const newRules = items.map(base=>({[cfg.baseField]:base, [cfg.superField]:sg}));
      Store.settings[cfg.settingsKey] = others.concat(newRules);
      Store.saveSettings();
      APP.showToast(items.length+" élément"+(items.length>1?"s déplacés":" déplacé")+" vers « "+sg+" »");
      selected.clear();
      selectMode = false;
      view="list"; renderList();
    };
  }

  function datalistsHtml(){
    return `<datalist id="am-super-list-${cfg.sheetId}">${existingSuperNames().map(n=>`<option value="${U.escHtml(n)}">`).join("")}</datalist>`;
  }

  function kindSectionHtml(){
    if(!cfg.showKind) return "";
    const key = editingFull || editingBase;
    const kind = AGG.getGroupKind(key);
    const voyMonth = AGG.getGroupVoyageMonth(key) || "";
    return `
      <div class="field-label" style="margin-top:0;">Type de groupe (utilisé par l'onglet Budget)</div>
      <div class="seg" id="am-kind-seg" style="margin-bottom:${kind==='voyage'?'10px':'18px'};">
        <button data-k="quotidien" class="${kind==='quotidien'?'active':''}">Vie quotidienne</button>
        <button data-k="voyage" class="${kind==='voyage'?'active':''}">Voyage</button>
      </div>
      <div id="am-voymonth-wrap" style="display:${kind==='voyage'?'block':'none'};margin-bottom:18px;">
        <div style="font-size:12.5px;color:var(--text-sub);margin-bottom:6px;line-height:1.4;">Mois auquel affecter les dépenses de ce groupe dans le budget (sinon le mois réel de chaque dépense est utilisé).</div>
        <input type="month" class="search-mini" id="am-voymonth-input" value="${U.escHtml(voyMonth)}">
      </div>
    `;
  }
  function wireKindSection(){
    if(!cfg.showKind) return;
    document.querySelectorAll("#am-kind-seg button").forEach(b=>{
      b.onclick = ()=>{
        document.querySelectorAll("#am-kind-seg button").forEach(x=>x.classList.remove("active"));
        b.classList.add("active");
        document.getElementById("am-voymonth-wrap").style.display = b.dataset.k==="voyage" ? "block" : "none";
      };
    });
  }
  function saveKindSection(){
    if(!cfg.showKind) return;
    const key = editingFull || editingBase;
    const active = document.querySelector("#am-kind-seg button.active");
    const kind = active ? active.dataset.k : "quotidien";
    Store.settings.groupKind = Store.settings.groupKind || {};
    Store.settings.groupVoyageMonth = Store.settings.groupVoyageMonth || {};
    if(kind==="voyage"){
      Store.settings.groupKind[key] = "voyage";
      const m = document.getElementById("am-voymonth-input").value || null;
      if(m) Store.settings.groupVoyageMonth[key] = m; else delete Store.settings.groupVoyageMonth[key];
    } else {
      delete Store.settings.groupKind[key];
      delete Store.settings.groupVoyageMonth[key];
    }
  }

  /* ---- Dates de début/fin d'un groupe (tous types confondus) : nombre de jours + moyennes/jour ---- */
  function dayStatsPreview(key, dateFrom, dateTo){
    if(!dateFrom || !dateTo) return null;
    const from = new Date(dateFrom+"T00:00:00");
    const to = new Date(dateTo+"T00:00:00");
    const days = Math.round((to-from)/86400000) + 1;
    if(days<=0) return null;
    let income=0, expense=0;
    Store.transactions.forEach(t=>{
      if(t.type==="Transfer") return;
      if(t.groupe !== key) return;
      if(t.type==="Income") income += t.montant; else expense += t.montant;
    });
    return {days, income, expense, total: income+expense,
      incomePerDay: income/days, expensePerDay: expense/days, totalPerDay: (income+expense)/days};
  }
  function dayStatsHtml(stats){
    if(!stats) return `<div style="font-size:12px;color:var(--text-faint);">Renseignez les deux dates pour voir le nombre de jours et les moyennes.</div>`;
    return `<div class="card" style="box-shadow:none;background:var(--card-alt);padding:4px 14px;">
      <div class="detail-row"><span>Nombre de jours</span><span>${stats.days}</span></div>
      <div class="detail-row"><span>Revenus / jour</span><span style="color:var(--income);">${U.fmtMoney(stats.incomePerDay)}</span></div>
      <div class="detail-row"><span>Dépenses / jour</span><span style="color:var(--expense);">${U.fmtMoney(Math.abs(stats.expensePerDay))}</span></div>
      <div class="detail-row"><span>Total / jour</span><span style="color:${stats.totalPerDay<0?'var(--expense)':'var(--income)'}">${U.fmtMoneySigned(stats.totalPerDay)}</span></div>
    </div>`;
  }
  function dateRangeSectionHtml(){
    if(!cfg.showKind) return "";
    const key = editingFull || editingBase;
    const range = AGG.getGroupDateRange(key) || {};
    const isToday = range.dateTo === AGG.GROUP_DATE_TODAY_SENTINEL;
    const dateToDisplay = isToday ? AGG.resolveGroupDateToValue(range.dateTo) : (range.dateTo||"");
    const stats = dayStatsPreview(key, range.dateFrom||"", dateToDisplay);
    return `
      <div class="field-label" style="margin-top:0;">Dates de début et de fin</div>
      <div style="font-size:12.5px;color:var(--text-sub);margin-bottom:8px;line-height:1.4;">Disponibles pour tous les groupes. Utilisées pour calculer le nombre de jours et les moyennes par jour (dépenses, revenus, total).</div>
      <div class="daterange" style="margin-bottom:8px;">
        <input type="date" class="search-mini" id="am-daterange-from" value="${U.escHtml(range.dateFrom||'')}">
        <input type="date" class="search-mini" id="am-daterange-to" value="${U.escHtml(dateToDisplay)}" ${isToday?'disabled':''}>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-sub);margin-bottom:10px;cursor:pointer;">
        <input type="checkbox" id="am-datefin-today-toggle" ${isToday?'checked':''} style="width:17px;height:17px;flex:0 0 auto;">
        Date de fin dynamique — toujours aujourd'hui
      </label>
      <div id="am-daystats" style="margin-bottom:18px;">${dayStatsHtml(stats)}</div>
    `;
  }
  function wireDateRangeSection(){
    if(!cfg.showKind) return;
    const key = editingFull || editingBase;
    const fromEl = document.getElementById("am-daterange-from");
    const toEl = document.getElementById("am-daterange-to");
    const toggle = document.getElementById("am-datefin-today-toggle");
    const update = ()=>{
      const df = fromEl.value;
      const dt = toggle.checked ? AGG.resolveGroupDateToValue(AGG.GROUP_DATE_TODAY_SENTINEL) : toEl.value;
      const stats = dayStatsPreview(key, df, dt);
      document.getElementById("am-daystats").innerHTML = dayStatsHtml(stats);
    };
    if(fromEl) fromEl.onchange = update;
    if(toEl) toEl.onchange = update;
    if(toggle) toggle.onchange = ()=>{
      if(toggle.checked){
        toEl.value = AGG.resolveGroupDateToValue(AGG.GROUP_DATE_TODAY_SENTINEL);
        toEl.disabled = true;
      } else {
        toEl.disabled = false;
      }
      update();
    };
  }
  function saveDateRangeSection(){
    if(!cfg.showKind) return;
    const key = editingFull || editingBase;
    const df = document.getElementById("am-daterange-from").value || null;
    const toggle = document.getElementById("am-datefin-today-toggle");
    const dt = (toggle && toggle.checked) ? AGG.GROUP_DATE_TODAY_SENTINEL : (document.getElementById("am-daterange-to").value || null);
    Store.settings.groupDateRange = Store.settings.groupDateRange || {};
    if(df && dt) Store.settings.groupDateRange[key] = {dateFrom: df, dateTo: dt};
    else delete Store.settings.groupDateRange[key];
  }

  function renderEdit(){
    const sheet = document.getElementById(cfg.sheetId);
    const isDatedOccurrence = !!(cfg.hasDates && editingFull && editingFull !== editingBase);
    let range = null;
    if(isDatedOccurrence){
      const txns = Store.transactions.filter(t=>t.groupe===editingFull);
      if(txns.length){
        let min=txns[0].date, max=txns[0].date;
        txns.forEach(t=>{ if(t.date<min) min=t.date; if(t.date>max) max=t.date; });
        range = {from:U.toISO(min), to:U.toISO(max), sampleDate:min};
      }
    }
    const currentRule = cfg.hasDates ? AGG.findGroupAliasRule(editingBase, editingFull) : (rulesForBase(editingBase)[0]||null);
    const currentValue = currentRule ? (currentRule[cfg.superField]||"") : "";
    const currentIsGlobalOther = currentRule ? (isDatedOccurrence && !currentRule.full) : false;

    sheet.innerHTML = `
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <button class="icon-btn" id="am-back">${ICONS.arrowLeft}</button>
        <h2 style="flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${U.escHtml(editingFull || editingBase)}</h2>
        <button class="icon-btn" id="am-close">${ICONS.close}</button>
      </div>
      <div class="sheet-body">
        ${kindSectionHtml()}
        ${range ? `<div style="font-size:12px;color:var(--text-sub);margin-bottom:14px;line-height:1.4;">Ce groupe couvre les transactions du ${U.fmtDateShort(new Date(range.from))} au ${U.fmtDateShort(new Date(range.to))}.</div>` : ""}
        <div class="field-label" style="margin-top:0;">${cfg.superLabel.charAt(0).toUpperCase()+cfg.superLabel.slice(1)}</div>
        ${datalistsHtml()}
        <input type="text" class="search-mini" id="am-super-input" list="am-super-list-${cfg.sheetId}" placeholder="Nom du ${cfg.superLabel}" value="${U.escHtml(currentValue)}" style="margin-bottom:6px;">
        ${currentRule && currentIsGlobalOther ? `<div style="font-size:12px;color:var(--text-sub);margin-bottom:12px;line-height:1.4;">Actuellement rattaché via une ancienne règle qui s'applique à toutes les périodes de « ${U.escHtml(editingBase)} » (importée avant cette version). Enregistrer ici crée une règle spécifique à cette occurrence uniquement, sans toucher à l'ancienne règle ni aux autres occurrences.</div>` : ""}
        ${dateRangeSectionHtml()}
      </div>
      <div class="sheet-foot">
        <button class="btn btn-ghost" id="am-cancel">Annuler</button>
        <button class="btn btn-primary" id="am-save">Enregistrer</button>
      </div>
    `;
    sheet.querySelector("#am-close").onclick = ()=>APP.closeOverlay(cfg.overlayId);
    sheet.querySelector("#am-back").onclick = ()=>{ view="list"; renderList(); };
    sheet.querySelector("#am-cancel").onclick = ()=>{ view="list"; renderList(); };
    wireKindSection();
    wireDateRangeSection();
    sheet.querySelector("#am-save").onclick = ()=>{
      const sg = sheet.querySelector("#am-super-input").value.trim();
      const all = rules();
      const keepOthers = all.filter(r=>{
        if(!cfg.hasDates) return r[cfg.baseField] !== editingBase;
        if(isDatedOccurrence){
          // Occurrence datée : on ne retire que l'éventuelle règle EXACTE déjà existante pour cette
          // occurrence précise (comparaison stricte sur le libellé complet) — jamais une règle base
          // générique, même si elle s'applique aussi à ce nom de base, pour ne jamais affecter une autre
          // occurrence du même nom de base.
          return r.full !== editingFull;
        }
        // Occurrence sans suffixe de date : règle globale classique par nom de base (comportement inchangé).
        return !(r[cfg.baseField]===editingBase && !r.full);
      });
      if(sg){
        const entry = {[cfg.baseField]: editingBase, [cfg.superField]: sg};
        if(cfg.hasDates && isDatedOccurrence) entry.full = editingFull;
        keepOthers.push(entry);
      }
      Store.settings[cfg.settingsKey] = keepOthers;
      saveKindSection();
      saveDateRangeSection();
      Store.saveSettings();
      APP.showToast("Mis à jour");
      view="list"; renderList();
    };
  }

  function render(){
    if(view==="edit") renderEdit();
    else if(view==="bulk") renderBulk();
    else renderList();
  }

  function open(){
    view="list"; searchTerm=""; selectMode=false; selected.clear(); openSections.clear(); editingBase=null; editingFull=null;
    renderList();
    APP.openOverlay(cfg.overlayId);
  }
  return {open};
}

(function(){
"use strict";
const U = window.__SF_UTILS;
const Store = window.__SF_STORE;
const AGG = window.__SF_AGG;
const APP = window.__SF_APP;
const ICONS = U.ICONS;

function distinctAccountTypeValues(){
  const set = new Set(["Courant","Épargne"]);
  Object.values(Store.settings.accountTypes||{}).forEach(v=>{ if(v) set.add(v); });
  return Array.from(set);
}

function renderAcctType(){
  const sheet = document.getElementById("sheet-accttype");
  const comptes = AGG.distinctValues(Store.transactions, "compte");
  const typeOptions = distinctAccountTypeValues();
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h2>Types de compte</h2><button class="icon-btn" id="at-close">${ICONS.close}</button></div>
    <div class="sheet-body">
      <div class="u-desc-sm">
        Indiquez le type de chaque compte (Courant, Épargne, ou un autre type de votre choix) — utilisé pour regrouper vos comptes dans les listes — ainsi qu'un acronyme court, affiché en badge sur chaque transaction dans l'onglet Transactions (par défaut, dérivé automatiquement des initiales du nom).
      </div>
      <datalist id="at-type-list">${typeOptions.map(t=>`<option value="${U.escHtml(t)}">`).join("")}</datalist>

        ${comptes.map(c=>{
          const current = AGG.getAccountTypeDisplay(c.value);

          return `
          <div class="rowline" data-compte="${U.escHtml(c.value)}" style="flex-direction:column;align-items:stretch;gap:8px;">
            <span style="font-weight:600;font-size:14px;">${U.escHtml(c.value)}</span>
            <div style="display:flex;gap:8px;align-items:center;">
              <div class="chiprow" data-quickchips style="flex:0 0 auto;">
                <div class="chip-opt ${current==='Courant'?'selected':''}" data-v="Courant">Courant</div>
                <div class="chip-opt ${current==='Épargne'?'selected':''}" data-v="Épargne">Épargne</div>
              </div>
              <input type="text" class="search-mini" style="margin:0;flex:1;" list="at-type-list" data-type-input placeholder="Autre type…" value="${U.escHtml(current)}">
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
              <span style="font-size:11.5px;color:var(--text-sub);flex:0 0 auto;">Acronyme</span>
              <input type="text" class="search-mini" style="margin:0;flex:1;text-transform:uppercase;" maxlength="4" data-acronym-input placeholder="${U.escHtml(AGG.getAccountAcronym(c.value))}" value="${U.escHtml(currentAcronym)}">
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>
  `;
  document.getElementById("at-close").onclick = ()=>APP.closeOverlay("overlay-accttype");
  function setType(row, value){
    const compte = row.dataset.compte;
    Store.settings.accountTypes = Store.settings.accountTypes || {};

    Store.saveSettings();

      chip.classList.toggle('selected', chip.dataset.v===value);
    });
  }
  function setAcronym(row, value){
    const compte = row.dataset.compte;
    Store.settings.accountAcronyms = Store.settings.accountAcronyms || {};

    if(v) Store.settings.accountAcronyms[compte] = v;
    else delete Store.settings.accountAcronyms[compte];
    Store.saveSettings();
    row.querySelector('[data-acronym-input]').value = v;
  }
  document.querySelectorAll("#sheet-accttype [data-compte]").forEach(row=>{
    row.querySelectorAll('[data-quickchips] .chip-opt').forEach(chip=>{
      chip.onclick = ()=> setType(row, chip.dataset.v);
