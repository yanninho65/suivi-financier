<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#F0F1F4" id="theme-color-meta">
<title>Suivi financier</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2716%27%20fill%3D%27%231259D6%27/%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23FFFFFF%27%20stroke-width%3D%273.4%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Cpath%20d%3D%27M46%2021V13.5H17a5.5%205.5%200%200%200%200%2011h29v10%27/%3E%3Cpath%20d%3D%27M12.5%2016v29a5%205%200%200%200%205%205h29v-12.5%27/%3E%3Cpath%20d%3D%27M38%2032.5a5%205%200%200%200%200%2010h9v-10z%27%20fill%3D%27%23FFFFFF%27/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2716%27%20fill%3D%27%231259D6%27/%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23FFFFFF%27%20stroke-width%3D%273.4%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Cpath%20d%3D%27M46%2021V13.5H17a5.5%205.5%200%200%200%200%2011h29v10%27/%3E%3Cpath%20d%3D%27M12.5%2016v29a5%205%200%200%200%205%205h29v-12.5%27/%3E%3Cpath%20d%3D%27M38%2032.5a5%205%200%200%200%200%2010h9v-10z%27%20fill%3D%27%23FFFFFF%27/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F0F1F4;
  --card:#FFFFFF;
  --card-alt:#F6F7F9;
  --primary:#1259D6;
  --primary-soft:#E7EFFE;
  --primary-tap:#0D46AD;
  --text:#181A1E;
  --text-sub:#6B707A;
  --text-faint:#9AA0AC;
  --divider:#E7E9ED;
  --income:#1A9E63;
  --income-soft:#E6F6EE;
  --expense:#E4402E;
  --expense-soft:#FCEBE9;
  --transfer:#8A5CF6;
  --transfer-soft:#F1EBFF;
  --radius-xl:30px;
  --radius-lg:24px;
  --radius-md:18px;
  --radius-sm:12px;
  --shadow-1: 0 1px 3px rgba(20,20,30,.06), 0 6px 18px rgba(20,20,30,.05);
  --shadow-2: 0 8px 30px rgba(20,20,30,.14);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"]{
  --bg:#0E0F12;
  --card:#1A1B1F;
  --card-alt:#212226;
  --primary:#4C8DFF;
  --primary-soft:#132A4E;
  --primary-tap:#6BA1FF;
  --text:#F1F2F4;
  --text-sub:#9BA0AC;
  --text-faint:#6E727C;
  --divider:#2A2C31;
  --income:#3FCE8E;
  --income-soft:#123324;
  --expense:#FF6B5E;
  --expense-soft:#3A1917;
  --transfer:#B49BFF;
  --transfer-soft:#251C40;
  --shadow-1: 0 1px 3px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  --shadow-2: 0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Roboto",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
input,select{font-family:inherit;}
::-webkit-scrollbar{width:0;height:0;}
/* Taille par défaut de toutes les icônes SVG inline (évite qu'une icône sans classe dédiée
   s'affiche à sa taille intrinsèque, ce qui la rendrait disproportionnée dans un bouton/une ligne).
   Les règles plus spécifiques ci-dessous (.icon-btn svg, .navbtn svg, etc.) restent prioritaires. */
svg{width:20px;height:20px;flex:0 0 auto;}

.app{max-width:560px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(150px + var(--safe-bottom));}

/* ---------- Top bar ---------- */
.topbar{padding:22px 20px 10px;}
.topbar-row{display:flex;align-items:center;justify-content:space-between;}
.app-title{font-size:30px;font-weight:900;letter-spacing:-.5px;margin:0;}
.topbar-actions{display:flex;gap:8px;}
.icon-btn{
  width:42px;height:42px;border-radius:50%;border:none;background:var(--card);
  display:flex;align-items:center;justify-content:center;color:var(--text);
  box-shadow:var(--shadow-1); cursor:pointer;
}
.icon-btn:active{background:var(--card-alt);}
.icon-btn svg{width:20px;height:20px;}
.sync-spin svg{animation:sf-spin 1s linear infinite;}
@keyframes sf-spin{to{transform:rotate(360deg);}}
.balance-hero{margin-top:18px;}
.balance-hero .label{font-size:14px;color:var(--text-sub);font-weight:500;}
.balance-hero .amount{font-size:40px;font-weight:900;letter-spacing:-1px;margin-top:2px;}
.balance-hero .sub{display:flex;gap:16px;margin-top:10px;}
.balance-hero .sub .chip{font-size:13px;font-weight:700;padding:6px 12px;border-radius:100px;}
.chip-in{background:var(--income-soft);color:var(--income);}
.chip-out{background:var(--expense-soft);color:var(--expense);}

/* ---------- Sections / Cards ---------- */
.section{padding:6px 20px 0;}
.section-title{font-size:13px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:.5px;margin:22px 4px 10px;}
.card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:16px;}
.card + .card{margin-top:10px;}
.rowline{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;}
.rowline + .rowline{border-top:1px solid var(--divider);}

.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 30px;color:var(--text-sub);}
.empty-state svg{width:60px;height:60px;color:var(--text-faint);margin-bottom:14px;}
.empty-state h3{margin:0 0 6px;color:var(--text);font-size:19px;}
.empty-state p{margin:0 0 20px;font-size:14px;line-height:1.5;}
.btn{
  border:none;border-radius:100px;padding:13px 22px;font-weight:700;font-size:14.5px;
  cursor:pointer; display:inline-flex;align-items:center;gap:8px;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:active{background:var(--primary-tap);}
.btn-ghost{background:var(--card-alt);color:var(--text);}
.btn-ghost:active{background:var(--divider);}
.btn-sm{padding:9px 16px;font-size:13px;}
.btn-block{width:100%;justify-content:center;}

/* ---------- Tabs content views ---------- */
.view{display:none;}
.view.active{display:block;}

/* ---------- Bottom floating search/filter bar ---------- */
.float-bar-wrap{
  position:fixed;left:0;right:0;bottom:calc(72px + var(--safe-bottom));
  display:none;justify-content:center;pointer-events:none;z-index:40;
  padding:0 16px;
}
.float-bar{
  pointer-events:auto;
  width:100%;max-width:528px;
  background:var(--card);
  border-radius:100px;
  box-shadow:var(--shadow-2);
  display:flex;align-items:center;gap:6px;
  padding:6px 6px 6px 18px;
}
.float-bar.actions{
  width:auto;max-width:none;
  padding:6px;justify-content:center;gap:10px;
}
.float-bar input{
  flex:1;border:none;outline:none;background:transparent;color:var(--text);
  font-size:15px;padding:10px 0;
}
.float-bar input::placeholder{color:var(--text-faint);}
.float-bar .fbtn{
  width:42px;height:42px;flex:0 0 auto;border-radius:50%;border:none;
  background:var(--card-alt);display:flex;align-items:center;justify-content:center;
  color:var(--text);position:relative;cursor:pointer;
}
.float-bar .fbtn.active-filter{background:var(--primary);color:#fff;}
.float-bar .fbtn svg{width:19px;height:19px;}
.filter-badge{
  position:absolute;top:-2px;right:-2px;background:var(--expense);color:#fff;
  font-size:10px;font-weight:800;border-radius:50%;min-width:16px;height:16px;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--card);
  border-top:1px solid var(--divider);
  padding:8px 6px calc(8px + var(--safe-bottom));
  display:flex;justify-content:space-around;
  z-index:39;
  max-width:560px;margin:0 auto;
}
.navbtn{
  border:none;background:transparent;display:flex;flex-direction:column;align-items:center;
  gap:3px;color:var(--text-faint);font-size:10.5px;font-weight:700;padding:6px 8px;border-radius:14px;
  cursor:pointer;flex:1;
}
.navbtn svg{width:22px;height:22px;}
.navbtn.active{color:var(--primary);}

/* ---------- Modal / bottom sheet ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:60;
  display:none;align-items:flex-end;justify-content:center;
}
.overlay.open{display:flex;}
.overlay.overlay-large{align-items:stretch;}
.sheet{
  width:100%;max-width:560px;background:var(--bg);
  border-radius:26px 26px 0 0;
  max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;
  animation:slideup .22s ease-out;
}
.sheet-large{max-height:100vh;height:100vh;max-height:100dvh;height:100dvh;border-radius:0;}
@keyframes slideup{from{transform:translateY(30px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:38px;height:5px;background:var(--divider);border-radius:10px;margin:12px auto 4px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 12px;}
.sheet-head h2{font-size:19px;margin:0;font-weight:800;}
.sheet-body{overflow-y:auto;padding:0 20px 20px;flex:1 1 auto;min-height:0;}
.sheet-foot{padding:14px 20px calc(16px + var(--safe-bottom));border-top:1px solid var(--divider);display:flex;gap:10px;background:var(--bg);}
.sheet-foot .btn{flex:1;}

.modal-center-wrap{align-items:center;}
.modal-center{
  width:92%;max-width:420px;background:var(--card);border-radius:var(--radius-lg);
  padding:22px;animation:popin .18s ease-out;
  max-height:86vh;overflow-y:auto;
}
@keyframes popin{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}

/* ---------- Filter sheet content ---------- */
.filter-group{margin-bottom:22px;}
.filter-group h4{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-sub);margin:0 0 10px;font-weight:700;}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;}
.chip-opt{
  border:1.5px solid var(--divider);background:var(--card);color:var(--text);
  border-radius:100px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.chip-opt.selected{background:var(--primary);border-color:var(--primary);color:#fff;}

.chips-bar{display:flex;flex-wrap:wrap;gap:8px;padding:2px 4px 10px;}
.chip-active{
  display:flex;align-items:center;gap:7px;background:var(--primary-soft);color:var(--primary);
  border-radius:100px;padding:6px 6px 6px 13px;font-size:12.5px;font-weight:700;max-width:100%;
}
.chip-active span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
.chip-active .chip-x{
  border:none;background:rgba(18,89,214,.14);color:inherit;width:19px;height:19px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:0 0 auto;
}
[data-theme="dark"] .chip-active .chip-x{background:rgba(76,141,255,.22);}
.chip-active .chip-x svg{width:10px;height:10px;stroke-width:3;}
.chip-clearall{border:none;background:transparent;color:var(--text-sub);font-size:12.5px;font-weight:700;text-decoration:underline;cursor:pointer;padding:6px 4px;}
.search-mini{
  width:100%;border:1.5px solid var(--divider);background:var(--card);border-radius:14px;
  padding:10px 14px;font-size:14px;color:var(--text);outline:none;margin-bottom:10px;
}
.check-list{max-height:46vh;overflow-y:auto;border:1px solid var(--divider);border-radius:14px;background:var(--card);}
.check-item{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:14px;border-bottom:1px solid var(--divider);cursor:pointer;}
.check-item:last-child{border-bottom:none;}
.check-item .cbox{width:19px;height:19px;border-radius:6px;border:2px solid var(--text-faint);flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
.check-item.selected .cbox{background:var(--primary);border-color:var(--primary);}
.check-item.selected .cbox svg{width:12px;height:12px;color:#fff;}
.check-item .lbl{flex:1;}
.check-item .cnt{color:var(--text-faint);font-size:12px;}
.groupe-section{border-bottom:1px solid var(--divider);}
.groupe-section:last-child{border-bottom:none;}
.groupe-section-head{border-bottom:none;background:var(--card-alt);}
.groupe-section-children{padding-left:18px;background:var(--card);}
.groupe-section-children .check-item{border-bottom:1px solid var(--divider);}
.groupe-section-children .check-item:last-child{border-bottom:none;}
.daterange{display:flex;gap:10px;}
.daterange input{flex:1;border:1.5px solid var(--divider);border-radius:14px;padding:10px 12px;font-size:14px;background:var(--card);color:var(--text);}
.seg{display:flex;background:var(--card-alt);border-radius:100px;padding:4px;}
.seg button{flex:1;border:none;background:transparent;padding:9px;border-radius:100px;font-size:13px;font-weight:700;color:var(--text-sub);cursor:pointer;}
.seg-sm{padding:3px;}
.seg-sm button{padding:6px 4px;font-size:11px;}
.oneui-pill{
  display:inline-flex;align-items:center;gap:6px;border:none;border-radius:100px;
  padding:8px 14px 8px 16px;background:var(--primary);color:#fff;font-weight:800;
  font-size:14px;cursor:pointer;max-width:100%;
}
.oneui-pill .pill-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.oneui-pill .pill-chev{flex:0 0 auto;opacity:.85;width:13px;height:13px;}
.pill-toggle-wrap{display:flex;flex-wrap:wrap;gap:8px;}
.pill-toggle{
  display:inline-flex;align-items:center;border:none;border-radius:100px;
  padding:8px 15px;background:var(--card-alt);color:var(--text-sub);font-weight:700;
  font-size:12.5px;cursor:pointer;white-space:nowrap;transition:background .12s ease,color .12s ease;
}
.pill-toggle.selected{background:var(--primary);color:#fff;}
.chev-rot{transition:transform .15s ease;}
details[open] > summary .chev-rot{transform:rotate(180deg);}
.seg button.active{background:var(--primary);color:#fff;}
.txn-view-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card-alt);border:none;border-radius:100px;
  padding:6px 12px 6px 10px;margin:8px 4px 0;cursor:pointer;
  font-size:12.5px;font-weight:700;color:var(--text);
}
.txn-view-pill svg{width:15px;height:15px;flex:0 0 auto;}
.txn-view-pill .tvp-chev{width:12px;height:12px;color:var(--text-faint);}

/* ---------- Transactions list ---------- */
.txn-date-label{font-size:12.5px;font-weight:700;color:var(--text-sub);margin:14px 4px 6px;text-transform:capitalize;}
.txn-item{
  display:flex;align-items:stretch;background:var(--card);
  border-radius:var(--radius-md);box-shadow:var(--shadow-1);cursor:pointer;
  overflow:hidden;
}
.txn-item + .txn-item{margin-top:6px;}
.txn-band{
  width:22px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:.03em;
  font-size:9.5px;font-weight:800;padding:6px 0;
}
.txn-band.inc{background:var(--income-soft);color:var(--income);}
.txn-band.exp{background:var(--expense-soft);color:var(--expense);}
.txn-band.trf{background:var(--transfer-soft);color:var(--transfer);}
/* Icône ronde — utilisée uniquement par la fiche détail d'une transaction (la liste utilise .txn-band) */
.txn-ico{
  width:40px;height:40px;border-radius:50%;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;
}
.txn-ico.inc{background:var(--income-soft);color:var(--income);}
.txn-ico.exp{background:var(--expense-soft);color:var(--expense);}
.txn-ico.trf{background:var(--transfer-soft);color:var(--transfer);}
.txn-content{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:7px 10px;}
.txn-mid{flex:1;min-width:0;}
.txn-title{font-size:13px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.txn-sub{font-size:11px;line-height:1.25;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.txn-line{font-size:10.5px;line-height:1.25;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.txn-line .txn-line-tag{opacity:.6;font-size:9.5px;text-transform:uppercase;letter-spacing:.02em;margin-right:4px;}
.txn-amt{font-size:13.5px;font-weight:800;flex:0 0 auto;text-align:right;}
.txn-amt.inc{color:var(--income);}
.txn-amt.exp{color:var(--expense);}
.txn-amt.trf{color:var(--transfer);}

.loadmore-wrap{display:flex;justify-content:center;margin-top:16px;}

/* ---------- Onglet Évolution : tableau à colonnes figées (libellé + total) ---------- */
.evo-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius-lg);box-shadow:var(--shadow-1);background:var(--card);cursor:grab;user-select:none;}
.evo-table-wrap.drag-scroll-active{cursor:grabbing;}
.evo-table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;}
.evo-table th,.evo-table td{box-sizing:border-box;padding:9px 10px;text-align:right;font-size:12.5px;white-space:nowrap;border-bottom:1px solid var(--divider);}
.evo-table thead th{font-size:10px;font-weight:800;color:var(--text-sub);text-transform:uppercase;letter-spacing:.02em;padding-top:10px;padding-bottom:10px;background:var(--card);border-bottom:2px solid var(--divider);}
.evo-col-label{position:sticky;left:0;z-index:3;background:var(--card);width:132px;min-width:132px;max-width:132px;text-align:left !important;overflow:hidden;text-overflow:ellipsis;}
.evo-col-total{position:sticky;left:132px;z-index:3;background:var(--card);width:82px;min-width:82px;max-width:82px;font-weight:800;box-shadow:2px 0 4px -2px rgba(0,0,0,.15);}
.evo-col-val{width:78px;min-width:78px;max-width:78px;}
.evo-year-header{cursor:pointer;}
.evo-year-header:active{color:var(--primary);}
.evo-total-row{background:var(--card);}
.evo-total-row td{font-weight:900;font-size:13.5px;border-bottom:2px solid var(--divider);}
.evo-total-row .evo-col-label,.evo-total-row .evo-col-total{background:var(--card);}
.evo-section-row{background:var(--card-alt);cursor:pointer;}
.evo-section-row td{font-weight:800;font-size:13px;}
.evo-section-row .evo-col-label,.evo-section-row .evo-col-total{background:var(--card-alt);}
.evo-section-row.selected .evo-col-label,.evo-section-row.selected .evo-col-total{background:var(--primary-soft);}
.evo-section-row.selected{background:var(--primary-soft);}
.evo-item-row td{color:var(--text-sub);}
.evo-item-row.hidden{display:none;}
.evo-val-cell{cursor:pointer;}
.evo-val-cell.neg{color:var(--expense);}
.evo-val-cell.pos{color:var(--income);}
.evo-chev{display:inline-block;width:10px;height:10px;margin-right:4px;transition:transform .15s;vertical-align:middle;}
.evo-chev.open{transform:rotate(90deg);}
.evo-merge-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:100px;background:var(--card-alt);color:var(--text);}
.evo-merge-chip button{border:none;background:none;padding:0;display:flex;color:var(--text-sub);cursor:pointer;}
.evo-section-check{width:18px;height:18px;flex:0 0 auto;}

/* ---------- Breakdown / evolution lists ---------- */
.bd-row{display:flex;align-items:center;gap:12px;padding:11px 4px;}
.bd-row + .bd-row{border-top:1px solid var(--divider);}
.bd-dot{width:11px;height:11px;border-radius:4px;flex:0 0 auto;}
.bd-name{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ---------------- Utils ---------------- */
function normalize(s){
  return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
}
function escHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function moneyDecimals(){
  try{
    const s = window.__SF_STORE && window.__SF_STORE.settings;
    const d = s && s.decimals;
    return d===2 ? 2 : 0;
  }catch(e){ return 0; }
}
function fmtMoney(n){
  if(n==null || isNaN(n)) n=0;
  const dec = moneyDecimals();
  const sign = n<0 ? "-" : "";
  const abs = Math.abs(n);
  return sign + abs.toLocaleString('fr-FR',{minimumFractionDigits:dec,maximumFractionDigits:dec}) + " €";
}
function fmtMoneySigned(n){
  const dec = moneyDecimals();
  return (n>0? "+ " : (n<0? "- " : "")) + Math.abs(n).toLocaleString('fr-FR',{minimumFractionDigits:dec,maximumFractionDigits:dec}) + " €";
}
/* Petit bouton pilule "0,00" qui bascule l'affichage global des montants entre 0 et 2 décimales
   (Store.settings.decimals). Utilisé dans les onglets Transactions et Comptes — le réglage est global,
   donc l'activer dans un onglet s'applique aussi immédiatement à l'autre. */
function decimalsToggleBtnHtml(id){
  const active = moneyDecimals()===2;
  return `<button type="button" id="${escHtml(id)}" title="${active?'Afficher les montants sans décimales':'Afficher les montants avec 2 décimales'}" style="flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:4px 10px;border:none;border-radius:100px;font-size:11px;font-weight:800;cursor:pointer;background:${active?'var(--primary)':'var(--card-alt)'};color:${active?'#fff':'var(--text-sub)'};">0,00</button>`;
}
function toggleMoneyDecimals(){
  const s = window.__SF_STORE.settings;
  s.decimals = (s.decimals===2) ? 0 : 2;
  window.__SF_STORE.saveSettings();
}
const MONTHS_FR = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MONTHS_FR_SHORT = ["jan.","fév.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const DAYS_FR = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
function pad2(n){return String(n).padStart(2,"0");}
function toISO(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function fmtDateLong(d){return DAYS_FR[d.getDay()]+" "+d.getDate()+" "+MONTHS_FR[d.getMonth()]+" "+d.getFullYear();}
function fmtDateShort(d){return pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+"/"+d.getFullYear();}
function fmtMonthYear(y,m){return MONTHS_FR[m]+" "+y;}
function debounce(fn,ms){let t;return function(...a){clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),ms);};}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}

/* ---------------- Date parsing ---------------- */
function parseDateValue(val){
  if(val==null || val==="") return null;
  if(val instanceof Date && !isNaN(val)) return new Date(val.getFullYear(),val.getMonth(),val.getDate());
  if(typeof val === "number"){
    // Excel serial date
    const epoch = new Date(Date.UTC(1899,11,30));
    const d = new Date(epoch.getTime() + val*86400000);
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }
  const s = String(val).trim();
  // dd/mm/yyyy OU dd/mm/yy (année 2 chiffres : pivot 68 -> 00-68 = 2000-2068, 69-99 = 1969-1999)
  let m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})$/);
  if(m){
    const day=parseInt(m[1],10), month=parseInt(m[2],10);
    let year=parseInt(m[3],10);
    if(m[3].length<=2) year += (year<=68 ? 2000 : 1900);
    if(month>=1&&month<=12&&day>=1&&day<=31) return new Date(year,month-1,day);
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return new Date(parseInt(m[1],10),parseInt(m[2],10)-1,parseInt(m[3],10));
  const fallback = new Date(s);
  if(!isNaN(fallback)) return new Date(fallback.getFullYear(),fallback.getMonth(),fallback.getDate());
  return null;
}

/* remarque -> transformed date info */
function computeTransform(remarque){
  const r = String(remarque||"").trim();
  let m = r.match(/(\d{2})-(\d{2})$/);
  if(m){
    const mm = parseInt(m[2],10);
    if(mm>=1 && mm<=12){
      const yy = parseInt(m[1],10);
      const year = 2000+yy;
      return {mode:"month", year, month: mm-1};
    }
  }
  m = r.match(/(?:^|[^0-9])(\d{4})$/);
  if(m){
    const year = parseInt(m[1],10);
    if(year>=1990 && year<=2100){
      return {mode:"yearsplit", year};
    }
  }
  return {mode:"same"};
}

/* ---------------- Type normalization ---------------- */
function normType(t){
  const n = normalize(t);
  if(n.startsWith("inc") || n==="revenu") return "Income";
  if(n.startsWith("exp") || n==="depense") return "Expense";
  if(n.startsWith("trans") || n==="virement") return "Transfer";
  return t;
}

/* Strips a trailing parenthetical period marker from a "Groupe" value,
   e.g. "Cliff Haven (23-01-08)" -> "Cliff Haven", "France (22-07)" -> "France".
   Values without a trailing parenthetical are returned unchanged. */
function baseGroupe(str){
  const s = String(str||"").trim();
  const m = s.match(/^(.*?)\s*\([^)]*\)\s*$/);
  return m ? m[1].trim() : s;
}

/* Permet de faire défiler horizontalement un conteneur (ex. tableau Évolution / Budget mois par mois) en
   cliquant-glissant à la souris — sur mobile, le défilement tactile natif fonctionne déjà sans cela. Un
   glissement effectif (déplacement > 4px) supprime le clic qui suit, pour ne pas déclencher l'ouverture
   d'une cellule au relâchement. Les tableaux étant reconstruits (innerHTML) à chaque rendu, enableDragScroll
   est rappelée sur un nouvel élément à chaque fois : seul le listener "mousedown" est posé par conteneur
   (nettoyé naturellement avec l'élément) ; les listeners globaux "mousemove"/"mouseup" ne sont posés qu'une
   seule fois pour toute la session, afin de ne jamais s'accumuler au fil des rendus. */
let __dragScrollState = null; // {el, startX, startScroll, moved}
let __dragScrollGlobalBound = false;
function ensureDragScrollGlobalListeners(){
  if(__dragScrollGlobalBound) return;
  __dragScrollGlobalBound = true;
  window.addEventListener("mousemove", (e)=>{
    const s = __dragScrollState;
    if(!s) return;
    const dx = e.pageX - s.startX;
    if(Math.abs(dx) > 4) s.moved = true;
    if(s.moved){ s.el.scrollLeft = s.startScroll - dx; s.el.classList.add("drag-scroll-active"); e.preventDefault(); }
  });
  window.addEventListener("mouseup", ()=>{
    const s = __dragScrollState;
    if(!s) return;
    s.el.classList.remove("drag-scroll-active");
    if(s.moved){
      const suppress = (e)=>{ e.stopPropagation(); e.preventDefault(); };
      s.el.addEventListener("click", suppress, {capture:true, once:true});
    }
    __dragScrollState = null;
  });
}
function enableDragScroll(el){
  if(!el || el.__dragScrollBound) return;
  el.__dragScrollBound = true;
  ensureDragScrollGlobalListeners();
  el.addEventListener("mousedown", (e)=>{
    if(e.button !== 0) return;
    __dragScrollState = {el, startX: e.pageX, startScroll: el.scrollLeft, moved:false};
  });
}

window.__SF_UTILS = {ICONS,normalize,escHtml,fmtMoney,fmtMoneySigned,MONTHS_FR,MONTHS_FR_SHORT,DAYS_FR,pad2,toISO,

  decimalsToggleBtnHtml,toggleMoneyDecimals,enableDragScroll};

const U = window.__SF_UTILS;

const LS_SETTINGS = "sf_settings_v1";
const LS_KEY_LEGACY = "sf_transactions_v1"; // ancien emplacement (localStorage), migré automatiquement

/* Traduit une erreur de stockage (IndexedDB ou localStorage) en message compréhensible */
function describeStorageError(e, byteLen){
  const name = e && e.name ? e.name : "";
  const sizeMb = byteLen ? (byteLen/1048576).toFixed(1)+" Mo" : "";
  if(name === "QuotaExceededError" || name === "NS_ERROR_DOM_QUOTA_REACHED"){
    return "Espace de stockage insuffisant sur cet appareil pour enregistrer vos données"+(sizeMb?` (~${sizeMb})`:"")+". Libérez de l'espace (autres apps, navigation privée…) ou exportez régulièrement une sauvegarde.";
  }
  if(name === "InvalidStateError"){
    return "Le stockage local a été fermé ou est inaccessible (onglet en arrière-plan, navigation privée). Rouvrez la page et réessayez.";
  }
  if(name === "VersionError"){
    return "Conflit de version de la base de données locale (probablement un autre onglet de l'application ouvert). Fermez les autres onglets et réessayez.";
  }
  if(!window.indexedDB){
    return "IndexedDB n'est pas disponible sur ce navigateur (mode privé strict ou navigateur ancien).";
  }
  return "Erreur de stockage" + (name?` (${name})`:"") + (e && e.message ? " : "+e.message : "") + ".";
}

/* ---------------- IndexedDB (grande capacité de stockage) ---------------- */
const IDB_NAME = "sf_finance_db";
const IDB_STORE = "kv";
let _idbPromise = null;
function idbOpen(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error("IndexedDB indisponible")); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return _idbPromise;
}
function idbGet(key){
  return idbOpen().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,"readonly");
    const r = tx.objectStore(IDB_STORE).get(key);
    r.onsuccess = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
  }));
}
function idbSet(key,val){
  return idbOpen().then(db=>new Promise((resolve,reject)=>{
    let tx;
    try{
      tx = db.transaction(IDB_STORE,"readwrite");
    }catch(e){ reject(e); return; }
    tx.onabort = ()=>reject(tx.error || new Error("Transaction IndexedDB annulée"));
    tx.onerror = ()=>reject(tx.error || new Error("Erreur de transaction IndexedDB"));
    let r;
    try{
      r = tx.objectStore(IDB_STORE).put(val,key);
    }catch(e){ reject(e); return; }
    r.onsuccess = ()=>resolve(true);
    r.onerror = ()=>{ reject(r.error); };
  }));
}
function idbDelete(key){
  return idbOpen().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,"readwrite");
    const r = tx.objectStore(IDB_STORE).delete(key);
    r.onsuccess = ()=>resolve(true);
    r.onerror = ()=>reject(r.error);
  }));
}

/* ---------------- Store ---------------- */
const Store = {
  transactions: [], // array of txn objects
  settings: {theme:"auto", dateBasis:"indiquee", decimals:0, groupAliasRules:[], accountTypes:{}, accountAcronyms:{}, personAliasRules:[],
    groupKind:{}, groupVoyageMonth:{}, groupDateRange:{},
    evolution:{view:"groupe", monthBasis:"reel", merges:{groupe:[], categorie:[], personne:[]}},
    budget:{scope:"perso", mode:"amorti", startMonth:null, mainGroup:null, extraGroups:[],
      amortCategories:[], adjustments:[], excludedAccounts:[]}},
  storageMode: "indexeddb", // "indexeddb" | "localstorage" (repli automatique)

  /* Charge les données au démarrage. Doit être attendu (await) avant d'afficher l'appli. */
  async load(){
    try{
      const raw = await idbGet("transactions");
      if(raw){
        this.transactions = JSON.parse(raw).map(t=>({...t, date:new Date(t.date)}));
      } else {
        // Migration depuis l'ancienne version (localStorage) si elle existe
        const legacy = localStorage.getItem(LS_KEY_LEGACY);
        if(legacy){
          this.transactions = JSON.parse(legacy).map(t=>({...t, date:new Date(t.date)}));
          await idbSet("transactions", legacy);
          localStorage.removeItem(LS_KEY_LEGACY);
        }
      }
    }catch(e){
      console.warn("IndexedDB indisponible, repli sur localStorage", e);
      this.storageMode = "localstorage";
      try{
        const raw = localStorage.getItem(LS_KEY_LEGACY);
        if(raw) this.transactions = JSON.parse(raw).map(t=>({...t, date:new Date(t.date)}));
      }catch(e2){ this.transactions=[]; }
    }
    try{
      const rawS = localStorage.getItem(LS_SETTINGS);
      if(rawS) this.settings = Object.assign(this.settings, JSON.parse(rawS));
    }catch(e){}
    this.normalizeSettings();
    // Backfill groupeBase for records saved by an older version of the app
    this.transactions.forEach(t=>{
      if(t.groupeBase==null) t.groupeBase = t.groupe ? U.baseGroupe(t.groupe) : "";
    });
  },

  /* Sauvegarde asynchrone. Retourne une Promise<boolean>. Peut être appelée sans await
     pour une UI réactive ; utiliser .then(ok=>...) pour confirmer le résultat.
     En cas d'échec, Store.lastSaveError contient un message explicite (à afficher à l'utilisateur). */
  lastSaveError: null,
  saveTransactions(){
    this.lastSaveError = null;
    const arr = this.transactions.map(t=>({...t, date:t.date.toISOString()}));
    let json;
    try{
      json = JSON.stringify(arr);
    }catch(e){
      this.lastSaveError = "Impossible de préparer les données (" + (e && e.message ? e.message : e) + ")";
      return Promise.resolve(false);
    }
    if(this.storageMode === "localstorage"){
      try{ localStorage.setItem(LS_KEY_LEGACY, json); return Promise.resolve(true); }
      catch(e){
        this.lastSaveError = describeStorageError(e, json.length);
        console.warn("Erreur de sauvegarde", e);
        return Promise.resolve(false);
      }
    }
    return idbSet("transactions", json).then(()=>true).catch(e=>{
      console.warn("Erreur de sauvegarde IndexedDB", e);
      this.lastSaveError = describeStorageError(e, json.length);
      // Repli d'urgence : si les données restent raisonnablement petites, on tente localStorage
      // pour ne pas perdre l'import en cours, même si IndexedDB est en défaut sur cet appareil.
      if(json.length < 4*1024*1024){
        try{
          localStorage.setItem(LS_KEY_LEGACY, json);
          this.storageMode = "localstorage";
          this.lastSaveError += " — repli automatique sur le stockage navigateur réussi, vos données sont bien enregistrées.";
          return true;
        }catch(e2){
          this.lastSaveError += " Le repli de secours (stockage navigateur) a également échoué : " + (e2 && e2.message ? e2.message : e2) + ".";
        }
      }
      return false;
    });
  },
  lastSettingsSaveError: null,
  saveSettings(){
    this.lastSettingsSaveError = null;
    try{
      localStorage.setItem(LS_SETTINGS, JSON.stringify(this.settings));
      return true;
    }catch(e){
      console.warn("Erreur de sauvegarde des paramètres/filtres", e);
      this.lastSettingsSaveError = describeStorageError(e);
      return false;
    }
  },
  /* Comble les champs manquants (settings anciens/partiels) pour éviter les erreurs sur les nouvelles fonctionnalités */
  normalizeSettings(){
    const s = this.settings;
    if(s.decimals!==2) s.decimals = 0;
    if(!s.groupKind) s.groupKind = {};
    if(!s.groupVoyageMonth) s.groupVoyageMonth = {};
    if(!s.groupDateRange) s.groupDateRange = {};
    if(!s.accountTypes || typeof s.accountTypes!=="object") s.accountTypes = {};
    if(!s.accountAcronyms || typeof s.accountAcronyms!=="object") s.accountAcronyms = {};
    if(!Array.isArray(s.accountTypeOrder)) s.accountTypeOrder = [];
    if(!Array.isArray(s.customBalances)) s.customBalances = [];
    if(!s.evolution || typeof s.evolution!=="object") s.evolution = {};
    if(!["groupe","categorie","personne","compte"].includes(s.evolution.view)) s.evolution.view = "groupe";
    if(s.evolution.monthBasis!=="reel" && s.evolution.monthBasis!=="transformee") s.evolution.monthBasis = "reel";
    if(!s.evolution.merges || typeof s.evolution.merges!=="object") s.evolution.merges = {};
    ["groupe","categorie","personne","compte"].forEach(d=>{ if(!Array.isArray(s.evolution.merges[d])) s.evolution.merges[d] = []; });
    if(!s.budget) s.budget = {};
    const b = s.budget;
    if(b.scope!=="couple" && b.scope!=="perso") b.scope = "perso";
    if(b.mode!=="amorti" && b.mode!=="brut_ajout") b.mode = "amorti";
    if(typeof b.detailView!=="boolean") b.detailView = false;
    if(typeof b.monthlyView!=="boolean") b.monthlyView = false;
    if(b.startMonth===undefined) b.startMonth = null;
    if(b.endMonth===undefined) b.endMonth = null;
    if(b.mainGroup===undefined) b.mainGroup = null;
    if(!Array.isArray(b.extraGroups)) b.extraGroups = [];
    if(!Array.isArray(b.amortCategories)) b.amortCategories = [];
    if(!Array.isArray(b.adjustments)) b.adjustments = [];
    if(!b.salaryEntries || typeof b.salaryEntries!=="object") b.salaryEntries = {};
    if(b.displayMode!=="moyenne" && b.displayMode!=="total") b.displayMode = "total";
    if(!Array.isArray(b.excludedAccounts)) b.excludedAccounts = [];
    if(!b.compare || typeof b.compare!=="object") b.compare = {};
    if(b.compare.enabled!==true) b.compare.enabled = false;
    if(b.compare.mode!=="period" && b.compare.mode!=="predefined") b.compare.mode = "period";
    if(b.compare.periodFrom===undefined) b.compare.periodFrom = null;
    if(b.compare.periodTo===undefined) b.compare.periodTo = null;
    if(!b.compare.predefined || typeof b.compare.predefined!=="object") b.compare.predefined = {};
    if(!s.sync || typeof s.sync!=="object") s.sync = {};
    if(typeof s.sync.token!=="string") s.sync.token = "";
    if(typeof s.sync.gistId!=="string") s.sync.gistId = "";
    if(!s.sync.filename) s.sync.filename = "suivi_financier_sync.json";
    if(s.sync.lastSyncedAt===undefined) s.sync.lastSyncedAt = null;
    if(s.sync.lastSyncedHash===undefined) s.sync.lastSyncedHash = null;
    if(typeof s.txnGroupsExpanded!=="boolean") s.txnGroupsExpanded = false;
  },
  clearAll(){
    this.transactions=[];
    if(this.storageMode === "localstorage"){
      try{ localStorage.removeItem(LS_KEY_LEGACY); }catch(e){}
      return Promise.resolve(true);
    }
    return idbDelete("transactions").catch(e=>{ console.warn(e); return false; });
  },
  /* Estimation de l'espace de stockage utilisé/disponible (si le navigateur le permet) */
  async estimateUsage(){
    if(navigator.storage && navigator.storage.estimate){
      try{ return await navigator.storage.estimate(); }catch(e){ return null; }
    }
    return null;
  }
};
window.__SF_STORE = Store;

/* ---------------- Header mapping ---------------- */
const HEADER_MAP = {
  "date":"date",
  "montant":"montant",
  "type":"type",
  "categorie":"categorie",
  "categorie de depense":"categorie",
  "categorie de la depense":"categorie",
  "personne":"personne",
  "compte":"compte",
  "compte cible":"compteCible",
  "comptecible":"compteCible",
  "groupe":"groupe",
  "remarque":"remarque",
};

function buildTxnId(t){
  return [t.dateISO,t.montant,t.type,t.categorie||"",t.personne||"",t.compte||"",t.compteCible||"",t.groupe||"",t.remarque||""].join("|");
}

/* Turn a raw row object (header->value) into a transaction, or null if invalid */
function rowToTxn(row){
  const mapped = {};
  Object.keys(row).forEach(k=>{
    const norm = U.normalize(k);
    const field = HEADER_MAP[norm];
    if(field) mapped[field] = row[k];
  });
  if(mapped.date==null || mapped.montant==null) return null;
  const date = U.parseDateValue(mapped.date);
  if(!date) return null;
  let montant = mapped.montant;
  if(typeof montant === "string") montant = parseFloat(montant.replace(/\s/g,"").replace(",","."));
  montant = Number(montant);
  if(isNaN(montant)) return null;
  const type = U.normType(mapped.type);
  const remarque = mapped.remarque==null ? "" : String(mapped.remarque).trim();
  const transform = U.computeTransform(remarque);

  const groupe = mapped.groupe==null? "" : String(mapped.groupe).trim();
  const t = {
    date, dateISO: U.toISO(date),
    montant, type,
    categorie: mapped.categorie==null? "" : String(mapped.categorie).trim(),
    personne: mapped.personne==null? "" : String(mapped.personne).trim(),
    compte: mapped.compte==null? "" : String(mapped.compte).trim(),
    compteCible: mapped.compteCible==null? "" : String(mapped.compteCible).trim(),
    groupe,
    groupeBase: groupe ? U.baseGroupe(groupe) : "",
    remarque,
    transform,
  };
  t.id = buildTxnId(t);
  return t;
}

/* Parse a File (xlsx/xls/csv) -> Promise<transactions[]> */
/* Locate the sheet holding transaction rows (has Date + Montant headers), ignoring a "Paramètres" sheet */
function findDataSheetName(wb){
  for(const name of wb.SheetNames){
    if(U.normalize(name)==="parametres") continue;
    const sheet = wb.Sheets[name];
    if(!sheet || !sheet['!ref']) continue;
    const headerRow = XLSX.utils.sheet_to_json(sheet, {header:1, defval:null})[0];
    if(headerRow){
      const normHeaders = headerRow.map(h=>U.normalize(h));
      if(normHeaders.includes("date") && normHeaders.includes("montant")) return name;
    }
  }
  return wb.SheetNames.find(n=>U.normalize(n)!=="parametres") || wb.SheetNames[0];
}

/* Parses an optional "Paramètres" sheet: group-alias rules (Groupe / Groupe de groupe / Date début / Date fin)
   and account types (Compte / Type de compte). Returns null if the sheet isn't found. */
function parseParametresSheet(wb){
  const sheetName = wb.SheetNames.find(n=>U.normalize(n)==="parametres");
  const groupRules = [];
  const personRules = [];
  const accountTypes = {};
  const accountAcronyms = {};
  const groupKind = {};
  const groupVoyageMonth = {};
  const groupDateRange = {};
  const categoryTypeOverride = {};
  if(sheetName){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {defval:null, raw:false});
    rows.forEach(r=>{
      const norm = {};
      Object.keys(r).forEach(k=>{ norm[U.normalize(k)] = r[k]; });
      const groupeRaw = norm["groupe"];
      const superGroupe = norm["groupe de groupe"];
      const occurrenceExacte = norm["occurrence exacte"];
      const compte = norm["compte"];
      const typeCompte = norm["type de compte"];
      const acronymeCompte = norm["acronyme"];
      const personne = norm["personne"];
      const superPersonne = norm["groupe de personnes"];
      const kType = norm["type budget (quotidien/voyage)"];
      const kMonth = norm["mois voyage (aaaa-mm)"];
      const daysFrom = norm["date debut (jours)"];
      const daysTo = norm["date fin (jours)"];
      const catForced = norm["categorie (classement force)"];
      const catForcedType = norm["type force (revenus/depenses)"];
      const groupeStr = groupeRaw ? String(groupeRaw).trim() : "";
      // Type budget / Mois voyage / Bornes (jours) sont indexés directement sur le libellé complet de la
      // colonne "Groupe" (suffixe de date inclus, ex. "France (26-06_07)") — jamais sur un nom de base
      // dérivé : deux occurrences distinctes du même lieu sont des groupes différents et peuvent avoir des
      // réglages différents (cf. getGroupKind/getGroupVoyageMonth).
      if(groupeStr && superGroupe){
        const groupeBase = U.baseGroupe(groupeStr);
        const rule = {
          groupe: groupeBase,
          superGroupe: String(superGroupe).trim()
        };
        // Une règle est toujours résolue en priorité via son occurrence exacte (`full`, libellé complet
        // avec suffixe) — le nom de base (`groupe`) ne sert que de repli optionnel pour classer en bloc
        // toutes les occurrences non encore rattachées individuellement (fonctionnement existant de "Gérer
        // les groupes", cf. findGroupAliasRule/resolvedSuperGroupeForOccurrence). Sans "Occurrence exacte"
        // renseignée, on la déduit automatiquement dès que "Groupe" contient un suffixe entre parenthèses.
        const explicitFull = occurrenceExacte && String(occurrenceExacte).trim();
        if(explicitFull) rule.full = explicitFull;
        else if(groupeBase !== groupeStr) rule.full = groupeStr;
        groupRules.push(rule);
      }
      if(personne && superPersonne){
        personRules.push({
          personne: String(personne).trim(),
          superPersonne: String(superPersonne).trim()
        });
      }
      if(compte && typeCompte){
        accountTypes[String(compte).trim()] = String(typeCompte).trim();
      }
      if(compte && acronymeCompte){
        accountAcronyms[String(compte).trim()] = String(acronymeCompte).trim().toUpperCase().slice(0,4);
      }
      // Type budget / Mois voyage / Bornes (jours) partagent maintenant la même colonne "Groupe" que le
      // groupe de groupe (au lieu de colonnes "Groupe (type budget)" / "Groupe (jours)" séparées) — un seul
      // bloc de colonnes contiguës par groupe, plus simple à lire et à éditer dans Excel. Toujours indexés
      // sur le libellé complet exact (groupeStr), jamais sur un nom de base dérivé.
      if(groupeStr && kType){
        groupKind[groupeStr] = U.normalize(kType).startsWith("voy") ? "voyage" : "quotidien";
        if(kMonth) groupVoyageMonth[groupeStr] = String(kMonth).trim();
      }
      if(groupeStr && daysFrom && daysTo){
        const dFrom = U.parseDateValue(daysFrom);
        const dTo = U.parseDateValue(daysTo);
        if(dFrom && dTo) groupDateRange[groupeStr] = {dateFrom: U.toISO(dFrom), dateTo: U.toISO(dTo)};
      }
      if(catForced && catForcedType){
        categoryTypeOverride[String(catForced).trim()] = U.normalize(catForcedType).startsWith("rev") ? "Income" : "Expense";
      }
    });
  }
  const budgetSheetName = wb.SheetNames.find(n=>U.normalize(n)==="budget");
  const budgetAdjustments = [];
  if(budgetSheetName){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[budgetSheetName], {defval:null, raw:false});
    rows.forEach(r=>{
      const norm = {};
      Object.keys(r).forEach(k=>{ norm[U.normalize(k)] = r[k]; });
      const month = norm["mois"], groupe = norm["groupe"], montant = norm["montant"];
      if(month && groupe && montant!=null){
        const amortiRaw = U.normalize(norm["amorti"]||"");
        const scopeRaw = U.normalize(norm["vue"]||norm["scope"]||"");
        const viewOnlyRaw = U.normalize(norm["vue uniquement"]||"");
        const montantScope = scopeRaw==="couple" ? "couple" : (scopeRaw==="les deux"||scopeRaw==="both" ? "both" : "perso");
        budgetAdjustments.push({
          month: String(month).trim(), groupe: String(groupe).trim(),
          categorie: norm["categorie"]?String(norm["categorie"]).trim():"",
          montant: Number(String(montant).replace(",",".")) || 0,
          remarque: norm["remarque"]?String(norm["remarque"]).trim():"",
          amorti: amortiRaw==="oui" || amortiRaw==="yes" || amortiRaw==="true" || amortiRaw==="1",
          montantScope,
          montantViewOnly: montantScope!=="both" && (viewOnlyRaw==="oui" || viewOnlyRaw==="yes" || viewOnlyRaw==="true" || viewOnlyRaw==="1")
        });
      }
    });
  }
  const bsSheetName = wb.SheetNames.find(n=>U.normalize(n)==="budget_reglages");
  let budgetSettings = null;
  if(bsSheetName){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[bsSheetName], {defval:null, raw:false, header:1});
    const map = {};
    rows.forEach(row=>{
      if(!row || row.length<2) return;
      const key = U.normalize(String(row[0]||""));
      map[key] = row[1];
    });
    budgetSettings = {
      mode: map["mode"] ? String(map["mode"]).trim() : null,
      scope: map["vue (perso/couple)"] ? String(map["vue (perso/couple)"]).trim() : null,
      startMonth: map["mois de debut"] ? String(map["mois de debut"]).trim() : null,
      endMonth: map["dernier mois"] ? String(map["dernier mois"]).trim() : null,
      mainGroup: map["groupe de groupe principal"] ? String(map["groupe de groupe principal"]).trim() : null,
      extraGroups: map["groupes de groupe additionnels"] ? String(map["groupes de groupe additionnels"]).split("|").map(s=>s.trim()).filter(Boolean) : [],
      amortCategories: map["categories amorties"] ? String(map["categories amorties"]).split("|").map(s=>s.trim()).filter(Boolean) : [],
      periodFrom: map["periode affichee - de"] ? String(map["periode affichee - de"]).trim() : null,
      periodTo: map["periode affichee - a"] ? String(map["periode affichee - a"]).trim() : null,
    };
  }
  const salSheetName = wb.SheetNames.find(n=>U.normalize(n)==="budget_salaires");
  let salaryEntries = null;
  if(salSheetName){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[salSheetName], {defval:null, raw:false});
    salaryEntries = {};
    rows.forEach(r=>{
      const norm = {};
      Object.keys(r).forEach(k=>{ norm[U.normalize(k)] = r[k]; });
      const month = norm["mois"];
      if(!month) return;
      const moiRaw = norm["moi"];
      const femmeRaw = norm["ma femme"];
      const moi = (moiRaw==null || moiRaw==="") ? null : (Number(String(moiRaw).replace(",",".")) || 0);
      const femme = (femmeRaw==null || femmeRaw==="") ? null : (Number(String(femmeRaw).replace(",",".")) || 0);
      salaryEntries[String(month).trim()] = {moi, femme};
    });
  }
  const cmpSheetName = wb.SheetNames.find(n=>U.normalize(n)==="budget_comparaison");
  let compareSettings = null;
  if(cmpSheetName){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[cmpSheetName], {defval:null, raw:false, header:1});
    const map = {};
    rows.forEach(row=>{
      if(!row || row.length<2) return;
      map[U.normalize(String(row[0]||""))] = row[1];
    });
    const activeRaw = U.normalize(String(map["activee"]||""));
    const modeRaw = U.normalize(String(map["mode"]||""));
    compareSettings = {
      enabled: activeRaw==="oui" || activeRaw==="yes" || activeRaw==="true" || activeRaw==="1",
      mode: modeRaw.startsWith("budget") ? "predefined" : "period",
      periodFrom: map["periode comparee - de"] ? String(map["periode comparee - de"]).trim() : null,
      periodTo: map["periode comparee - a"] ? String(map["periode comparee - a"]).trim() : null,
    };
  }
  const predefSheetName = wb.SheetNames.find(n=>U.normalize(n)==="budget_predefini");
  let comparePredefined = null;
  if(predefSheetName){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[predefSheetName], {defval:null, raw:false});
    comparePredefined = {};
    rows.forEach(r=>{
      const norm = {};
      Object.keys(r).forEach(k=>{ norm[U.normalize(k)] = r[k]; });
      const montant = norm["montant mensuel"];
      if(montant==null || montant==="") return;
      let key = norm["cle"] ? String(norm["cle"]).trim() : "";
      if(!key){
        const groupe = norm["groupe"] ? String(norm["groupe"]).trim() : "";
        const cat = norm["categorie"] ? String(norm["categorie"]).trim() : "";
        if(!groupe) return;
        key = (cat && U.normalize(cat)==="(voyages)") ? (groupe+"::voyage") : cat ? (groupe+"::cat::"+cat) : groupe;
      }
      comparePredefined[key] = Number(String(montant).replace(",",".")) || 0;
    });
  }
  if(!sheetName && !budgetSheetName && !bsSheetName && !salSheetName && !cmpSheetName && !predefSheetName) return null;
  return {groupRules, personRules, accountTypes, accountAcronyms, groupKind, groupVoyageMonth, groupDateRange, categoryTypeOverride, budgetAdjustments, budgetSettings, salaryEntries, compareSettings, comparePredefined};
}

function parseFile(file){
  return new Promise((resolve,reject)=>{
    const name = file.name.toLowerCase();
    const isCsv = name.endsWith(".csv");
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error("Lecture du fichier impossible"));
    reader.onload = (e)=>{
      try{
        let wb;
        if(isCsv){
          wb = XLSX.read(e.target.result, {type:"binary", cellDates:true, raw:false});
        } else {
          const data = new Uint8Array(e.target.result);
          wb = XLSX.read(data, {type:"array", cellDates:true, raw:false});
        }
        const sheetName = findDataSheetName(wb);
        const sheet = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, {defval:null, raw:false, dateNF:"yyyy-mm-dd"});
        const txns = [];
        let skipped = 0;
        rows.forEach(r=>{
          const t = rowToTxn(r);
          if(t) txns.push(t); else skipped++;
        });
        const params = isCsv ? null : parseParametresSheet(wb);
        resolve({txns, skipped, total: rows.length, params});
      }catch(err){ reject(err); }
    };
    if(isCsv) reader.readAsBinaryString(file);
    else reader.readAsArrayBuffer(file);
  });
}

/* Merge new txns into store (in-memory only — caller must call Store.saveTransactions() to persist).
   mode: "replace" | "merge". Returns stats. */
function importTxns(newTxns, mode){
  if(mode === "replace"){
    Store.transactions = newTxns.slice();
    Store.transactions.sort((a,b)=>a.date-b.date);
    return {added:newTxns.length, skippedDup:0, mode};
  }
  const existingIds = new Set(Store.transactions.map(t=>t.id));
  let added=0, dup=0;
  newTxns.forEach(t=>{
    if(existingIds.has(t.id)){ dup++; return; }
    existingIds.add(t.id);
    Store.transactions.push(t);
    added++;
  });
  Store.transactions.sort((a,b)=>a.date-b.date);
  return {added, skippedDup:dup, mode};
}

   ex. "France (26-06-07)") — comparaison stricte par égalité, jamais d'ambiguïté possible avec une autre
   occurrence du même nom de base, même si leurs transactions ont des dates qui se chevauchent ; ou (2) une
   règle "base" générique (`groupe` = nom de base) qui s'applique à toute occurrence de ce nom de base non
   rattachée individuellement via une règle `full`. Une règle `full` est toujours prioritaire sur la règle
   base générique pour la même occurrence. */
function findGroupAliasRule(base, full){
  const rules = Store.settings.groupAliasRules || [];
  if(full){
    const exact = rules.find(r=> r.full === full);
    if(exact) return exact;
  }
  return rules.find(r=> !r.full && r.groupe===base) || null;

  return rule ? rule.superGroupe : t.groupe;

   groupes non rattachés à une période, afin de ne pas mélanger "Groupe" et "Période" dans les deux modes
   d'affichage désormais distincts. */
function getPeriodeDisplay(t){

   (voir resolvedSuperGroupeForOccurrence) car ceci ignore volontairement le champ `full`. */

  const rules = Store.settings.groupAliasRules || [];

  const map = new Map();
  stats.forEach((o,cat)=> map.set(cat, overrides[cat] || (o.inc>=o.exp ? "Income" : "Expense")));
  return map;
}
/* Distinct catégorie list ordered: Income (A→Z), then Expense (A→Z) */
function distinctValuesCategorieSorted(transactions){
  const items = distinctValues(transactions, "categorie");
  const typeMap = classifyCategoryTypes(transactions);
  const withType = items.map(it=>({...it, kind: typeMap.get(it.value)||"Expense"}));
  withType.sort((a,b)=>{
    if(a.kind!==b.kind) return a.kind==="Income" ? -1 : 1;
    return a.value.localeCompare(b.value, 'fr');
  });
  return withType;
}
/* Display value used when grouping/breaking down by a dimension. "groupe" et "personne" renvoient
   désormais le libellé brut de la transaction (le regroupement par groupe de groupe / groupe de
   personnes se fait via les dimensions dédiées "periode" / "groupe_personnes" ci-dessous — ces deux
   paires de modes sont volontairement distinctes dans l'Affichage de l'onglet Transactions). Pour
   "compte", on regroupe par compte réel (nom exact du compte) — le regroupement par type de compte
   (Courant/Épargne...) se fait via la dimension dédiée "type_compte".
   */
function dimDisplayValue(t, dim){
  if(dim==="groupe") return t.groupe || "(Non renseigné)";
  if(dim==="periode") return getPeriodeDisplay(t);
  if(dim==="compte") return t.compte || "(Non renseigné)";
  if(dim==="type_compte") return getAccountTypeDisplay(t.compte);
  if(dim==="personne") return t.personne || "(Non renseigné)";
  if(dim==="groupe_personnes") return getGroupePersonnesDisplay(t);
  if(dim==="type") return TYPE_LABELS_FR[t.type] || t.type || "(Non renseigné)";
  return t[dim] || "(Non renseigné)";
}

const TYPE_LABELS_FR = {Income:"Revenus", Expense:"Dépenses", Transfer:"Transferts"};

/* "AAAA-MM" -> libellé lisible ("Mai 2024"), pour les puces de filtre actif. */
function monthKeyLabel(key){
  const parts = String(key).split("-");
  const y = parseInt(parts[0],10), m = parseInt(parts[1],10)-1;
  const lbl = U.fmtMonthYear(y,m);
  return lbl.charAt(0).toUpperCase()+lbl.slice(1);
}

function getActiveChips(){

function removeChip(chip){

  else if(chip.kind==="dateTo") Filters.dateTo=null;

/* ---------------- Distinct values (for filter chip lists) ---------------- */
function distinctValues(transactions, field){
  const map = new Map();
  transactions.forEach(t=>{
    const v = t[field];
    if(v==null || v==="") return;
    map.set(v, (map.get(v)||0)+1);
  });
  return Array.from(map.entries()).sort((a,b)=>b[1]-a[1]).map(([value,count])=>({value,count}));
}

/* Mois distincts présents dans les transactions, pour le filtre "Mois indiqué" / "Mois calculé".
   mode: "indiquee" (date réelle de la transaction) | "transformee" (date après transformation
   éventuelle via la Remarque, cf. computeTransform). value = "AAAA-MM", trié du plus récent au
   plus ancien. */
function distinctMonths(transactions, mode){
  const map = new Map(); // "AAAA-MM" -> {label, sortVal, count}
  transactions.forEach(t=>{
    let y, m;
    if(mode==="transformee"){
      const ym = getCalcMonthYM(t);
      y=ym.y; m=ym.m;
    } else {
      y=t.date.getFullYear(); m=t.date.getMonth();
    }
    const key = y+"-"+U.pad2(m+1);
    if(!map.has(key)){
      const lbl = U.fmtMonthYear(y,m);
      map.set(key, {label: lbl.charAt(0).toUpperCase()+lbl.slice(1), sortVal: y*12+m, count:0});
    }
    map.get(key).count++;
  });
  return Array.from(map.entries())
    .sort((a,b)=> b[1].sortVal - a[1].sortVal)
    .map(([value,o])=>({value, label:o.label, count:o.count}));
}

/* ---------------- Account balances (always all-time, unfiltered by design) ---------------- */
function computeAccountBalances(transactions){
  const balances = new Map(); // compte -> {balance, income, expense, transferIn, transferOut}
  function ensure(name){
    if(!balances.has(name)) balances.set(name,{name,balance:0,income:0,expense:0,transferIn:0,transferOut:0,count:0});
    return balances.get(name);
  }
  transactions.forEach(t=>{
    if(!t.compte) return;
    const a = ensure(t.compte);
    a.count++;
    if(t.type==="Income"){ a.balance += t.montant; a.income += t.montant; }
    else if(t.type==="Expense"){ a.balance += t.montant; a.expense += t.montant; }
    else if(t.type==="Transfer"){
      a.balance -= t.montant; a.transferOut += t.montant;
      if(t.compteCible){
        const b = ensure(t.compteCible);
        b.balance += t.montant; b.transferIn += t.montant;
      }
    }
  });
  return Array.from(balances.values()).sort((a,b)=>b.balance-a.balance);
}

/* ---------------- Totals (income/expense/net) for a filtered set ---------------- */
function computeTotals(transactions){
  let income=0, expense=0;
  transactions.forEach(t=>{
    if(t.type==="Income") income += t.montant;
    else if(t.type==="Expense") expense += t.montant;
  });
  return {income, expense, net: income+expense};
}

/* ---------------- Breakdown by dimension (Groupe/Catégorie/Personne/Compte), for filtered set ---------------- */
function computeBreakdown(transactions, dim, opts){
  opts = opts||{};
  const onlyExpense = opts.onlyExpense;
  const map = new Map();
  transactions.forEach(t=>{
    if(t.type==="Transfer") return;
    if(onlyExpense && t.type!=="Expense") return;
    const key = dimDisplayValue(t, dim);
    if(!map.has(key)) map.set(key,{key, income:0, expense:0, net:0, count:0});
    const o = map.get(key);
    if(t.type==="Income") o.income += t.montant;
    else if(t.type==="Expense") o.expense += t.montant;
    o.net += t.montant;
    o.count++;
  });
  return Array.from(map.values());
}

/* ---------------- Time-bucketed series, respecting date basis ---------------- */
/* granularity: "year" | "month". dateBasis: "indiquee" | "transformee" */
function iterateBuckets(t, granularity, dateBasis, cb){
  // cb(bucketKey, year, month, weight, montant) — weight lets year-split divide amounts
  if(dateBasis==="transformee"){
    const tr = t.transform;
    if(tr.mode==="month"){
      const key = granularity==="year" ? String(tr.year) : tr.year+"-"+U.pad2(tr.month+1);
      cb(key, tr.year, tr.month, 1, t.montant);
      return;
    }
    if(tr.mode==="yearsplit"){
      if(granularity==="year"){
        cb(String(tr.year), tr.year, 0, 1, t.montant);
      } else {
        for(let m=0;m<12;m++){
          cb(tr.year+"-"+U.pad2(m+1), tr.year, m, 1/12, t.montant/12);
        }
      }
      return;
    }
  }
  const y = t.date.getFullYear(), m = t.date.getMonth();
  const key = granularity==="year" ? String(y) : y+"-"+U.pad2(m+1);
  cb(key, y, m, 1, t.montant);
}

function computeTimeSeries(transactions, granularity, dateBasis, dimension){
  // returns {buckets:[{key,year,month,label,income,expense,net, byDim:Map}], dimTotals:Map(dimValue->total)}
  const buckets = new Map();
  const dimTotals = new Map();
  function ensureBucket(key,year,month){
    if(!buckets.has(key)){
      const label = granularity==="year" ? String(year) : U.MONTHS_FR_SHORT[month]+" "+String(year).slice(2);
      buckets.set(key,{key,year,month,label,income:0,expense:0,net:0,byDim:new Map()});
    }
    return buckets.get(key);
  }
  transactions.forEach(t=>{
    if(t.type==="Transfer") return;
    iterateBuckets(t, granularity, dateBasis, (key,year,month,weight,amount)=>{
      const b = ensureBucket(key,year,month);
      if(t.type==="Income") b.income += amount; else b.expense += amount;
      b.net += amount;
      if(dimension){
        const dv = dimDisplayValue(t, dimension);
        b.byDim.set(dv, (b.byDim.get(dv)||0) + amount);
        dimTotals.set(dv, (dimTotals.get(dv)||0) + Math.abs(amount));
      }
    });
  });
  const arr = Array.from(buckets.values()).sort((a,b)=> a.key<b.key?-1:1);
  return {buckets:arr, dimTotals};
}

/* ================= ONGLET ÉVOLUTION — agrégation par groupe/catégorie/personne × année/mois ================= */
/* Construit l'index {sections:[{key,label,items:[{key,label,values:Map("YYYY-MM"->montant)}]}]} pour une
   dimension donnée. "reel" = date réelle de chaque transaction ; "transformee" = applique la même logique
   que le Budget (remarque -> mois réaffecté, ou montant réparti sur 12 mois pour un "yearsplit"). Les
   transferts sont toujours exclus (comme partout ailleurs dans l'app pour ces 3 dimensions). */
function buildEvolutionIndex(dimension, monthBasis){
  const sections = new Map();
  function ensureSection(key, label){
    if(!sections.has(key)) sections.set(key, {key, label, items: new Map()});
    return sections.get(key);
  }
  function ensureItem(sec, key, label){
    if(!sec.items.has(key)) sec.items.set(key, {key, label, values: new Map()});
    return sec.items.get(key);
  }
  function addAmt(item, year, month, amt){
    const ym = year+"-"+U.pad2(month+1);
    item.values.set(ym, (item.values.get(ym)||0)+amt);
  }
  /* Réparti un montant sur un ou plusieurs mois selon "reel"/"transformee" (yearsplit -> 1/12e par mois) */
  function distribute(item, t, amt){
    if(monthBasis==="reel"){
      addAmt(item, t.date.getFullYear(), t.date.getMonth(), amt);
      return;
    }
    const tr = t.transform;
    if(tr.mode==="yearsplit"){
      for(let m=0;m<12;m++) addAmt(item, tr.year, m, amt/12);
    } else if(tr.mode==="month"){
      addAmt(item, tr.year, tr.month, amt);
    } else {
      addAmt(item, t.date.getFullYear(), t.date.getMonth(), amt);
    }
  }
  const catTypeMap = dimension==="categorie" ? classifyCategoryTypes(Store.transactions) : null;

  Store.transactions.forEach(t=>{
    if(dimension==="compte"){
      // Vue Compte : reflète l'évolution du solde de chaque compte — revenus/dépenses normalement, et pour
      // un virement, -montant sur le compte source et +montant sur le compte cible (même logique que
      // computeAccountBalances), donc un virement peut alimenter DEUX comptes à la fois.
      if(t.type==="Transfer"){
        if(t.compte){
          const sec = ensureSection(getAccountTypeDisplay(t.compte), getAccountTypeDisplay(t.compte));
          distribute(ensureItem(sec, t.compte, t.compte), t, -t.montant);
        }
        if(t.compteCible){
          const sec = ensureSection(getAccountTypeDisplay(t.compteCible), getAccountTypeDisplay(t.compteCible));
          distribute(ensureItem(sec, t.compteCible, t.compteCible), t, t.montant);
        }
      } else if(t.compte){
        const sec = ensureSection(getAccountTypeDisplay(t.compte), getAccountTypeDisplay(t.compte));
        distribute(ensureItem(sec, t.compte, t.compte), t, t.montant);
      }
      return;
    }
    if(t.type==="Transfer") return;
    let sectionKey, sectionLabel, itemKey, itemLabel;
    if(dimension==="groupe"){
      if(!t.groupe) return;
      const base = t.groupeBase || U.baseGroupe(t.groupe);
      const rule = findGroupAliasRule(base, t.groupe);
      sectionLabel = rule ? rule.superGroupe : t.groupe;
      sectionKey = sectionLabel;
      itemKey = t.groupe; itemLabel = t.groupe;
    } else if(dimension==="categorie"){
      itemLabel = t.categorie || "(Non renseigné)";
      itemKey = itemLabel;
      sectionKey = (t.categorie && catTypeMap.get(t.categorie)) || t.type;
      sectionLabel = sectionKey==="Income" ? "Revenus" : "Dépenses";
    } else { // personne
      itemLabel = t.personne || "(Non renseigné)";
      itemKey = itemLabel;
      sectionLabel = t.personne ? getPersonneDisplay(t) : "(Non renseigné)";
      sectionKey = sectionLabel;
    }
    const sec = ensureSection(sectionKey, sectionLabel);
    const item = ensureItem(sec, itemKey, itemLabel);
    distribute(item, t, t.montant);
  });

  let sectionList = Array.from(sections.values()).map(s=>({...s, items: Array.from(s.items.values())}));

  // Fusions manuelles de sections (cf. Store.settings.evolution.merges[dimension])
  const merges = ((Store.settings.evolution||{}).merges||{})[dimension] || [];
  merges.forEach(merge=>{
    const memberSet = new Set(merge.members);
    const members = sectionList.filter(s=>memberSet.has(s.key));
    if(members.length<2) return;
    const merged = {key:"__merge__"+merge.name, label: merge.name, items: [], __merged:true, __members: members.map(m=>m.key)};
    const itemMap = new Map();
    members.forEach(m=>{
      m.items.forEach(it=>{
        const key = m.key+"::"+it.key; // préfixé par section d'origine pour éviter toute collision de nom
        itemMap.set(key, {...it, key, __origLabel: it.label, __origSection: m.label});
      });
    });
    merged.items = Array.from(itemMap.values());
    sectionList = sectionList.filter(s=>!memberSet.has(s.key));
    sectionList.push(merged);
  });

  sectionList.forEach(s=> s.items.sort((a,b)=> itemTotalValue(b)-itemTotalValue(a)));
  sectionList.sort((a,b)=> Math.abs(sectionTotalValue(b))-Math.abs(sectionTotalValue(a)));
  return {sections: sectionList};
}
function itemTotalValue(item){
  let s=0; item.values.forEach(v=> s+=v); return s;
}
function sectionTotalValue(section){
  let s=0; section.items.forEach(it=> s+=itemTotalValue(it)); return s;
}
function itemYearValue(item, year){
  let s=0; const prefix=year+"-"; item.values.forEach((v,ym)=>{ if(ym.startsWith(prefix)) s+=v; }); return s;
}
function sectionYearValue(section, year){
  let s=0; section.items.forEach(it=> s+=itemYearValue(it, year)); return s;
}
function itemMonthValue(item, year, month){
  return item.values.get(year+"-"+U.pad2(month+1)) || 0;
}
function sectionMonthValue(section, year, month){
  let s=0; section.items.forEach(it=> s+=itemMonthValue(it, year, month)); return s;
}
function evolutionYearsList(evoIndex){
  const years = new Set();
  evoIndex.sections.forEach(s=> s.items.forEach(it=>{
    it.values.forEach((v,ym)=> years.add(Number(ym.slice(0,4))));
  }));
  return Array.from(years).sort((a,b)=>a-b);
}

function cycleTheme(){
  const order = ["auto","light","dark"];
  let i = order.indexOf(Store.settings.theme);
  Store.settings.theme = order[(i+1)%order.length];
  Store.saveSettings();
  applyThemeToDom();
  showToast("Thème : " + ({auto:"Automatique",light:"Clair",dark:"Sombre"}[Store.settings.theme]));
}
function applyThemeToDom(){
  const t = Store.settings.theme;
  if(t==="auto"){
    document.documentElement.removeAttribute("data-theme");
    const mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
    if(mq && mq.matches) document.documentElement.setAttribute("data-theme","dark");
  } else {
    document.documentElement.setAttribute("data-theme", t);
  }
  updateThemeColorMeta();
}
/* Garde la couleur de la barre d'état Android/du navigateur synchronisée avec le thème réellement affiché
   (clair ou sombre), plutôt que la couleur par défaut du navigateur. */

  const meta = document.getElementById("theme-color-meta");

}

function capitalize(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }

/* Determine the group key/label/sort value for a transaction, given the active group-by mode */
function getGroupInfo(t, groupBy){
  if(groupBy==="day"){
    return {key:t.dateISO, label:U.fmtDateLong(t.date), sortVal:t.date.getTime()};
  }
  if(groupBy==="month_indiquee"){
    const y=t.date.getFullYear(), m=t.date.getMonth();
    return {key:y+"-"+U.pad2(m+1), label:capitalize(U.fmtMonthYear(y,m)), sortVal:y*12+m};
  }
  if(groupBy==="month_transformee"){
    const ym = AGG.getCalcMonthYM(t);
    const y=ym.y, m=ym.m;
    return {key:"t"+y+"-"+U.pad2(m+1), label:capitalize(U.fmtMonthYear(y,m)), sortVal:y*12+m};
  }
  // dimension-based grouping: groupe / categorie / compte / personne
  const v = AGG.dimDisplayValue(t, groupBy);
  return {key:v, label:v};
}
const CHRONO_MODES = ["day","month_indiquee","month_transformee"];

/* Regroupe les transactions filtrées selon le mode actif (chronologique ou par dimension), avec
   totaux par groupe et tri approprié. Fonction commune à tous les modes d'affichage. */
function computeTxnGroups(filtered, groupBy){
  const isChrono = CHRONO_MODES.includes(groupBy);
  const groups = new Map(); // key -> {key, label, sortVal, items:[], income, expense, count}
  filtered.forEach(t=>{
    const g = getGroupInfo(t, groupBy);
    if(!groups.has(g.key)) groups.set(g.key, {key:g.key, label:g.label, sortVal:g.sortVal, items:[], income:0, expense:0, count:0});
    const o = groups.get(g.key);
    o.items.push(t);
    if(t.type==="Income") o.income += t.montant;
    else if(t.type==="Expense") o.expense += t.montant;
    o.count++;
  });
  const arr = Array.from(groups.values());
  arr.forEach(g=> g.items.sort((a,b)=>b.date-a.date));
  if(isChrono){
    arr.sort((a,b)=> b.sortVal - a.sortVal);
  } else if(groupBy==="categorie"){
    // Range catégorie par Revenu puis Dépense, puis ordre alphabétique
    const typeMap = AGG.classifyCategoryTypes(filtered);
    arr.sort((a,b)=>{
      const ka = typeMap.get(a.key) || "Expense", kb = typeMap.get(b.key) || "Expense";
      if(ka!==kb) return ka==="Income" ? -1 : 1;
      return a.key.localeCompare(b.key, 'fr');
    });
  } else if(groupBy==="type"){
    // Ordre fixe : Revenus, Dépenses, Transferts
    const rank = {"Revenus":0, "Dépenses":1, "Transferts":2};
    arr.sort((a,b)=> (rank[a.key]??99) - (rank[b.key]??99));
  } else {
    arr.sort((a,b)=> (Math.abs(b.income)+Math.abs(b.expense)) - (Math.abs(a.income)+Math.abs(a.expense)));
  }
  return arr;
}

/* Affiche les groupes (Jour / Mois / Compte / Groupe / Catégorie / Personne) sous forme de cartes
   repliables identiques dans tous les modes, avec le total du groupe dans son en-tête. Par défaut,
   l'état d'ouverture de chaque groupe suit le réglage global "Tout déplier / Tout replier"
   (Store.settings.txnGroupsExpanded, persistant) ; un dépassement individuel (clic sur un groupe
   précis) est mémorisé le temps de la session (APP.state.txnOpenGroups) afin de survivre aux
   re-rendus déclenchés par "Afficher plus" ou par le chargement automatique au scroll. */
function renderTxnGroupCards(listSection, arr){
  const groupsShown = APP.state.txnGroupsShown;
  const shownGroups = arr.slice(0, groupsShown);
  const perGroupMap = APP.state.txnPerGroupShown;
  const openGroups = APP.state.txnOpenGroups;
  const allExpanded = !!Store.settings.txnGroupsExpanded;

  shownGroups.forEach(g=>{
    const net = g.income + g.expense;
    const details = document.createElement("details");
    details.className = "card txn-group-card";
    details.style.padding = "0";
    details.style.marginBottom = "10px";
    const isOpen = openGroups.has(g.key) ? openGroups.get(g.key) : allExpanded;
    if(isOpen) details.open = true;
    details.addEventListener("toggle", ()=>{
      openGroups.set(g.key, details.open);
    });

    const perShown = perGroupMap[g.key] || 10;
    const itemsToShow = g.items.slice(0, perShown);

    const summary = document.createElement("summary");
    summary.style.cssText = "list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;";
    summary.innerHTML = `
      <span style="font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;">${U.escHtml(g.label)}</span>
      <span style="display:flex;align-items:center;gap:10px;flex:0 0 auto;">
        <span style="font-size:12px;color:var(--text-sub);font-weight:600;">${g.count}</span>
        <span style="font-weight:800;font-size:13.5px;color:${net>=0?'var(--income)':'var(--expense)'}">${U.fmtMoneySigned(net)}</span>
      </span>
    `;
    details.appendChild(summary);

    const body = document.createElement("div");
    body.style.cssText = "padding:0 0 10px;";
    itemsToShow.forEach(t=>{
      const el = makeTxnItemEl(t);
      el.style.margin = "6px 6px 0";
      body.appendChild(el);
    });
    if(g.items.length > perShown){
      const more = document.createElement("button");
      more.className = "btn btn-ghost btn-sm";
      more.style.cssText = "display:block;width:calc(100% - 12px);margin:8px 6px 0;";
      more.textContent = "Afficher plus ("+(g.items.length-perShown)+" restantes)";
      more.onclick = (ev)=>{ ev.preventDefault(); perGroupMap[g.key] = perShown + 15; renderTransactions(); };
      body.appendChild(more);
    }
    details.appendChild(body);
    listSection.appendChild(details);
  });
}

/* Chargement automatique au scroll : dévoile davantage de groupes quand la sentinelle en bas de
   liste approche du viewport, sans bouton "Charger plus" à cliquer. */
function setupTxnInfiniteScroll(sentinel, arr){
  if(txnScrollObserver){ txnScrollObserver.disconnect(); txnScrollObserver=null; }
  const groupsShown = APP.state.txnGroupsShown;
  if(arr.length <= groupsShown) return;
  txnScrollObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        txnScrollObserver.disconnect();
        txnScrollObserver = null;
        APP.state.txnGroupsShown += 20;
        renderTransactions();
      }
    });
  }, {root:null, rootMargin:"600px"});
  txnScrollObserver.observe(sentinel);
}

/* ================= PICKER PLEIN ÉCRAN (sélection en un seul appui) ================= */
/* Remplace les <select> natifs (qui exigent un second appui "OK" sur mobile) par une liste
   dans laquelle taper une valeur la sélectionne immédiatement et referme l'écran.
   opts.hierarchy (optionnel) : {sections: Map(nom du groupe de groupe -> [{base, count}]), flat: [{base, count}]}
   Si fourni, affiche les groupes de groupe (triés alphabétiquement) en en-tête dépliable —
   taper l'en-tête sélectionne le groupe de groupe, taper un élément à l'intérieur sélectionne ce groupe précis —
   puis les groupes non classés (triés alphabétiquement) en dessous. */
function renderPickerList(opts){
  const sheet = document.getElementById("sheet-picker");
  const options = opts.options || [];
  const hasHierarchy = !!opts.hierarchy;

  function hierarchyListHtml(){
    const h = opts.hierarchy;
    const sectionNames = Array.from(h.sections.keys()).sort((a,b)=>a.localeCompare(b,'fr'));
    let html = sectionNames.map((sup,idx)=>{
      const children = h.sections.get(sup).slice().sort((a,b)=>a.base.localeCompare(b.base,'fr'));
      return `<div class="groupe-section">
        <div class="check-item groupe-section-head ${sup===opts.value?'selected':''}" data-pv="${U.escHtml(sup)}">
          <span class="lbl" style="font-weight:800;">${U.escHtml(sup)}</span>
          <span class="cnt">${children.length}</span>
          <button type="button" class="icon-btn pk-expand-btn" data-expand="pk-hsec-${idx}" style="width:30px;height:30px;flex:0 0 auto;">${ICONS.arrowLeft.replace('<svg ','<svg style="width:14px;height:14px;transform:rotate(-90deg);" ')}</button>
        </div>
        <div class="groupe-section-children" id="pk-hsec-${idx}" style="display:none;">
          ${children.map(c=>`
            <div class="check-item ${c.base===opts.value?'selected':''}" data-pv="${U.escHtml(c.base)}">
              <span class="lbl">${U.escHtml(c.base)}</span><span class="cnt">${c.count}</span>
            </div>
          `).join("")}
        </div>
      </div>`;
    }).join("");
    const flat = h.flat.slice().sort((a,b)=>a.base.localeCompare(b.base,'fr'));
    html += flat.map(f=>`
      <div class="check-item ${f.base===opts.value?'selected':''}" data-pv="${U.escHtml(f.base)}">
        <span class="lbl">${U.escHtml(f.base)}</span><span class="cnt">${f.count}</span>
      </div>
    `).join("");
    return html;
  }

  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h2>${U.escHtml(opts.title)}</h2><button class="icon-btn" id="pk-close">${ICONS.close}</button></div>
    <div class="sheet-body">
      ${(hasHierarchy || options.length>6) ? `<input type="text" class="search-mini" id="pk-search" placeholder="Rechercher…">` : ""}
      <div class="check-list" style="max-height:none;" id="pk-list">
        <div class="check-item ${!opts.value?'selected':''}" data-pv="">
          <span class="lbl" style="color:var(--text-faint);">— Aucun(e) —</span>
        </div>
        ${hasHierarchy ? hierarchyListHtml() : options.map(v=>`
          <div class="check-item ${v===opts.value?'selected':''}" data-pv="${U.escHtml(v)}">
            <span class="lbl">${U.escHtml(v)}</span>
          </div>
        `).join("")}
        ${opts.allowNew ? `
        <div class="check-item" data-pv="__new__" style="color:var(--primary);font-weight:700;">
          <span class="lbl">${U.escHtml(opts.newLabel || "+ Nouveau…")}</span>
        </div>` : ""}
      </div>
    </div>
  `;
  document.getElementById("pk-close").onclick = ()=>APP.closeOverlay("overlay-picker");
  document.querySelectorAll(".pk-expand-btn").forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const target = document.getElementById(btn.dataset.expand);
      const open = target.style.display!=="none";
      target.style.display = open ? "none" : "block";
      btn.style.transform = open ? "" : "rotate(180deg)";
    };
  });
  const search = document.getElementById("pk-search");
  if(search){
    search.oninput = ()=>{
      const q = U.normalize(search.value);
      document.querySelectorAll("#pk-list [data-pv]").forEach(el=>{
        if(el.dataset.pv==="" || el.dataset.pv==="__new__"){ return; }
        const match = U.normalize(el.dataset.pv).includes(q);
        el.style.display = match ? "flex" : "none";
        if(match && q && el.closest(".groupe-section-children")){
          el.closest(".groupe-section-children").style.display = "block";
        }
      });
    };
  }
  document.querySelectorAll("#pk-list [data-pv]").forEach(el=>{
    el.onclick = ()=>{
      const v = el.dataset.pv;
      if(v==="__new__"){ renderPickerNew(opts); return; }
      APP.closeOverlay("overlay-picker");
      opts.onSelect(v);
    };
  });
}

function categorieList(){
  const items = AGG.distinctValuesCategorieSorted(Store.transactions); // [{value,count,kind}]

}

      // la bonne ligne.
      let toAdd = updated;
      if(Store.transactions.some(x=>x.id===toAdd.id)){

      Store.transactions.push(toAdd);

      APP.refreshCurrentTab();
      Store.saveTransactions().then(ok=>{
        APP.showToast(ok ? "Transaction ajoutée" : "Ajoutée, mais la sauvegarde a échoué");

      APP.showToast(ok ? "Transaction modifiée" : "Modifiée, mais la sauvegarde a échoué");
    });
  };

  APP.openOverlay("overlay-detail");
}

(function(){

const U = window.__SF_UTILS;

const AGG = window.__SF_AGG;
