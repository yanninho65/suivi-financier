<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#F0F1F4" id="theme-color-meta">
<title>Suivi financier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F0F1F4;
  --card:#FFFFFF;
  --card-alt:#F6F7F9;
  --primary:#1259D6;
  --primary-soft:#E7EFFE;
  --primary-tap:#0D46AD;
  --text:#181A1E;
  --text-sub:#6B707A;
  --text-faint:#9AA0AC;
  --divider:#E7E9ED;
  --income:#1A9E63;
  --income-soft:#E6F6EE;
  --expense:#E4402E;
  --expense-soft:#FCEBE9;
  --transfer:#8A5CF6;
  --transfer-soft:#F1EBFF;
  --radius-xl:30px;
  --radius-lg:24px;
  --radius-md:18px;
  --radius-sm:12px;
  --shadow-1: 0 1px 3px rgba(20,20,30,.06), 0 6px 18px rgba(20,20,30,.05);
  --shadow-2: 0 8px 30px rgba(20,20,30,.14);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"]{
  --bg:#0E0F12;
  --card:#1A1B1F;
  --card-alt:#212226;
  --primary:#4C8DFF;
  --primary-soft:#132A4E;
  --primary-tap:#6BA1FF;
  --text:#F1F2F4;
  --text-sub:#9BA0AC;
  --text-faint:#6E727C;
  --divider:#2A2C31;
  --income:#3FCE8E;
  --income-soft:#123324;
  --expense:#FF6B5E;
  --expense-soft:#3A1917;
  --transfer:#B49BFF;
  --transfer-soft:#251C40;
  --shadow-1: 0 1px 3px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  --shadow-2: 0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Roboto",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
input,select{font-family:inherit;}
::-webkit-scrollbar{width:0;height:0;}

.app{max-width:560px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(150px + var(--safe-bottom));}

/* ---------- Top bar ---------- */
.topbar{padding:22px 20px 10px;}
.topbar-row{display:flex;align-items:center;justify-content:space-between;}
.app-title{font-size:30px;font-weight:900;letter-spacing:-.5px;margin:0;}
.topbar-actions{display:flex;gap:8px;}
.icon-btn{
  width:42px;height:42px;border-radius:50%;border:none;background:var(--card);
  display:flex;align-items:center;justify-content:center;color:var(--text);
  box-shadow:var(--shadow-1); cursor:pointer;
}
.icon-btn:active{background:var(--card-alt);}
.icon-btn svg{width:20px;height:20px;}
.balance-hero{margin-top:18px;}
.balance-hero .label{font-size:14px;color:var(--text-sub);font-weight:500;}
.balance-hero .amount{font-size:40px;font-weight:900;letter-spacing:-1px;margin-top:2px;}
.balance-hero .sub{display:flex;gap:16px;margin-top:10px;}
.balance-hero .sub .chip{font-size:13px;font-weight:700;padding:6px 12px;border-radius:100px;}
.chip-in{background:var(--income-soft);color:var(--income);}
.chip-out{background:var(--expense-soft);color:var(--expense);}

/* ---------- Sections / Cards ---------- */
.section{padding:6px 20px 0;}
.section-title{font-size:13px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:.5px;margin:22px 4px 10px;}
.card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:16px;}
.card + .card{margin-top:10px;}
.rowline{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;}
.rowline + .rowline{border-top:1px solid var(--divider);}

.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 30px;color:var(--text-sub);}
.empty-state svg{width:60px;height:60px;color:var(--text-faint);margin-bottom:14px;}
.empty-state h3{margin:0 0 6px;color:var(--text);font-size:19px;}
.empty-state p{margin:0 0 20px;font-size:14px;line-height:1.5;}
.btn{
  border:none;border-radius:100px;padding:13px 22px;font-weight:700;font-size:14.5px;
  cursor:pointer; display:inline-flex;align-items:center;gap:8px;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:active{background:var(--primary-tap);}
.btn-ghost{background:var(--card-alt);color:var(--text);}
.btn-ghost:active{background:var(--divider);}
.btn-sm{padding:9px 16px;font-size:13px;}
.btn-block{width:100%;justify-content:center;}

/* ---------- Tabs content views ---------- */
.view{display:none;}
.view.active{display:block;}

/* ---------- Bottom floating search/filter bar ---------- */
.float-bar-wrap{
  position:fixed;left:0;right:0;bottom:calc(72px + var(--safe-bottom));
  display:none;justify-content:center;pointer-events:none;z-index:40;
  padding:0 16px;
}
.float-bar{
  pointer-events:auto;
  width:100%;max-width:528px;
  background:var(--card);
  border-radius:100px;
  box-shadow:var(--shadow-2);
  display:flex;align-items:center;gap:6px;
  padding:6px 6px 6px 18px;
}
.float-bar input{
  flex:1;border:none;outline:none;background:transparent;color:var(--text);
  font-size:15px;padding:10px 0;
}
.float-bar input::placeholder{color:var(--text-faint);}
.float-bar .fbtn{
  width:42px;height:42px;flex:0 0 auto;border-radius:50%;border:none;
  background:var(--card-alt);display:flex;align-items:center;justify-content:center;
  color:var(--text);position:relative;cursor:pointer;
}
.float-bar .fbtn.active-filter{background:var(--primary);color:#fff;}
.float-bar .fbtn svg{width:19px;height:19px;}
.filter-badge{
  position:absolute;top:-2px;right:-2px;background:var(--expense);color:#fff;
  font-size:10px;font-weight:800;border-radius:50%;min-width:16px;height:16px;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--card);
  border-top:1px solid var(--divider);
  padding:8px 6px calc(8px + var(--safe-bottom));
  display:flex;justify-content:space-around;
  z-index:39;
  max-width:560px;margin:0 auto;
}
.navbtn{
  border:none;background:transparent;display:flex;flex-direction:column;align-items:center;
  gap:3px;color:var(--text-faint);font-size:10.5px;font-weight:700;padding:6px 8px;border-radius:14px;
  cursor:pointer;flex:1;
}
.navbtn svg{width:22px;height:22px;}
.navbtn.active{color:var(--primary);}

/* ---------- Modal / bottom sheet ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:60;
  display:none;align-items:flex-end;justify-content:center;
}
.overlay.open{display:flex;}
.overlay.overlay-large{align-items:stretch;}
.sheet{
  width:100%;max-width:560px;background:var(--bg);
  border-radius:26px 26px 0 0;
  max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;
  animation:slideup .22s ease-out;
}
.sheet-large{max-height:100vh;height:100vh;max-height:100dvh;height:100dvh;border-radius:0;}
@keyframes slideup{from{transform:translateY(30px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:38px;height:5px;background:var(--divider);border-radius:10px;margin:12px auto 4px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 12px;}
.sheet-head h2{font-size:19px;margin:0;font-weight:800;}
.sheet-body{overflow-y:auto;padding:0 20px 20px;flex:1 1 auto;min-height:0;}
.sheet-foot{padding:14px 20px calc(16px + var(--safe-bottom));border-top:1px solid var(--divider);display:flex;gap:10px;background:var(--bg);}
.sheet-foot .btn{flex:1;}

.modal-center-wrap{align-items:center;}
.modal-center{
  width:92%;max-width:420px;background:var(--card);border-radius:var(--radius-lg);
  padding:22px;animation:popin .18s ease-out;
}
@keyframes popin{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}

/* ---------- Filter sheet content ---------- */
.filter-group{margin-bottom:22px;}
.filter-group h4{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-sub);margin:0 0 10px;font-weight:700;}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;}
.chip-opt{
  border:1.5px solid var(--divider);background:var(--card);color:var(--text);
  border-radius:100px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.chip-opt.selected{background:var(--primary);border-color:var(--primary);color:#fff;}

.chips-bar{display:flex;flex-wrap:wrap;gap:8px;padding:2px 4px 10px;}
.chip-active{
  display:flex;align-items:center;gap:7px;background:var(--primary-soft);color:var(--primary);
  border-radius:100px;padding:6px 6px 6px 13px;font-size:12.5px;font-weight:700;max-width:100%;
}
.chip-active span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
.chip-active .chip-x{
  border:none;background:rgba(18,89,214,.14);color:inherit;width:19px;height:19px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:0 0 auto;
}
[data-theme="dark"] .chip-active .chip-x{background:rgba(76,141,255,.22);}
.chip-active .chip-x svg{width:10px;height:10px;stroke-width:3;}
.chip-clearall{border:none;background:transparent;color:var(--text-sub);font-size:12.5px;font-weight:700;text-decoration:underline;cursor:pointer;padding:6px 4px;}
.search-mini{
  width:100%;border:1.5px solid var(--divider);background:var(--card);border-radius:14px;
  padding:10px 14px;font-size:14px;color:var(--text);outline:none;margin-bottom:10px;
}
.check-list{max-height:46vh;overflow-y:auto;border:1px solid var(--divider);border-radius:14px;background:var(--card);}
.check-item{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:14px;border-bottom:1px solid var(--divider);cursor:pointer;}
.check-item:last-child{border-bottom:none;}
.check-item .cbox{width:19px;height:19px;border-radius:6px;border:2px solid var(--text-faint);flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
.check-item.selected .cbox{background:var(--primary);border-color:var(--primary);}
.check-item.selected .cbox svg{width:12px;height:12px;color:#fff;}
.check-item .lbl{flex:1;}
.check-item .cnt{color:var(--text-faint);font-size:12px;}
.groupe-section{border-bottom:1px solid var(--divider);}
.groupe-section:last-child{border-bottom:none;}
.groupe-section-head{border-bottom:none;background:var(--card-alt);}
.groupe-section-children{padding-left:18px;background:var(--card);}
.groupe-section-children .check-item{border-bottom:1px solid var(--divider);}
.groupe-section-children .check-item:last-child{border-bottom:none;}
.daterange{display:flex;gap:10px;}
.daterange input{flex:1;border:1.5px solid var(--divider);border-radius:14px;padding:10px 12px;font-size:14px;background:var(--card);color:var(--text);}
.seg{display:flex;background:var(--card-alt);border-radius:100px;padding:4px;}
.seg button{flex:1;border:none;background:transparent;padding:9px;border-radius:100px;font-size:13px;font-weight:700;color:var(--text-sub);cursor:pointer;}
.seg button.active{background:var(--primary);color:#fff;}

/* ---------- Transactions list ---------- */
.txn-date-label{font-size:12.5px;font-weight:700;color:var(--text-sub);margin:18px 4px 8px;text-transform:capitalize;}
.txn-item{
  display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);
  border-radius:var(--radius-md);box-shadow:var(--shadow-1);cursor:pointer;
}
.txn-item + .txn-item{margin-top:8px;}
.txn-ico{
  width:40px;height:40px;border-radius:50%;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;
}
.txn-ico.inc{background:var(--income-soft);color:var(--income);}
.txn-ico.exp{background:var(--expense-soft);color:var(--expense);}
.txn-ico.trf{background:var(--transfer-soft);color:var(--transfer);}
.txn-mid{flex:1;min-width:0;}
.txn-title{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.txn-sub{font-size:12px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.txn-amt{font-size:14.5px;font-weight:800;flex:0 0 auto;text-align:right;}
.txn-amt.inc{color:var(--income);}
.txn-amt.exp{color:var(--expense);}
.txn-amt.trf{color:var(--transfer);}

.loadmore-wrap{display:flex;justify-content:center;margin-top:16px;}

/* ---------- Breakdown / evolution lists ---------- */
.bd-row{display:flex;align-items:center;gap:12px;padding:11px 4px;}
.bd-row + .bd-row{border-top:1px solid var(--divider);}
.bd-dot{width:11px;height:11px;border-radius:4px;flex:0 0 auto;}
.bd-name{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bd-bar-wrap{position:relative;height:6px;background:var(--card-alt);border-radius:6px;margin-top:6px;overflow:hidden;}
.bd-bar{position:absolute;left:0;top:0;bottom:0;border-radius:6px;}
.bd-val{font-size:13.5px;font-weight:800;flex:0 0 auto;min-width:76px;text-align:right;}
.bd-item{padding:6px 4px;}
.bd-item + .bd-item{border-top:1px solid var(--divider);}

.dimtabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;}
.dimtabs button{
  white-space:nowrap;border:none;background:var(--card-alt);color:var(--text-sub);
  font-weight:700;font-size:13px;padding:9px 16px;border-radius:100px;cursor:pointer;flex:0 0 auto;
}
.dimtabs button.active{background:var(--primary);color:#fff;}

details.card summary{list-style:none;}
details.card summary::-webkit-details-marker{display:none;}
details.card summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--text-faint);border-bottom:2px solid var(--text-faint);transform:rotate(-45deg);transition:transform .15s;flex:0 0 auto;margin-left:4px;}
details.card[open] summary::after{transform:rotate(45deg);}

.chart-wrap{position:relative;height:230px;margin-top:6px;}
.chart-wrap.tall{height:260px;}

/* ---------- Account cards ---------- */
.acc-card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;}
.acc-card + .acc-card{margin-top:10px;}
.acc-ico{width:44px;height:44px;border-radius:16px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:0 0 auto;}
.acc-mid{flex:1;min-width:0;}
.acc-name{font-weight:700;font-size:14.5px;}
.acc-flows{font-size:11.5px;color:var(--text-sub);margin-top:2px;}
.acc-bal{font-weight:800;font-size:16px;text-align:right;flex:0 0 auto;}

/* ---------- Import ---------- */
.dropzone{
  border:2px dashed var(--divider);border-radius:var(--radius-lg);padding:30px 16px;text-align:center;
  cursor:pointer;background:var(--card-alt);
}
.dropzone svg{width:34px;height:34px;color:var(--text-faint);margin-bottom:8px;}
.dropzone p{margin:4px 0 0;font-size:13.5px;color:var(--text-sub);}
.dropzone .fname{font-weight:700;color:var(--text);margin-top:8px;font-size:14px;word-break:break-all;}
.radio-opt{display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:16px;border:1.5px solid var(--divider);cursor:pointer;}
.radio-opt + .radio-opt{margin-top:10px;}
.radio-opt.selected{border-color:var(--primary);background:var(--primary-soft);}
.radio-opt .rc{width:20px;height:20px;border-radius:50%;border:2px solid var(--text-faint);flex:0 0 auto;margin-top:1px;display:flex;align-items:center;justify-content:center;}
.radio-opt.selected .rc{border-color:var(--primary);}
.radio-opt.selected .rc::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary);}
.radio-opt .rt{font-weight:700;font-size:14.5px;}
.radio-opt .rd{font-size:12.5px;color:var(--text-sub);margin-top:2px;}
.import-summary{background:var(--card-alt);border-radius:16px;padding:14px;font-size:13.5px;margin-top:14px;line-height:1.6;}
.import-summary b{color:var(--text);}

.toast{
  position:fixed;left:50%;bottom:calc(160px + var(--safe-bottom));transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:12px 20px;border-radius:100px;font-size:13.5px;font-weight:600;
  z-index:80;box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;
  max-width:86%;text-align:center;
}
.toast.toast-long{border-radius:20px;text-align:left;line-height:1.5;}
.toast.show{opacity:1;bottom:calc(180px + var(--safe-bottom));}

.field-label{font-size:12.5px;font-weight:700;color:var(--text-sub);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.4px;}
.detail-row{display:flex;justify-content:space-between;padding:10px 2px;font-size:14px;}
.detail-row span:first-child{color:var(--text-sub);}
.detail-row span:last-child{font-weight:700;}

@media (max-width:360px){
  .app-title{font-size:26px;}
  .balance-hero .amount{font-size:33px;}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================

(function(){

const ICONS = {

  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>',

/* ---------------- Utils ---------------- */
function normalize(s){
  return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
}
function escHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(n){
  if(n==null || isNaN(n)) n=0;
  const sign = n<0 ? "-" : "";
  const abs = Math.abs(n);
  return sign + abs.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0}) + " €";
}
function fmtMoneySigned(n){
  return (n>0? "+ " : (n<0? "- " : "")) + Math.abs(n).toLocaleString('fr-FR') + " €";
}
const MONTHS_FR = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MONTHS_FR_SHORT = ["jan.","fév.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const DAYS_FR = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
function pad2(n){return String(n).padStart(2,"0");}
function toISO(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function fmtDateLong(d){return DAYS_FR[d.getDay()]+" "+d.getDate()+" "+MONTHS_FR[d.getMonth()]+" "+d.getFullYear();}
function fmtDateShort(d){return pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+"/"+d.getFullYear();}
function fmtMonthYear(y,m){return MONTHS_FR[m]+" "+y;}
function debounce(fn,ms){let t;return function(...a){clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),ms);};}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}

/* ---------------- Date parsing ---------------- */
function parseDateValue(val){
  if(val==null || val==="") return null;
  if(val instanceof Date && !isNaN(val)) return new Date(val.getFullYear(),val.getMonth(),val.getDate());
  if(typeof val === "number"){
    // Excel serial date
    const epoch = new Date(Date.UTC(1899,11,30));
    const d = new Date(epoch.getTime() + val*86400000);
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }
  const s = String(val).trim();
  let m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
  if(m){
    const day=parseInt(m[1],10), month=parseInt(m[2],10), year=parseInt(m[3],10);
    if(month>=1&&month<=12&&day>=1&&day<=31) return new Date(year,month-1,day);
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return new Date(parseInt(m[1],10),parseInt(m[2],10)-1,parseInt(m[3],10));
  const fallback = new Date(s);
  if(!isNaN(fallback)) return new Date(fallback.getFullYear(),fallback.getMonth(),fallback.getDate());
  return null;
}

/* remarque -> transformed date info */
function computeTransform(remarque){
  const r = String(remarque||"").trim();
  let m = r.match(/(\d{2})-(\d{2})$/);
  if(m){
    const mm = parseInt(m[2],10);
    if(mm>=1 && mm<=12){
      const yy = parseInt(m[1],10);
      const year = 2000+yy;
      return {mode:"month", year, month: mm-1};
    }
  }
  m = r.match(/(?:^|[^0-9])(\d{4})$/);
  if(m){
    const year = parseInt(m[1],10);
    if(year>=1990 && year<=2100){
      return {mode:"yearsplit", year};
    }
  }
  return {mode:"same"};
}

/* ---------------- Type normalization ---------------- */
function normType(t){
  const n = normalize(t);
  if(n.startsWith("inc") || n==="revenu") return "Income";
  if(n.startsWith("exp") || n==="depense") return "Expense";
  if(n.startsWith("trans") || n==="virement") return "Transfer";
  return t;
}

/* Strips a trailing parenthetical period marker from a "Groupe" value,
   e.g. "Cliff Haven (23-01-08)" -> "Cliff Haven", "France (22-07)" -> "France".
   Values without a trailing parenthetical are returned unchanged. */
function baseGroupe(str){
  const s = String(str||"").trim();
  const m = s.match(/^(.*?)\s*\([^)]*\)\s*$/);
  return m ? m[1].trim() : s;
}

/* Traduit une erreur de stockage (IndexedDB ou localStorage) en message compréhensible */
function describeStorageError(e, byteLen){
  const name = e && e.name ? e.name : "";
  const sizeMb = byteLen ? (byteLen/1048576).toFixed(1)+" Mo" : "";
  if(name === "QuotaExceededError" || name === "NS_ERROR_DOM_QUOTA_REACHED"){
    return "Espace de stockage insuffisant sur cet appareil pour enregistrer vos données"+(sizeMb?` (~${sizeMb})`:"")+". Libérez de l'espace (autres apps, navigation privée…) ou exportez régulièrement une sauvegarde.";
  }
  if(name === "InvalidStateError"){
    return "Le stockage local a été fermé ou est inaccessible (onglet en arrière-plan, navigation privée). Rouvrez la page et réessayez.";
  }
  if(name === "VersionError"){
    return "Conflit de version de la base de données locale (probablement un autre onglet de l'application ouvert). Fermez les autres onglets et réessayez.";
  }
  if(!window.indexedDB){
    return "IndexedDB n'est pas disponible sur ce navigateur (mode privé strict ou navigateur ancien).";
  }
  return "Erreur de stockage" + (name?` (${name})`:"") + (e && e.message ? " : "+e.message : "") + ".";
}

/* ---------------- IndexedDB (grande capacité de stockage) ---------------- */
const IDB_NAME = "sf_finance_db";
const IDB_STORE = "kv";
let _idbPromise = null;
function idbOpen(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error("IndexedDB indisponible")); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return _idbPromise;
}
function idbGet(key){
  return idbOpen().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,"readonly");
    const r = tx.objectStore(IDB_STORE).get(key);
    r.onsuccess = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
  }));
}
function idbSet(key,val){
  return idbOpen().then(db=>new Promise((resolve,reject)=>{
    let tx;
    try{
      tx = db.transaction(IDB_STORE,"readwrite");
    }catch(e){ reject(e); return; }
    tx.onabort = ()=>reject(tx.error || new Error("Transaction IndexedDB annulée"));
    tx.onerror = ()=>reject(tx.error || new Error("Erreur de transaction IndexedDB"));
    let r;
    try{
      r = tx.objectStore(IDB_STORE).put(val,key);
    }catch(e){ reject(e); return; }
    r.onsuccess = ()=>resolve(true);
    r.onerror = ()=>{ reject(r.error); };
  }));
}
function idbDelete(key){
  return idbOpen().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,"readwrite");
    const r = tx.objectStore(IDB_STORE).delete(key);
    r.onsuccess = ()=>resolve(true);
    r.onerror = ()=>reject(r.error);
  }));
}

/* ---------------- Header mapping ---------------- */
const HEADER_MAP = {
  "date":"date",
  "montant":"montant",
  "type":"type",
  "categorie":"categorie",
  "categorie de depense":"categorie",
  "categorie de la depense":"categorie",
  "personne":"personne",
  "compte":"compte",
  "compte cible":"compteCible",
  "comptecible":"compteCible",
  "groupe":"groupe",
  "remarque":"remarque",
};

function buildTxnId(t){
  return [t.dateISO,t.montant,t.type,t.categorie||"",t.personne||"",t.compte||"",t.compteCible||"",t.groupe||"",t.remarque||""].join("|");
}

/* Turn a raw row object (header->value) into a transaction, or null if invalid */
function rowToTxn(row){
  const mapped = {};
  Object.keys(row).forEach(k=>{
    const norm = U.normalize(k);
    const field = HEADER_MAP[norm];
    if(field) mapped[field] = row[k];
  });
  if(mapped.date==null || mapped.montant==null) return null;
  const date = U.parseDateValue(mapped.date);
  if(!date) return null;
  let montant = mapped.montant;
  if(typeof montant === "string") montant = parseFloat(montant.replace(/\s/g,"").replace(",","."));
  montant = Number(montant);
  if(isNaN(montant)) return null;
  const type = U.normType(mapped.type);
  const remarque = mapped.remarque==null ? "" : String(mapped.remarque).trim();
  const transform = U.computeTransform(remarque);

  const groupe = mapped.groupe==null? "" : String(mapped.groupe).trim();
  const t = {
    date, dateISO: U.toISO(date),
    montant, type,
    categorie: mapped.categorie==null? "" : String(mapped.categorie).trim(),
    personne: mapped.personne==null? "" : String(mapped.personne).trim(),
    compte: mapped.compte==null? "" : String(mapped.compte).trim(),
    compteCible: mapped.compteCible==null? "" : String(mapped.compteCible).trim(),
    groupe,
    groupeBase: groupe ? U.baseGroupe(groupe) : "",
    remarque,
    transform,
  };
  t.id = buildTxnId(t);
  return t;
}

/* Parse a File (xlsx/xls/csv) -> Promise<transactions[]> */
/* Locate the sheet holding transaction rows (has Date + Montant headers), ignoring a "Paramètres" sheet */
function findDataSheetName(wb){
  for(const name of wb.SheetNames){
    if(U.normalize(name)==="parametres") continue;
    const sheet = wb.Sheets[name];
    if(!sheet || !sheet['!ref']) continue;
    const headerRow = XLSX.utils.sheet_to_json(sheet, {header:1, defval:null})[0];
    if(headerRow){
      const normHeaders = headerRow.map(h=>U.normalize(h));
      if(normHeaders.includes("date") && normHeaders.includes("montant")) return name;
    }
  }
  return wb.SheetNames.find(n=>U.normalize(n)!=="parametres") || wb.SheetNames[0];
}

/* Parses an optional "Paramètres" sheet: group-alias rules (Groupe / Groupe de groupe / Date début / Date fin)
   and account types (Compte / Type de compte). Returns null if the sheet isn't found. */
function parseParametresSheet(wb){
  const sheetName = wb.SheetNames.find(n=>U.normalize(n)==="parametres");
  const groupRules = [];
  const personRules = [];
  const accountTypes = {};
  const groupKind = {};
  const groupVoyageMonth = {};
  if(sheetName){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {defval:null, raw:false});
    rows.forEach(r=>{
      const norm = {};
      Object.keys(r).forEach(k=>{ norm[U.normalize(k)] = r[k]; });
      const groupe = norm["groupe"];
      const superGroupe = norm["groupe de groupe"];
      const compte = norm["compte"];
      const typeCompte = norm["type de compte"];
      const personne = norm["personne"];
      const superPersonne = norm["groupe de personnes"];
      const kGroupe = norm["groupe (type budget)"];
      const kType = norm["type budget (quotidien/voyage)"];
      const kMonth = norm["mois voyage (aaaa-mm)"];
      if(groupe && superGroupe){
        const df = U.parseDateValue(norm["date debut"]);
        const dt = U.parseDateValue(norm["date fin"]);
        groupRules.push({
          groupe: String(groupe).trim(),
          superGroupe: String(superGroupe).trim(),
          dateFrom: df ? U.toISO(df) : null,
          dateTo: dt ? U.toISO(dt) : null
        });
      }
      if(personne && superPersonne){
        personRules.push({
          personne: String(personne).trim(),
          superPersonne: String(superPersonne).trim()
        });
      }
      if(compte && typeCompte){
        accountTypes[String(compte).trim()] = String(typeCompte).trim();
      }
      if(kGroupe && kType){
        const base = String(kGroupe).trim();
        groupKind[base] = U.normalize(kType).startsWith("voy") ? "voyage" : "quotidien";
        if(kMonth) groupVoyageMonth[base] = String(kMonth).trim();
      }
    });
  }
  const budgetSheetName = wb.SheetNames.find(n=>U.normalize(n)==="budget");
  const budgetAdjustments = [];
  if(budgetSheetName){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[budgetSheetName], {defval:null, raw:false});
    rows.forEach(r=>{
      const norm = {};
      Object.keys(r).forEach(k=>{ norm[U.normalize(k)] = r[k]; });
      const month = norm["mois"], groupe = norm["groupe"], montant = norm["montant"];
      if(month && groupe && montant!=null){
        budgetAdjustments.push({
          month: String(month).trim(), groupe: String(groupe).trim(),
          categorie: norm["categorie"]?String(norm["categorie"]).trim():"",
          montant: Number(String(montant).replace(",",".")) || 0,
          remarque: norm["remarque"]?String(norm["remarque"]).trim():""
        });
      }
    });
  }
  if(!sheetName && !budgetSheetName) return null;
  return {groupRules, personRules, accountTypes, groupKind, groupVoyageMonth, budgetAdjustments};
}

function parseFile(file){
  return new Promise((resolve,reject)=>{
    const name = file.name.toLowerCase();
    const isCsv = name.endsWith(".csv");
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error("Lecture du fichier impossible"));
    reader.onload = (e)=>{
      try{
        let wb;
        if(isCsv){
          wb = XLSX.read(e.target.result, {type:"binary", cellDates:true, raw:false});
        } else {
          const data = new Uint8Array(e.target.result);
          wb = XLSX.read(data, {type:"array", cellDates:true, raw:false});
        }
        const sheetName = findDataSheetName(wb);
        const sheet = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, {defval:null, raw:false, dateNF:"yyyy-mm-dd"});
        const txns = [];
        let skipped = 0;
        rows.forEach(r=>{
          const t = rowToTxn(r);
          if(t) txns.push(t); else skipped++;
        });
        const params = isCsv ? null : parseParametresSheet(wb);
        resolve({txns, skipped, total: rows.length, params});
      }catch(err){ reject(err); }
    };
    if(isCsv) reader.readAsBinaryString(file);
    else reader.readAsArrayBuffer(file);
  });
}

/* Merge new txns into store (in-memory only — caller must call Store.saveTransactions() to persist).
   mode: "replace" | "merge". Returns stats. */
function importTxns(newTxns, mode){
  if(mode === "replace"){
    Store.transactions = newTxns.slice();
    Store.transactions.sort((a,b)=>a.date-b.date);
    return {added:newTxns.length, skippedDup:0, mode};
  }
  const existingIds = new Set(Store.transactions.map(t=>t.id));
  let added=0, dup=0;
  newTxns.forEach(t=>{
    if(existingIds.has(t.id)){ dup++; return; }
    existingIds.add(t.id);
    Store.transactions.push(t);
    added++;
  });
  Store.transactions.sort((a,b)=>a.date-b.date);
  return {added, skippedDup:dup, mode};
}

/* ---------------- Account balances (always all-time, unfiltered by design) ---------------- */
function computeAccountBalances(transactions){
  const balances = new Map(); // compte -> {balance, income, expense, transferIn, transferOut}
  function ensure(name){
    if(!balances.has(name)) balances.set(name,{name,balance:0,income:0,expense:0,transferIn:0,transferOut:0,count:0});
    return balances.get(name);
  }
  transactions.forEach(t=>{
    if(!t.compte) return;
    const a = ensure(t.compte);
    a.count++;
    if(t.type==="Income"){ a.balance += t.montant; a.income += t.montant; }
    else if(t.type==="Expense"){ a.balance += t.montant; a.expense += t.montant; }
    else if(t.type==="Transfer"){
      a.balance -= t.montant; a.transferOut += t.montant;
      if(t.compteCible){
        const b = ensure(t.compteCible);
        b.balance += t.montant; b.transferIn += t.montant;
      }
    }
  });
  return Array.from(balances.values()).sort((a,b)=>b.balance-a.balance);
}

/* ---------------- Totals (income/expense/net) for a filtered set ---------------- */
function computeTotals(transactions){
  let income=0, expense=0;
  transactions.forEach(t=>{
    if(t.type==="Income") income += t.montant;
    else if(t.type==="Expense") expense += t.montant;
  });
  return {income, expense, net: income+expense};
}

/* ---------------- Breakdown by dimension (Groupe/Catégorie/Personne/Compte), for filtered set ---------------- */
function computeBreakdown(transactions, dim, opts){

  const map = new Map();
  transactions.forEach(t=>{
    if(t.type==="Transfer") return;
    if(onlyExpense && t.type!=="Expense") return;
    const key = dimDisplayValue(t, dim);
    if(!map.has(key)) map.set(key,{key, income:0, expense:0, net:0, count:0});
    const o = map.get(key);
    if(t.type==="Income") o.income += t.montant;
    else if(t.type==="Expense") o.expense += t.montant;
    o.net += t.montant;
    o.count++;
  });
  return Array.from(map.values());
}

/* ---------------- Time-bucketed series, respecting date basis ---------------- */
/* granularity: "year" | "month". dateBasis: "indiquee" | "transformee" */
function iterateBuckets(t, granularity, dateBasis, cb){
  // cb(bucketKey, year, month, weight, montant) — weight lets year-split divide amounts
  if(dateBasis==="transformee"){
    const tr = t.transform;
    if(tr.mode==="month"){
      const key = granularity==="year" ? String(tr.year) : tr.year+"-"+U.pad2(tr.month+1);
      cb(key, tr.year, tr.month, 1, t.montant);
      return;
    }
    if(tr.mode==="yearsplit"){
      if(granularity==="year"){
        cb(String(tr.year), tr.year, 0, 1, t.montant);
      } else {
        for(let m=0;m<12;m++){
          cb(tr.year+"-"+U.pad2(m+1), tr.year, m, 1/12, t.montant/12);
        }
      }
      return;
    }
  }
  const y = t.date.getFullYear(), m = t.date.getMonth();
  const key = granularity==="year" ? String(y) : y+"-"+U.pad2(m+1);
  cb(key, y, m, 1, t.montant);
}

function computeTimeSeries(transactions, granularity, dateBasis, dimension){
  // returns {buckets:[{key,year,month,label,income,expense,net, byDim:Map}], dimTotals:Map(dimValue->total)}
  const buckets = new Map();
  const dimTotals = new Map();
  function ensureBucket(key,year,month){
    if(!buckets.has(key)){
      const label = granularity==="year" ? String(year) : U.MONTHS_FR_SHORT[month]+" "+String(year).slice(2);
      buckets.set(key,{key,year,month,label,income:0,expense:0,net:0,byDim:new Map()});
    }
    return buckets.get(key);
  }
  transactions.forEach(t=>{
    if(t.type==="Transfer") return;
    iterateBuckets(t, granularity, dateBasis, (key,year,month,weight,amount)=>{
      const b = ensureBucket(key,year,month);
      if(t.type==="Income") b.income += amount; else b.expense += amount;
      b.net += amount;
      if(dimension){
        const dv = dimDisplayValue(t, dimension);
        b.byDim.set(dv, (b.byDim.get(dv)||0) + amount);
        dimTotals.set(dv, (dimTotals.get(dv)||0) + Math.abs(amount));
      }
    });
  });
  const arr = Array.from(buckets.values()).sort((a,b)=> a.key<b.key?-1:1);
  return {buckets:arr, dimTotals};
}

function showToast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  el.classList.toggle("toast-long", msg.length>60);
  clearTimeout(showToast._t);
  const dur = Math.min(9000, Math.max(2600, msg.length*70));
  showToast._t = setTimeout(()=>el.classList.remove("show"), dur);
}

function closeOverlay(id){ document.getElementById(id).classList.remove("open"); }
function openOverlay(id){ document.getElementById(id).classList.add("open"); }

function cycleTheme(){
  const order = ["auto","light","dark"];
  let i = order.indexOf(Store.settings.theme);
  Store.settings.theme = order[(i+1)%order.length];
  Store.saveSettings();
  applyThemeToDom();
  showToast("Thème : " + ({auto:"Automatique",light:"Clair",dark:"Sombre"}[Store.settings.theme]));
}
function applyThemeToDom(){
  const t = Store.settings.theme;
  if(t==="auto"){
    document.documentElement.removeAttribute("data-theme");
    const mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
    if(mq && mq.matches) document.documentElement.setAttribute("data-theme","dark");
  } else {
    document.documentElement.setAttribute("data-theme", t);
  }
  updateThemeColorMeta();
}
/* Garde la couleur de la barre d'état Android/du navigateur synchronisée avec le thème réellement affiché
   (clair ou sombre), plutôt que la couleur par défaut du navigateur. */
function updateThemeColorMeta(){
  const meta = document.getElementById("theme-color-meta");
  if(!meta) return;
  const isDark = document.documentElement.getAttribute("data-theme")==="dark";
  meta.setAttribute("content", isDark ? "#0E0F12" : "#F0F1F4");
}

function switchTab(tab){
  currentTab = tab;
  resetTxnPagination();
  const moreTabs = (tab==="evolution"||tab==="breakdown");
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab || (moreTabs && b.dataset.tab==="more")));
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById("view-"+tab).classList.add("active");
  const showFloat = (tab==="transactions"||tab==="evolution"||tab==="breakdown");
  document.getElementById("floatbar-wrap").style.display = showFloat ? "flex" : "none";
  refreshCurrentTab();
}

function refreshCurrentTab(){
  renderHero();
  updateFilterBadge();
  const V = window.__SF_VIEWS;
  if(!V) return;
  if(currentTab==="dashboard") V.renderDashboard();
  else if(currentTab==="transactions") V.renderTransactions();
  else if(currentTab==="budget") V.renderBudget && V.renderBudget();
  else if(currentTab==="evolution") V.renderEvolution();
  else if(currentTab==="breakdown") V.renderBreakdown();
  else if(currentTab==="accounts") V.renderAccounts();
}

function updateFilterBadge(){
  const n = F.activeCount();
  const badge = document.getElementById("filter-badge");
  const btn = document.getElementById("btn-filter");
  const searchInput = document.getElementById("search-input");
  if(searchInput.value !== F.search) searchInput.value = F.search;
  if(n>0){ badge.style.display="flex"; badge.textContent=n; btn.classList.add("active-filter"); }
  else { badge.style.display="none"; btn.classList.remove("active-filter"); }
}

function renderHero(){
  const hero = document.getElementById("hero");
  if(Store.transactions.length===0){ hero.innerHTML=""; return; }
  const balances = AGG.computeAccountBalances(Store.transactions);
  const total = balances.reduce((s,a)=>s+a.balance,0);
  const now = new Date();
  const monthTxns = Store.transactions.filter(t=>t.date.getFullYear()===now.getFullYear() && t.date.getMonth()===now.getMonth());
  const totals = AGG.computeTotals(monthTxns);
  hero.innerHTML = `
    <div class="label">Solde total</div>
    <div class="amount">${U.fmtMoney(total)}</div>
    <div class="sub">
      <span class="chip chip-in">↑ ${U.fmtMoney(totals.income)} ce mois</span>
      <span class="chip chip-out">↓ ${U.fmtMoney(Math.abs(totals.expense))} ce mois</span>
    </div>
  `;
}

function emptyStateHtml(opts){

function wireEmptyState(container){
  const b1 = container.querySelector("#empty-import-btn");
  if(b1) b1.onclick = ()=>window.__SF_IMPORT.open();
  const b2 = container.querySelector("#empty-demo-btn");

/* txn icon letter + class */
function txnIconInfo(t){
  if(t.type==="Income") return {cls:"inc", letter:(t.categorie||"R")[0].toUpperCase()};
  if(t.type==="Transfer") return {cls:"trf", letter:"⇄"};
  return {cls:"exp", letter:(t.categorie||"D")[0].toUpperCase()};
}
function txnAmtClass(t){ return t.type==="Income"?"inc":(t.type==="Transfer"?"trf":"exp"); }
function txnTitle(t){
  if(t.remarque) return t.remarque;
  if(t.type==="Transfer") return "Transfert "+t.compte+" → "+t.compteCible;
  return t.categorie || (t.type==="Income"?"Revenu":"Dépense");
}
function txnSubtitle(t){
  const parts=[];
  if(t.type==="Transfer"){ parts.push(t.compte+" → "+t.compteCible); }
  else { if(t.categorie) parts.push(t.categorie); if(t.personne) parts.push(t.personne); }
  if(t.groupe) parts.push(t.groupe);
  return parts.join(" · ");
}

/* ================= TRANSACTIONS LIST ================= */
function makeTxnItemEl(t){
  const info = txnIconInfo(t);
  const el = document.createElement("div");
  el.className = "txn-item";
  el.innerHTML = `
    <div class="txn-ico ${info.cls}">${info.letter}</div>

      <div class="txn-sub">${U.escHtml(txnSubtitle(t))}</div>
    </div>
    <div class="txn-amt ${txnAmtClass(t)}">${t.type==="Transfer" ? U.fmtMoney(t.montant) : U.fmtMoneySigned(t.montant)}</div>
  `;
  el.onclick = ()=> openTxnDetail(t.id);
  return el;
}

function capitalize(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }

/* Determine the group key/label/sort value for a transaction, given the active group-by mode */
function getGroupInfo(t, groupBy){
  if(groupBy==="day"){
    return {key:t.dateISO, label:U.fmtDateLong(t.date), sortVal:t.date.getTime()};
  }
  if(groupBy==="month_indiquee"){
    const y=t.date.getFullYear(), m=t.date.getMonth();
    return {key:y+"-"+U.pad2(m+1), label:capitalize(U.fmtMonthYear(y,m)), sortVal:y*12+m};
  }
  if(groupBy==="month_transformee"){
    let y,m;
    if(t.transform.mode==="month"){ y=t.transform.year; m=t.transform.month; }
    else { y=t.date.getFullYear(); m=t.date.getMonth(); }
    return {key:"t"+y+"-"+U.pad2(m+1), label:capitalize(U.fmtMonthYear(y,m)), sortVal:y*12+m};
  }
  // dimension-based grouping: groupe / categorie / compte / personne
  const v = AGG.dimDisplayValue(t, groupBy);
  return {key:v, label:v};
}
const CHRONO_MODES = ["day","month_indiquee","month_transformee"];

function renderTransactions(){
  const view = document.getElementById("view-transactions");
  if(Store.transactions.length===0){
    view.innerHTML = `<div class="section" style="margin-top:10px;">${emptyStateHtml({
      title:"Aucune transaction", text:"Importez vos données pour voir la liste de vos transactions ici.", showDemo:true
    })}</div>`;

    return;
  }
  const filtered = AGG.applyFilters(Store.transactions);
  const totals = AGG.computeTotals(filtered);
  const groupBy = APP.state.txnGroupBy;
  const isChrono = CHRONO_MODES.includes(groupBy);

  let html = `<div class="section" style="padding-top:14px;">
    <div style="display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;">
      <span style="font-size:13px;color:var(--text-sub);font-weight:600;">${filtered.length.toLocaleString('fr-FR')} transaction${filtered.length>1?"s":""}</span>
      <span style="font-size:13px;font-weight:800;color:${totals.net>=0?'var(--income)':'var(--expense)'}">${U.fmtMoneySigned(totals.net)}</span>
    </div>
    <div class="chips-bar" id="txn-chips" style="display:none;"></div>
    <div class="dimtabs" id="txn-groupby" style="margin-top:2px;">
      ${Object.keys(APP.GROUPBY_LABEL).map(k=>`<button data-v="${k}" class="${groupBy===k?'active':''}">${APP.GROUPBY_LABEL[k]}</button>`).join("")}
    </div>
  </div>`;

  if(filtered.length===0){
    html += `<div class="section"><div class="empty-state">${ICONS.search}<h3>Aucun résultat</h3><p>Essayez d'ajuster vos filtres ou votre recherche.</p></div></div>`;
    view.innerHTML = html;
    F.renderChipsBar("txn-chips", ()=>{ APP.resetTxnPagination(); renderTransactions(); });
    wireGroupByButtons();
    return;
  }

  html += `<div class="section" id="txn-list-section"></div>
  <div class="section loadmore-wrap" id="txn-loadmore-wrap"></div>`;
  view.innerHTML = html;

  F.renderChipsBar("txn-chips", ()=>{ APP.resetTxnPagination(); renderTransactions(); });
  wireGroupByButtons();

  const listSection = document.getElementById("txn-list-section");
  const loadmoreWrap = document.getElementById("txn-loadmore-wrap");

  if(isChrono){
    renderChronoGroups(listSection, loadmoreWrap, filtered, groupBy);
  } else {
    renderDimensionGroups(listSection, loadmoreWrap, filtered, groupBy);
  }
}

function wireGroupByButtons(){
  document.querySelectorAll("#txn-groupby button").forEach(b=>{
    b.onclick = ()=>{
      APP.state.txnGroupBy = b.dataset.v;
      APP.resetTxnPagination();
      renderTransactions();
    };
  });
}

/* Chronological grouping: Jour / Mois (indiquée) / Mois (transformée) */
function renderChronoGroups(listSection, loadmoreWrap, filtered, groupBy){
  const enriched = filtered.map(t=>{
    const g = getGroupInfo(t, groupBy);
    return {t, key:g.key, label:g.label, sortVal:g.sortVal};
  });
  enriched.sort((a,b)=> (b.sortVal-a.sortVal) || (b.t.date-a.t.date));

  const totalsByKey = new Map();
  enriched.forEach(e=>{
    if(!totalsByKey.has(e.key)) totalsByKey.set(e.key, {label:e.label, income:0, expense:0, count:0});
    const o = totalsByKey.get(e.key);
    if(e.t.type==="Income") o.income += e.t.montant;
    else if(e.t.type==="Expense") o.expense += e.t.montant;
    o.count++;
  });

  const limit = APP.state.txnLimit;
  const shown = enriched.slice(0, limit);
  const isDay = groupBy==="day";

  let currentKey = null;
  let groupWrap = null;
  shown.forEach(e=>{
    if(e.key !== currentKey){
      currentKey = e.key;
      const gt = totalsByKey.get(e.key);
      const header = document.createElement("div");
      if(isDay){
        header.className = "txn-date-label";
        header.textContent = e.label;
      } else {
        header.className = "txn-date-label";
        header.style.display = "flex";
        header.style.justifyContent = "space-between";
        header.style.alignItems = "baseline";
        const net = gt.income + gt.expense;
        header.innerHTML = `<span>${U.escHtml(e.label)}</span><span style="color:${net>=0?'var(--income)':'var(--expense)'};font-weight:800;">${U.fmtMoneySigned(net)}</span>`;
      }
      listSection.appendChild(header);
      groupWrap = document.createElement("div");
      groupWrap.className = "txn-daygroup-items";
      listSection.appendChild(groupWrap);
    }
    groupWrap.appendChild(makeTxnItemEl(e.t));
  });

  if(enriched.length > limit){
    const btn = document.createElement("button");
    btn.className = "btn btn-ghost";
    btn.textContent = "Charger plus ("+(enriched.length-limit)+" restantes)";
    btn.onclick = ()=>{ APP.state.txnLimit += 60; renderTransactions(); };
    loadmoreWrap.appendChild(btn);
  }
}

/* Dimension-based grouping: Groupe / Catégorie / Compte / Personne */
function renderDimensionGroups(listSection, loadmoreWrap, filtered, groupBy){
  const groups = new Map(); // key -> {label, items:[], income, expense, count}
  filtered.forEach(t=>{
    const g = getGroupInfo(t, groupBy);
    if(!groups.has(g.key)) groups.set(g.key, {label:g.label, items:[], income:0, expense:0, count:0});
    const o = groups.get(g.key);
    o.items.push(t);
    if(t.type==="Income") o.income += t.montant;
    else if(t.type==="Expense") o.expense += t.montant;
    o.count++;
  });
  const arr = Array.from(groups.entries()).map(([key,o])=>({key, ...o}));
  arr.forEach(g=> g.items.sort((a,b)=>b.date-a.date));
  if(groupBy==="categorie"){
    // Range catégorie par Income puis Expense, puis ordre alphabétique
    const typeMap = AGG.classifyCategoryTypes(filtered);
    arr.sort((a,b)=>{
      const ka = typeMap.get(a.key) || "Expense", kb = typeMap.get(b.key) || "Expense";
      if(ka!==kb) return ka==="Income" ? -1 : 1;
      return a.key.localeCompare(b.key, 'fr');
    });
  } else {
    arr.sort((a,b)=> (Math.abs(b.income)+Math.abs(b.expense)) - (Math.abs(a.income)+Math.abs(a.expense)));
  }

  const groupsShown = APP.state.txnGroupsShown;
  const shownGroups = arr.slice(0, groupsShown);
  const perGroupMap = APP.state.txnPerGroupShown;

  shownGroups.forEach((g,idx)=>{
    const net = g.income + g.expense;
    const details = document.createElement("details");
    details.className = "card";
    details.style.padding = "0";
    details.style.marginBottom = "10px";
    if(idx===0) details.open = true;
    const perShown = perGroupMap[g.key] || 10;
    const itemsToShow = g.items.slice(0, perShown);

    const summary = document.createElement("summary");
    summary.style.cssText = "list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;";
    summary.innerHTML = `
      <span style="font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;">${U.escHtml(g.label)}</span>
      <span style="display:flex;align-items:center;gap:10px;flex:0 0 auto;">
        <span style="font-size:12px;color:var(--text-sub);font-weight:600;">${g.count}</span>
        <span style="font-weight:800;font-size:13.5px;color:${net>=0?'var(--income)':'var(--expense)'}">${U.fmtMoneySigned(net)}</span>
      </span>
    `;
    details.appendChild(summary);

    const body = document.createElement("div");
    body.style.cssText = "padding:0 12px 12px;";
    itemsToShow.forEach(t=>{
      const el = makeTxnItemEl(t);
      el.style.marginTop = "8px";
      body.appendChild(el);
    });
    if(g.items.length > perShown){
      const more = document.createElement("button");
      more.className = "btn btn-ghost btn-sm btn-block";
      more.style.marginTop = "8px";
      more.textContent = "Afficher plus ("+(g.items.length-perShown)+" restantes)";
      more.onclick = (ev)=>{ ev.preventDefault(); perGroupMap[g.key] = perShown + 15; renderTransactions(); };
      body.appendChild(more);
    }
    details.appendChild(body);
    listSection.appendChild(details);
  });

  if(arr.length > groupsShown){
    const btn = document.createElement("button");
    btn.className = "btn btn-ghost";
    btn.textContent = "Afficher plus de groupes ("+(arr.length-groupsShown)+" restants)";
    btn.onclick = ()=>{ APP.state.txnGroupsShown += 20; renderTransactions(); };
    loadmoreWrap.appendChild(btn);
  }
}

let periodFrom = null, periodTo = null; // "YYYY-MM"
function ensurePeriod(){
  if(periodFrom && periodTo) return;
  const saved = Store.settings.budget || {};
  const now = new Date();
  const ym = now.getFullYear()+"-"+U.pad2(now.getMonth()+1);
  periodFrom = periodFrom || saved.periodFrom || ym;
  periodTo = periodTo || saved.periodTo || ym;
}
function persistPeriod(){
  Store.settings.budget = Store.settings.budget || {};
  Store.settings.budget.periodFrom = periodFrom;
  Store.settings.budget.periodTo = periodTo;
  Store.saveSettings();
}
function monthsInRange(from, to){
  const [fy,fm] = from.split("-").map(Number);
  const [ty,tm] = to.split("-").map(Number);
  const out = [];
  let y=fy, m=fm;
  let guard=0;
  while((y<ty || (y===ty && m<=tm)) && guard<1200){
    out.push(y+"-"+U.pad2(m));
    m++; if(m>12){m=1;y++;}
    guard++;
  }
  return out;
}

/* ---------------- Moteur de calcul du budget ---------------- */
/* Calcule, pour un "groupe de groupe" donné (nom affiché résolu) et une période [from,to] (mois inclus),
   les montants par catégorie (groupes "vie quotidienne") + par groupe voyage (groupes "voyage"),
   en tenant compte : date corrigée, amortissement des catégories choisies, ajustements manuels, vue couple/perso. */
function computeGroupBudget(superGroupeName, months, opts){
  const cfg = Store.settings.budget;
  const scopeMult = cfg.scope==="couple" ? 2 : 1;
  const monthSet = new Set(months);
  const amortSet = new Set(cfg.amortCategories||[]);
  const isAmorti = cfg.mode==="amorti";

  // catégorie -> {income, expense}
  const catTotals = new Map();
  // groupe voyage (base) -> {income, expense, label}
  const voyTotals = new Map();
  // catégorie amortie -> total brut sur TOUTE la période disponible (pas seulement les mois affichés)
  const amortPoolAll = new Map();

  function ensureCat(cat){
    if(!catTotals.has(cat)) catTotals.set(cat, {key:cat, income:0, expense:0});
    return catTotals.get(cat);
  }
  function ensureVoy(base){
    if(!voyTotals.has(base)) voyTotals.set(base, {key:base, income:0, expense:0});
    return voyTotals.get(base);
  }

  Store.transactions.forEach(t=>{
    if(t.type==="Transfer") return;
    if(AGG.getGroupeDisplay(t) !== superGroupeName) return;
    const base = t.groupeBase || U.baseGroupe(t.groupe);
    const kind = AGG.getGroupKind(base);

    if(kind==="voyage"){
      // Les groupes voyage sont affectés en bloc à un mois défini (ou au mois réel/corrigé sinon)
      const forced = AGG.getGroupVoyageMonth(base);
      let targetMonth = forced;
      if(!targetMonth){
        const tr = t.transform;
        if(tr.mode==="month") targetMonth = tr.year+"-"+U.pad2(tr.month+1);
        else if(tr.mode==="yearsplit"){
          // réparti sur l'année : on ajoute 1/12 à chaque mois de cette année qui est dans la période affichée
          for(let m=1;m<=12;m++){
            const key = tr.year+"-"+U.pad2(m);
            if(monthSet.has(key)){
              const o = ensureVoy(base);
              const amt = t.montant/12*scopeMult;
              if(t.type==="Income") o.income += amt; else o.expense += amt;
            }
          }
          return;
        } else targetMonth = t.date.getFullYear()+"-"+U.pad2(t.date.getMonth()+1);
      }
      if(monthSet.has(targetMonth)){
        const o = ensureVoy(base);
        const amt = t.montant*scopeMult;
        if(t.type==="Income") o.income += amt; else o.expense += amt;
      }
      return;
    }

    // "quotidien" : par catégorie, date corrigée, avec gestion des catégories amorties
    const cat = t.categorie || "(Non renseigné)";
    const tr = t.transform;
    // Une dépense antérieure au mois de début est elle aussi considérée comme amortie (peu importe sa catégorie)
    const effMonthKey = tr.mode==="month" ? (tr.year+"-"+U.pad2(tr.month+1)) : (t.date.getFullYear()+"-"+U.pad2(t.date.getMonth()+1));
    const beforeStart = cfg.startMonth && effMonthKey < cfg.startMonth;
    const amortized = isAmorti && (amortSet.has(cat) || beforeStart);
    function addToMonth(key, weight){
      if(!monthSet.has(key)) return;
      const o = ensureCat(cat);
      const amt = t.montant*weight*scopeMult;
      if(t.type==="Income") o.income += amt; else o.expense += amt;
    }
    if(amortized){
      // accumulation pour le pool d'amortissement (indépendant des mois affichés)
      const prev = amortPoolAll.get(cat) || {income:0, expense:0};
      const amt = t.montant*scopeMult;
      if(t.type==="Income") prev.income += amt; else prev.expense += amt;
      amortPoolAll.set(cat, prev);
      return;
    }
    if(tr.mode==="month"){
      addToMonth(tr.year+"-"+U.pad2(tr.month+1), 1);
    } else if(tr.mode==="yearsplit"){
      for(let m=1;m<=12;m++) addToMonth(tr.year+"-"+U.pad2(m), 1/12);
    } else {
      addToMonth(t.date.getFullYear()+"-"+U.pad2(t.date.getMonth()+1), 1);
    }
  });

  // Amortissement : total (sur tout l'historique, catégorie par catégorie) / nombre de mois de la période où on reste,
  // réinjecté également sur chaque mois affiché. À défaut de période définie, on lisse sur la période affichée elle-même.
  if(isAmorti){
    const periodMonths = (cfg.amortPeriodMonths && Number(cfg.amortPeriodMonths)>0) ? Number(cfg.amortPeriodMonths) : months.length;
    amortPoolAll.forEach((tot, cat)=>{
      const perMonth = {income: tot.income/periodMonths, expense: tot.expense/periodMonths};
      const o = ensureCat(cat);
      o.income += perMonth.income*months.length;
      o.expense += perMonth.expense*months.length;
    });
  }

  // Ajustements manuels (montant brut, non multiplié par la vue couple/perso)
  if(isAmorti){
    (cfg.adjustments||[]).forEach(adj=>{
      if(adj.groupe !== superGroupeName) return;
      if(!monthSet.has(adj.month)) return;
      const amt = Number(adj.montant)||0;
      if(adj.categorie){
        const o = ensureCat(adj.categorie);
        if(amt>=0) o.income += amt; else o.expense += amt;
      } else {
        const o = ensureVoy("__ajustement__");
        o.label = "Ajustements";
        if(amt>=0) o.income += amt; else o.expense += amt;
      }
    });
  }

  const categories = Array.from(catTotals.values());
  const typeMap = new Map();
  categories.forEach(c=>{ typeMap.set(c.key, c.income>=Math.abs(c.expense) ? "Income" : "Expense"); });
  categories.sort((a,b)=>{
    const ta = typeMap.get(a.key), tb = typeMap.get(b.key);
    if(ta!==tb) return ta==="Income" ? -1 : 1;
    return a.key.localeCompare(b.key,'fr');
  });
  const voyages = Array.from(voyTotals.values()).sort((a,b)=>(a.label||a.key).localeCompare(b.label||b.key,'fr'));

  const income = categories.reduce((s,c)=>s+c.income,0) + voyages.reduce((s,c)=>s+c.income,0);
  const expense = categories.reduce((s,c)=>s+c.expense,0) + voyages.reduce((s,c)=>s+c.expense,0);
  return {categories, voyages, income, expense, net: income+expense};
}

function renderBudget(){
  ensurePeriod();
  const view = document.getElementById("view-budget");
  const cfg = Store.settings.budget;
  const months = monthsInRange(periodFrom, periodTo);

  if(Store.transactions.length===0){
    view.innerHTML = `<div class="section"><div class="empty-state">
      ${ICONS.inbox}<h3>Pas encore de données</h3><p>Importez vos transactions pour utiliser l'onglet Budget.</p>
    </div></div>`;
    return;
  }
  if(!cfg.mainGroup){
    view.innerHTML = `<div class="section">
      <div class="empty-state">
        ${ICONS.budget}<h3>Configurez votre budget</h3>
        <p>Choisissez un groupe de groupe principal dans les paramètres de cet onglet pour commencer.</p>
        <button class="btn btn-primary" id="bg-open-settings">${ICONS.settings} Paramètres du budget</button>
      </div>
    </div>`;
    document.getElementById("bg-open-settings").onclick = ()=>openBudgetSettings();
    return;
  }

  const mainRes = computeGroupBudget(cfg.mainGroup, months);
  const extraResults = (cfg.extraGroups||[]).filter(g=>g!==cfg.mainGroup).map(g=>({name:g, res:computeGroupBudget(g, months)}));
  const grandIncome = mainRes.income + extraResults.reduce((s,e)=>s+e.res.income,0);
  const grandExpense = mainRes.expense + extraResults.reduce((s,e)=>s+e.res.expense,0);

  view.innerHTML = `
    <div class="section">
      <div style="display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;">
        <div class="seg" id="bg-mode-seg" style="max-width:260px;">
          <button data-m="amorti" class="${cfg.mode==='amorti'?'active':''}">Avec amort. + ajouts</button>
          <button data-m="brut" class="${cfg.mode==='brut'?'active':''}">Brut</button>
        </div>
        <button class="icon-btn" id="bg-settings-btn" title="Paramètres du budget">${ICONS.settings}</button>
      </div>
      ${periodPickerHtml()}
      <div class="card" style="margin-bottom:14px;background:var(--primary-soft);box-shadow:none;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <span style="font-weight:800;font-size:16px;color:var(--primary);">Total tous groupes</span>
          <span style="font-weight:800;font-size:16px;color:var(--primary);">${U.fmtMoneySigned(grandIncome+grandExpense)}</span>
        </div>
        <div class="detail-row"><span>Revenus</span><span style="color:var(--income);">${U.fmtMoney(grandIncome)}</span></div>
        <div class="detail-row"><span>Dépenses</span><span style="color:var(--expense);">${U.fmtMoney(Math.abs(grandExpense))}</span></div>
      </div>
      ${groupCardHtml(cfg.mainGroup, mainRes, true)}
      ${extraResults.map(e=>groupCardHtml(e.name, e.res, false)).join("")}
      <div style="height:10px;"></div>
    </div>
  `;

  document.querySelectorAll("#bg-mode-seg button").forEach(b=>{
    b.onclick = ()=>{
      cfg.mode = b.dataset.m;
      Store.saveSettings();
      renderBudget();
    };
  });
  document.getElementById("bg-settings-btn").onclick = ()=>openBudgetSettings();
  document.getElementById("bg-from").onchange = (e)=>{ periodFrom = e.target.value; if(periodFrom>periodTo) periodTo=periodFrom; persistPeriod(); renderBudget(); };
  document.getElementById("bg-to").onchange = (e)=>{ periodTo = e.target.value; if(periodTo<periodFrom) periodFrom=periodTo; persistPeriod(); renderBudget(); };
}

function wireNestedFilter(kind){

  list.querySelectorAll(".check-item").forEach(el=>{

      updateApplyButton();

  if(search){
    search.oninput = ()=>{
      const q = U.normalize(search.value);
      list.querySelectorAll(".groupe-section").forEach(sec=>{
        const supMatch = U.normalize(sec.dataset.super).includes(q);
        let anyChildMatch = false;
        sec.querySelectorAll(".groupe-child-item").forEach(ch=>{
          const match = !q || U.normalize(ch.dataset.childname).includes(q);
          ch.style.display = match ? "flex" : "none";

      });
    };
  }
}

function renderImportStep1(){

function handleFile(file){
  const statusEl = document.getElementById("import-status");
  statusEl.innerHTML = `<div style="text-align:center;color:var(--text-sub);font-size:13.5px;padding:14px;">Analyse du fichier…</div>`;
  const name = file.name.toLowerCase();
  if(name.endsWith(".json")){
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const obj = JSON.parse(e.target.result);
        const rawArr = Array.isArray(obj) ? obj : (obj.transactions || []);
        const txns = rawArr.map(t=>({...t, date:new Date(t.date)})).filter(t=>t.date && !isNaN(t.date));
        const params = (!Array.isArray(obj) && obj.params) ? obj.params : null;
        parsedResult = {txns, skipped: rawArr.length-txns.length, total: rawArr.length, fileName: file.name, params};
        renderImportSummary();
      }catch(err){
        statusEl.innerHTML = `<div style="color:var(--expense);font-size:13.5px;padding:10px;">Fichier JSON invalide : ${U.escHtml(err.message)}</div>`;
      }
    };
    reader.readAsText(file);
    return;
  }
  DATA.parseFile(file).then(res=>{
    parsedResult = {...res, fileName: file.name};
    renderImportSummary();
  }).catch(err=>{
    statusEl.innerHTML = `<div style="color:var(--expense);font-size:13.5px;padding:10px;">Impossible de lire ce fichier : ${U.escHtml(err.message)}</div>`;
  });
}

function mergeRuleList(existing, incoming, sigFn){
  const existingSigs = new Set(existing.map(sigFn));
  let added = 0;
  incoming.forEach(r=>{
    const s = sigFn(r);
    if(!existingSigs.has(s)){ existing.push(r); existingSigs.add(s); added++; }
  });
  return added;
}

function applyParamsImport(params, mode){
  if(!params) return {rulesAdded:0, personRulesAdded:0, acctAdded:0};
  const groupRules = params.groupRules || [];
  const personRules = params.personRules || [];
  const accountTypes = params.accountTypes || {};
  const groupKind = params.groupKind || {};
  const groupVoyageMonth = params.groupVoyageMonth || {};
  const budgetAdjustments = params.budgetAdjustments || [];
  Store.settings.budget = Store.settings.budget || {};
  if(mode==="replace"){
    Store.settings.groupAliasRules = groupRules.slice();
    Store.settings.personAliasRules = personRules.slice();
    Store.settings.accountTypes = Object.assign({}, accountTypes);
    Store.settings.groupKind = Object.assign({}, groupKind);
    Store.settings.groupVoyageMonth = Object.assign({}, groupVoyageMonth);
    Store.settings.budget.adjustments = budgetAdjustments.slice();
    return {rulesAdded:groupRules.length, personRulesAdded:personRules.length, acctAdded:Object.keys(accountTypes).length};
  }
  const existingGroup = Store.settings.groupAliasRules || [];
  const rulesAdded = mergeRuleList(existingGroup, groupRules, r=>[r.groupe,r.superGroupe,r.dateFrom||"",r.dateTo||""].join("|"));
  Store.settings.groupAliasRules = existingGroup;

  const existingPerson = Store.settings.personAliasRules || [];
  const personRulesAdded = mergeRuleList(existingPerson, personRules, r=>[r.personne,r.superPersonne,r.dateFrom||"",r.dateTo||""].join("|"));
  Store.settings.personAliasRules = existingPerson;

  const acctBefore = Object.keys(Store.settings.accountTypes||{}).length;
  Store.settings.accountTypes = Object.assign({}, Store.settings.accountTypes, accountTypes);
  const acctAdded = Object.keys(Store.settings.accountTypes).length - acctBefore;

  Store.settings.groupKind = Object.assign({}, Store.settings.groupKind, groupKind);
  Store.settings.groupVoyageMonth = Object.assign({}, Store.settings.groupVoyageMonth, groupVoyageMonth);

  const existingAdj = Store.settings.budget.adjustments || [];
  mergeRuleList(existingAdj, budgetAdjustments, a=>[a.month,a.groupe,a.categorie||"",a.montant,a.remarque||""].join("|"));
  Store.settings.budget.adjustments = existingAdj;

  return {rulesAdded, personRulesAdded, acctAdded};
}

let chosenImportScope = "both"; // "both" | "transactions" | "params"

function renderImportSummary(){
  const statusEl = document.getElementById("import-status");
  const r = parsedResult;
  const hasExisting = Store.transactions.length>0;
  const hasTxns = r.txns.length>0;
  const hasParams = !!(r.params && ((r.params.groupRules||[]).length || (r.params.personRules||[]).length || Object.keys(r.params.accountTypes||{}).length ||
    Object.keys(r.params.groupKind||{}).length || (r.params.budgetAdjustments||[]).length));
  chosenMode = hasExisting ? "merge" : "replace";
  chosenParamsMode = "merge";
  chosenImportScope = "both";

  if(!hasTxns && !hasParams){
    statusEl.innerHTML = `<div style="color:var(--expense);font-size:13.5px;padding:10px;">Aucune donnée exploitable trouvée dans ce fichier (ni transactions, ni paramètres). Vérifiez les noms de colonnes et le format des dates.</div>`;
    return;
  }

  const dMin = hasTxns ? r.txns.reduce((m,t)=>t.date<m?t.date:m, r.txns[0].date) : null;
  const dMax = hasTxns ? r.txns.reduce((m,t)=>t.date>m?t.date:m, r.txns[0].date) : null;
  const showBoth = hasTxns && hasParams;

  function scopeChoiceHtml(){

    return `

      <div class="radio-opt ${chosenImportScope==='params'?'selected':''}" data-iscope="params">
        <span class="rc"></span>
        <div><div class="rt">Paramètres seulement</div></div>
      </div>
    `;
  }

  function txnSectionHtml(){
    if(!hasTxns) return "";
    return `
      <div class="import-summary" style="margin-top:14px;">
        ${r.txns.length.toLocaleString('fr-FR')} transaction(s) valide(s) sur ${r.total.toLocaleString('fr-FR')} ligne(s)${r.skipped?` · ${r.skipped} ignorée(s)`:""}<br>
        Période : ${U.fmtDateShort(dMin)} – ${U.fmtDateShort(dMax)}
      </div>
      ${hasExisting ? `
      <div class="field-label">Que faire de ces transactions ?</div>

      </div>
      ` : ""}
    `;
  }

  function paramsSectionHtml(){
    if(!hasParams) return hasTxns ? `<div class="import-summary" style="margin-top:14px;">Aucun onglet/données Paramètres détecté — vos règles de groupe et types de compte actuels resteront inchangés.</div>` : "";
    return `
      <div class="import-summary" style="margin-top:14px;">
        <b>Paramètres détectés</b><br>
        ${(r.params.groupRules||[]).length} règle(s) de groupe · ${(r.params.personRules||[]).length} règle(s) de personne · ${Object.keys(r.params.accountTypes||{}).length} type(s) de compte<br>

      </div>
      <div class="radio-opt" data-pmode="replace" id="pmode-replace">
        <span class="rc"></span>
        <div><div class="rt">Remplacer les paramètres</div><div class="rd">Toutes les règles de groupe et types de compte actuels seront remplacés par ceux de ce fichier.</div></div>
      </div>
    `;
  }

  function render(){

    statusEl.innerHTML = `

      if(pstats) Store.saveSettings();

      const finish = (ok)=>{
        if(!ok){

          if(doParams) msg += ` · paramètres mis à jour`;
        } else {
          msg = "Paramètres mis à jour";
        }

  scope = scope || "both";
  const payload = {version:2, exportedAt: new Date().toISOString()};
  if(scope==="both" || scope==="transactions"){
    payload.transactions = Store.transactions.map(t=>({...t, date:t.date.toISOString()}));
  }
  if(scope==="both" || scope==="params"){
    payload.params = buildParamsPayload();
  }
  const blob = new Blob([JSON.stringify(payload)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = U.toISO(new Date());
  const suffix = scope==="transactions" ? "_transactions" : scope==="params" ? "_parametres" : "";
  a.href = url; a.download = "suivi_financier_sauvegarde"+suffix+"_"+stamp+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  APP.showToast("Sauvegarde exportée");
}

/* scope: "both" | "transactions" | "params" */
function exportExcel(scope){
  scope = scope || "both";
  const wb = XLSX.utils.book_new();

  if(scope==="both" || scope==="transactions"){
    const header = ["Date","Type","Montant","Catégorie","Personne","Compte","Compte cible","Groupe","Remarque"];
    const data = [header];
    Store.transactions.forEach(t=>{
      data.push([
        U.pad2(t.date.getDate())+"."+U.pad2(t.date.getMonth()+1)+"."+t.date.getFullYear(),
        t.type, t.montant, t.categorie, t.personne, t.compte, t.compteCible, t.groupe, t.remarque
      ]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), "Transactions");
  }

  if(scope==="both" || scope==="params"){
    const pHeader = ["Groupe","Groupe de groupe","Date début","Date fin","Compte","Type de compte","Personne","Groupe de personnes",
      "Groupe (type budget)","Type budget (Quotidien/Voyage)","Mois voyage (AAAA-MM)"];
    const rules = Store.settings.groupAliasRules || [];
    const acct = Object.entries(Store.settings.accountTypes || {});
    const personRules = Store.settings.personAliasRules || [];
    const kindEntries = Object.entries(Store.settings.groupKind || {});
    const n = Math.max(rules.length, acct.length, personRules.length, kindEntries.length, 1);
    const pData = [pHeader];
    for(let i=0;i<n;i++){
      const r = rules[i], a = acct[i], p = personRules[i], k = kindEntries[i];
      pData.push([
        r?r.groupe:"", r?r.superGroupe:"", r&&r.dateFrom?r.dateFrom:"", r&&r.dateTo?r.dateTo:"",
        a?a[0]:"", a?a[1]:"",
        p?p.personne:"", p?p.superPersonne:"",
        k?k[0]:"", k?(k[1]==="voyage"?"Voyage":"Quotidien"):"", k?((Store.settings.groupVoyageMonth||{})[k[0]]||""):""
      ]);
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pData), "Paramètres");

    const adj = (Store.settings.budget||{}).adjustments || [];
    const aHeader = ["Mois","Groupe","Catégorie","Montant","Remarque"];
    const aData = [aHeader].concat(adj.map(a=>[a.month||"", a.groupe||"", a.categorie||"", a.montant||0, a.remarque||""]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aData), "Budget");
  }

  const stamp = U.toISO(new Date());
  const suffix = scope==="transactions" ? "_transactions" : scope==="params" ? "_parametres" : "";
  XLSX.writeFile(wb, "suivi_financier"+suffix+"_"+stamp+".xlsx");
  APP.showToast("Export Excel généré");
}
