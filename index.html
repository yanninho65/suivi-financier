const ICONS = U.ICONS;

/* ================= ACCOUNTS ================= */
/* Construit un texte tabulé (TSV) "Compte / Solde" — collé dans Excel, il forme deux colonnes : le nom
   du compte, et son solde avec 2 décimales (virgule comme séparateur décimal, sans séparateur de
   milliers, pour être reconnu comme nombre par Excel FR quelle que soit sa locale). Une ligne "Total"
   termine le récapitulatif. */
function buildAccountsClipboardText(typeGroups, total){
  const lines = ["Compte\tSolde"];
  typeGroups.forEach(g=>{
    g.accounts.forEach(a=>{
      lines.push(a.name + "\t" + a.balance.toFixed(2).replace(".", ","));
    });
  });
  lines.push("Total\t" + total.toFixed(2).replace(".", ","));
  return lines.join("\n");
}
/* Copie un texte dans le presse-papiers — API moderne d'abord (nécessite un contexte sécurisé https),
   avec repli sur la méthode historique (textarea + execCommand) si elle échoue ou est indisponible
   (ex. ouverture locale en file://). Retourne true/false selon le succès. */
async function copyTextToClipboard(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){ /* repli ci-dessous */ }
  try{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e2){ return false; }
}

/* Ordonne les groupes de type de compte (Courant/Épargne/types libres) selon l'ordre choisi par
   l'utilisateur (Store.settings.accountTypeOrder). Les types absents de cet ordre (nouveaux comptes,
   première utilisation) sont ajoutés à la fin, en respectant l'ordre par défaut (Courant, Épargne, puis
   alphabétique) — jamais perdus, juste positionnés après les types déjà classés. */
function orderAccountTypeGroups(groups){
  const savedOrder = Store.settings.accountTypeOrder || [];
  const DEFAULT_ORDER = {"Courant":0, "Épargne":1};
  const byDefault = groups.slice().sort((a,b)=>{
    const oa = DEFAULT_ORDER[a.type]!=null ? DEFAULT_ORDER[a.type] : 2;
    const ob = DEFAULT_ORDER[b.type]!=null ? DEFAULT_ORDER[b.type] : 2;
    if(oa!==ob) return oa-ob;
    return a.type.localeCompare(b.type,'fr');
  });
  if(!savedOrder.length) return byDefault;
  const rank = new Map(savedOrder.map((t,i)=>[t,i]));
  return byDefault.slice().sort((a,b)=>{
    const ra = rank.has(a.type) ? rank.get(a.type) : savedOrder.length + byDefault.indexOf(a);
    const rb = rank.has(b.type) ? rank.get(b.type) : savedOrder.length + byDefault.indexOf(b);
    return ra-rb;
  });
}

(function(){

const Store = window.__SF_STORE;
const AGG = window.__SF_AGG;
const APP = window.__SF_APP;
const ICONS = U.ICONS;
const PICKER = window.__SF_PICKER;

/* L'onglet Budget affiche toujours les montants sans décimales, quel que soit le réglage global de
   l'application (Store.settings.decimals, utilisé ailleurs) — ces deux fonctions remplacent U.fmtMoney /
   U.fmtMoneySigned partout dans cet onglet, sans toucher au réglage global ni aux autres onglets. */
function bgFmtMoney(n){
  if(n==null || isNaN(n)) n=0;
  const sign = n<0 ? "-" : "";
  return sign + Math.abs(n).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0}) + " €";
}
function bgFmtMoneySigned(n){
  if(n==null || isNaN(n)) n=0;
  return (n>0? "+ " : (n<0? "- " : "")) + Math.abs(n).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0}) + " €";
}

function fmtMonthYearShort(y,m){ return U.MONTHS_FR_SHORT[m]+" "+String(y).slice(2); }
/* Liste de pilules One UI cliquables (sélection multiple, plusieurs par ligne) pour remplacer les listes à
   cases à cocher dans cet onglet (comptes exclus, catégories amorties). */

/* état local de la vue (période affichée) */
let periodFrom = null, periodTo = null; // "YYYY-MM"
/* Un compte coché ici est totalement ignoré par tous les calculs du Budget (transactions réelles,
   amortissement, salaire) — les ajustements manuels n'ont pas de compte et ne sont donc jamais concernés. */
function isAccountExcluded(compte){
  const excl = Store.settings.budget.excludedAccounts;
  if(!excl || !excl.length) return false;
  return excl.indexOf(compte||"") !== -1;
}
/* État ouvert/fermé des sections Revenus/Dépenses (Catégories et Voyages) de chaque carte de groupe,
   clé = "<titre du groupe>::cat::income" etc. Ouvertes par défaut (comportement inchangé), conservé entre
   les re-rendus (Map, pas de perte lors du grouper/dégrouper). */
/* Un seul état partagé pour toutes les sections Revenus/Dépenses/Voyages de toutes les cartes : grouper ou
   dégrouper l'une d'elles grouper/dégroupe tout le reste en même temps (cf. wiring de .bg-cv-section). */
let allSectionsOpen = true;
function isGroupSectionOpen(){ return allSectionsOpen; }
function ensurePeriod(){
  if(periodFrom && periodTo) return;
  const saved = Store.settings.budget || {};
  const now = new Date();
  const ym = now.getFullYear()+"-"+U.pad2(now.getMonth()+1);
  periodFrom = periodFrom || saved.periodFrom || ym;
  periodTo = periodTo || saved.periodTo || ym;
}
function persistPeriod(){
  Store.settings.budget = Store.settings.budget || {};
  Store.settings.budget.periodFrom = periodFrom;
  Store.settings.budget.periodTo = periodTo;
  Store.saveSettings();
}
function monthsInRange(from, to){
  const [fy,fm] = from.split("-").map(Number);
  const [ty,tm] = to.split("-").map(Number);
  const out = [];
  let y=fy, m=fm;
  let guard=0;
  while((y<ty || (y===ty && m<=tm)) && guard<1200){
    out.push(y+"-"+U.pad2(m));
    m++; if(m>12){m=1;y++;}
    guard++;
  }
  return out;
}
/* Pour une dépense "lissée sur l'année" (remarque finissant par une année, montant réparti sur 12 mois) :
   nombre de mois de cette année-là compris dans la période affichée (monthSet). */
function yearsplitMonthsInPeriod(year, monthSet){
  let c=0;
  for(let m=1;m<=12;m++){ if(monthSet.has(year+"-"+U.pad2(m))) c++; }
  return c;
}
/* Ajoute n mois (peut être négatif) à une clé "AAAA-MM". */
function addMonthsToKey(key, n){
  let [y,m] = key.split("-").map(Number);
  m += n;
  while(m>12){ m-=12; y++; }
  while(m<1){ m+=12; y--; }
  return y+"-"+U.pad2(m);
}
/* Fenêtre calendaire de l'amortissement : [Mois de début, Mois de début + Période où on reste - 1].
   L'amortissement d'une dépense (quelle que soit sa date d'origine, même antérieure de plusieurs années)
   ne doit se répercuter QUE sur les mois de cette fenêtre — jamais avant ni après — même si la période
   actuellement affichée déborde de cette fenêtre. Sans "Mois de début" configuré, aucune fenêtre n'est
   définie : on retombe alors sur l'ancien comportement (toute la période affichée reçoit sa part).
   boundsMonths (optionnel) : période affichée complète à utiliser pour ce "retombe sur..." quand `months`
   n'en est qu'un sous-ensemble (ex. un seul mois, pour la vue "mois par mois" du Budget) — sans cela, un
   appel avec un seul mois recevrait à tort 100% du lissage sur ce mois. Omis, comportement inchangé. */
function amortWindowMonths(months, periodMonths, boundsMonths){
  const cfg = Store.settings.budget;
  if(!cfg.startMonth) return boundsMonths ? months.filter(m=> boundsMonths.includes(m)) : months;
  const windowEnd = addMonthsToKey(cfg.startMonth, periodMonths-1);
  return months.filter(m=> m>=cfg.startMonth && m<=windowEnd);
}
/* Mois de la période affichée qui tombent dans la borne chronologique de l'amortissement (["Mois de
   début", "Dernier mois"], l'une ou l'autre pouvant être vide). Utilisé pour le diviseur de la vue
   "Moyenne / mois" — quel que soit le mode (Amort. + ajouts ou Ajouts), les mois hors bornes ne comptent pas
   dans la moyenne, tout comme leurs dépenses sont amorties d'office hors de ces bornes. Sans bornes
   configurées, retombe sur la période affichée complète (comportement d'origine). */
function amortBoundedMonths(months){
  const cfg = Store.settings.budget;
  if(!cfg.startMonth && !cfg.endMonth) return months;
  return months.filter(m => (!cfg.startMonth || m>=cfg.startMonth) && (!cfg.endMonth || m<=cfg.endMonth));
}
/* Nombre de mois de la fenêtre d'amortissement, calculé automatiquement à partir de "Mois de début" et
   "Dernier mois" (inclusifs des deux côtés) — plus de saisie manuelle. Sans les deux bornes renseignées,
   retombe sur le nombre de mois de la période affichée (comportement d'origine). Voir boundsMonths ci-dessus
   pour amortWindowMonths — même principe ici quand `months` n'est qu'un sous-ensemble de la période affichée. */
function computeAmortPeriodMonths(months, boundsMonths){
  const cfg = Store.settings.budget;
  if(cfg.startMonth && cfg.endMonth){
    const [sy,sm] = cfg.startMonth.split("-").map(Number);
    const [ey,em] = cfg.endMonth.split("-").map(Number);
    const diff = (ey-sy)*12 + (em-sm) + 1;
    if(diff>0) return diff;
  }
  return (boundsMonths || months).length;
}

/* ---------------- Moteur de calcul du budget ---------------- */
/* Calcule, pour un "groupe de groupe" donné (nom affiché résolu) et une période [from,to] (mois inclus),
   les montants par catégorie (groupes "vie quotidienne") + par groupe voyage (groupes "voyage"),
   en tenant compte : date corrigée, amortissement des catégories choisies, ajustements manuels, vue couple/perso. */
/* Une transaction correspond à un nom de groupe sélectionné (groupe de groupe, groupe précis, ou base)
   — voir computeGroupBudget pour le détail. Utilisé aussi pour le détail des catégories. */
function groupSelectionMatches(t, selectedName){
  if(AGG.getGroupeDisplay(t) === selectedName) return true;
  if(t.groupe === selectedName) return true;
  const base = t.groupeBase || U.baseGroupe(t.groupe);
  if(base === selectedName) return true;
  return false;
}

/* Montant d'un ajustement manuel converti à l'échelle du scope actuellement affiché (Perso/Couple).
   Chaque ajustement porte le scope dans lequel son montant a été saisi (montantScope) ; on le convertit
   vers le scope courant (÷2 Couple→Perso, ×2 Perso→Couple) pour qu'il s'intègre correctement aux totaux
   et à ceux des transactions réelles (elles-mêmes ×2 en Couple, cf. scopeMult). Ajustements anciens sans
   montantScope : on suppose qu'ils correspondent déjà au scope courant (comportement historique, brut).
   montantScope==="both" : montant identique en Perso et en Couple (jamais converti), pour les ajustements
   qui doivent rester fixes quel que soit le scope affiché.
   montantViewOnly (uniquement avec montantScope "perso" ou "couple") : l'ajustement n'apparaît QUE quand la
   vue affichée correspond exactement à montantScope — 0 dans l'autre vue, jamais converti. Utile pour une
   correction qui ne doit exister que dans une vue précise (ex. réduire les impôts uniquement en vue Couple,
   sans que ça double aussi en vue Perso ni que la correction elle-même soit doublée/divisée). */
function adjustmentScopedAmount(adj){
  const cfg = Store.settings.budget;
  const raw = Number(adj.montant)||0;
  if(adj.montantScope==="both") return raw;
  const adjScope = adj.montantScope || cfg.scope;
  if(adj.montantViewOnly) return adjScope===cfg.scope ? raw : 0;
  if(adjScope === cfg.scope) return raw;
  return adjScope === "couple" ? raw/2 : raw*2;
}

/* ---------------- Salaire : saisie manuelle Moi / Ma femme par mois ---------------- */
/* La catégorie "Salaire" (nom normalisé, insensible à la casse/accents) peut être pilotée manuellement
   mois par mois plutôt que déduite des transactions : utile si le salaire de la conjointe n'est pas
   suivi dans les transactions, ou pour corriger une valeur ponctuelle. */
function isSalaryCategory(catKey){
  return U.normalize(catKey) === "salaire";
}
/* Montant réel (brut, non multiplié par le scope) des transactions de cette catégorie pour ce groupe,
   sur un mois donné (date corrigée). Sert de valeur par défaut pour "Moi" quand rien n'est saisi. */
function salaryRealMonthAmount(superGroupeName, catKey, monthKey){
  let total = 0;
  Store.transactions.forEach(t=>{
    if(t.type==="Transfer") return;
    if(!groupSelectionMatches(t, superGroupeName)) return;
    if(isAccountExcluded(t.compte)) return;
    const base = t.groupeBase || U.baseGroupe(t.groupe);
    if(AGG.getGroupKind(t.groupe)==="voyage") return;
    const cat = t.categorie || "(Non renseigné)";
    if(cat !== catKey) return;
    const tr = t.transform;
    if(tr.mode==="yearsplit"){
      const [my] = monthKey.split("-").map(Number);
      if(String(tr.year)===String(my)) total += t.montant/12;
      return;
    }
    const effMonthKey = tr.mode==="month" ? (tr.year+"-"+U.pad2(tr.month+1)) : (t.date.getFullYear()+"-"+U.pad2(t.date.getMonth()+1));
    if(effMonthKey === monthKey) total += t.montant;
  });
  return total;
}
/* Entrée manuelle Moi/Ma femme pour un mois donné ({moi:null, femme:null} si rien saisi ce mois-là). */
function salaryEntryFor(monthKey){
  const cfg = Store.settings.budget;
  const e = (cfg.salaryEntries||{})[monthKey];
  return {
    moi: (e && e.moi!=null && e.moi!=="") ? Number(e.moi) : null,
    femme: (e && e.femme!=null && e.femme!=="") ? Number(e.femme) : null
  };
}
/* Montant total "utilisé" pour la catégorie Salaire sur un mois donné, selon le scope courant :
   - Couple : salaire de ma femme (saisi, 0 par défaut si rien saisi) + le mien.
   - Perso : le mien uniquement. Pas de multiplication ×2 : le total couple additionne déjà les deux
     salaires réels. */
function salaryMonthTotal(superGroupeName, catKey, monthKey){
  const b = salaryMonthBreakdown(superGroupeName, catKey, monthKey);
  return b.total;
}
/* Décomposition Brut / Ajout du montant "utilisé" pour la catégorie Salaire sur un mois donné :
   - Le salaire de "Ma femme" (saisie manuelle, 0 par défaut si rien saisi) est entièrement considéré
     comme "Brut" — sa valeur déclarée n'est jamais comparée à des transactions (elle n'est en général pas
     suivie dans les transactions).
   - Mon salaire ("Moi") : le montant des transactions réelles est toujours le "Brut". Si une saisie
     manuelle est renseignée pour le mois, elle représente le salaire déclaré ; l'écart entre cette valeur
     déclarée et le montant des transactions est comptabilisé comme "Ajout" (positif ou négatif). Sans
     saisie manuelle, "Moi" = Brut seul (Ajout = 0). */
function salaryMonthBreakdown(superGroupeName, catKey, monthKey){
  const cfg = Store.settings.budget;
  const entry = salaryEntryFor(monthKey);
  const moiReal = salaryRealMonthAmount(superGroupeName, catKey, monthKey);
  const moiDeclared = entry.moi!=null ? entry.moi : moiReal;
  const moiAdj = moiDeclared - moiReal;
  let real = moiReal, adj = moiAdj;
  if(cfg.scope==="couple"){
    const femme = entry.femme!=null ? entry.femme : 0;
    real += femme;
  }
  return {real, adj, total: real+adj};
}

function computeGroupBudget(superGroupeName, months, opts){
  opts = opts || {};
  const cfg = Store.settings.budget;
  const scopeMult = cfg.scope==="couple" ? 2 : 1;
  const monthSet = new Set(months);
  const amortSet = new Set(cfg.amortCategories||[]);
  // "amorti" (lissage catégories + ajustements) / "brut_ajout" (pas de lissage, mais ajustements manuels non-amortis
  // pris en compte). Les groupes additionnels restent toujours forcés en brut (forceBrut), quel que soit le mode.
  const isAmorti = !opts.forceBrut && cfg.mode==="amorti";
  const applyAdjustments = !opts.forceBrut && (cfg.mode==="amorti" || cfg.mode==="brut_ajout");

  // catégorie -> {income, expense}
  const catTotals = new Map();
  // groupe voyage (base) -> {income, expense, label}
  const voyTotals = new Map();
  // catégorie amortie -> total brut sur TOUTE la période disponible (pas seulement les mois affichés)
  const amortPoolAll = new Map();

  function ensureCat(cat){
    if(!catTotals.has(cat)) catTotals.set(cat, {key:cat, income:0, expense:0, realIncome:0, realExpense:0, amortIncome:0, amortExpense:0, adjIncome:0, adjExpense:0});
    return catTotals.get(cat);
  }
  function ensureVoy(base){
    if(!voyTotals.has(base)) voyTotals.set(base, {key:base, income:0, expense:0, realIncome:0, realExpense:0, amortIncome:0, amortExpense:0, adjIncome:0, adjExpense:0});
    return voyTotals.get(base);
  }

  /* Une transaction correspond à la sélection si son groupe résolu (groupe de groupe) correspond,
     OU si son groupe littéral (avec date) ou son nom de base correspond exactement — ce qui permet
     de choisir un groupe précis à l'intérieur d'un groupe de groupe plutôt que le groupe de groupe entier. */
  function matchesSelection(t){ return groupSelectionMatches(t, superGroupeName); }

  Store.transactions.forEach(t=>{
    if(t.type==="Transfer") return;
    if(!matchesSelection(t)) return;
    if(isAccountExcluded(t.compte)) return;
    const base = t.groupeBase || U.baseGroupe(t.groupe);
    const kind = AGG.getGroupKind(t.groupe);

    if(kind==="voyage"){
      // Les groupes voyage sont affectés en bloc à un mois défini (ou au mois réel/corrigé sinon)
      const forced = AGG.getGroupVoyageMonth(t.groupe);
      // Le libellé affiché conserve le nom complet du groupe (avec la date entre parenthèses) :
      // on ne fusionne pas plusieurs séjours du même lieu sous un seul nom de base.
      let targetMonth = forced;
      if(!targetMonth){
        const tr = t.transform;
        if(tr.mode==="month") targetMonth = tr.year+"-"+U.pad2(tr.month+1);
        else if(tr.mode==="yearsplit"){
          // réparti sur l'année : on ajoute 1/12 à chaque mois de cette année qui est dans la période affichée
          for(let m=1;m<=12;m++){
            const key = tr.year+"-"+U.pad2(m);
            if(monthSet.has(key)){
              const o = ensureVoy(t.groupe);
              const amt = t.montant/12*scopeMult;
              if(t.type==="Income"){ o.income += amt; o.realIncome += amt; } else { o.expense += amt; o.realExpense += amt; }
            }
          }
          return;
        } else targetMonth = t.date.getFullYear()+"-"+U.pad2(t.date.getMonth()+1);
      }
      if(monthSet.has(targetMonth)){
        const o = ensureVoy(t.groupe);
        const amt = t.montant*scopeMult;
        if(t.type==="Income"){ o.income += amt; o.realIncome += amt; } else { o.expense += amt; o.realExpense += amt; }
      }
      return;
    }

    // "quotidien" : par catégorie, date corrigée, avec gestion des catégories amorties
    const cat = t.categorie || "(Non renseigné)";
    const tr = t.transform;
    // Une dépense en dehors de la borne chronologique définie (avant "Mois de début" OU après "Dernier
    // mois") est elle aussi considérée comme amortie, peu importe sa catégorie — même mécanisme des deux
    // côtés de la fenêtre.
    const effMonthKey = tr.mode==="month" ? (tr.year+"-"+U.pad2(tr.month+1)) : (t.date.getFullYear()+"-"+U.pad2(t.date.getMonth()+1));
    const beforeStart = cfg.startMonth && effMonthKey < cfg.startMonth;
    const afterEnd = cfg.endMonth && effMonthKey > cfg.endMonth;
    const amortized = isAmorti && (amortSet.has(cat) || beforeStart || afterEnd);
    function addToMonth(key, weight){
      if(!monthSet.has(key)) return;
      const o = ensureCat(cat);
      const amt = t.montant*weight*scopeMult;
      if(t.type==="Income"){ o.income += amt; o.realIncome += amt; } else { o.expense += amt; o.realExpense += amt; }
    }
    if(amortized){
      // Alimentation du pool d'amortissement : TOUTE transaction éligible (catégorie amortie, ou antérieure
      // au mois de début quelle que soit sa catégorie), peu importe son ancienneté — une dépense de plusieurs
      // années avant le mois de début reste amortissable (cf. §5.3bis). Seule la RÉPARTITION vers les mois
      // affichés est bornée à la fenêtre d'amortissement (voir plus bas, amortWindowMonths).
      const prev = amortPoolAll.get(cat) || {income:0, expense:0};
      const amt = t.montant*scopeMult;
      if(t.type==="Income") prev.income += amt; else prev.expense += amt;
      amortPoolAll.set(cat, prev);
      return;
    }
    if(tr.mode==="month"){
      addToMonth(tr.year+"-"+U.pad2(tr.month+1), 1);
    } else if(tr.mode==="yearsplit"){
      for(let m=1;m<=12;m++) addToMonth(tr.year+"-"+U.pad2(m), 1/12);
    } else {
      addToMonth(t.date.getFullYear()+"-"+U.pad2(t.date.getMonth()+1), 1);
    }
  });

  // Ajustements manuels : montant converti à l'échelle du scope courant (§ adjustmentScopedAmount),
  // selon le scope dans lequel chacun a été saisi (Perso/Couple).
  // Un ajustement "amorti" ajoute son montant tel quel sur son mois (pour, par ex., annuler une dépense
  // ponctuelle) ET amortit son opposé sur l'ensemble de la période d'amortissement (même mécanisme que
  // les catégories amorties ci-dessus).
  const amortPoolVoyAll = {income:0, expense:0};
  if(applyAdjustments){
    (cfg.adjustments||[]).forEach(adj=>{
      if(adj.groupe !== superGroupeName) return;
      // Mode "Sans amort, avec ajout" : les ajustements créés via la case "Amortir ce montant sur toute la
      // période" restent exclus (ni leur entrée immédiate, ni leur lissage) — seuls les ajustements simples
      // (non amortis) sont pris en compte dans ce mode intermédiaire.
      if(!isAmorti && adj.amorti) return;
      const amt = adjustmentScopedAmount(adj);
      if(!amt) return;
      if(monthSet.has(adj.month)){
        if(adj.categorie){
          const o = ensureCat(adj.categorie);
          if(amt>=0){ o.income += amt; o.adjIncome += amt; } else { o.expense += amt; o.adjExpense += amt; }
        } else {
          const o = ensureVoy("__ajustement__");
          o.label = "Ajustements";
          if(amt>=0){ o.income += amt; o.adjIncome += amt; } else { o.expense += amt; o.adjExpense += amt; }
        }
      }
      if(adj.amorti && isAmorti){
        const oppAmt = -amt;
        if(adj.categorie){
          const prev = amortPoolAll.get(adj.categorie) || {income:0, expense:0};
          if(oppAmt>=0) prev.income += oppAmt; else prev.expense += oppAmt;
          amortPoolAll.set(adj.categorie, prev);
        } else {
          if(oppAmt>=0) amortPoolVoyAll.income += oppAmt; else amortPoolVoyAll.expense += oppAmt;
        }
      }
    });
  }

  // Amortissement : total (sur tout l'historique, catégorie par catégorie, + ajustements amortis) / "période
  // où on reste", réinjecté uniquement sur les mois affichés qui tombent DANS la fenêtre d'amortissement
  // [Mois de début → Mois de début + période - 1]. Les mois affichés hors de cette fenêtre (avant ou après)
  // reçoivent 0 — jamais une part de l'amortissement, même si la période affichée les inclut.
  // opts.boundsMonths (optionnel) : période affichée complète, quand `months` n'en est qu'un sous-ensemble
  // (ex. un seul mois, pour la vue "mois par mois") — voir amortWindowMonths/computeAmortPeriodMonths.
  if(isAmorti){
    const boundsMonths = opts.boundsMonths || months;
    const periodMonths = computeAmortPeriodMonths(months, boundsMonths);
    const windowN = amortWindowMonths(months, periodMonths, boundsMonths).length;
    amortPoolAll.forEach((tot, cat)=>{
      const perMonth = {income: tot.income/periodMonths, expense: tot.expense/periodMonths};
      const o = ensureCat(cat);
      const addInc = perMonth.income*windowN, addExp = perMonth.expense*windowN;
      o.income += addInc; o.expense += addExp;
      o.amortIncome += addInc; o.amortExpense += addExp;
    });
    if(amortPoolVoyAll.income || amortPoolVoyAll.expense){
      const perMonth = {income: amortPoolVoyAll.income/periodMonths, expense: amortPoolVoyAll.expense/periodMonths};
      const o = ensureVoy("__ajustement__");
      o.label = "Ajustements";
      const addInc = perMonth.income*windowN, addExp = perMonth.expense*windowN;
      o.income += addInc; o.expense += addExp;
      o.amortIncome += addInc; o.amortExpense += addExp;
    }
  }

  // Salaire : remplace le montant calculé (transactions + amortissement + ajustements) par la décomposition
  // Brut/Ajout "utilisée" mois par mois (cf. salaryMonthBreakdown : transactions réelles = Brut, écart avec
  // la saisie manuelle "Moi" = Ajout, salaire de "Ma femme" entièrement Brut). S'applique à la catégorie "Salaire" du groupe même si aucune transaction réelle ne
  // tombe dans la période affichée (ex. période ne couvrant que des mois purement saisis à la main) : sans
  // cela, la ligne Salaire disparaîtrait dès que la période ne contient plus de transaction réelle, alors
  // même que des saisies manuelles existent pour ces mois. On recherche donc le nom canonique de la
  // catégorie "Salaire" du groupe dans TOUTE l'historique de transactions (pas seulement la période), et on
  // crée la ligne dès qu'elle existe déjà pour la période OU qu'au moins un mois de la période a une saisie
  // manuelle (Moi/Ma femme) renseignée.
  let salaryCatKey = null;
  catTotals.forEach((o, cat)=>{ if(isSalaryCategory(cat)) salaryCatKey = cat; });
  if(!salaryCatKey){
    Store.transactions.some(t=>{
      if(t.type==="Transfer") return false;
      if(!matchesSelection(t)) return false;
      if(isAccountExcluded(t.compte)) return false;
      const base = t.groupeBase || U.baseGroupe(t.groupe);
      if(AGG.getGroupKind(t.groupe)==="voyage") return false;
      const cat = t.categorie || "(Non renseigné)";
      if(isSalaryCategory(cat)){ salaryCatKey = cat; return true; }
      return false;
    });
  }
  if(salaryCatKey){
    const hasManualEntry = months.some(m=>{ const e = salaryEntryFor(m); return e.moi!=null || e.femme!=null; });
    if(catTotals.has(salaryCatKey) || hasManualEntry){
      const o = ensureCat(salaryCatKey);
      let real = 0, adj = 0;
      months.forEach(m=>{ const b = salaryMonthBreakdown(superGroupeName, salaryCatKey, m); real += b.real; adj += b.adj; });
      const total = real+adj;
      o.income = total; o.expense = 0;
      o.realIncome = real; o.realExpense = 0;
      o.amortIncome = 0; o.amortExpense = 0;
      o.adjIncome = adj; o.adjExpense = 0;
    }
  }

  const categories = Array.from(catTotals.values());
  const typeMap = new Map();
  categories.forEach(c=>{ typeMap.set(c.key, c.income>=Math.abs(c.expense) ? "Income" : "Expense"); });
  categories.sort((a,b)=>{
    const ta = typeMap.get(a.key), tb = typeMap.get(b.key);
    if(ta!==tb) return ta==="Income" ? -1 : 1;
    return a.key.localeCompare(b.key,'fr');
  });
  const voyages = Array.from(voyTotals.values()).sort((a,b)=>(a.label||a.key).localeCompare(b.label||b.key,'fr'));

  // Revenus/Dépenses (bucket "quotidien", catégories) et Voyages sont désormais présentés comme trois
  // ensembles distincts (au lieu de fusionner voyages dans revenus/dépenses) : catIncome/catExpense pour
  // les catégories, voyIncome/voyExpense/voyNet pour les voyages (et ajustements sans catégorie).
  const catIncome = categories.reduce((s,c)=>s+c.income,0);
  const catExpense = categories.reduce((s,c)=>s+c.expense,0);
  const voyIncome = voyages.reduce((s,c)=>s+c.income,0);
  const voyExpense = voyages.reduce((s,c)=>s+c.expense,0);
  const income = catIncome + voyIncome;
  const expense = catExpense + voyExpense;
  return {categories, voyages, income, expense, net: income+expense,
    catIncome, catExpense, voyIncome, voyExpense, voyNet: voyIncome+voyExpense};
}

/* Ventilation "mois par mois" d'un groupe (principal ou additionnel), pour la vue calendrier de l'onglet
   Budget — net global ET détail par catégorie / par voyage (mêmes lignes que la carte du groupe : le
   calendrier doit lister les mêmes catégories et voyages, pas seulement un total par groupe). Réutilise
   directement computeGroupBudget() un mois à la fois (aucune duplication de sa logique
   réel/amortissement/ajustements/salaire) ; boundsMonths = la période affichée complète, pour que le calcul
   de la fenêtre d'amortissement (voir amortWindowMonths/computeAmortPeriodMonths) reste exact même appelé
   sur un seul mois. Les groupes additionnels (forceBrut) suivent leurs mois effectifs habituels
   (extraGroupEffectiveMonths) : les mois hors de cette borne sont absents des Map retournées (0 pour
   l'appelant), exactement comme pour leur total agrégé habituel.
   Retourne {net: Map(mois->net), categories: Map(catKey -> Map(mois->net)), voyages: Map(voyKey ->
   Map(mois->net))}. */
function computeGroupBudgetDetailByMonth(groupName, allMonths, opts){
  opts = opts || {};
  const effMonths = opts.forceBrut ? extraGroupEffectiveMonths(groupName, allMonths) : allMonths;
  const effSet = new Set(effMonths);
  const net = new Map();
  const categories = new Map();
  const voyages = new Map();
  allMonths.forEach(m=>{
    if(!effSet.has(m)) return;
    const res = computeGroupBudget(groupName, [m], Object.assign({}, opts, {boundsMonths: allMonths}));
    net.set(m, res.net);
    res.categories.forEach(c=>{
      if(!categories.has(c.key)) categories.set(c.key, new Map());
      categories.get(c.key).set(m, c.income+c.expense);
    });
    res.voyages.forEach(v=>{
      if(!voyages.has(v.key)) voyages.set(v.key, new Map());
      voyages.get(v.key).set(m, v.income+v.expense);
    });
  });
  return {net, categories, voyages};
}

/* ---------------- Comparaison (autre période / budget prédéfini) ---------------- */
/* Liste des catégories (hors voyages) qui apparaissent au moins une fois pour ce groupe, toutes périodes
   confondues — sert à proposer les lignes du budget prédéfini même pour des mois hors de la période affichée. */
function categoriesForGroup(groupName){
  const set = new Set();
  Store.transactions.forEach(t=>{
    if(t.type==="Transfer") return;
    if(!groupSelectionMatches(t, groupName)) return;
    if(isAccountExcluded(t.compte)) return;
    const base = t.groupeBase || U.baseGroupe(t.groupe);
    if(AGG.getGroupKind(t.groupe)==="voyage") return;
    set.add(t.categorie || "(Non renseigné)");
  });
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'fr'));
}
function predefinedCatKey(groupName, catKey){ return groupName+"::cat::"+catKey; }
function predefinedVoyageKey(groupName){ return groupName+"::voyage"; }

/* Les mois "effectifs" d'un groupe additionnel sont désormais toujours les mêmes que ceux de la borne
   chronologique de l'amortissement (Mois de début → Dernier mois, cf. amortBoundedMonths) — plus de
   bornage indépendant par groupe additionnel : ils suivent forcément les mêmes mois que le principal. */
function extraGroupEffectiveMonths(groupName, mainMonths){
  return amortBoundedMonths(mainMonths);
}

/* Construit le contexte de comparaison pour l'ensemble des groupes affichés (principal + additionnels).
   Le scénario "autre période" applique EXACTEMENT les mêmes réglages (mode, vue, amortissement, comptes
   exclus, ajustements) que le scénario principal — seule la période change, librement choisie (et,
   pour un groupe additionnel, reste bornée par sa propre période le cas échéant, en intersection avec la
   période comparée). Le scénario "budget prédéfini" est un montant mensuel saisi à la main par
   groupe/catégorie/voyages, multiplié par le nombre de mois EFFECTIFS du groupe concerné (bornes propres
   incluses) dans le scénario principal en vue Total (utilisé tel quel, sans multiplication, en vue Moyenne/mois). */
function computeCompareContext(mainMonths){
  const cfg = Store.settings.budget;
  const cmp = cfg.compare;
  if(!cmp || !cmp.enabled) return null;
  if(cmp.mode==="predefined"){
    const multForGroup = (groupName)=>{
      if(cfg.displayMode==="moyenne") return 1;
      const gm = groupName===cfg.mainGroup ? mainMonths : extraGroupEffectiveMonths(groupName, mainMonths);
      return gm.length || 0;
    };
    return {type:"predefined", predefined: cmp.predefined||{}, multForGroup};
  }
  if(!cmp.periodFrom || !cmp.periodTo) return null;
  const cMonths = monthsInRange(cmp.periodFrom, cmp.periodTo);
  if(!cMonths.length) return null;
  // Même logique que le scénario principal (voir divisor dans renderBudget) : en vue Moyenne/mois, le
  // diviseur ne compte que les mois de la période COMPARÉE compris dans la borne chronologique de
  // l'amortissement (Mois de début → Dernier mois), quel que soit le mode — jamais le nombre brut de mois
  // de la période comparée.
  const divisor = cfg.displayMode==="moyenne" ? (amortBoundedMonths(cMonths).length || 1) : 1;
  return {type:"period", months: cMonths, divisor, cache: new Map()};
}
function compareGroupResult(ctx, groupName){
  if(ctx.type!=="period") return null;
  if(!ctx.cache.has(groupName)){
    const cfg = Store.settings.budget;
    const forceBrut = groupName!==cfg.mainGroup;
    const gMonths = forceBrut ? extraGroupEffectiveMonths(groupName, ctx.months) : ctx.months;
    ctx.cache.set(groupName, computeGroupBudget(groupName, gMonths, {forceBrut}));
  }
  return ctx.cache.get(groupName);
}
/* Valeur comparée pour une ligne catégorie précise d'un groupe. */
function compareCategoryTotal(ctx, groupName, catKey){
  if(!ctx) return 0;
  if(ctx.type==="predefined"){
    const raw = Number((ctx.predefined||{})[predefinedCatKey(groupName, catKey)]);
    return (isNaN(raw)?0:raw) * ctx.multForGroup(groupName);
  }
  const r = compareGroupResult(ctx, groupName);
  if(!r) return 0;
  const c = r.categories.find(x=>x.key===catKey);
  return c ? (c.income+c.expense)/ctx.divisor : 0;
}
/* Valeur comparée pour l'ensemble des voyages d'un groupe (total unique, sans distinction par voyage). */
function compareVoyageTotal(ctx, groupName){
  if(!ctx) return 0;
  if(ctx.type==="predefined"){
    const raw = Number((ctx.predefined||{})[predefinedVoyageKey(groupName)]);
    return (isNaN(raw)?0:raw) * ctx.multForGroup(groupName);
  }
  const r = compareGroupResult(ctx, groupName);
  return r ? r.voyNet/ctx.divisor : 0;
}
/* Tableau à trois colonnes (Résultat / Comparé / Variation) affiché quand la comparaison est active.
   BG_CMP_COLS fixe les proportions des colonnes (libellé + 3 valeurs), partagées entre l'en-tête
   (compareHeaderRowHtml, affiché une fois en haut de chaque carte/bloc) et chaque ligne (compareRowHtml) —
   libellé et valeurs tiennent sur une seule ligne. Couleur de la variation : vert si le solde évolue
   favorablement (Résultat - Comparé > 0), rouge sinon, peu importe qu'il s'agisse d'un revenu ou d'une
   dépense (montants nets signés). Les totaux Revenus/Dépenses/Voyages (cartes et grand total) sont
   toujours la somme des lignes affichées en dessous, jamais une valeur indépendante.*/
const BG_CMP_COLS = "minmax(0,1fr) minmax(0,0.85fr) minmax(0,0.85fr) minmax(0,0.85fr)";
/* Un filtre "kind" (Réel/Amorti/Ajout) peut être une valeur composée "reel_ajout" (utilisée par la vue
   détail Amort.+ajouts pour la colonne "Réel + ajout", qui regroupe deux natures d'éléments à la fois) —
   ce helper centralise le test d'inclusion, utilisé par les feuilles de détail catégorie/voyage/groupe. */
function bgKindIncluded(filterKind, kind){
  if(!filterKind) return true;
  if(filterKind===kind) return true;
  return filterKind==="reel_ajout" && (kind==="reel" || kind==="ajout");
}
function compareHeaderRowHtml(){
  const th = (t)=>`<span style="font-size:9px;font-weight:800;color:var(--text-sub);text-transform:uppercase;letter-spacing:.2px;text-align:right;">${t}</span>`;
  return `<div style="display:grid;grid-template-columns:${BG_CMP_COLS};gap:5px;padding:0 0 3px;"><span></span>${th("Résultat")}${th("Comparé")}${th("Variation")}</div>`;
}
function compareRowHtml(label, resultVal, compareVal, opts){
  opts = opts || {};
  const diff = resultVal - compareVal;
  const color = diff>0 ? "var(--income)" : diff<0 ? "var(--expense)" : "var(--text-sub)";
  const labelSize = opts.big ? "13.5px" : "12.5px";
  const labelWeight = opts.big ? 800 : 600;
  const valSize = opts.big ? "12px" : "11px";
  return `
    <div style="display:grid;grid-template-columns:${BG_CMP_COLS};gap:5px;align-items:baseline;">
      <span style="font-size:${labelSize};font-weight:${labelWeight};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${U.escHtml(label)}</span>
      <span style="font-size:${valSize};font-weight:800;text-align:right;color:${resultVal<0?'var(--expense)':'var(--income)'};">${bgFmtMoneySigned(resultVal)}</span>
      <span style="font-size:${valSize};font-weight:600;text-align:right;color:var(--text-sub);">${bgFmtMoney(compareVal)}</span>
      <span style="font-size:${valSize};font-weight:800;text-align:right;color:${color};">${bgFmtMoneySigned(diff)}</span>
    </div>
  `;
}

/* ---------------- Vue détail (Réel+Ajout / Amorti / Total, ou Brut / Ajout / Total) ---------------- */
/* Libellés des 3 colonnes selon le mode budget courant : en mode "Amort. + ajouts", la colonne de gauche
   regroupe réel ET ajout (puisque l'amortissement est la seule dimension pertinente à isoler) ; en mode
   "Sans amort, avec ajout" (pas de lissage catégoriel), la colonne de gauche est le montant brut réel seul,
   la colonne du milieu l'ajout manuel — l'amortissement, toujours nul dans ce mode, n'est jamais affiché. */
function bgDetailLabels(mode){
  return mode==="amorti" ? ["Réel + ajout","Amorti","Total"] : ["Brut","Ajout","Total"];
}
function detailHeaderRowHtml(mode){
  const th = (t)=>`<span style="font-size:9px;font-weight:800;color:var(--text-sub);text-transform:uppercase;letter-spacing:.2px;text-align:right;">${t}</span>`;
  const labels = bgDetailLabels(mode);
  return `<div style="display:grid;grid-template-columns:${BG_CMP_COLS};gap:5px;padding:0 0 3px;"><span></span>${labels.map(th).join("")}</div>`;
}
/* Construit une ligne 3 colonnes à partir des montants réel/amorti/ajout (déjà signés) d'une catégorie,
   d'un voyage, ou d'un total agrégé. clickAttrs (optionnel) rend chaque valeur individuellement cliquable
   via la classe .bg-detail-cell, avec le filtre (data-filter) correspondant à la colonne cliquée — géré par
   le wiring central dans renderBudget. */
function detailRowHtml(label, mode, real, amort, adj, opts, clickAttrs){
  opts = opts || {};
  const col1 = mode==="amorti" ? real+adj : real;
  const col2 = mode==="amorti" ? amort : adj;
  const total = real+amort+adj;
  const kind1 = mode==="amorti" ? "reel_ajout" : "reel";
  const kind2 = mode==="amorti" ? "amorti" : "ajout";
  const labelSize = opts.big ? "13.5px" : "12.5px";
  const labelWeight = opts.big ? 800 : 600;
  const valSize = opts.big ? "12px" : "11px";
  function cell(v, kind, isTotal){
    const color = isTotal ? (v<0?'var(--expense)':'var(--income)') : "var(--text-sub)";
    const weight = isTotal ? 800 : 600;
    if(!clickAttrs){
      return `<span style="font-size:${valSize};font-weight:${weight};text-align:right;color:${color};">${bgFmtMoneySigned(v)}</span>`;
    }
    const dataAttrs = [
      `data-sheet="${clickAttrs.sheet}"`,
      `data-supergroupe="${U.escHtml(clickAttrs.supergroupe)}"`,
      clickAttrs.cat!=null ? `data-cat="${U.escHtml(clickAttrs.cat)}"` : "",
      clickAttrs.voy!=null ? `data-voy="${U.escHtml(clickAttrs.voy)}"` : "",
      clickAttrs.type!=null ? `data-type="${U.escHtml(clickAttrs.type)}"` : "",
      clickAttrs.groups ? `data-groups="${U.escHtml(clickAttrs.groups)}"` : "",
      `data-filter="${kind||''}"`,
    ].join(" ");
    return `<span class="bg-detail-cell" ${dataAttrs} style="cursor:pointer;font-size:${valSize};font-weight:${weight};text-align:right;color:${color};">${bgFmtMoneySigned(v)}</span>`;
  }
  return `
    <div style="display:grid;grid-template-columns:${BG_CMP_COLS};gap:5px;align-items:baseline;">
      <span style="font-size:${labelSize};font-weight:${labelWeight};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${U.escHtml(label)}</span>
      ${cell(col1, kind1, false)}
      ${cell(col2, kind2, false)}
      ${cell(total, null, true)}
    </div>
  `;
}


/* ---------------- Rendu ---------------- */
function candidateSuperGroupes(){
  return AGG.distinctValuesGroupeDisplay(Store.transactions).map(v=>v.value).sort((a,b)=>a.localeCompare(b,'fr'));
}

/* Hiérarchie pour les pickers de groupe du Budget : groupes de groupe (triés alpha) avec leurs groupes
   enfants sélectionnables individuellement, puis les groupes non classés (triés alpha). excludeSet retire
   des entrées précises (ex. le groupe principal déjà choisi) de la liste proposée. */
function groupPickerHierarchy(excludeSet){
  const full = AGG.groupeHierarchyFull(Store.transactions);
  const sections = new Map();
  full.sections.forEach((children, sup)=>{
    if(excludeSet.has(sup)) return;
    const filtered = children.filter(c=>!excludeSet.has(c.base));
    if(filtered.length) sections.set(sup, filtered);
  });
  const flat = full.flat.filter(f=>!excludeSet.has(f.base));
  return {sections, flat};
}

/* ---------------- Ajustements manuels : section sur la page principale du Budget ---------------- */
function adjustmentsInPeriod(){
  const cfg = Store.settings.budget;
  const months = monthsInRange(periodFrom, periodTo);
  const monthSet = new Set(months);
  // Un ajustement amorti ("Amortir ce montant sur toute la période") reste actif sur toute la période
  // d'amortissement, pas seulement sur son mois d'origine : on le montre donc en plus de ceux dont le
  // mois d'origine tombe dans la période affichée.
  return (cfg.adjustments||[]).map((a,i)=>Object.assign({__idx:i}, a)).filter(a=>monthSet.has(a.month) || a.amorti);
}
function adjustmentsSectionHtml(){

}
function wireAdjustmentsSection(){

/* Formulaire d'ajout / modification d'un ajustement (pop-up plein) */
function openAdjustmentForm(adj, prefill){
  const cfg = Store.settings.budget;
  const groups = candidateSuperGroupes();
  const cats = AGG.distinctValuesCategorieSorted(Store.transactions).map(c=>c.value);
  const isEdit = !!(adj && adj.__idx!=null);
  const data = adj || Object.assign({month: periodFrom||"", groupe: cfg.mainGroup||"", categorie:"", montant:"", remarque:"", amorti:false, montantScope: cfg.scope}, prefill||{});
  if(!data.montantScope) data.montantScope = cfg.scope;
  const modal = document.getElementById("modal-detail");
  modal.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <span style="font-weight:800;font-size:17px;">${isEdit?"Modifier l'ajustement":"Nouvel ajustement"}</span>
      <button class="icon-btn" id="adjf-close">${ICONS.close}</button>
    </div>
    <div class="daterange" style="margin-bottom:10px;">
      <input type="month" class="search-mini" id="adjf-month" value="${U.escHtml(data.month||'')}">
      <select id="adjf-groupe" class="search-mini" style="margin:0;">
        <option value="">— Groupe —</option>
        ${groups.map(g=>`<option value="${U.escHtml(g)}" ${data.groupe===g?'selected':''}>${U.escHtml(g)}</option>`).join("")}
      </select>
    </div>
    <select id="adjf-cat" class="search-mini" style="margin-bottom:10px;">
      <option value="">— Catégorie (vide = ajustement global au groupe) —</option>
      ${cats.map(c=>`<option value="${U.escHtml(c)}" ${data.categorie===c?'selected':''}>${U.escHtml(c)}</option>`).join("")}
    </select>
    <input type="number" step="0.01" class="search-mini" style="margin-bottom:10px;" placeholder="Montant (négatif = dépense)" id="adjf-montant" value="${data.montant!=null?data.montant:''}">
    <input type="text" class="search-mini" style="margin-bottom:10px;" placeholder="Remarque" id="adjf-remarque" value="${U.escHtml(data.remarque||'')}">
    <div style="margin-bottom:14px;">
      <div style="font-size:12px;color:var(--text-sub);margin-bottom:6px;">Ce montant est saisi en :</div>
      <div style="display:flex;gap:8px;">
        <div class="adjf-scope-opt" data-scope="perso" style="flex:1;text-align:center;padding:9px 0;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:700;border:2px solid var(--divider);">Perso (×1)</div>
        <div class="adjf-scope-opt" data-scope="couple" style="flex:1;text-align:center;padding:9px 0;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:700;border:2px solid var(--divider);">Couple (×2)</div>
        <div class="adjf-scope-opt" data-scope="both" style="flex:1;text-align:center;padding:9px 0;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:700;border:2px solid var(--divider);">Les deux</div>
      </div>
      <div style="font-size:11px;color:var(--text-sub);margin-top:6px;line-height:1.4;">
        Perso/Couple : le montant est automatiquement multiplié ou divisé par deux si la vue Perso/Couple du budget est changée par la suite. "Les deux" : montant identique, jamais converti, quelle que soit la vue affichée.
      </div>
    </div>
    <div class="check-item ${data.montantViewOnly?'selected':''}" id="adjf-viewonly-toggle" style="margin-bottom:6px;cursor:pointer;">
      <span class="cbox">${ICONS.check}</span><span class="lbl">N'apparaît que dans la vue <strong id="adjf-viewonly-scopename"></strong></span>
    </div>
    <div style="font-size:11px;color:var(--text-sub);margin-bottom:14px;line-height:1.4;" id="adjf-viewonly-note">
      Si activé, ce montant ne compte que lorsque le budget est affiché dans cette vue précise — 0 € dans l'autre vue, jamais multiplié/divisé par deux. Utile pour une correction propre à une seule vue (ex. réduire les impôts uniquement en vue Couple, sans que ça double aussi en vue Perso).
    </div>
    <div class="check-item ${data.amorti?'selected':''}" id="adjf-amorti-toggle" style="margin-bottom:8px;cursor:pointer;">
      <span class="cbox">${ICONS.check}</span><span class="lbl">Amortir ce montant sur toute la période</span>
    </div>
    <div style="font-size:12px;color:var(--text-sub);margin-bottom:18px;line-height:1.4;">
      Si activé : le montant saisi est ajouté tel quel sur le mois choisi (ex. +1000 € pour annuler une dépense ponctuelle de 1000 €), et son opposé (ex. -1000 €) est lissé sur chaque mois de la période d'amortissement définie dans les paramètres du budget.
    </div>
    <div style="display:flex;gap:10px;">
      ${isEdit ? `<button class="btn btn-ghost" id="adjf-delete" style="color:var(--expense);">${ICONS.trash}</button>` : ""}
      <button class="btn btn-primary" id="adjf-save" style="flex:1;">Enregistrer</button>
    </div>
  `;
  document.getElementById("adjf-close").onclick = ()=>APP.closeOverlay("overlay-detail");
  document.getElementById("adjf-amorti-toggle").onclick = (e)=> e.currentTarget.classList.toggle("selected");
  let selectedScope = (data.montantScope==='couple'||data.montantScope==='both') ? data.montantScope : 'perso';
  let selectedViewOnly = !!data.montantViewOnly && selectedScope!=='both';
  const viewOnlyToggle = document.getElementById("adjf-viewonly-toggle");
  if(selectedViewOnly) viewOnlyToggle.classList.add("selected");
  viewOnlyToggle.onclick = ()=>{
    selectedViewOnly = !selectedViewOnly;
    viewOnlyToggle.classList.toggle("selected", selectedViewOnly);
  };
  function updateViewOnlyVisibility(){
    const show = selectedScope!=='both';
    viewOnlyToggle.style.display = show ? "" : "none";
    document.getElementById("adjf-viewonly-note").style.display = show ? "" : "none";
    document.getElementById("adjf-viewonly-scopename").textContent = selectedScope==='couple' ? "Couple" : "Perso";
    if(!show){ selectedViewOnly = false; viewOnlyToggle.classList.remove("selected"); }
  }
  function paintScopeOpts(){
    document.querySelectorAll(".adjf-scope-opt").forEach(el=>{
      const on = el.dataset.scope===selectedScope;
      el.style.borderColor = on ? "var(--primary)" : "var(--divider)";
      el.style.background = on ? "var(--primary-soft)" : "";
      el.style.color = on ? "var(--primary)" : "";
    });
    updateViewOnlyVisibility();
  }
  paintScopeOpts();
  document.querySelectorAll(".adjf-scope-opt").forEach(el=>{
    el.onclick = ()=>{
      selectedScope = el.dataset.scope;
      paintScopeOpts();
    };
  });
  if(isEdit){
    document.getElementById("adjf-delete").onclick = ()=>{
      APP.confirmAction({
        title:"Supprimer cet ajustement ?",
        text:"Cette action est définitive.",
        confirmLabel:"Supprimer",
        onConfirm:()=>{
          cfg.adjustments.splice(adj.__idx,1);
          Store.saveSettings();
          APP.closeOverlay("overlay-detail");
          APP.showToast("Ajustement supprimé");
          renderBudget();
        }
      });
    };
  }
  document.getElementById("adjf-save").onclick = ()=>{
    const month = document.getElementById("adjf-month").value;
    const groupe = document.getElementById("adjf-groupe").value;
    const categorie = document.getElementById("adjf-cat").value.trim();
    const montant = Number(document.getElementById("adjf-montant").value) || 0;
    const remarque = document.getElementById("adjf-remarque").value.trim();
    const amorti = document.getElementById("adjf-amorti-toggle").classList.contains("selected");
    if(!month || !groupe || !montant){ APP.showToast("Mois, groupe et montant sont requis"); return; }
    const entry = {month, groupe, categorie, montant, remarque, amorti, montantScope: selectedScope, montantViewOnly: selectedScope!=='both' && selectedViewOnly};
    cfg.adjustments = cfg.adjustments || [];
    if(isEdit) cfg.adjustments[adj.__idx] = entry;
    else cfg.adjustments.push(entry);
    Store.saveSettings();
    APP.closeOverlay("overlay-detail");
    APP.showToast(isEdit ? "Ajustement mis à jour" : "Ajustement ajouté");
    renderBudget();
  };
  APP.openOverlay("overlay-detail");
}

/* Sépare une liste (catégories ou voyages) en deux sous-listes Revenus (net ≥ 0) / Dépenses (net < 0). */
function splitIncomeExpense(list){
  const income = [], expense = [];
  list.forEach(c=> (c.income+c.expense) < 0 ? expense.push(c) : income.push(c));
  return {income, expense};
}
/* Bloc <details> Revenus/Dépenses/Voyages, repliable, pour une liste de lignes catégorie/voyage. Le total
   de la section est toujours la somme des lignes listées (list) ; si compareVal est fourni (comparaison
   active), ce total est affiché sous forme de ligne comparée (Résultat/Comparé/Variation) au lieu du
   simple montant cliquable. Si detailInfo est fourni (vue détail active, comparaison inactive), le total est
   affiché sous forme de ligne 3 colonnes (Réel+ajout/Amorti/Total ou Brut/Ajout/Total selon le mode). */
function collapsibleRowsHtml(sectionKey, label, color, list, rowsHtml, dv, clickAttrs, compareVal, detailInfo){
  if(!list.length) return "";
  const total = dv(list.reduce((s,c)=>s+c.income+c.expense, 0));
  const open = isGroupSectionOpen(sectionKey);
  if(compareVal!=null){
    return `
      <details class="bg-cv-section" data-section-key="${U.escHtml(sectionKey)}" style="margin-top:8px;" ${open?'open':''}>
        <summary style="list-style:none;cursor:pointer;padding:4px 0;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">
            <span style="font-size:12px;font-weight:700;color:${color};">${label} (${list.length})</span>
            <svg class="chev-rot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          <div class="bg-section-total" data-supergroupe="${U.escHtml(clickAttrs.supergroupe)}" data-type="${U.escHtml(clickAttrs.type||"")}" style="cursor:pointer;">
            ${compareRowHtml("Total "+label.toLowerCase(), total, compareVal, {big:false})}
          </div>
        </summary>
        ${rowsHtml(list)}
      </details>
    `;
  }
  if(detailInfo){
    const cellAttrs = {sheet:"group", supergroupe: clickAttrs.supergroupe, type: clickAttrs.type||""};
    return `
      <details class="bg-cv-section" data-section-key="${U.escHtml(sectionKey)}" style="margin-top:8px;" ${open?'open':''}>
        <summary style="list-style:none;cursor:pointer;padding:4px 0;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">
            <span style="font-size:12px;font-weight:700;color:${color};">${label} (${list.length})</span>
            <svg class="chev-rot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          ${detailRowHtml("Total "+label.toLowerCase(), detailInfo.mode, dv(detailInfo.real), dv(detailInfo.amort), dv(detailInfo.adj), {big:false}, cellAttrs)}
        </summary>
        ${rowsHtml(list)}
      </details>
    `;
  }
  const totalAttrs = clickAttrs ? `class="bg-section-total" data-supergroupe="${U.escHtml(clickAttrs.supergroupe)}" data-type="${U.escHtml(clickAttrs.type||"")}" style="font-size:12px;font-weight:700;color:${color};cursor:pointer;"` : `style="font-size:12px;font-weight:700;color:${color};"`;
  return `
    <details class="bg-cv-section" data-section-key="${U.escHtml(sectionKey)}" style="margin-top:6px;" ${open?'open':''}>
      <summary style="list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:4px 0;">
        <span style="font-size:12px;font-weight:700;color:${color};">${label} (${list.length})</span>
        <span style="display:flex;align-items:center;gap:6px;">
          <span ${totalAttrs}>${bgFmtMoneySigned(total)}</span>
          <svg class="chev-rot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;"><path d="M6 9l6 6 6-6"/></svg>
        </span>
      </summary>
      ${rowsHtml(list)}
    </details>
  `;
}
/* Construit la carte d'un groupe (principal ou additionnel). Retourne {html, cmp} : cmp (présent seulement
   si la comparaison est active) contient {income, expense, voyage, total}, la somme des valeurs comparées
   des lignes affichées dans la carte — utilisé par renderBudget pour construire le grand total, qui est
   lui-même toujours une somme (jamais une valeur indépendante). Les voyages ne sont jamais comparés voyage
   par voyage : un seul total "Voyages" pour l'ensemble de la section, sans distinction entre eux. */
/* Formate une borne "YYYY-MM" en format court ("sept. 26"). */
function fmtBoundMonth(ym){
  if(!ym) return null;
  const parts = ym.split("-").map(Number);
  return fmtMonthYearShort(parts[0], parts[1]-1);
}
function groupCardHtml(title, res, isMain, divisor, compareCtx){
  const cfg = Store.settings.budget;
  divisor = divisor || 1;
  const dv = n => n/divisor;
  const detailOn = cfg.detailView && !compareCtx;
  const mode = cfg.mode;
  const catRowsHtml = list=>list.map(c=>{
    const val = dv(c.income+c.expense);
    if(compareCtx){
      return `
      <div class="detail-row budget-cat-row" data-cat="${U.escHtml(c.key)}" data-supergroupe="${U.escHtml(title)}" style="cursor:pointer;display:block;padding:6px 2px;">
        ${compareRowHtml(c.label||c.key, val, compareCategoryTotal(compareCtx, title, c.key), {big:false})}
      </div>`;
    }
    if(detailOn){
      const real = c.realIncome+c.realExpense, amort = c.amortIncome+c.amortExpense, adj = c.adjIncome+c.adjExpense;
      return `
      <div class="detail-row" style="display:block;padding:6px 2px;">
        ${detailRowHtml(c.label||c.key, mode, dv(real), dv(amort), dv(adj), {big:false}, {sheet:"cat", supergroupe:title, cat:c.key})}
      </div>`;
    }
    return `
    <div class="detail-row budget-cat-row" data-cat="${U.escHtml(c.key)}" data-supergroupe="${U.escHtml(title)}" style="cursor:pointer;">
      <span>${U.escHtml(c.label||c.key)}</span>
      <span style="color:${val<0?'var(--expense)':'var(--income)'}">${bgFmtMoneySigned(val)}</span>
    </div>
  `;}).join("");
  const voyRowsHtml = list=>list.map(c=>{
    if(detailOn){
      const real = c.realIncome+c.realExpense, amort = c.amortIncome+c.amortExpense, adj = c.adjIncome+c.adjExpense;
      return `
      <div class="detail-row" style="display:block;padding:6px 2px;">
        ${detailRowHtml(c.label||c.key, mode, dv(real), dv(amort), dv(adj), {big:false}, {sheet:"voy", supergroupe:title, voy:c.key})}
      </div>`;
    }
    return `
    <div class="detail-row budget-voy-row" data-voy="${U.escHtml(c.key)}" data-supergroupe="${U.escHtml(title)}" style="cursor:pointer;">
      <span>${U.escHtml(c.label||c.key)}</span>
      <span style="color:${(c.income+c.expense)<0?'var(--expense)':'var(--income)'}">${bgFmtMoneySigned(dv(c.income+c.expense))}</span>
    </div>
  `;}).join("");
  const catSplit = splitIncomeExpense(res.categories);
  const cardNet = dv(res.net);
  let cmp = null;
  let cmpIncome = null, cmpExpense = null, cmpVoyage = null;
  if(compareCtx){
    cmpIncome = catSplit.income.reduce((s,c)=>s+compareCategoryTotal(compareCtx, title, c.key), 0);
    cmpExpense = catSplit.expense.reduce((s,c)=>s+compareCategoryTotal(compareCtx, title, c.key), 0);
    cmpVoyage = compareVoyageTotal(compareCtx, title);
    cmp = {income: cmpIncome, expense: cmpExpense, voyage: cmpVoyage, total: cmpIncome+cmpExpense+cmpVoyage};
  }
  // Sommes réel/amorti/ajout par section (Revenus, Dépenses, Voyages), utilisées uniquement en vue détail.
  function sumBreakdown(list){
    return list.reduce((s,c)=>({
      real: s.real + c.realIncome + c.realExpense,
      amort: s.amort + c.amortIncome + c.amortExpense,
      adj: s.adj + c.adjIncome + c.adjExpense
    }), {real:0, amort:0, adj:0});
  }
  const incomeBreak = detailOn ? sumBreakdown(catSplit.income) : null;
  const expenseBreak = detailOn ? sumBreakdown(catSplit.expense) : null;
  const voyBreak = detailOn ? sumBreakdown(res.voyages) : null;
  const cardBreak = detailOn ? {
    real: (incomeBreak?incomeBreak.real:0)+(expenseBreak?expenseBreak.real:0)+(voyBreak?voyBreak.real:0),
    amort: (incomeBreak?incomeBreak.amort:0)+(expenseBreak?expenseBreak.amort:0)+(voyBreak?voyBreak.amort:0),
    adj: (incomeBreak?incomeBreak.adj:0)+(expenseBreak?expenseBreak.adj:0)+(voyBreak?voyBreak.adj:0)
  } : null;
  const headerHtml = compareCtx ? compareHeaderRowHtml() : detailOn ? detailHeaderRowHtml(mode) : "";
  /* En-tête de carte : sélecteur de groupe (clic sur le nom → changer ce groupe), et pour un groupe
     additionnel, en plus : bouton de suppression. Plus de bornage de période propre au groupe additionnel
     — il suit toujours les mêmes mois que le principal (bornes d'amortissement, cf. extraGroupEffectiveMonths). */
  const groupSelectorHtml = `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;">
      <button type="button" class="bg-group-swap-btn" data-group="${U.escHtml(title)}" data-ismain="${isMain?1:0}" style="display:flex;align-items:center;gap:4px;background:none;border:none;padding:0;cursor:pointer;min-width:0;flex:1;">
        <span style="font-weight:800;font-size:15.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${U.escHtml(title)}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex:0 0 auto;color:var(--text-sub);"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      ${!isMain ? `
      <button type="button" class="bg-group-remove-btn" data-group="${U.escHtml(title)}" title="Retirer ce groupe" style="display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--card-alt);border:none;cursor:pointer;color:var(--text-sub);flex:0 0 auto;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>` : ""}
    </div>
  `;
  const totalRowHtml = compareCtx ? `
      ${headerHtml}
      <div class="detail-row bg-typetxn-row" data-supergroupe="${U.escHtml(title)}" data-type="" style="cursor:pointer;display:block;padding:0 0 6px;">
        ${compareRowHtml("Total", cardNet, cmp.total, {big:true})}
      </div>
  ` : detailOn ? `
      ${headerHtml}
      <div style="display:block;padding:0 0 6px;">
        ${detailRowHtml("Total", mode, dv(cardBreak.real), dv(cardBreak.amort), dv(cardBreak.adj), {big:true}, {sheet:"group", supergroupe:title, type:""})}
      </div>
  ` : `
      <div class="detail-row bg-typetxn-row" data-supergroupe="${U.escHtml(title)}" data-type="" style="cursor:pointer;padding:0 0 4px;">
        <span style="font-size:9.5px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:.3px;">Total</span>
        <span style="font-weight:800;font-size:15.5px;color:${res.net<0?'var(--expense)':'var(--income)'}">${bgFmtMoneySigned(cardNet)}</span>
      </div>
  `;
  const titleRowHtml = groupSelectorHtml + totalRowHtml;
  /* Voyages : jamais détaillés voyage par voyage en vue comparaison — un total unique, toujours affiché
     (même à 0/0), pour permettre d'éditer le budget prédéfini des voyages même hors saison. Hors vue
     comparaison, comportement inchangé : liste détaillée, uniquement si des voyages existent sur la
     période affichée. */
  const voyagesHtml = compareCtx ? `
      <div class="bg-section-total" data-supergroupe="${U.escHtml(title)}" data-type="Voyage" style="cursor:pointer;margin-top:8px;">
        ${compareRowHtml("Total voyages", dv(res.voyNet), cmpVoyage, {big:false})}
      </div>
  ` : (res.voyages.length ? collapsibleRowsHtml(title+"::voy::all", "Voyages", (res.voyNet<0?'var(--expense)':'var(--income)'), res.voyages, voyRowsHtml, dv, {supergroupe:title, type:"Voyage"}, null, detailOn?{mode, real:voyBreak.real, amort:voyBreak.amort, adj:voyBreak.adj}:null) : "");
  const html = `
    <div class="card" style="margin-bottom:12px;">
      ${titleRowHtml}
      ${catSplit.income.length ? collapsibleRowsHtml(title+"::cat::income", "Revenus", "var(--income)", catSplit.income, catRowsHtml, dv, {supergroupe:title, type:"Income"}, compareCtx?cmpIncome:null, detailOn?{mode, real:incomeBreak.real, amort:incomeBreak.amort, adj:incomeBreak.adj}:null) : ""}
      ${catSplit.expense.length ? collapsibleRowsHtml(title+"::cat::expense", "Dépenses", "var(--expense)", catSplit.expense, catRowsHtml, dv, {supergroupe:title, type:"Expense"}, compareCtx?cmpExpense:null, detailOn?{mode, real:expenseBreak.real, amort:expenseBreak.amort, adj:expenseBreak.adj}:null) : ""}
      ${voyagesHtml}
    </div>
  `;
  return {html, cmp};
}

/* Sélecteur pour changer le groupe principal, ou le groupe occupant un slot de groupe additionnel (le nom
   choisi remplace celui-ci ; les bornes de période propres à l'ancien nom sont oubliées). */
function openGroupSwapPicker(groupName, isMain){
  const cfg = Store.settings.budget;
  if(isMain){
    PICKER.openPicker({
      title:"Groupe principal", hierarchy: groupPickerHierarchy(new Set()), value: cfg.mainGroup,
      onSelect:(v)=>{
        if(!v || v===cfg.mainGroup) return;
        cfg.mainGroup = v;
        cfg.extraGroups = (cfg.extraGroups||[]).filter(g=>g!==v);
        Store.saveSettings();
        renderBudget();
      }
    });
    return;
  }
  const exclude = new Set([cfg.mainGroup].concat((cfg.extraGroups||[]).filter(g=>g!==groupName)));
  PICKER.openPicker({
    title:"Changer ce groupe", hierarchy: groupPickerHierarchy(exclude), value: groupName,
    onSelect:(v)=>{
      if(!v || v===groupName) return;
      const idx = (cfg.extraGroups||[]).indexOf(groupName);
      if(idx>=0) cfg.extraGroups[idx] = v; else cfg.extraGroups = (cfg.extraGroups||[]).concat([v]);
      Store.saveSettings();
      renderBudget();
    }
  });
}

const EMPTY_MAP = new Map();
/* Construit le tableau "mois par mois" du Budget (bouton calendrier, entre "Ajouts" et "Colonnes") :
   EXACTEMENT les mêmes lignes que la vue par carte habituelle — "Total tous groupes", puis pour chaque
   groupe (principal puis additionnels) sa ligne Total suivie d'une ligne par catégorie et d'une ligne par
   voyage (mêmes libellés, même contenu que dans la carte du groupe, cf. groupCardHtml) — simplement
   ventilées mois par mois au lieu d'un total unique sur la période. Colonne "Total" figée à gauche
   (identique à la carte habituelle) puis une colonne par mois de la période affichée, à faire défiler vers
   la droite — même gabarit visuel que le tableau de l'onglet Évolution (classes .evo-table-wrap /
   .evo-col-label / .evo-col-total / .evo-col-val / .evo-val-cell / .evo-item-row), sticky comprise. Chaque
   cellule (Total ou mois) est cliquable et ouvre la liste des transactions correspondante, comme dans les
   autres vues (et comme les lignes catégorie/voyage des cartes habituelles). */
function buildBudgetMonthlyTableHtml(months, cfg, mainRes, extraResults, allGroupNames){
  const mainDetail = computeGroupBudgetDetailByMonth(cfg.mainGroup, months, {});
  const extraDetail = extraResults.map(e=>({name:e.name, res:e.res, detail: computeGroupBudgetDetailByMonth(e.name, months, {forceBrut:true})}));

  const grandMonthly = new Map();
  months.forEach(m=>{
    let v = mainDetail.net.get(m) || 0;
    extraDetail.forEach(e=> v += (e.detail.net.get(m) || 0));
    grandMonthly.set(m, v);
  });
  const grandTotal = mainRes.net + extraResults.reduce((s,e)=>s+e.res.net, 0);

  function cellClass(v){ return v>0 ? "pos" : v<0 ? "neg" : ""; }
  function fmtCell(v){ return v ? bgFmtMoneySigned(v) : "—"; }

  const theadHtml = `
    <thead><tr>
      <th class="evo-col-label">Groupe</th>
      <th class="evo-col-total">Total</th>
      ${months.map(m=>{
        const [y,mm] = m.split("-").map(Number);
        return `<th class="evo-col-val">${fmtMonthYearShort(y, mm-1)}</th>`;
      }).join("")}
    </tr></thead>
  `;

  // Une ligne "groupe" (figée, en gras) suivie d'une ligne par catégorie puis par voyage (indentées, plus
  // claires) — data-kind distingue le type de ligne pour le clic (groupe entier / catégorie / voyage).
  function groupRowsHtml(name, res, detail){
    const groupAttr = U.escHtml(name);
    const headerCells = months.map(m=>{
      const v = detail.net.get(m) || 0;
      return `<td class="evo-col-val evo-val-cell ${cellClass(v)}" data-groups="${groupAttr}" data-month="${m}">${fmtCell(v)}</td>`;
    }).join("");
    const headerRow = `
      <tr class="evo-section-row">
        <td class="evo-col-label">${U.escHtml(name)}</td>
        <td class="evo-col-total evo-val-cell ${cellClass(res.net)}" data-groups="${groupAttr}">${fmtCell(res.net)}</td>
        ${headerCells}
      </tr>
    `;
    function itemRow(kind, key, label, total, byMonth){
      const attrs = `data-kind="${kind}" data-group="${groupAttr}" data-key="${U.escHtml(key)}"`;
      const cells = months.map(m=>{
        const v = (byMonth.get(key)||EMPTY_MAP).get(m) || 0;
        return `<td class="evo-col-val evo-val-cell ${cellClass(v)}" ${attrs} data-month="${m}">${fmtCell(v)}</td>`;
      }).join("");
      return `
        <tr class="evo-item-row">
          <td class="evo-col-label" style="padding-left:16px;">${U.escHtml(label)}</td>
          <td class="evo-col-total evo-val-cell ${cellClass(total)}" ${attrs}>${fmtCell(total)}</td>
          ${cells}
        </tr>
      `;
    }
    const catRows = res.categories.map(c=> itemRow("cat", c.key, c.label||c.key, c.income+c.expense, detail.categories)).join("");
    const voyRows = res.voyages.map(v=> itemRow("voy", v.key, v.label||v.key, v.income+v.expense, detail.voyages)).join("");
    return headerRow + catRows + voyRows;
  }

  const grandGroupsAttr = U.escHtml(allGroupNames.join("||"));
  const grandCells = months.map(m=>{
    const v = grandMonthly.get(m) || 0;
    return `<td class="evo-col-val evo-val-cell ${cellClass(v)}" data-groups="${grandGroupsAttr}" data-month="${m}">${fmtCell(v)}</td>`;
  }).join("");
  const grandRow = `
    <tr class="evo-total-row">
      <td class="evo-col-label">Total tous groupes</td>
      <td class="evo-col-total evo-val-cell ${cellClass(grandTotal)}" data-groups="${grandGroupsAttr}">${fmtCell(grandTotal)}</td>
      ${grandCells}
    </tr>
  `;

  const bodyRows = grandRow
    + groupRowsHtml(cfg.mainGroup, mainRes, mainDetail)
    + extraDetail.map(e=> groupRowsHtml(e.name, e.res, e.detail)).join("");

  return `<div class="evo-table-wrap" id="bg-monthly-table-wrap"><table>${theadHtml}<tbody>${bodyRows}</tbody></table></div>`;
}

function renderBudget(){
  ensurePeriod();
  const view = document.getElementById("view-budget");
  const cfg = Store.settings.budget;
  const months = monthsInRange(periodFrom, periodTo);

  if(Store.transactions.length===0){
    view.innerHTML = `<div class="section"><div class="empty-state">
      ${ICONS.inbox}<h3>Pas encore de données</h3><p>Importez vos transactions pour utiliser l'onglet Budget.</p>
    </div></div>`;
    return;
  }
  if(!cfg.mainGroup){
    view.innerHTML = `<div class="section">
      <div class="empty-state">
        ${ICONS.budget}<h3>Configurez votre budget</h3>
        <p>Choisissez un groupe de groupe principal pour commencer.</p>
        <div style="width:100%;max-width:320px;margin-top:6px;">${PICKER.fieldPickerBtnHtml("bg-main-btn", "Choisir un groupe principal", cfg.mainGroup)}</div>
      </div>
    </div>`;
    document.getElementById("bg-main-btn").onclick = ()=> PICKER.openPicker({
      title:"Groupe principal", hierarchy: groupPickerHierarchy(new Set()), value: cfg.mainGroup,
      onSelect:(v)=>{ cfg.mainGroup = v || null; Store.saveSettings(); renderBudget(); }
    });
    return;
  }

  const mainRes = computeGroupBudget(cfg.mainGroup, months);
  const extraResults = (cfg.extraGroups||[]).filter(g=>g!==cfg.mainGroup).map(g=>({name:g, res:computeGroupBudget(g, extraGroupEffectiveMonths(g, months), {forceBrut:true})}));
  const grandCatIncome = mainRes.catIncome + extraResults.reduce((s,e)=>s+e.res.catIncome,0);
  const grandCatExpense = mainRes.catExpense + extraResults.reduce((s,e)=>s+e.res.catExpense,0);
  const grandVoyIncome = mainRes.voyIncome + extraResults.reduce((s,e)=>s+e.res.voyIncome,0);
  const grandVoyExpense = mainRes.voyExpense + extraResults.reduce((s,e)=>s+e.res.voyExpense,0);
  const grandVoyNet = grandVoyIncome + grandVoyExpense;
  const grandNet = grandCatIncome + grandCatExpense + grandVoyNet;

  const selectedExtra = (cfg.extraGroups||[]).filter(g=>g!==cfg.mainGroup);
  const allGroupNames = [cfg.mainGroup].concat(selectedExtra);
  // Moyenne = totaux divisés par le nombre de mois de la période affichée compris dans la borne
  // chronologique de l'amortissement (voir amortBoundedMonths) — quel que soit le mode. N'affecte que les
  // vues d'ensemble (cartes/lignes ci-dessous) ; les feuilles de détail (catégorie, voyage, transactions)
  // continuent d'afficher le total réel de la période, jamais une moyenne.
  const divisor = cfg.displayMode==="moyenne" ? (amortBoundedMonths(months).length || 1) : 1;
  const dv = n => n/divisor;
  const compareCtx = computeCompareContext(months);

  const mainCard = groupCardHtml(cfg.mainGroup, mainRes, true, divisor, compareCtx);
  const extraCards = extraResults.map(e=>groupCardHtml(e.name, e.res, false, divisor, compareCtx));
  const grandCmp = compareCtx ? [mainCard].concat(extraCards).reduce((acc, c)=>({
    income: acc.income + (c.cmp?c.cmp.income:0),
    expense: acc.expense + (c.cmp?c.cmp.expense:0),
    voyage: acc.voyage + (c.cmp?c.cmp.voyage:0),
    total: acc.total + (c.cmp?c.cmp.total:0)
  }), {income:0, expense:0, voyage:0, total:0}) : null;

  // Sommes réel/amorti/ajout agrégées sur tous les groupes (principal + additionnels), par section — pour
  // la carte "Total tous groupes" en vue détail (mêmes principes que dans groupCardHtml).
  const detailOn = cfg.detailView && !compareCtx;
  let grandBreak = null;
  if(detailOn){
    const allRes = [mainRes].concat(extraResults.map(e=>e.res));
    const sumList = list=>list.reduce((s,c)=>({real:s.real+c.realIncome+c.realExpense, amort:s.amort+c.amortIncome+c.amortExpense, adj:s.adj+c.adjIncome+c.adjExpense}), {real:0,amort:0,adj:0});
    const inc = {real:0,amort:0,adj:0}, exp = {real:0,amort:0,adj:0}, voy = {real:0,amort:0,adj:0};
    allRes.forEach(res=>{
      const split = splitIncomeExpense(res.categories);
      const si = sumList(split.income), se = sumList(split.expense), sv = sumList(res.voyages);
      inc.real+=si.real; inc.amort+=si.amort; inc.adj+=si.adj;
      exp.real+=se.real; exp.amort+=se.amort; exp.adj+=se.adj;
      voy.real+=sv.real; voy.amort+=sv.amort; voy.adj+=sv.adj;
    });
    grandBreak = {
      inc, exp, voy,
      total: {real: inc.real+exp.real+voy.real, amort: inc.amort+exp.amort+voy.amort, adj: inc.adj+exp.adj+voy.adj}
    };
  }

  const cmp = cfg.compare;
  const cmpSublabel = !cmp.enabled ? "Désactivée"
    : cmp.mode==="predefined" ? "Budget prédéfini"
    : (cmp.periodFrom && cmp.periodTo) ? (fmtBoundMonth(cmp.periodFrom)+" → "+fmtBoundMonth(cmp.periodTo))
    : "Autre période";

  // En-tête de colonnes (Résultat/Comparé/Variation, ou Réel+ajout/Amorti/Total) : rendu comme une barre
  // séparée, en dehors de la carte "Total tous groupes", et directement enfant de la section — sa "boîte
  // englobante" pour le calcul du sticky est donc toute la section (total + cartes de groupes), pas
  // seulement la petite carte de total. Elle reste ainsi figée en haut de l'écran tant que l'utilisateur
  // n'a pas dépassé la fin de la liste des cartes, au lieu de disparaître dès la fin de la carte de total.
  const grandHeaderInner = compareCtx ? compareHeaderRowHtml() : detailOn ? detailHeaderRowHtml(cfg.mode) : "";
  const grandHeaderStickyHtml = grandHeaderInner ? `
      <div style="position:sticky;top:0;z-index:10;margin:0 4px 8px;">
        <div class="card" style="padding:8px 16px;box-shadow:var(--shadow-2);">
          ${grandHeaderInner}
        </div>
      </div>
  ` : "";

  // Vue "mois par mois" (bouton calendrier) : remplace la liste de cartes par un tableau à colonne Total
  // figée + une colonne par mois défilante — voir buildBudgetMonthlyTableHtml.
  const monthlyOn = !!cfg.monthlyView;
  const monthlyTableHtml = monthlyOn ? buildBudgetMonthlyTableHtml(months, cfg, mainRes, extraResults, allGroupNames) : "";

  view.innerHTML = `
    <div class="section" style="padding-top:2px;">
      <div class="card" style="margin:0 4px 14px;padding:14px;">
        <div style="display:flex;gap:14px;margin:0 0 10px;align-items:stretch;">
          <div class="seg seg-sm" id="bg-mode-seg" style="flex:1;">
            <button data-m="amorti" class="${cfg.mode==='amorti'?'active':''}">Amort. + ajouts</button>
            <button data-m="brut_ajout" class="${cfg.mode==='brut_ajout'?'active':''}">Ajouts</button>
          </div>
          <button type="button" id="bg-monthly-toggle-btn" title="${cfg.monthlyView?'Revenir à la vue par groupe':'Voir le budget mois par mois'}" style="flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:40px;border:none;border-radius:100px;cursor:pointer;background:${cfg.monthlyView?'var(--primary)':'var(--card-alt)'};color:${cfg.monthlyView?'#fff':'var(--text-sub)'};">
            <span style="width:17px;height:17px;display:flex;">${ICONS.calendar}</span>
          </button>
          <button type="button" id="bg-detail-toggle-btn" title="${cfg.detailView?'Masquer le détail (Réel / Amorti / Ajout)':'Afficher le détail (Réel / Amorti / Ajout)'}" style="flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:40px;border:none;border-radius:100px;cursor:pointer;background:${cfg.detailView?'var(--primary)':'var(--card-alt)'};color:${cfg.detailView?'#fff':'var(--text-sub)'};">
            <span style="width:17px;height:17px;display:flex;">${ICONS.columns}</span>
          </button>
        </div>
        <div style="display:flex;gap:8px;margin:0 0 10px;">
          <div class="seg seg-sm" id="bg-scope-seg" style="flex:1;">
            <button data-v="perso" class="${cfg.scope==='perso'?'active':''}">Perso</button>
            <button data-v="couple" class="${cfg.scope==='couple'?'active':''}">Couple</button>
          </div>
          <div class="seg seg-sm" id="bg-display-seg" style="flex:1;">
            <button data-d="total" class="${cfg.displayMode!=='moyenne'?'active':''}">Total</button>
            <button data-d="moyenne" class="${cfg.displayMode==='moyenne'?'active':''}">Moyenne</button>
          </div>
        </div>
        ${periodPickerHtml()}
      </div>
      <div style="display:flex;gap:6px;margin:0 4px 14px;">
        ${budgetToolButtonHtml("bg-amort-open-btn", "Amortissement", cfg.mode==="amorti" ? ((cfg.amortCategories||[]).length+" catégorie"+((cfg.amortCategories||[]).length>1?"s":"")) : "Inactif (mode Ajouts)")}
        ${budgetToolButtonHtml("bg-adj-open-btn", "Ajustements", adjustmentsInPeriod().length ? (adjustmentsInPeriod().length+" sur la période") : "Aucun")}
        ${budgetToolButtonHtml("bg-cmp-open-btn", "Comparaison", cmpSublabel)}
        ${budgetToolButtonHtml("bg-acctexcl-open-btn", "Comptes exclus", (cfg.excludedAccounts||[]).length ? (cfg.excludedAccounts.length+" exclu"+(cfg.excludedAccounts.length>1?"s":"")) : "Aucun")}
      </div>
      ${monthlyOn ? `
      <div style="padding:0 4px 14px;">${monthlyTableHtml}</div>
      ` : `
      ${grandHeaderStickyHtml}
      <div class="card" style="margin-bottom:14px;">
        ${compareCtx ? `
        <div class="detail-row bg-typetxn-all-row" data-type="" style="cursor:pointer;display:block;padding:0 0 6px;">
          ${compareRowHtml("Total tous groupes", dv(grandNet), grandCmp.total, {big:true})}
        </div>
        <div class="detail-row bg-typetxn-all-row" data-type="Income" style="cursor:pointer;display:block;padding:6px 0;">
          ${compareRowHtml("Revenus", dv(grandCatIncome), grandCmp.income, {big:false})}
        </div>
        <div class="detail-row bg-typetxn-all-row" data-type="Expense" style="cursor:pointer;display:block;padding:6px 0;">
          ${compareRowHtml("Dépenses", dv(grandCatExpense), grandCmp.expense, {big:false})}
        </div>
        <div class="detail-row bg-typetxn-all-row" data-type="Voyage" style="cursor:pointer;display:block;padding:6px 0;">
          ${compareRowHtml("Voyages", dv(grandVoyNet), grandCmp.voyage, {big:false})}
        </div>
        ` : detailOn ? `
        <div style="display:block;padding:0 0 6px;">
          ${detailRowHtml("Total tous groupes", cfg.mode, dv(grandBreak.total.real), dv(grandBreak.total.amort), dv(grandBreak.total.adj), {big:true}, {sheet:"group", supergroupe:allGroupNames[0], groups:allGroupNames.join("||"), type:""})}
        </div>
        <div style="padding:6px 0;">
          ${detailRowHtml("Revenus", cfg.mode, dv(grandBreak.inc.real), dv(grandBreak.inc.amort), dv(grandBreak.inc.adj), {big:false}, {sheet:"group", supergroupe:allGroupNames[0], groups:allGroupNames.join("||"), type:"Income"})}
        </div>
        <div style="padding:6px 0;">
          ${detailRowHtml("Dépenses", cfg.mode, dv(grandBreak.exp.real), dv(grandBreak.exp.amort), dv(grandBreak.exp.adj), {big:false}, {sheet:"group", supergroupe:allGroupNames[0], groups:allGroupNames.join("||"), type:"Expense"})}
        </div>
        <div style="padding:6px 0;">
          ${detailRowHtml("Voyages", cfg.mode, dv(grandBreak.voy.real), dv(grandBreak.voy.amort), dv(grandBreak.voy.adj), {big:false}, {sheet:"group", supergroupe:allGroupNames[0], groups:allGroupNames.join("||"), type:"Voyage"})}
        </div>
        ` : `
        <div class="detail-row bg-typetxn-all-row" data-type="" style="cursor:pointer;padding:0 0 4px;">
          <span style="font-weight:800;font-size:16px;">Total tous groupes</span>
          <span style="display:flex;align-items:baseline;gap:6px;">
            <span style="font-size:9.5px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:.3px;">Total</span>
            <span style="font-weight:800;font-size:16px;color:${grandNet<0?'var(--expense)':'var(--income)'}">${bgFmtMoneySigned(dv(grandNet))}</span>
          </span>
