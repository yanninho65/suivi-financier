        </div>
        <div class="detail-row bg-typetxn-all-row" data-type="Income" style="cursor:pointer;"><span>Revenus</span><span style="color:var(--income);">${bgFmtMoneySigned(dv(grandCatIncome))}</span></div>
        <div class="detail-row bg-typetxn-all-row" data-type="Expense" style="cursor:pointer;"><span>Dépenses</span><span style="color:var(--expense);">${bgFmtMoneySigned(dv(grandCatExpense))}</span></div>
        <div class="detail-row bg-typetxn-all-row" data-type="Voyage" style="cursor:pointer;"><span>Voyages</span><span style="color:${grandVoyNet<0?'var(--expense)':'var(--income)'}">${bgFmtMoneySigned(dv(grandVoyNet))}</span></div>
        `}
      </div>
      ${mainCard.html}
      ${extraCards.map(c=>c.html).join("")}
      <button type="button" class="btn btn-ghost btn-block" id="bg-newgroup-btn" style="margin:0 4px 14px;">${ICONS.plus} Nouveau groupe</button>
      `}
      <div style="height:10px;"></div>
    </div>
  `;

  document.querySelectorAll("#bg-mode-seg button").forEach(b=>{
    b.onclick = ()=>{
      cfg.mode = b.dataset.m;
      Store.saveSettings();
      renderBudget();
    };
  });
  document.getElementById("bg-detail-toggle-btn").onclick = ()=>{
    cfg.detailView = !cfg.detailView;
    Store.saveSettings();
    renderBudget();
  };
  document.getElementById("bg-monthly-toggle-btn").onclick = ()=>{
    cfg.monthlyView = !cfg.monthlyView;
    Store.saveSettings();
    renderBudget();
  };
  document.querySelectorAll("#bg-scope-seg button").forEach(b=>{
    b.onclick = ()=>{
      cfg.scope = b.dataset.v;
      Store.saveSettings();
      renderBudget();
    };
  });
  document.querySelectorAll("#bg-display-seg button").forEach(b=>{
    b.onclick = ()=>{
      cfg.displayMode = b.dataset.d;
      Store.saveSettings();
      renderBudget();
    };
  });
  document.getElementById("bg-amort-open-btn").onclick = openAmortSheet;
  document.getElementById("bg-adj-open-btn").onclick = ()=>{
    const inPeriod = adjustmentsInPeriod();
    if(inPeriod.length) openAdjustmentsListSheet();
    else openAdjustmentForm(null);
  };
  document.getElementById("bg-cmp-open-btn").onclick = openCompareSheet;
  document.getElementById("bg-acctexcl-open-btn").onclick = openAccountExcludeSheet;
  const newGroupBtn = document.getElementById("bg-newgroup-btn");
  if(newGroupBtn) newGroupBtn.onclick = ()=>{
    const exclude = new Set([cfg.mainGroup].concat(selectedExtra));
    PICKER.openPicker({
      title:"Nouveau groupe", hierarchy: groupPickerHierarchy(exclude), value: null,
      onSelect:(v)=>{
        if(!v) return;
        const set = new Set(cfg.extraGroups||[]);
        set.add(v);
        cfg.extraGroups = Array.from(set);
        Store.saveSettings();
        renderBudget();
      }
    });
  };
  // Vue "mois par mois" : chaque cellule (Total ou mois), qu'elle appartienne à une ligne groupe, catégorie
  // ou voyage, ouvre la même liste de transactions que le clic correspondant dans la vue par carte ; le
  // tableau se fait glisser à la souris sur ordinateur (voir enableDragScroll).
  const monthlyTableWrap = document.getElementById("bg-monthly-table-wrap");
  if(monthlyTableWrap){
    U.enableDragScroll(monthlyTableWrap);
    monthlyTableWrap.querySelectorAll(".evo-val-cell").forEach(td=>{
      td.onclick = ()=>{
        const kind = td.dataset.kind;
        const monthOpt = td.dataset.month ? {month: td.dataset.month} : {};
        if(kind==="cat"){
          if(isSalaryCategory(td.dataset.key)) openSalaryEditor(td.dataset.group, td.dataset.key);
          else openCategoryTxnSheet(td.dataset.group, td.dataset.key, monthOpt);
        } else if(kind==="voy"){
          openVoyageTxnSheet(td.dataset.group, td.dataset.key, monthOpt);
        } else if(td.dataset.groups){
          const groups = td.dataset.groups.split("||");
          if(td.dataset.month) openGroupMonthTxnSheet(groups, td.dataset.month);
          else openGroupTypeTxnSheet(groups, null);
        }
      };
    });
  }
  document.querySelectorAll(".bg-group-swap-btn[data-group]").forEach(el=>{
    el.onclick = ()=> openGroupSwapPicker(el.dataset.group, el.dataset.ismain==="1");
  });
  document.querySelectorAll(".bg-group-remove-btn[data-group]").forEach(el=>{
    el.onclick = ()=>{
      const g = el.dataset.group;
      cfg.extraGroups = (cfg.extraGroups||[]).filter(x=>x!==g);
      Store.saveSettings();
      renderBudget();
    };
  });
  document.getElementById("bg-from").onchange = (e)=>{ periodFrom = e.target.value; if(periodFrom>periodTo) periodTo=periodFrom; persistPeriod(); renderBudget(); };
  document.getElementById("bg-to").onchange = (e)=>{ periodTo = e.target.value; if(periodTo<periodFrom) periodFrom=periodTo; persistPeriod(); renderBudget(); };
  document.querySelectorAll(".budget-cat-row[data-cat]").forEach(el=>{
    el.onclick = ()=>{
      if(isSalaryCategory(el.dataset.cat)) openSalaryEditor(el.dataset.supergroupe, el.dataset.cat);
      else openCategoryTxnSheet(el.dataset.supergroupe, el.dataset.cat);
    };
  });
  document.querySelectorAll(".budget-voy-row[data-voy]").forEach(el=>{
    el.onclick = ()=> openVoyageTxnSheet(el.dataset.supergroupe, el.dataset.voy);
  });
  document.querySelectorAll(".bg-typetxn-row[data-supergroupe]").forEach(el=>{
    el.onclick = ()=> openGroupTypeTxnSheet(el.dataset.supergroupe, el.dataset.type || null);
  });
  document.querySelectorAll(".bg-typetxn-all-row[data-type]").forEach(el=>{
    el.onclick = ()=> openGroupTypeTxnSheet(allGroupNames, el.dataset.type || null);
  });
  document.querySelectorAll(".bg-section-total[data-supergroupe]").forEach(el=>{
    el.onclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      openGroupTypeTxnSheet(el.dataset.supergroupe, el.dataset.type || null);
    };
  });
  /* Vue détail (3 colonnes cliquables) : chaque valeur (Réel+ajout/Brut, Amorti/Ajout, Total) ouvre la
     feuille de détail appropriée (catégorie, voyage, ou groupe/type) avec le filtre correspondant à la
     colonne cliquée — data-filter="" (ou absent) pour la colonne Total affiche tout, sans filtre. */
  document.querySelectorAll(".bg-detail-cell[data-sheet]").forEach(el=>{
    el.onclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const filterKind = el.dataset.filter || null;
      const sheet = el.dataset.sheet;
      if(sheet==="cat"){
        if(isSalaryCategory(el.dataset.cat)) openSalaryEditor(el.dataset.supergroupe, el.dataset.cat);
        else openCategoryTxnSheet(el.dataset.supergroupe, el.dataset.cat, {filterKind});
      } else if(sheet==="voy"){
        openVoyageTxnSheet(el.dataset.supergroupe, el.dataset.voy, {filterKind});
      } else if(sheet==="group"){
        const names = el.dataset.groups ? el.dataset.groups.split("||") : [el.dataset.supergroupe];
        openGroupTypeTxnSheet(names, el.dataset.type || null, {filterKind});
      }
    };
  });
  document.querySelectorAll(".bg-cv-section[data-section-key]").forEach(el=>{
    el.addEventListener("toggle", function(){
      allSectionsOpen = this.open;
      document.querySelectorAll(".bg-cv-section[data-section-key]").forEach(other=>{
        if(other!==this) other.open = this.open;
      });
    });
  });
}

/* ---------------- Détail des transactions d'une catégorie (Amorti / Réel) ---------------- */
function openCategoryTxnSheet(superGroupeName, catKey, opts){
  opts = opts || {};
  let filterKind = opts.filterKind || null; // null | "reel" | "amorti" | "ajout" | "reel_ajout"
  const cfg = Store.settings.budget;
  // boundsMonths = période affichée complète (pour le calcul de fenêtre d'amortissement, cf.
  // amortWindowMonths/computeAmortPeriodMonths) ; months = soit cette même période (comportement d'origine),
  // soit un seul mois quand opts.month est fourni (clic sur une cellule de la vue "mois par mois").
  const boundsMonths = monthsInRange(periodFrom, periodTo);
  const months = opts.month ? [opts.month] : boundsMonths;
  const monthSet = new Set(months);
  const amortSet = new Set(cfg.amortCategories||[]);
  const isAmorti = cfg.mode==="amorti" && superGroupeName===cfg.mainGroup;
  const periodMonths = computeAmortPeriodMonths(months, boundsMonths);
  const windowN = amortWindowMonths(months, periodMonths, boundsMonths).length;
  // Montant "utilisé" par le budget : les transactions réelles sont doublées en vue Couple (comme dans
  // computeGroupBudget) ; les ajustements manuels restent en montant brut, non multipliés (§5.3 doc).
  const scopeMult = cfg.scope==="couple" ? 2 : 1;

  const items = [];
  Store.transactions.forEach(t=>{
    if(t.type==="Transfer") return;
    if(!groupSelectionMatches(t, superGroupeName)) return;
    if(isAccountExcluded(t.compte)) return;
    const base = t.groupeBase || U.baseGroupe(t.groupe);
    if(AGG.getGroupKind(t.groupe)==="voyage") return;
    const cat = t.categorie || "(Non renseigné)";
    if(cat !== catKey) return;
    const tr = t.transform;
    const effMonthKey = tr.mode==="month" ? (tr.year+"-"+U.pad2(tr.month+1)) : (t.date.getFullYear()+"-"+U.pad2(t.date.getMonth()+1));
    const beforeStart = cfg.startMonth && effMonthKey < cfg.startMonth;
    const afterEnd = cfg.endMonth && effMonthKey > cfg.endMonth;
    const amortized = isAmorti && (amortSet.has(cat) || beforeStart || afterEnd);
    if(amortized){
      // Toute transaction éligible (même très ancienne) alimente l'amortissement, mais sa contribution
      // affichée est nulle si la période actuellement affichée ne recoupe pas la fenêtre d'amortissement
      // [Mois de début → + période - 1] — jamais avant ni après cette fenêtre (cf. computeGroupBudget).
      if(windowN<=0) return;
      const displayAmount = (t.montant/periodMonths)*windowN*scopeMult;
      items.push({kind:"amorti", date: t.date, txnId: t.id, remarque: t.remarque||t.categorie||"—", displayAmount, rawAmount: t.montant, effMonthKey, yearsplit:false});
      return;
    }
    // Dépense non amortie : prise en compte seulement si son mois (corrigé) tombe dans la période affichée.
    const inPeriod = monthSet.has(effMonthKey) || (tr.mode==="yearsplit" && String(tr.year)>=months[0].slice(0,4) && String(tr.year)<=months[months.length-1].slice(0,4));
    if(!inPeriod) return;
    let displayAmount = tr.mode==="yearsplit" ? (t.montant/12) * yearsplitMonthsInPeriod(tr.year, monthSet) : t.montant;
    displayAmount *= scopeMult;
    items.push({kind:"reel", date: t.date, txnId: t.id, remarque: t.remarque||t.categorie||"—", displayAmount, rawAmount: t.montant, effMonthKey, yearsplit: tr.mode==="yearsplit", yearsplitCount: tr.mode==="yearsplit"?yearsplitMonthsInPeriod(tr.year, monthSet):null});
  });

  // Ajustements manuels ciblant cette catégorie pour ce groupe, sur la période affichée. Montant converti
  // à l'échelle du scope courant (Perso/Couple), comme pour les transactions réelles ci-dessus, afin que
  // la somme des montants affichés corresponde bien au total de la carte. En mode "Sans amort, avec ajout",
  // les ajustements amortis (case "Amortir ce montant...") sont exclus (ni entrée immédiate, ni lissage) —
  // seuls les ajustements simples restent pris en compte.
  const applyAdjustments = (cfg.mode==="amorti" || cfg.mode==="brut_ajout") && superGroupeName===cfg.mainGroup;
  if(applyAdjustments){
    (cfg.adjustments||[]).forEach((adj, adjIdx)=>{
      if(adj.groupe !== superGroupeName) return;
      if((adj.categorie||"") !== catKey) return;
      if(!isAmorti && adj.amorti) return;
      const amt = adjustmentScopedAmount(adj);
      if(monthSet.has(adj.month)){
        const [ay,am] = adj.month.split("-").map(Number);
        items.push({kind:"ajout", date: new Date(ay, (am||1)-1, 1), txnId:null, adjIdx, remarque: adj.remarque||"Ajustement", displayAmount: amt});
      }
      if(adj.amorti && isAmorti && amt && windowN>0){
        const [ay,am] = adj.month.split("-").map(Number);
        items.push({kind:"amorti", date: new Date(ay, (am||1)-1, 1), txnId:null, adjIdx, remarque: "Amortissement : "+(adj.remarque||"Ajustement"), displayAmount: -amt/periodMonths*windowN});
      }
    });
  }

  items.sort((a,b)=> b.date - a.date);

  // Totaux cohérents avec ceux affichés sur la carte du groupe (calcul identique à computeGroupBudget).
  const budgetRes = computeGroupBudget(superGroupeName, months, {forceBrut: superGroupeName!==cfg.mainGroup, boundsMonths});
  const catEntry = budgetRes.categories.find(c=>c.key===catKey);
  const realTotal = catEntry ? (catEntry.realIncome||0)+(catEntry.realExpense||0) : 0;
  const amortTotal = catEntry ? (catEntry.amortIncome||0)+(catEntry.amortExpense||0) : 0;
  const adjTotal = catEntry ? (catEntry.adjIncome||0)+(catEntry.adjExpense||0) : 0;
  const monthSubtitle = opts.month ? (()=>{ const [my,mm] = opts.month.split("-").map(Number); const l = U.fmtMonthYear(my, mm-1); return " · "+l.charAt(0).toUpperCase()+l.slice(1); })() : "";

  const KIND_STYLE = {
    reel:   {label:"Réel",   bg:"var(--primary-soft)",  fg:"var(--primary)"},
    amorti: {label:"Amorti", bg:"var(--transfer-soft)", fg:"var(--transfer)"},
    ajout:  {label:"Ajout",  bg:"var(--card-alt)",      fg:"var(--text-sub)"},
  };

  function renderModal(){
    const shown = items.filter(x=>bgKindIncluded(filterKind, x.kind));
    const modal = document.getElementById("modal-detail");
    modal.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <span style="font-weight:800;font-size:17px;">${U.escHtml(catKey)}</span>
        <button class="icon-btn" id="cattxn-close">${ICONS.close}</button>
      </div>
      <div style="color:var(--text-sub);font-size:12.5px;margin-bottom:12px;">${U.escHtml(superGroupeName)}${monthSubtitle} · ${shown.length} élément${shown.length>1?"s":""}</div>
      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
        <span class="cattxn-badge" data-kind="reel" style="cursor:pointer;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:${KIND_STYLE.reel.bg};color:${KIND_STYLE.reel.fg};${filterKind&&!bgKindIncluded(filterKind,'reel')?'opacity:.45;':''}${filterKind==='reel'?'box-shadow:0 0 0 2px '+KIND_STYLE.reel.fg+';':''}">Réel : ${bgFmtMoneySigned(realTotal)}</span>
        ${amortTotal!==0 ? `<span class="cattxn-badge" data-kind="amorti" style="cursor:pointer;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:${KIND_STYLE.amorti.bg};color:${KIND_STYLE.amorti.fg};${filterKind&&!bgKindIncluded(filterKind,'amorti')?'opacity:.45;':''}${filterKind==='amorti'?'box-shadow:0 0 0 2px '+KIND_STYLE.amorti.fg+';':''}">Amorti : ${bgFmtMoneySigned(amortTotal)}</span>` : ""}
        ${adjTotal!==0 ? `<span class="cattxn-badge" data-kind="ajout" style="cursor:pointer;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:${KIND_STYLE.ajout.bg};color:${KIND_STYLE.ajout.fg};${filterKind&&!bgKindIncluded(filterKind,'ajout')?'opacity:.45;':''}${filterKind==='ajout'?'box-shadow:0 0 0 2px '+KIND_STYLE.ajout.fg+';':''}">Ajouts : ${bgFmtMoneySigned(adjTotal)}</span>` : ""}
      </div>
      <div style="max-height:56vh;overflow-y:auto;">
        ${shown.length===0 ? `<div style="padding:14px;color:var(--text-sub);font-size:13.5px;">Aucun élément${filterKind?" pour ce filtre":""} sur la période affichée.</div>` :
        shown.map((x,i)=>`
          <div class="detail-row cattxn-row" ${x.txnId?`data-txnid="${U.escHtml(x.txnId)}"`:""} ${x.adjIdx!=null?`data-adjidx="${x.adjIdx}"`:""} style="align-items:center;${(x.txnId||x.adjIdx!=null)?'cursor:pointer;':''}">
            <span style="display:flex;flex-direction:column;min-width:0;">
              <span style="font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${(x.txnId||x.adjIdx!=null)?'text-decoration:underline;text-decoration-color:var(--divider);':''}">${U.escHtml(x.remarque)}</span>
              <span style="font-size:11px;color:var(--text-sub);">${x.kind==="ajout"||x.adjIdx!=null ? fmtMonthYearShort(x.date.getFullYear(),x.date.getMonth()) : U.fmtDateShort(x.date)}${x.kind==="amorti"?" · "+windowN+"/"+periodMonths+" mois":""}${x.yearsplit?" · "+x.yearsplitCount+"/12 mois":""}</span>
            </span>
            <span style="display:flex;align-items:center;gap:8px;flex:0 0 auto;">
              ${x.kind==="reel" ? `<button type="button" class="btn btn-ghost btn-sm cattxn-amortize" data-txnid="${U.escHtml(x.txnId)}" data-month="${U.escHtml(x.effMonthKey)}" data-amount="${x.rawAmount}" data-remarque="${U.escHtml(x.remarque)}" style="padding:3px 9px;font-size:10.5px;">Amortir</button>` : ""}
              <span style="font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;background:${KIND_STYLE[x.kind].bg};color:${KIND_STYLE[x.kind].fg};">${KIND_STYLE[x.kind].label}</span>
              <span style="font-weight:700;font-size:13.5px;color:${x.displayAmount<0?'var(--expense)':'var(--income)'}">${bgFmtMoneySigned(x.displayAmount)}</span>
            </span>
          </div>
        `).join("")}
      </div>
    `;
    document.getElementById("cattxn-close").onclick = ()=>APP.closeOverlay("overlay-detail");
    document.querySelectorAll(".cattxn-badge[data-kind]").forEach(el=>{
      el.onclick = ()=>{
        const k = el.dataset.kind;
        filterKind = (filterKind===k) ? null : k;
        renderModal();
      };
    });
    document.querySelectorAll(".cattxn-amortize[data-txnid]").forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        openAdjustmentForm(null, {
          month: btn.dataset.month,
          groupe: superGroupeName,
          categorie: catKey,
          montant: -Number(btn.dataset.amount),
          remarque: "Amortissement : "+(btn.dataset.remarque||catKey),
          amorti: true,
          montantScope: "perso"
        });
      };
    });
    document.querySelectorAll(".cattxn-row[data-txnid]").forEach(el=>{
      el.onclick = ()=> window.__SF_VIEWS.openTxnDetail(el.dataset.txnid);
    });
    document.querySelectorAll(".cattxn-row[data-adjidx]").forEach(el=>{
      if(el.dataset.txnid) return;
      el.onclick = ()=>{
        const idx = Number(el.dataset.adjidx);
        const a = Object.assign({__idx:idx}, (cfg.adjustments||[])[idx]);
        openAdjustmentForm(a);
      };
    });
  }

  renderModal();
  APP.openOverlay("overlay-detail");
}

/* ---------------- Salaire : édition manuelle Moi / Ma femme, mois par mois ---------------- */
function openSalaryEditor(superGroupeName, catKey){
  const cfg = Store.settings.budget;
  const months = monthsInRange(periodFrom, periodTo);

  function computeRow(m){
    const b = salaryMonthBreakdown(superGroupeName, catKey, m);
    const entry = salaryEntryFor(m);
    const fallback = salaryRealMonthAmount(superGroupeName, catKey, m);
    return {entry, fallback, total: b.total, real: b.real, adj: b.adj};
  }

  function periodTotal(){
    return months.reduce((s,m)=> s+computeRow(m).total, 0);
  }

  function renderModal(){
    const modal = document.getElementById("modal-detail");
    const rowsHtml = months.map(m=>{
      const r = computeRow(m);
      const [y,mm] = m.split("-").map(Number);
      const label = fmtMonthYearShort(y, mm-1);
      return `
        <div class="detail-row" style="align-items:center;gap:6px;flex-wrap:nowrap;padding:8px 0;">
          <span style="flex:0 0 62px;font-size:12px;font-weight:600;">${U.escHtml(label)}</span>
          <input type="number" step="0.01" inputmode="decimal" class="search-mini salf-moi" data-month="${m}" placeholder="${r.fallback?bgFmtMoney(r.fallback):'0,00 €'}" value="${r.entry.moi!=null?r.entry.moi:''}" style="flex:1;min-width:0;margin:0;">
          <input type="number" step="0.01" inputmode="decimal" class="search-mini salf-femme" data-month="${m}" placeholder="0,00 €" value="${r.entry.femme!=null?r.entry.femme:''}" style="flex:1;min-width:0;margin:0;">
          <span class="salf-total" data-month="${m}" style="flex:0 0 76px;text-align:right;font-weight:700;font-size:13px;color:${r.total<0?'var(--expense)':'var(--income)'}">${bgFmtMoneySigned(r.total)}</span>
        </div>`;
    }).join("");
    modal.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <span style="font-weight:800;font-size:17px;">${U.escHtml(catKey)}</span>
        <button class="icon-btn" id="salf-close">${ICONS.close}</button>
      </div>
      <div style="color:var(--text-sub);font-size:12.5px;margin-bottom:10px;">${U.escHtml(superGroupeName)} · saisie manuelle · vue ${cfg.scope==="couple"?"Couple":"Perso"}</div>
      <div style="font-size:11.5px;color:var(--text-sub);margin-bottom:10px;line-height:1.4;">
        Laisser "Moi" vide pour utiliser le montant des transactions du mois. En vue Couple, le total additionne mon salaire et celui de ma femme (0 € si non saisi). En vue Perso, seul mon salaire compte.
        <br><strong>Brut / Ajout :</strong> le montant des transactions est toujours le "Brut" de mon salaire ; si je saisis une valeur "Moi" différente, l'écart apparaît comme "Ajout" dans la vue détaillée du Budget. Le salaire de ma femme est, lui, entièrement considéré comme "Brut" (sa saisie n'est jamais comparée à des transactions).
      </div>
      <div class="detail-row" style="align-items:center;gap:6px;padding:2px 0 6px;font-size:10.5px;color:var(--text-sub);font-weight:700;">
        <span style="flex:0 0 62px;">Mois</span>
        <span style="flex:1;">Moi</span>
        <span style="flex:1;">Ma femme</span>
        <span style="flex:0 0 76px;text-align:right;">Total</span>
      </div>
      <div style="max-height:48vh;overflow-y:auto;">${rowsHtml}</div>
      <div class="detail-row" style="align-items:center;margin-top:6px;padding-top:10px;border-top:2px solid var(--divider);">
        <span style="font-weight:800;font-size:13.5px;">Total période</span>
        <span style="font-weight:800;font-size:15px;color:var(--income);" id="salf-period-total">${bgFmtMoneySigned(periodTotal())}</span>
      </div>
      <button class="btn btn-ghost btn-block" id="salf-realtxn" style="margin-top:14px;">Voir les transactions réelles</button>
    `;
    document.getElementById("salf-close").onclick = ()=>APP.closeOverlay("overlay-detail");
    document.getElementById("salf-realtxn").onclick = ()=> openCategoryTxnSheet(superGroupeName, catKey);
    function saveField(month, field, val){
      cfg.salaryEntries = cfg.salaryEntries || {};
      const cur = Object.assign({}, cfg.salaryEntries[month]);
      cur[field] = (val==null || val==="") ? null : Number(val);
      cfg.salaryEntries[month] = cur;
      Store.saveSettings();
      const r = computeRow(month);
      const totalEl = modal.querySelector(`.salf-total[data-month="${month}"]`);
      if(totalEl){
        totalEl.textContent = bgFmtMoneySigned(r.total);
        totalEl.style.color = r.total<0 ? 'var(--expense)' : 'var(--income)';
      }
      const periodEl = document.getElementById("salf-period-total");
      if(periodEl) periodEl.textContent = bgFmtMoneySigned(periodTotal());
      renderBudget();
    }
    modal.querySelectorAll(".salf-moi").forEach(inp=>{
      inp.onchange = (e)=> saveField(e.target.dataset.month, "moi", e.target.value);
    });
    modal.querySelectorAll(".salf-femme").forEach(inp=>{
      inp.onchange = (e)=> saveField(e.target.dataset.month, "femme", e.target.value);
    });
  }

  renderModal();
  APP.openOverlay("overlay-detail");
}


function openVoyageTxnSheet(superGroupeName, voyKey, opts){
  opts = opts || {};
  let filterKind = opts.filterKind || null; // null | "reel" | "amorti" | "ajout" | "reel_ajout"
  const cfg = Store.settings.budget;
  // boundsMonths = période affichée complète ; months = cette même période, ou un seul mois si opts.month
  // est fourni (clic sur une cellule de la vue "mois par mois") — voir openCategoryTxnSheet ci-dessus.
  const boundsMonths = monthsInRange(periodFrom, periodTo);
  const months = opts.month ? [opts.month] : boundsMonths;
  const monthSet = new Set(months);
  const scopeMult = cfg.scope==="couple" ? 2 : 1;

  const items = [];
  if(voyKey === "__ajustement__"){
    const isAmorti = cfg.mode==="amorti" && superGroupeName===cfg.mainGroup;
    const applyAdjustments = (cfg.mode==="amorti" || cfg.mode==="brut_ajout") && superGroupeName===cfg.mainGroup;
    const periodMonths = computeAmortPeriodMonths(months, boundsMonths);
    const windowN = amortWindowMonths(months, periodMonths, boundsMonths).length;
    if(applyAdjustments){
      (cfg.adjustments||[]).forEach(adj=>{
        if(adj.groupe !== superGroupeName) return;
        if(adj.categorie) return;
        if(!isAmorti && adj.amorti) return;
        const amt = adjustmentScopedAmount(adj);
        if(monthSet.has(adj.month)){
          const [ay,am] = adj.month.split("-").map(Number);
          items.push({kind:"ajout", date: new Date(ay, (am||1)-1, 1), txnId:null, remarque: adj.remarque||"Ajustement", displayAmount: amt});
        }
        if(adj.amorti && isAmorti && amt && windowN>0){
          const [ay,am] = adj.month.split("-").map(Number);
          items.push({kind:"amorti", date: new Date(ay, (am||1)-1, 1), txnId:null, remarque: "Amortissement : "+(adj.remarque||"Ajustement"), displayAmount: -amt/periodMonths*windowN});
        }
      });
    }
  } else {
    Store.transactions.forEach(t=>{
      if(t.type==="Transfer") return;
      if(!groupSelectionMatches(t, superGroupeName)) return;
      if(isAccountExcluded(t.compte)) return;
      const base = t.groupeBase || U.baseGroupe(t.groupe);
      if(AGG.getGroupKind(t.groupe)!=="voyage") return;
      if(t.groupe !== voyKey) return;
      const tr = t.transform;
      let inPeriod;
      if(tr.mode==="yearsplit"){
        inPeriod = String(tr.year) >= months[0].slice(0,4) && String(tr.year) <= months[months.length-1].slice(0,4);
      } else {
        const forced = AGG.getGroupVoyageMonth(t.groupe);
        let targetMonth = forced;
        if(!targetMonth){
          if(tr.mode==="month") targetMonth = tr.year+"-"+U.pad2(tr.month+1);
          else targetMonth = t.date.getFullYear()+"-"+U.pad2(t.date.getMonth()+1);
        }
        inPeriod = monthSet.has(targetMonth);
      }
      if(!inPeriod) return;
      const displayAmount = (tr.mode==="yearsplit" ? (t.montant/12) * yearsplitMonthsInPeriod(tr.year, monthSet) : t.montant) * scopeMult;
      items.push({kind:"reel", date: t.date, txnId: t.id, remarque: t.remarque||t.categorie||"—", displayAmount, yearsplit: tr.mode==="yearsplit", yearsplitCount: tr.mode==="yearsplit"?yearsplitMonthsInPeriod(tr.year, monthSet):null});
    });
  }

  items.sort((a,b)=> b.date - a.date);

  const budgetRes = computeGroupBudget(superGroupeName, months, {forceBrut: superGroupeName!==cfg.mainGroup, boundsMonths});
  const voyEntry = budgetRes.voyages.find(v=>v.key===voyKey);
  const realTotal = voyEntry ? (voyEntry.realIncome||0)+(voyEntry.realExpense||0) : 0;
  const amortTotal = voyEntry ? (voyEntry.amortIncome||0)+(voyEntry.amortExpense||0) : 0;
  const adjTotal = voyEntry ? (voyEntry.adjIncome||0)+(voyEntry.adjExpense||0) : 0;
  const label = voyEntry ? (voyEntry.label||voyEntry.key) : voyKey;
  const monthSubtitle = opts.month ? (()=>{ const [my,mm] = opts.month.split("-").map(Number); const l = U.fmtMonthYear(my, mm-1); return " · "+l.charAt(0).toUpperCase()+l.slice(1); })() : "";

  const KIND_STYLE = {
    reel:   {label:"Réel",   bg:"var(--primary-soft)",  fg:"var(--primary)"},
    amorti: {label:"Amorti", bg:"var(--transfer-soft)", fg:"var(--transfer)"},
    ajout:  {label:"Ajout",  bg:"var(--card-alt)",      fg:"var(--text-sub)"},
  };

  function renderModal(){
    const shown = items.filter(x=>bgKindIncluded(filterKind, x.kind));
    const modal = document.getElementById("modal-detail");
    modal.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <span style="font-weight:800;font-size:17px;">${U.escHtml(label)}</span>
        <button class="icon-btn" id="voytxn-close">${ICONS.close}</button>
      </div>
      <div style="color:var(--text-sub);font-size:12.5px;margin-bottom:12px;">${U.escHtml(superGroupeName)}${monthSubtitle} · ${shown.length} élément${shown.length>1?"s":""}</div>
      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
        <span class="voytxn-badge" data-kind="reel" style="cursor:pointer;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:${KIND_STYLE.reel.bg};color:${KIND_STYLE.reel.fg};${filterKind&&!bgKindIncluded(filterKind,'reel')?'opacity:.45;':''}${filterKind==='reel'?'box-shadow:0 0 0 2px '+KIND_STYLE.reel.fg+';':''}">Réel : ${bgFmtMoneySigned(realTotal)}</span>
        ${amortTotal!==0 ? `<span class="voytxn-badge" data-kind="amorti" style="cursor:pointer;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:${KIND_STYLE.amorti.bg};color:${KIND_STYLE.amorti.fg};${filterKind&&!bgKindIncluded(filterKind,'amorti')?'opacity:.45;':''}${filterKind==='amorti'?'box-shadow:0 0 0 2px '+KIND_STYLE.amorti.fg+';':''}">Amorti : ${bgFmtMoneySigned(amortTotal)}</span>` : ""}
        ${adjTotal!==0 ? `<span class="voytxn-badge" data-kind="ajout" style="cursor:pointer;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:${KIND_STYLE.ajout.bg};color:${KIND_STYLE.ajout.fg};${filterKind&&!bgKindIncluded(filterKind,'ajout')?'opacity:.45;':''}${filterKind==='ajout'?'box-shadow:0 0 0 2px '+KIND_STYLE.ajout.fg+';':''}">Ajouts : ${bgFmtMoneySigned(adjTotal)}</span>` : ""}
      </div>
      <div style="max-height:56vh;overflow-y:auto;">
        ${shown.length===0 ? `<div style="padding:14px;color:var(--text-sub);font-size:13.5px;">Aucun élément${filterKind?" pour ce filtre":""} sur la période affichée.</div>` :
        shown.map((x,i)=>`
          <div class="detail-row cattxn-row" ${x.txnId?`data-txnid="${U.escHtml(x.txnId)}"`:""} style="align-items:center;${x.txnId?'cursor:pointer;':''}">
            <span style="display:flex;flex-direction:column;min-width:0;">
              <span style="font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${x.txnId?'text-decoration:underline;text-decoration-color:var(--divider);':''}">${U.escHtml(x.remarque)}</span>
              <span style="font-size:11px;color:var(--text-sub);">${x.kind==="ajout"||x.kind==="amorti" ? fmtMonthYearShort(x.date.getFullYear(),x.date.getMonth()) : U.fmtDateShort(x.date)}${x.yearsplit?" · "+x.yearsplitCount+"/12 mois":""}</span>
            </span>
            <span style="display:flex;align-items:center;gap:8px;flex:0 0 auto;">
              <span style="font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;background:${KIND_STYLE[x.kind].bg};color:${KIND_STYLE[x.kind].fg};">${KIND_STYLE[x.kind].label}</span>
              <span style="font-weight:700;font-size:13.5px;color:${x.displayAmount<0?'var(--expense)':'var(--income)'}">${bgFmtMoneySigned(x.displayAmount)}</span>
            </span>
          </div>
        `).join("")}
      </div>
    `;
    document.getElementById("voytxn-close").onclick = ()=>APP.closeOverlay("overlay-detail");
    document.querySelectorAll(".voytxn-badge[data-kind]").forEach(el=>{
      el.onclick = ()=>{
        const k = el.dataset.kind;
        filterKind = (filterKind===k) ? null : k;
        renderModal();
      };
    });
    document.querySelectorAll(".cattxn-row[data-txnid]").forEach(el=>{
      el.onclick = ()=> window.__SF_VIEWS.openTxnDetail(el.dataset.txnid);
    });
  }

  renderModal();
  APP.openOverlay("overlay-detail");
}

/* Détail Réel/Amorti/Ajout des transactions menant aux totaux Revenus/Dépenses/Voyages/Total affichés pour
   un ou plusieurs groupes — cohérent avec computeGroupBudget (amortissement + ajustements pris en compte
   pour le groupe principal selon le mode budget (Amort. + ajouts ou Ajouts) ; les groupes additionnels restent toujours en brut).
   typeFilter : null (tout, catégories+voyages) | "Income" | "Expense" (catégories/quotidien uniquement) |
   "Voyage" (voyages + ajustements sans catégorie uniquement, quel que soit le signe). */
function collectGroupTypeItemsDetailed(superGroupeNames, typeFilter, months, boundsMonths){
  const names = Array.isArray(superGroupeNames) ? superGroupeNames : [superGroupeNames];
  const cfg = Store.settings.budget;
  const monthSet = new Set(months);
  const scopeMult = cfg.scope==="couple" ? 2 : 1;
  const amortSet = new Set(cfg.amortCategories||[]);
  const periodMonths = computeAmortPeriodMonths(months, boundsMonths);
  const windowN = amortWindowMonths(months, periodMonths, boundsMonths).length;
  const multiName = names.length>1;
  const items = [];

  function isAmortForName(name){ return cfg.mode==="amorti" && name===cfg.mainGroup; }
  function adjustForName(name){ return (cfg.mode==="amorti" || cfg.mode==="brut_ajout") && name===cfg.mainGroup; }

  Store.transactions.forEach(t=>{
    if(t.type==="Transfer") return;
    if(isAccountExcluded(t.compte)) return;
    const matchedName = names.find(n=>groupSelectionMatches(t, n));
    if(!matchedName) return;
    const base = t.groupeBase || U.baseGroupe(t.groupe);
    const kind = AGG.getGroupKind(t.groupe);
    const isVoyage = kind==="voyage";
    if(typeFilter==="Voyage" && !isVoyage) return;
    if((typeFilter==="Income" || typeFilter==="Expense") && isVoyage) return;
    const subLabel = isVoyage ? (t.groupe||"") : (t.categorie||"(Non renseigné)");
    const sub = multiName ? [subLabel, matchedName].filter(Boolean).join(" · ") : subLabel;

    if(isVoyage){
      const forced = AGG.getGroupVoyageMonth(t.groupe);
      const tr = t.transform;
      if(tr.mode==="yearsplit" && !forced){
        const inYear = String(tr.year) >= months[0].slice(0,4) && String(tr.year) <= months[months.length-1].slice(0,4);
        if(!inYear) return;
        const displayAmount = (t.montant/12) * yearsplitMonthsInPeriod(tr.year, monthSet) * scopeMult;
        items.push({kind:"reel", date: t.date, txnId: t.id, remarque: t.remarque||t.categorie||"—", sub, displayAmount, yearsplit:true, yearsplitCount: yearsplitMonthsInPeriod(tr.year, monthSet)});
        return;
      }
      let targetMonth = forced;
      if(!targetMonth){
        if(tr.mode==="month") targetMonth = tr.year+"-"+U.pad2(tr.month+1);
        else targetMonth = t.date.getFullYear()+"-"+U.pad2(t.date.getMonth()+1);
      }
      if(!monthSet.has(targetMonth)) return;
      const displayAmount = t.montant*scopeMult;
      items.push({kind:"reel", date: t.date, txnId: t.id, remarque: t.remarque||t.categorie||"—", sub, displayAmount, yearsplit:false});
      return;
    }

    // "quotidien"
    if((typeFilter==="Income" || typeFilter==="Expense") && t.type!==typeFilter) return;
    const cat = t.categorie || "(Non renseigné)";
    const tr = t.transform;
    const effMonthKey = tr.mode==="month" ? (tr.year+"-"+U.pad2(tr.month+1)) : (t.date.getFullYear()+"-"+U.pad2(t.date.getMonth()+1));
    const beforeStart = cfg.startMonth && effMonthKey < cfg.startMonth;
    const afterEnd = cfg.endMonth && effMonthKey > cfg.endMonth;
    const amortized = isAmortForName(matchedName) && (amortSet.has(cat) || beforeStart || afterEnd);
    if(amortized){
      if(windowN<=0) return;
      const displayAmount = (t.montant/periodMonths)*windowN*scopeMult;
      items.push({kind:"amorti", date: t.date, txnId: t.id, remarque: t.remarque||cat||"—", sub, displayAmount, yearsplit:false, catKey:cat, matchedName, effMonthKey, rawAmount:t.montant});
      return;
    }
    const inPeriod = monthSet.has(effMonthKey) || (tr.mode==="yearsplit" && String(tr.year)>=months[0].slice(0,4) && String(tr.year)<=months[months.length-1].slice(0,4));
    if(!inPeriod) return;
    let displayAmount = tr.mode==="yearsplit" ? (t.montant/12) * yearsplitMonthsInPeriod(tr.year, monthSet) : t.montant;
    displayAmount *= scopeMult;
    items.push({kind:"reel", date: t.date, txnId: t.id, remarque: t.remarque||cat||"—", sub, displayAmount, yearsplit: tr.mode==="yearsplit", yearsplitCount: tr.mode==="yearsplit"?yearsplitMonthsInPeriod(tr.year, monthSet):null, catKey:cat, matchedName, effMonthKey, rawAmount:t.montant});
  });

  // Ajustements manuels : uniquement pour le groupe principal, en mode "Amort. + ajouts" ou "Sans amort,
  // avec ajout" (les groupes additionnels restent toujours en brut, cf. computeGroupBudget/forceBrut).
  names.forEach(name=>{
    if(!adjustForName(name)) return;
    const amortiOk = isAmortForName(name);
    (cfg.adjustments||[]).forEach((adj, adjIdx)=>{
      if(adj.groupe !== name) return;
      if(!amortiOk && adj.amorti) return; // "Sans amort, avec ajout" : exclut les ajustements amortis
      const isVoyAdj = !adj.categorie;
      if(typeFilter==="Voyage" && !isVoyAdj) return;
      if((typeFilter==="Income" || typeFilter==="Expense") && isVoyAdj) return;
      const amt = adjustmentScopedAmount(adj);
      const adjType = amt>=0 ? "Income" : "Expense";
      const sub = multiName ? [adj.categorie||"Ajustements", name].filter(Boolean).join(" · ") : (adj.categorie||"Ajustements");
      if(monthSet.has(adj.month) && amt){
        if(!typeFilter || typeFilter==="Voyage" || adjType===typeFilter){
          const [ay,am] = adj.month.split("-").map(Number);
          items.push({kind:"ajout", date: new Date(ay,(am||1)-1,1), txnId:null, adjIdx, remarque: adj.remarque||"Ajustement", sub, displayAmount: amt});
        }
      }
      if(adj.amorti && amortiOk && amt && windowN>0){
        const oppAmount = -amt/periodMonths*windowN;
        const oppType = oppAmount>=0 ? "Income" : "Expense";
        if(!typeFilter || typeFilter==="Voyage" || oppType===typeFilter){
          const [ay,am] = adj.month.split("-").map(Number);
          items.push({kind:"amorti", date: new Date(ay,(am||1)-1,1), txnId:null, adjIdx, remarque: "Amortissement : "+(adj.remarque||"Ajustement"), sub, displayAmount: oppAmount});
        }
      }
    });
  });

  items.sort((a,b)=> b.date - a.date);
  return items;
}
function openGroupTypeTxnSheet(superGroupeNames, type, opts){
  opts = opts || {};
  const names = Array.isArray(superGroupeNames) ? superGroupeNames : [superGroupeNames];
  const months = monthsInRange(periodFrom, periodTo);
  const items = collectGroupTypeItemsDetailed(names, type, months);
  let filterKind = opts.filterKind || null; // null | "reel" | "amorti" | "ajout" | "reel_ajout"

  const label = type==="Income" ? "Revenus" : type==="Expense" ? "Dépenses" : type==="Voyage" ? "Voyages" : "Total";
  const subtitle = names.length>1 ? "Tous les groupes" : names[0];
  const mainGroup = Store.settings.budget.mainGroup;

  const KIND_STYLE = {
    reel:   {label:"Réel",   bg:"var(--primary-soft)",  fg:"var(--primary)"},
    amorti: {label:"Amorti", bg:"var(--transfer-soft)", fg:"var(--transfer)"},
    ajout:  {label:"Ajout",  bg:"var(--card-alt)",      fg:"var(--text-sub)"},
  };

  function renderModal(){
    const shown = items.filter(x=>bgKindIncluded(filterKind, x.kind));
    const realTotal = items.filter(x=>x.kind==="reel").reduce((s,x)=>s+x.displayAmount,0);
    const amortTotal = items.filter(x=>x.kind==="amorti").reduce((s,x)=>s+x.displayAmount,0);
    const adjTotal = items.filter(x=>x.kind==="ajout").reduce((s,x)=>s+x.displayAmount,0);
    const total = realTotal+amortTotal+adjTotal;
    const color = type==="Income" ? "var(--income)" : type==="Expense" ? "var(--expense)" : (total<0?"var(--expense)":"var(--income)");
    const bg = type==="Income" ? "var(--income-soft)" : type==="Expense" ? "var(--expense-soft)" : "var(--primary-soft)";
    const modal = document.getElementById("modal-detail");
    modal.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <span style="font-weight:800;font-size:17px;">${label}</span>
        <button class="icon-btn" id="grptxn-close">${ICONS.close}</button>
      </div>
      <div style="color:var(--text-sub);font-size:12.5px;margin-bottom:12px;">${U.escHtml(subtitle)} · ${shown.length} élément${shown.length>1?"s":""}</div>
      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
        <span class="grptxn-badge" data-kind="reel" style="cursor:pointer;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:${KIND_STYLE.reel.bg};color:${KIND_STYLE.reel.fg};${filterKind&&!bgKindIncluded(filterKind,'reel')?'opacity:.45;':''}${filterKind==='reel'?'box-shadow:0 0 0 2px '+KIND_STYLE.reel.fg+';':''}">Réel : ${bgFmtMoneySigned(realTotal)}</span>
        ${amortTotal!==0 ? `<span class="grptxn-badge" data-kind="amorti" style="cursor:pointer;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:${KIND_STYLE.amorti.bg};color:${KIND_STYLE.amorti.fg};${filterKind&&!bgKindIncluded(filterKind,'amorti')?'opacity:.45;':''}${filterKind==='amorti'?'box-shadow:0 0 0 2px '+KIND_STYLE.amorti.fg+';':''}">Amorti : ${bgFmtMoneySigned(amortTotal)}</span>` : ""}
        ${adjTotal!==0 ? `<span class="grptxn-badge" data-kind="ajout" style="cursor:pointer;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:${KIND_STYLE.ajout.bg};color:${KIND_STYLE.ajout.fg};${filterKind&&!bgKindIncluded(filterKind,'ajout')?'opacity:.45;':''}${filterKind==='ajout'?'box-shadow:0 0 0 2px '+KIND_STYLE.ajout.fg+';':''}">Ajouts : ${bgFmtMoneySigned(adjTotal)}</span>` : ""}
        <span style="margin-left:auto;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:${bg};color:${color};">Total : ${bgFmtMoneySigned(total)}</span>
      </div>
      <div style="max-height:56vh;overflow-y:auto;">
        ${shown.length===0 ? `<div style="padding:14px;color:var(--text-sub);font-size:13.5px;">Aucun élément${filterKind?" pour ce filtre":""} sur la période affichée.</div>` :
        shown.map(x=>`
          <div class="detail-row grptxn-row" ${x.txnId?`data-txnid="${U.escHtml(x.txnId)}"`:""} ${x.adjIdx!=null?`data-adjidx="${x.adjIdx}"`:""} style="align-items:center;${(x.txnId||x.adjIdx!=null)?'cursor:pointer;':''}">
            <span style="display:flex;flex-direction:column;min-width:0;">
              <span style="font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${(x.txnId||x.adjIdx!=null)?'text-decoration:underline;text-decoration-color:var(--divider);':''}">${U.escHtml(x.remarque)}</span>
              <span style="font-size:11px;color:var(--text-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${x.kind==="ajout"||x.adjIdx!=null ? fmtMonthYearShort(x.date.getFullYear(),x.date.getMonth()) : U.fmtDateShort(x.date)}${x.sub?" · "+U.escHtml(x.sub):""}${x.yearsplit?" · "+x.yearsplitCount+"/12 mois":""}</span>
            </span>
            <span style="display:flex;align-items:center;gap:8px;flex:0 0 auto;">
              ${(x.kind==="reel" && x.catKey && x.matchedName===mainGroup) ? `<button type="button" class="btn btn-ghost btn-sm grptxn-amortize" data-txnid="${U.escHtml(x.txnId)}" data-groupe="${U.escHtml(x.matchedName)}" data-cat="${U.escHtml(x.catKey)}" data-month="${U.escHtml(x.effMonthKey)}" data-amount="${x.rawAmount}" data-remarque="${U.escHtml(x.remarque)}" style="padding:3px 9px;font-size:10.5px;">Amortir</button>` : ""}
              <span style="font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;background:${KIND_STYLE[x.kind].bg};color:${KIND_STYLE[x.kind].fg};">${KIND_STYLE[x.kind].label}</span>
              <span style="font-weight:700;font-size:13.5px;color:${x.displayAmount<0?'var(--expense)':'var(--income)'}">${bgFmtMoneySigned(x.displayAmount)}</span>
            </span>
          </div>
        `).join("")}
      </div>
    `;
    document.getElementById("grptxn-close").onclick = ()=>APP.closeOverlay("overlay-detail");
    document.querySelectorAll(".grptxn-badge[data-kind]").forEach(el=>{
      el.onclick = ()=>{
        const k = el.dataset.kind;
        filterKind = (filterKind===k) ? null : k;
        renderModal();
      };
    });
    document.querySelectorAll(".grptxn-amortize[data-txnid]").forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        openAdjustmentForm(null, {
          month: btn.dataset.month,
          groupe: btn.dataset.groupe,
          categorie: btn.dataset.cat,
          montant: -Number(btn.dataset.amount),
          remarque: "Amortissement : "+(btn.dataset.remarque||btn.dataset.cat),
          amorti: true,
          montantScope: "perso"
        });
      };
    });
    document.querySelectorAll(".grptxn-row[data-txnid]").forEach(el=>{
      el.onclick = ()=> window.__SF_VIEWS.openTxnDetail(el.dataset.txnid);
    });
    document.querySelectorAll(".grptxn-row[data-adjidx]").forEach(el=>{
      if(el.dataset.txnid) return;
      el.onclick = ()=>{
        const idx = Number(el.dataset.adjidx);
        const a = Object.assign({__idx:idx}, (Store.settings.budget.adjustments||[])[idx]);
        openAdjustmentForm(a);
      };
    });
  }

  renderModal();
  APP.openOverlay("overlay-detail");
}

/* Détail des transactions/ajustements d'un ou plusieurs groupes pour UN SEUL mois — ouvert en cliquant une
   cellule de la vue "mois par mois" du Budget (bouton calendrier, entre "Ajouts" et "Colonnes"). Même
   présentation que openGroupTypeTxnSheet() ci-dessus (badges Réel/Amorti/Ajout filtrables, liste
   cliquable), mais bornée à ce mois précis ; boundsMonths = la période affichée complète, pour que la part
   d'amortissement de ce mois reste calculée avec la bonne fenêtre/diviseur (même principe que
   computeGroupBudgetByMonth, cf. plus haut). */
function openGroupMonthTxnSheet(superGroupeNames, monthKey){
  const names = Array.isArray(superGroupeNames) ? superGroupeNames : [superGroupeNames];
  const boundsMonths = monthsInRange(periodFrom, periodTo);
  const items = collectGroupTypeItemsDetailed(names, null, [monthKey], boundsMonths);
  let filterKind = null; // null | "reel" | "amorti" | "ajout"

  const [my, mm] = monthKey.split("-").map(Number);
  const monthLabel = U.fmtMonthYear(my, mm-1);
  const label = monthLabel.charAt(0).toUpperCase()+monthLabel.slice(1);
  const subtitle = names.length>1 ? "Tous les groupes" : names[0];

  const KIND_STYLE = {
    reel:   {label:"Réel",   bg:"var(--primary-soft)",  fg:"var(--primary)"},
    amorti: {label:"Amorti", bg:"var(--transfer-soft)", fg:"var(--transfer)"},
    ajout:  {label:"Ajout",  bg:"var(--card-alt)",      fg:"var(--text-sub)"},
  };

  function renderModal(){
    const shown = items.filter(x=>bgKindIncluded(filterKind, x.kind));

/* Toujours 0 décimale dans l'onglet Évolution, indépendamment du réglage global (Transactions/Comptes) */
function fmtVal(n){
  if(n==null || isNaN(n)) n=0;
  const sign = n>0 ? "+ " : (n<0 ? "- " : "");
  return sign + Math.round(Math.abs(n)).toLocaleString('fr-FR') + " €";
}
function fmtValPlain(n){
  if(n==null || isNaN(n)) n=0;
  const sign = n<0 ? "-" : "";
  return sign + Math.round(Math.abs(n)).toLocaleString('fr-FR') + " €";
}

function valClass(n){ return n<0 ? "neg" : (n>0 ? "pos" : ""); }

/* ---------------- Rendu principal ---------------- */

function buildTableHtml(evoIndex, dimension, years){
  const cols = drillYear!=null
    ? Array.from({length:12}, (_,m)=>({type:"month", year:drillYear, month:m, label:U.MONTHS_FR_SHORT[m]}))

  const theadHtml = `

      <th class="evo-col-total">Total</th>
      ${cols.map(c=> c.type==="year"
        ? `<th class="evo-col-val evo-year-header" data-year="${c.year}">${c.label}</th>`
        : `<th class="evo-col-val">${c.label}</th>`
      ).join("")}
    </tr></thead>
  `;

  const grandTotal = drillYear!=null
    ? evoIndex.sections.reduce((s,sec)=> s+AGG.sectionYearValue(sec, drillYear), 0)

      ${cols.map(c=>{

        return `<td class="evo-col-val evo-val-cell ${valClass(v)}" data-global="1" ${periodAttrs}>${v ? fmtVal(v) : "—"}</td>`;
      }).join("")}
    </tr>
  `;

  const bodyRows = evoIndex.sections.map(sec=>{
    const secTotal = drillYear!=null ? AGG.sectionYearValue(sec, drillYear) : AGG.sectionTotalValue(sec);
    const secSelected = mergeMode && mergeSelection.has(sec.key);

    const collapsed = collapsedSections.has(sec.key);
    const secCells = cols.map(c=>{

      const dataAttrs = secIsMerge

    const secRow = `

    const itemRows = sec.items.map(it=>{
      const itTotal = drillYear!=null ? AGG.itemYearValue(it, drillYear) : AGG.itemTotalValue(it);
      const itCells = cols.map(c=>{
        const v = c.type==="year" ? AGG.itemYearValue(it, c.year) : AGG.itemMonthValue(it, c.year, c.month);

        return `<td class="evo-col-val evo-val-cell ${valClass(v)}" data-item="${U.escHtml(it.label)}" ${periodAttrs}>${v ? fmtVal(v) : "—"}</td>`;

    }).join("");
    return secRow + itemRows;
  }).join("");

  return `<table class="evo-table">${theadHtml}<tbody>${totalRowHtml}${bodyRows}</tbody></table>`;

/* ---------------- Feuille de détail transactions ---------------- */
function txnBucketsFor(t, monthBasis){
  if(monthBasis==="reel") return [{year:t.date.getFullYear(), month:t.date.getMonth()}];
  const tr = t.transform;
  if(tr.mode==="yearsplit"){
    const arr=[]; for(let m=0;m<12;m++) arr.push({year:tr.year, month:m}); return arr;
  }
  if(tr.mode==="month") return [{year:tr.year, month:tr.month}];
  return [{year:t.date.getFullYear(), month:t.date.getMonth()}];
}
function txnMatchesPeriod(t, monthBasis, year, month){
  if(year==null) return true;
  const buckets = txnBucketsFor(t, monthBasis);
  return buckets.some(b=> b.year===year && (month==null || b.month===month));
}
function matchesSectionForAccount(compteName, opts){
  if(!compteName) return false;
  const type = AGG.getAccountTypeDisplay(compteName);
  if(opts.sectionMembers) return opts.sectionMembers.includes(type);
  return type===opts.sectionKey;
}
function txnMatchesDimTarget(t, dimension, opts){
  if(opts.global) return true;
  if(dimension==="groupe"){
    if(!t.groupe) return false;
    if(opts.itemKey!=null) return t.groupe===opts.itemKey;
    const base = t.groupeBase || U.baseGroupe(t.groupe);
    const rule = AGG.findGroupAliasRule(base, t.groupe);
    const superName = rule ? rule.superGroupe : t.groupe;
    if(opts.sectionMembers) return opts.sectionMembers.includes(superName);
    return superName===opts.sectionKey;
  }
  if(dimension==="categorie"){
    const cat = t.categorie || "(Non renseigné)";
    if(opts.itemKey!=null) return cat===opts.itemKey;
    const type = (t.categorie && opts.catTypeMap.get(t.categorie)) || t.type;
    if(opts.sectionMembers) return opts.sectionMembers.includes(type);
    return type===opts.sectionKey;
  }
  if(dimension==="compte"){
    if(t.type==="Transfer"){
      const matchesSource = opts.itemKey!=null ? t.compte===opts.itemKey : matchesSectionForAccount(t.compte, opts);
      const matchesDest = opts.itemKey!=null ? t.compteCible===opts.itemKey : matchesSectionForAccount(t.compteCible, opts);
      return matchesSource || matchesDest;
    }
    if(!t.compte) return false;
    if(opts.itemKey!=null) return t.compte===opts.itemKey;
    return matchesSectionForAccount(t.compte, opts);
  }
  const per = t.personne || "(Non renseigné)";
  if(opts.itemKey!=null) return per===opts.itemKey;
  const superName = t.personne ? AGG.getPersonneDisplay(t) : "(Non renseigné)";
  if(opts.sectionMembers) return opts.sectionMembers.includes(superName);
  return superName===opts.sectionKey;
}
/* Montant à afficher pour une transaction dans la feuille de détail de la vue Compte : pour un virement,
   le signe dépend du sens (négatif si le compte/section cliqué est la source, positif s'il est la cible —
   les deux si la source ET la cible appartiennent à la même section, ex. deux comptes du même type). */
function evoSignedAmountForCompte(t, opts){
  if(t.type!=="Transfer") return t.montant;
  let amt = 0;
  const matchesSource = opts.itemKey!=null ? t.compte===opts.itemKey : matchesSectionForAccount(t.compte, opts);
  const matchesDest = opts.itemKey!=null ? t.compteCible===opts.itemKey : matchesSectionForAccount(t.compteCible, opts);
  if(matchesSource) amt -= t.montant;
  if(matchesDest) amt += t.montant;
  return amt;
}
function openEvolutionTxnSheet(dimension, opts){
  const rows = [];
  Store.transactions.forEach(t=>{
    if(dimension!=="compte" && t.type==="Transfer") return;
    if(!txnMatchesDimTarget(t, dimension, opts)) return;
    if(!txnMatchesPeriod(t, opts.monthBasis, opts.year!=null?opts.year:null, opts.month!=null?opts.month:null)) return;
    rows.push({t, amt: dimension==="compte" ? evoSignedAmountForCompte(t, opts) : t.montant});

  flat.sort((a,b)=>a.base.localeCompare(b.base,'fr'));
  if(cfg.noGroupLabel && flat.length){
    // Les éléments non rattachés à un groupe sont regroupés sous un en-tête "Sans type" dédié,
    // cliquable comme les autres en-têtes pour tout sélectionner/désélectionner en bloc — il n'existe
    // toutefois pas de valeur "groupe" unique les représentant tous (contrairement aux en-têtes de
    // groupe normaux, dont le nom sert lui-même de filtre), donc le clic bascule directement chacun
    // des éléments qu'il contient (cf. wireNestedFilter → data-notypehead).
    const totalCount = flat.reduce((s,f)=>s+f.count,0);
    const allSelected = flat.every(f=>filterSet.has(f.base));
    html += `<div class="groupe-section" data-super="${U.escHtml(cfg.noGroupLabel)}">
      <div class="check-item groupe-section-head ${allSelected?'selected':''}" data-notypehead="1">
        <span class="cbox">${ICONS.check}</span>
        <span class="lbl" style="font-weight:800;">${U.escHtml(cfg.noGroupLabel)}</span>
        <span class="cnt">${totalCount}</span>

            <span class="cbox">${ICONS.check}</span>
            <span class="lbl">${U.escHtml(f.base)}</span>
            <span class="cnt">${f.count}</span>
          </div>
        `).join("")}
      </div>
    </div>`;
  } else {
    flat.forEach(f=>{
      const selected = filterSet.has(f.base);
      html += `<div class="check-item groupe-flat-item" data-val="${U.escHtml(f.base)}">
        <span class="cbox">${ICONS.check}</span>
        <span class="lbl">${U.escHtml(f.base)}</span>
        <span class="cnt">${f.count}</span>
      </div>`;
    });
  }

}
function wireNestedFilter(kind){
  const cfg = NESTED_DIM_CONFIG[kind];
  const filterSet = F[kind];
  const list = document.getElementById(cfg.listId);
  if(!list) return;
  list.querySelectorAll(".check-item").forEach(el=>{
    el.onclick = ()=>{
      const val = el.dataset.val;
      if(filterSet.has(val)) filterSet.delete(val); else filterSet.add(val);
      el.classList.toggle("selected");
      F.persist();
      updateApplyButton();
    };
  });
  // En-tête "Sans type" : bascule en bloc tous les éléments non rattachés (cf. commentaire dans nestedFilterHtml).
  list.querySelectorAll("[data-notypehead]").forEach(head=>{
    head.onclick = ()=>{
      const section = head.closest(".groupe-section");
      const children = Array.from(section.querySelectorAll(".groupe-child-item"));
      const allSelected = children.length>0 && children.every(c=>filterSet.has(c.dataset.val));
      children.forEach(c=>{
        if(allSelected) filterSet.delete(c.dataset.val); else filterSet.add(c.dataset.val);
        c.classList.toggle("selected", !allSelected);
      });
      head.classList.toggle("selected", !allSelected);
      F.persist();
      updateApplyButton();
    };
  });
  const search = document.getElementById(cfg.searchId);
  if(search){
    search.oninput = ()=>{
      const q = U.normalize(search.value);
      list.querySelectorAll(".groupe-section").forEach(sec=>{
        const supMatch = U.normalize(sec.dataset.super).includes(q);
        let anyChildMatch = false;
        sec.querySelectorAll(".groupe-child-item").forEach(ch=>{
          const match = !q || U.normalize(ch.dataset.childname).includes(q);
          ch.style.display = match ? "flex" : "none";
          if(match) anyChildMatch = true;
        });
        sec.style.display = (!q || supMatch || anyChildMatch) ? "" : "none";
      });
      list.querySelectorAll(".groupe-flat-item").forEach(el=>{
        const match = !q || U.normalize(el.dataset.val).includes(q);
        el.style.display = match ? "flex" : "none";
      });
    };
  }
}

function handleFile(file){
  const statusEl = document.getElementById("import-status");
  statusEl.innerHTML = `<div style="text-align:center;color:var(--text-sub);font-size:13.5px;padding:14px;">Analyse du fichier…</div>`;

  if(name.endsWith(".json")){
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const obj = JSON.parse(e.target.result);
        const rawArr = Array.isArray(obj) ? obj : (obj.transactions || []);
        const txns = rawArr.map(t=>({...t, date:new Date(t.date)})).filter(t=>t.date && !isNaN(t.date));
        const params = (!Array.isArray(obj) && obj.params) ? obj.params : null;

      }
    };
    reader.readAsText(file);
    return;
  }
  DATA.parseFile(file).then(res=>{
    parsedResult = {...res, fileName: file.name};

    statusEl.innerHTML = `<div style="color:var(--expense);font-size:13.5px;padding:10px;">Impossible de lire ce fichier : ${U.escHtml(err.message)}</div>`;

function mergeRuleList(existing, incoming, sigFn){
  const existingSigs = new Set(existing.map(sigFn));
  let added = 0;
  incoming.forEach(r=>{
    const s = sigFn(r);
    if(!existingSigs.has(s)){ existing.push(r); existingSigs.add(s); added++; }
  });
  return added;
}

function applyParamsImport(params, mode){
  if(!params) return {rulesAdded:0, personRulesAdded:0, acctAdded:0};
  const groupRules = params.groupRules || [];
  const personRules = params.personRules || [];
  const accountTypes = params.accountTypes || {};
  const accountAcronyms = params.accountAcronyms || {};
  const groupKind = params.groupKind || {};
  const groupVoyageMonth = params.groupVoyageMonth || {};
  const groupDateRange = params.groupDateRange || {};
  const categoryTypeOverride = params.categoryTypeOverride || {};
  const budgetAdjustments = params.budgetAdjustments || [];
  const budgetSettings = params.budgetSettings || null;
  const salaryEntries = params.salaryEntries || null;
  const compareSettings = params.compareSettings || null;
  const comparePredefined = params.comparePredefined || null;
  Store.settings.budget = Store.settings.budget || {};
  Store.settings.budget.compare = Store.settings.budget.compare || {enabled:false, mode:"period", periodFrom:null, periodTo:null, predefined:{}};
  if(mode==="replace"){
    Store.settings.groupAliasRules = groupRules.slice();
    Store.settings.personAliasRules = personRules.slice();
    Store.settings.accountTypes = Object.assign({}, accountTypes);
    Store.settings.accountAcronyms = Object.assign({}, accountAcronyms);
    Store.settings.groupKind = Object.assign({}, groupKind);
    Store.settings.groupVoyageMonth = Object.assign({}, groupVoyageMonth);
    Store.settings.groupDateRange = Object.assign({}, groupDateRange);
    Store.settings.categoryTypeOverride = Object.assign({}, categoryTypeOverride);
    Store.settings.budget.adjustments = budgetAdjustments.slice();
    if(budgetSettings){
      Object.assign(Store.settings.budget, {
        mode: budgetSettings.mode || Store.settings.budget.mode,
        scope: budgetSettings.scope || Store.settings.budget.scope,
        startMonth: budgetSettings.startMonth,
        endMonth: budgetSettings.endMonth,
        mainGroup: budgetSettings.mainGroup,
        extraGroups: (budgetSettings.extraGroups || []).slice(),
        amortCategories: (budgetSettings.amortCategories || []).slice(),
        periodFrom: budgetSettings.periodFrom,
        periodTo: budgetSettings.periodTo,
      });
    }
    if(salaryEntries) Store.settings.budget.salaryEntries = Object.assign({}, salaryEntries);
    if(compareSettings){
      Store.settings.budget.compare = {
        enabled: !!compareSettings.enabled,
        mode: compareSettings.mode==="predefined" ? "predefined" : "period",
        periodFrom: compareSettings.periodFrom || null,
        periodTo: compareSettings.periodTo || null,
        predefined: Object.assign({}, comparePredefined || {})
      };
    } else if(comparePredefined){
      Store.settings.budget.compare.predefined = Object.assign({}, comparePredefined);
    }
    // Sécurité : un ancien backup peut contenir un mode budget aujourd'hui obsolète (ex. l'ancien mode
    // "Brut", supprimé) — normalizeSettings migre silencieusement vers "amorti" le cas échéant.
    Store.normalizeSettings();
    return {rulesAdded:groupRules.length, personRulesAdded:personRules.length, acctAdded:Object.keys(accountTypes).length};
  }
  const existingGroup = Store.settings.groupAliasRules || [];
  const rulesAdded = mergeRuleList(existingGroup, groupRules, r=>[r.groupe,r.superGroupe,r.full||""].join("|"));
  Store.settings.groupAliasRules = existingGroup;

  const existingPerson = Store.settings.personAliasRules || [];
  const personRulesAdded = mergeRuleList(existingPerson, personRules, r=>[r.personne,r.superPersonne].join("|"));
  Store.settings.personAliasRules = existingPerson;

  const acctBefore = Object.keys(Store.settings.accountTypes||{}).length;
  Store.settings.accountTypes = Object.assign({}, Store.settings.accountTypes, accountTypes);
  const acctAdded = Object.keys(Store.settings.accountTypes).length - acctBefore;
  Store.settings.accountAcronyms = Object.assign({}, Store.settings.accountAcronyms, accountAcronyms);

  Store.settings.groupKind = Object.assign({}, Store.settings.groupKind, groupKind);
  Store.settings.groupVoyageMonth = Object.assign({}, Store.settings.groupVoyageMonth, groupVoyageMonth);
  Store.settings.groupDateRange = Object.assign({}, Store.settings.groupDateRange, groupDateRange);
  Store.settings.categoryTypeOverride = Object.assign({}, Store.settings.categoryTypeOverride, categoryTypeOverride);

  const existingAdj = Store.settings.budget.adjustments || [];
  mergeRuleList(existingAdj, budgetAdjustments, a=>[a.month,a.groupe,a.categorie||"",a.montant,a.remarque||""].join("|"));
  Store.settings.budget.adjustments = existingAdj;

  // Réglages du budget : on ne remplit que les champs pas encore configurés, sans écraser la config actuelle.
  if(budgetSettings){
    const b = Store.settings.budget;
    if(!b.mainGroup && budgetSettings.mainGroup) b.mainGroup = budgetSettings.mainGroup;
    if(!b.mode && budgetSettings.mode) b.mode = budgetSettings.mode;
    if(!b.scope && budgetSettings.scope) b.scope = budgetSettings.scope;
    if(!b.startMonth && budgetSettings.startMonth) b.startMonth = budgetSettings.startMonth;
    if(!b.endMonth && budgetSettings.endMonth) b.endMonth = budgetSettings.endMonth;
    if((!b.extraGroups || !b.extraGroups.length) && (budgetSettings.extraGroups||[]).length) b.extraGroups = budgetSettings.extraGroups.slice();
    if((!b.amortCategories || !b.amortCategories.length) && (budgetSettings.amortCategories||[]).length) b.amortCategories = budgetSettings.amortCategories.slice();
  }
  // Salaires saisis manuellement : par mois, on ne remplit que les mois pas encore renseignés localement
  // (ne remplace jamais une saisie existante avec une valeur importée).
  if(salaryEntries){
    Store.settings.budget.salaryEntries = Store.settings.budget.salaryEntries || {};
    const localSal = Store.settings.budget.salaryEntries;
    Object.keys(salaryEntries).forEach(month=>{
      if(!localSal[month]) localSal[month] = salaryEntries[month];
    });
  }
  // Comparaison : réglages (activé/mode/période comparée) uniquement s'ils ne sont pas déjà configurés
  // localement ; budget prédéfini fusionné clé par clé, sans écraser une valeur déjà saisie localement.
  if(compareSettings && compareSettings.enabled && !Store.settings.budget.compare.periodFrom && !Store.settings.budget.compare.enabled){

    c.periodTo = compareSettings.periodTo || null;
  }
  if(comparePredefined){
    const localPredef = Store.settings.budget.compare.predefined || {};
    Object.keys(comparePredefined).forEach(key=>{
      if(localPredef[key]==null) localPredef[key] = comparePredefined[key];
    });
    Store.settings.budget.compare.predefined = localPredef;
  }

  Store.normalizeSettings();
  return {rulesAdded, personRulesAdded, acctAdded};
}

        <div><div class="rt">Ajouter aux paramètres existants</div><div class="rd">Les règles déjà enregistrées sont conservées ; celles en commun avec un compte sont mises à jour.</div></div>
      </div>
      <div class="radio-opt" data-pmode="replace" id="pmode-replace">
        <span class="rc"></span>
        <div><div class="rt">Remplacer les paramètres</div><div class="rd">Toutes les règles de groupe et types de compte actuels seront remplacés par ceux de ce fichier.</div></div>
      </div>
    `;
  }

  function render(){
    const showTxnSection = hasTxns && (chosenImportScope==="both" || chosenImportScope==="transactions");
    const showParamsSection = hasParams && (chosenImportScope==="both" || chosenImportScope==="params");
    statusEl.innerHTML = `
      <div class="import-summary"><b>${U.escHtml(r.fileName)}</b></div>
      ${scopeChoiceHtml()}
      ${showTxnSection ? txnSectionHtml() : ""}
      ${showParamsSection ? paramsSectionHtml() : ""}
      <button class="btn btn-primary btn-block" id="import-confirm" style="margin-top:18px;">Importer</button>
    `;
    if(showBoth){
      statusEl.querySelectorAll("[data-iscope]").forEach(el=>{
        el.onclick = ()=>{ chosenImportScope = el.dataset.iscope; render(); };
      });
    }
    if(showTxnSection && hasExisting){
      document.getElementById("mode-merge").onclick = ()=>{ chosenMode="merge"; document.getElementById("mode-merge").classList.add("selected"); document.getElementById("mode-replace").classList.remove("selected"); };
      document.getElementById("mode-replace").onclick = ()=>{ chosenMode="replace"; document.getElementById("mode-replace").classList.add("selected"); document.getElementById("mode-merge").classList.remove("selected"); };
    }
    if(showParamsSection){
      document.getElementById("pmode-merge").onclick = ()=>{ chosenParamsMode="merge"; document.getElementById("pmode-merge").classList.add("selected"); document.getElementById("pmode-replace").classList.remove("selected"); };
      document.getElementById("pmode-replace").onclick = ()=>{ chosenParamsMode="replace"; document.getElementById("pmode-replace").classList.add("selected"); document.getElementById("pmode-merge").classList.remove("selected"); };
    }
    document.getElementById("import-confirm").onclick = ()=>{
      const doTxns = showTxnSection;
      const doParams = showParamsSection;
      const stats = doTxns ? DATA.importTxns(parsedResult.txns, chosenMode) : null;
      const pstats = doParams ? applyParamsImport(parsedResult.params, chosenParamsMode) : null;
      if(pstats) Store.saveSettings();
      APP.closeOverlay("overlay-import");
      APP.refreshCurrentTab();
      APP.showToast("Enregistrement…");
      const finish = (ok)=>{
        if(!ok){
          const reason = Store.lastSaveError ? Store.lastSaveError : "raison inconnue";
          APP.showToast("Import réussi, mais l'enregistrement a échoué : " + reason + " Exportez une sauvegarde par sécurité.");
          return;
        }
        let msg;
        if(doTxns){
          msg = stats.mode==="replace" ? `${stats.added.toLocaleString('fr-FR')} transactions importées` :
            `${stats.added.toLocaleString('fr-FR')} ajoutée(s)` + (stats.skippedDup? `, ${stats.skippedDup} doublon(s) ignoré(s)`:"");
          if(doParams) msg += ` · paramètres mis à jour`;
        } else {
          msg = "Paramètres mis à jour";
        }
        APP.showToast(msg);
      };
      if(doTxns) Store.saveTransactions().then(finish);
      else finish(true);
    };
  }
  render();
}

function buildParamsPayload(){
  const budget = Store.settings.budget || {};
  return {
    groupRules: (Store.settings.groupAliasRules || []).slice(),
    personRules: (Store.settings.personAliasRules || []).slice(),
    accountTypes: Object.assign({}, Store.settings.accountTypes || {}),
    accountAcronyms: Object.assign({}, Store.settings.accountAcronyms || {}),
    groupKind: Object.assign({}, Store.settings.groupKind || {}),
    groupVoyageMonth: Object.assign({}, Store.settings.groupVoyageMonth || {}),
    groupDateRange: Object.assign({}, Store.settings.groupDateRange || {}),
    categoryTypeOverride: Object.assign({}, Store.settings.categoryTypeOverride || {}),
    budgetAdjustments: (budget.adjustments || []).slice(),
    budgetSettings: {
      mode: budget.mode || null,
      scope: budget.scope || null,
      startMonth: budget.startMonth || null,
      endMonth: budget.endMonth || null,
      mainGroup: budget.mainGroup || null,
      extraGroups: (budget.extraGroups || []).slice(),
      amortCategories: (budget.amortCategories || []).slice(),
      periodFrom: budget.periodFrom || null,
      periodTo: budget.periodTo || null,
    },
    salaryEntries: Object.assign({}, budget.salaryEntries || {}),
    compareSettings: {
      enabled: !!(budget.compare && budget.compare.enabled),
      mode: (budget.compare && budget.compare.mode) || null,
      periodFrom: (budget.compare && budget.compare.periodFrom) || null,
      periodTo: (budget.compare && budget.compare.periodTo) || null,
    },
    comparePredefined: Object.assign({}, (budget.compare && budget.compare.predefined) || {})
  };
}

/* scope: "both" | "transactions" | "params" */
function exportBackup(scope){
  scope = scope || "both";
  const payload = {version:2, exportedAt: new Date().toISOString()};
  if(scope==="both" || scope==="transactions"){
    payload.transactions = Store.transactions.map(t=>({...t, date:t.date.toISOString()}));
  }
  if(scope==="both" || scope==="params"){
    payload.params = buildParamsPayload();
  }
  const blob = new Blob([JSON.stringify(payload)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = U.toISO(new Date());
  const suffix = scope==="transactions" ? "_transactions" : scope==="params" ? "_parametres" : "";
  a.href = url; a.download = "suivi_financier_sauvegarde"+suffix+"_"+stamp+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  APP.showToast("Sauvegarde exportée");
}

/* scope: "both" | "transactions" | "params" */
/* Convertit une date "YYYY-MM-DD" en objet Date (jour précis, pour écriture Excel en tant que vraie
   cellule date, pas du texte) ; null/"" → null. */
function isoToDateObj(iso){
  if(!iso) return null;
  const [y,m,d] = String(iso).split("-").map(Number);
  if(!y || !m || !d) return null;
  return new Date(y, m-1, d);
}
/* Applique le format d'affichage JJ/MM/AAAA aux cellules de type date (t==='d') d'une colonne donnée
   (0-indexée), sur toutes les lignes à partir de startRow (1 = sous l'en-tête). */
function setColumnDateFormatDDMMYYYY(ws, colIndex, startRow, rowCount){
  for(let r=startRow; r<startRow+rowCount; r++){
    const addr = XLSX.utils.encode_cell({r, c: colIndex});
    const cell = ws[addr];
    if(cell && cell.t==="d") cell.z = "dd/mm/yyyy";
  }
}
function exportExcel(scope){
  scope = scope || "both";
  const wb = XLSX.utils.book_new();

  if(scope==="both" || scope==="transactions"){
    const header = ["Date","Type","Montant","Catégorie","Personne","Compte","Compte cible","Groupe","Remarque"];
    const typeLabelFr = {Income:"Revenu", Expense:"Dépense", Transfer:"Transfert"};
    const data = [header];
    Store.transactions.forEach(t=>{
      data.push([
        t.date, typeLabelFr[t.type]||t.type, t.montant, t.categorie, t.personne, t.compte, t.compteCible, t.groupe, t.remarque
      ]);
    });
    const wsTxn = XLSX.utils.aoa_to_sheet(data, {cellDates:true});
    setColumnDateFormatDDMMYYYY(wsTxn, 0, 1, data.length-1);
    XLSX.utils.book_append_sheet(wb, wsTxn, "Transactions");
  }

  if(scope==="both" || scope==="params"){
    const pHeader = ["Groupe","Groupe de groupe",
      "Type budget (Quotidien/Voyage)","Mois voyage (AAAA-MM)","Date début (jours)","Date fin (jours)",
      "Compte","Type de compte","Acronyme","Personne","Groupe de personnes",
      "Catégorie (classement forcé)","Type forcé (Revenus/Dépenses)"];
    const rules = Store.settings.groupAliasRules || [];
    const kindMap = Store.settings.groupKind || {};
    const voyageMonthMap = Store.settings.groupVoyageMonth || {};
    const dateRangeMap = Store.settings.groupDateRange || {};
    // Un seul bloc de colonnes "Groupe" contiguës (groupe de groupe + type budget + mois voyage + bornes
    // jours), au lieu de plusieurs blocs disjoints ailleurs dans la feuille. La colonne "Groupe" contient
    // TOUJOURS le libellé complet exact (suffixe de date inclus, ex. "France (26-06_07)") — jamais un nom
    // de base dérivé — sauf pour une règle "générique" volontairement créée sans occurrence précise dans
    // "Gérer les groupes" (rattache alors toute occurrence non classée individuellement ; cf. `full` dans
    // findGroupAliasRule), auquel cas "Groupe" montre simplement le nom tel quel, sans suffixe puisqu'il
    // n'y en a pas. Une ligne par règle de "groupe de groupe" (rules), enrichie du type budget/mois
    // voyage/bornes jours du même libellé s'ils existent ; les libellés qui n'ont NI règle de groupe de
    // groupe MAIS ont un type budget ou des bornes jours reçoivent une ligne dédiée pour ne rien perdre.
    const ruleKeys = new Set(rules.map(r=>r.full || r.groupe));
    const extraKeys = Array.from(new Set([...Object.keys(kindMap), ...Object.keys(dateRangeMap)]))
      .filter(k=>!ruleKeys.has(k));
    const groupRows = rules.map(r=>{
      const key = r.full || r.groupe;
      return {
        groupe: key, superGroupe: r.superGroupe,
        kind: kindMap[key]||"", voyageMonth: voyageMonthMap[key]||"",
        daysFrom: (dateRangeMap[key]||{}).dateFrom||null, daysTo: (dateRangeMap[key]||{}).dateTo||null
      };
    }).concat(extraKeys.map(k=>({
      groupe: k, superGroupe: "",
      kind: kindMap[k]||"", voyageMonth: voyageMonthMap[k]||"",
      daysFrom: (dateRangeMap[k]||{}).dateFrom||null, daysTo: (dateRangeMap[k]||{}).dateTo||null
    })));
    const acctTypesMap = Store.settings.accountTypes || {};
    const acctAcronymsMap = Store.settings.accountAcronyms || {};
    const acctNames = Array.from(new Set([...Object.keys(acctTypesMap), ...Object.keys(acctAcronymsMap)]));
    const acct = acctNames.map(name=>[name, acctTypesMap[name]||"", acctAcronymsMap[name]||""]);
    const personRules = Store.settings.personAliasRules || [];
    const catOverrideEntries = Object.entries(Store.settings.categoryTypeOverride || {});
    const n = Math.max(groupRows.length, acct.length, personRules.length, catOverrideEntries.length, 1);
    const pData = [pHeader];
    for(let i=0;i<n;i++){
      const g = groupRows[i], a = acct[i], p = personRules[i], co = catOverrideEntries[i];
      pData.push([
        g?g.groupe:"", g?g.superGroupe:"",
        g?(g.kind==="voyage"?"Voyage":(g.kind?"Quotidien":"")):"", g?g.voyageMonth:"",
        (g&&g.daysFrom)?isoToDateObj(g.daysFrom):"", (g&&g.daysTo)?isoToDateObj(g.daysTo):"",
        a?a[0]:"", a?a[1]:"", a?a[2]:"",
        p?p.personne:"", p?p.superPersonne:"",
        co?co[0]:"", co?(co[1]==="Income"?"Revenus":"Dépenses"):""
      ]);
    }
    const wsParams = XLSX.utils.aoa_to_sheet(pData, {cellDates:true});
    setColumnDateFormatDDMMYYYY(wsParams, 4, 1, pData.length-1);
    setColumnDateFormatDDMMYYYY(wsParams, 5, 1, pData.length-1);
    XLSX.utils.book_append_sheet(wb, wsParams, "Paramètres");

    const adj = (Store.settings.budget||{}).adjustments || [];
    const aHeader = ["Mois","Groupe","Catégorie","Montant","Remarque","Amorti","Vue","Vue uniquement"];
    const aData = [aHeader].concat(adj.map(a=>[a.month||"", a.groupe||"", a.categorie||"", a.montant||0, a.remarque||"", a.amorti?"Oui":"Non", a.montantScope==="both"?"Les deux":(a.montantScope==="couple"?"Couple":"Perso"), (a.montantViewOnly&&a.montantScope!=="both")?"Oui":"Non"]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aData), "Budget");

    const b = Store.settings.budget || {};
    const bsData = [
      ["Réglage","Valeur"],
      ["Mode", b.mode||""],
      ["Vue (perso/couple)", b.scope||""],
      ["Mois de début", b.startMonth||""],
      ["Dernier mois", b.endMonth||""],
      ["Groupe de groupe principal", b.mainGroup||""],
      ["Groupes de groupe additionnels", (b.extraGroups||[]).join(" | ")],
      ["Catégories amorties", (b.amortCategories||[]).join(" | ")],
      ["Période affichée - de", b.periodFrom||""],
      ["Période affichée - à", b.periodTo||""],
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(bsData), "Budget_Reglages");

    const salEntries = Object.entries(b.salaryEntries || {}).sort((x,y)=>x[0].localeCompare(y[0]));
    const salHeader = ["Mois","Moi","Ma femme"];
    const salData = [salHeader].concat(salEntries.map(([month, e])=>[month, e.moi==null?"":e.moi, e.femme==null?"":e.femme]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(salData), "Budget_Salaires");

    const cmp = b.compare || {};
    const cmpData = [
      ["Réglage","Valeur"],
      ["Activée", cmp.enabled ? "Oui" : "Non"],
      ["Mode", cmp.mode==="predefined" ? "Budget prédéfini" : "Autre période"],
      ["Période comparée - de", cmp.periodFrom||""],
      ["Période comparée - à", cmp.periodTo||""],
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(cmpData), "Budget_Comparaison");

    const predefEntries = Object.entries(cmp.predefined || {}).sort((x,y)=>x[0].localeCompare(y[0]));
    const predefHeader = ["Clé","Groupe","Catégorie","Montant mensuel"];
    const predefData = [predefHeader].concat(predefEntries.map(([key, montant])=>{
      if(key.endsWith("::voyage")) return [key, key.slice(0, -"::voyage".length), "(Voyages)", montant];
      const parts = key.split("::cat::");
      return [key, parts[0]||"", parts.length>1?parts[1]:"", montant];
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(predefData), "Budget_Predefini");
  }

  const stamp = U.toISO(new Date());
  const suffix = scope==="transactions" ? "_transactions" : scope==="params" ? "_parametres" : "";
  XLSX.writeFile(wb, "suivi_financier"+suffix+"_"+stamp+".xlsx");
  APP.showToast("Export Excel généré");
}

window.__SF_MENU = {open: openMenuSheet, buildParamsPayload};
