/* ---------------- Feuille de détail transactions ---------------- */
function txnBucketsFor(t, monthBasis){
  if(monthBasis==="reel") return [{year:t.date.getFullYear(), month:t.date.getMonth()}];
  const tr = t.transform;
  if(tr.mode==="yearsplit"){
    const arr=[]; for(let m=0;m<12;m++) arr.push({year:tr.year, month:m}); return arr;
  }
  if(tr.mode==="month") return [{year:tr.year, month:tr.month}];
  return [{year:t.date.getFullYear(), month:t.date.getMonth()}];
}
function txnMatchesPeriod(t, monthBasis, year, month, cumulative){
  if(year==null) return true;
  const buckets = txnBucketsFor(t, monthBasis);
  if(cumulative){
    const limit = year*12 + (month==null ? 11 : month);
    return buckets.some(b=> (b.year*12+b.month) <= limit);
  }
  return buckets.some(b=> b.year===year && (month==null || b.month===month));
}
function matchesSectionForAccount(compteName, opts){
  if(!compteName) return false;
  const type = AGG.getAccountTypeDisplay(compteName);
  if(opts.sectionMembers) return opts.sectionMembers.includes(type);
  return type===opts.sectionKey;
}
function txnMatchesDimTarget(t, dimension, opts){
  if(opts.global) return true;
  if(dimension==="groupe"){
    if(!t.groupe) return false;
    if(opts.itemKey!=null) return t.groupe===opts.itemKey;
    const base = t.groupeBase || U.baseGroupe(t.groupe);
    const rule = AGG.findGroupAliasRule(base, t.groupe);
    const superName = rule ? rule.superGroupe : t.groupe;
    if(opts.sectionMembers) return opts.sectionMembers.includes(superName);
    return superName===opts.sectionKey;
  }
  if(dimension==="categorie"){
    const cat = t.categorie || "(Non renseigné)";
    if(opts.itemKey!=null) return cat===opts.itemKey;
    const type = (t.categorie && opts.catTypeMap.get(t.categorie)) || t.type;
    if(opts.sectionMembers) return opts.sectionMembers.includes(type);
    return type===opts.sectionKey;
  }
  if(dimension==="compte"){
    if(t.type==="Transfer"){
      const matchesSource = opts.itemKey!=null ? t.compte===opts.itemKey : matchesSectionForAccount(t.compte, opts);
      const matchesDest = opts.itemKey!=null ? t.compteCible===opts.itemKey : matchesSectionForAccount(t.compteCible, opts);
      return matchesSource || matchesDest;
    }
    if(!t.compte) return false;
    if(opts.itemKey!=null) return t.compte===opts.itemKey;
    return matchesSectionForAccount(t.compte, opts);
  }
  const per = t.personne || "(Non renseigné)";
  if(opts.itemKey!=null) return per===opts.itemKey;
  const superName = t.personne ? AGG.getPersonneDisplay(t) : "(Non renseigné)";
  if(opts.sectionMembers) return opts.sectionMembers.includes(superName);
  return superName===opts.sectionKey;
}
/* Montant à afficher pour une transaction dans la feuille de détail de la vue Compte : pour un virement,
   le signe dépend du sens (négatif si le compte/section cliqué est la source, positif s'il est la cible —
   les deux si la source ET la cible appartiennent à la même section, ex. deux comptes du même type). */
function evoSignedAmountForCompte(t, opts){
  if(t.type!=="Transfer") return t.montant;
  let amt = 0;
  const matchesSource = opts.itemKey!=null ? t.compte===opts.itemKey : matchesSectionForAccount(t.compte, opts);
  const matchesDest = opts.itemKey!=null ? t.compteCible===opts.itemKey : matchesSectionForAccount(t.compteCible, opts);
  if(matchesSource) amt -= t.montant;
  if(matchesDest) amt += t.montant;
  return amt;
}
function openEvolutionTxnSheet(dimension, opts){
  const rows = [];
  Store.transactions.forEach(t=>{
    if(dimension!=="compte" && t.type==="Transfer") return;
    if(!txnMatchesDimTarget(t, dimension, opts)) return;
    if(!txnMatchesPeriod(t, opts.monthBasis, opts.year!=null?opts.year:null, opts.month!=null?opts.month:null, opts.cumulative)) return;
    rows.push({t, amt: dimension==="compte" ? evoSignedAmountForCompte(t, opts) : t.montant});
  });

(function(){
"use strict";
const U = window.__SF_UTILS;

/* ================= ONGLET RÉCURRENT ================= */
/* Ne montre que les transactions dont la Remarque porte un suffixe de date transformée (YY-MM ou YYYY,
   cf. computeTransform) — celles dont le mois calculé diffère du mois réel. Regroupées par Catégorie
   (repliable/dépliable) puis, au sein de chaque catégorie, par nom de transaction sans la date (ordre
   alphabétique). Colonnes : Total de la période, puis chaque mois ; les entrées "YYYY" (montant non réparti
   sur l'année) apparaissent dans une colonne spéciale juste après décembre de cette année-là. Le filtre de
   période porte uniquement sur le mois calculé (jamais le mois réel). Même format visuel que l'onglet
   Évolution (tableau à colonnes figées, sections repliables, montants cliquables), à ceci près que la
   colonne Total n'est pas figée et que le conteneur est étroit (max. 2 colonnes visibles) : le défilement
   au-delà se fait à la main (glisser-déposer souris ou tactile natif, cf. U.enableDragScroll), ce qui laisse
   plus de place à la colonne libellé. */
let recCollapsedSections = new Set();
let recSeenSectionKeys = new Set();

function recCfg(){ return Store.settings.recurrent; }

/* Toujours 0 décimale, comme l'onglet Évolution */
function recFmtVal(n){
  if(n==null || isNaN(n)) n=0;
  const sign = n>0 ? "+ " : (n<0 ? "- " : "");
  return sign + Math.round(Math.abs(n)).toLocaleString('fr-FR') + " €";
}
function recValClass(n){ return n<0 ? "neg" : (n>0 ? "pos" : ""); }
function recFmtYM(ym){
  const parts = ym.split("-").map(Number);
  return U.MONTHS_FR_SHORT[parts[1]-1] + " " + String(parts[0]).slice(2);
}
function recFmtYMLong(ym){
  const parts = ym.split("-").map(Number);
  return U.MONTHS_FR[parts[1]-1] + " " + parts[0];
}

/* Calcule par défaut la période la plus large couvrant toutes les transactions récurrentes existantes
   (mois calculé), pour ne rien masquer au premier affichage. Les entrées "YYYY" sont ancrées sur décembre,
   cohérent avec leur position de colonne juste après ce mois. */
function ensureRecurrentPeriod(){
  const cfg = recCfg();
  if(cfg.periodFrom && cfg.periodTo) return;
  let minYM=null, maxYM=null;
  Store.transactions.forEach(t=>{
    if(t.type==="Transfer") return;
    const tr = t.transform;
    if(!tr || tr.mode==="same") return;
    const ym = tr.mode==="month" ? (tr.year+"-"+U.pad2(tr.month+1)) : (tr.year+"-12");
    if(minYM==null || ym<minYM) minYM = ym;
    if(maxYM==null || ym>maxYM) maxYM = ym;
  });
  const now = new Date();
  const nowYM = now.getFullYear()+"-"+U.pad2(now.getMonth()+1);
  cfg.periodFrom = minYM || nowYM;
  cfg.periodTo = maxYM || nowYM;
  Store.saveSettings();
}

function recPeriodPickerHtml(cfg){
  return `
    <div style="display:flex;align-items:center;gap:6px;background:var(--card);border-radius:100px;padding:7px 8px 7px 16px;margin:0 4px 12px;box-shadow:var(--shadow-1);">

function renderRecurrent(){

  const evoIndex = AGG.buildRecurringIndex(cfg.periodFrom, cfg.periodTo);
  const cols = AGG.recurringColumns(evoIndex, cfg.periodFrom, cfg.periodTo);

  // Toute nouvelle catégorie jamais rencontrée démarre selon le réglage global "Tout déplier/replier"
  // (persistant) ; l'état des catégories déjà vues, y compris les dépassements individuels, est conservé
  // d'un rendu à l'autre tant que le bouton global n'est pas actionné (cf. toggleAllRecurrentGroups).
  evoIndex.sections.forEach(s=>{
    if(!recSeenSectionKeys.has(s.key)){
      if(!cfg.groupsExpanded) recCollapsedSections.add(s.key);

    }
  });

  const allExpanded = !!cfg.groupsExpanded;

        <button type="button" class="txn-view-pill" id="rec-expand-toggle">
          <span style="display:flex;transform:rotate(${allExpanded?90:-90}deg);">${ICONS.arrowLeft}</span>
          <span>${allExpanded?"Tout replier":"Tout déplier"}</span>

  `;

  const tableHtml = evoIndex.sections.length===0
    ? `<div class="empty-state" style="padding:32px 20px;">${ICONS.inbox}<h3>Aucune transaction récurrente</h3><p>Aucune remarque avec suffixe de date sur cette période.</p></div>`
    : `<div class="evo-table-wrap recur-table-wrap">${buildRecurringTableHtml(evoIndex, cols)}</div>`;

  view.innerHTML = headerHtml + `<div class="section" style="padding-top:0;padding-left:8px;padding-right:8px;">${tableHtml}</div><div style="height:10px;"></div>`;

function buildRecurringTableHtml(evoIndex, cols){
  const theadHtml = `
    <thead><tr>
      <th class="evo-col-label">Catégorie</th>
      <th class="evo-col-total">Total</th>
      ${cols.map(c=> c.type==="year"
        ? `<th class="evo-col-val recur-year-col">${c.year}</th>`
        : `<th class="evo-col-val">${recFmtYM(c.ym)}</th>`
      ).join("")}
    </tr></thead>
  `;

  const grandTotal = evoIndex.sections.reduce((s,sec)=> s+AGG.recurringSectionTotal(sec), 0);
  const totalRowHtml = `
    <tr class="evo-total-row">
      <td class="evo-col-label">Total</td>
      <td class="evo-col-total evo-val-cell ${recValClass(grandTotal)}" data-global="1">${grandTotal ? recFmtVal(grandTotal) : "—"}</td>
      ${cols.map(c=>{
        const v = c.type==="year"
          ? evoIndex.sections.reduce((s,sec)=> s+AGG.recurringSectionYearLumpValue(sec,c.year), 0)
          : evoIndex.sections.reduce((s,sec)=> s+AGG.recurringSectionMonthValue(sec,c.year,c.month), 0);
        const colAttrs = c.type==="year" ? `data-col-type="year" data-year="${c.year}"` : `data-col-type="month" data-year="${c.year}" data-month="${c.month}"`;
        const cls = c.type==="year" ? "recur-year-col" : "";
        return `<td class="evo-col-val evo-val-cell ${cls} ${recValClass(v)}" data-global="1" ${colAttrs}>${v ? recFmtVal(v) : "—"}</td>`;
      }).join("")}
    </tr>
  `;

  const bodyRows = evoIndex.sections.map(sec=>{
    const secTotal = AGG.recurringSectionTotal(sec);
    const collapsed = recCollapsedSections.has(sec.key);
    const secCells = cols.map(c=>{
      const v = c.type==="year" ? AGG.recurringSectionYearLumpValue(sec,c.year) : AGG.recurringSectionMonthValue(sec,c.year,c.month);
      const colAttrs = c.type==="year" ? `data-col-type="year" data-year="${c.year}"` : `data-col-type="month" data-year="${c.year}" data-month="${c.month}"`;
      const cls = c.type==="year" ? "recur-year-col" : "";
      return `<td class="evo-col-val evo-val-cell ${cls} ${recValClass(v)}" data-section="${U.escHtml(sec.key)}" ${colAttrs}>${v ? recFmtVal(v) : "—"}</td>`;
    }).join("");
    const secRow = `
      <tr class="evo-section-row" data-section-toggle="${U.escHtml(sec.key)}">
        <td class="evo-col-label"><span class="evo-chev ${collapsed?'':'open'}">▸</span>${U.escHtml(sec.label)}</td>
        <td class="evo-col-total evo-val-cell ${recValClass(secTotal)}" data-section="${U.escHtml(sec.key)}">${secTotal ? recFmtVal(secTotal) : "—"}</td>
        ${secCells}
      </tr>
    `;
    const itemRows = sec.items.map(it=>{
      const itTotal = AGG.recurringItemTotal(it);
      const itCells = cols.map(c=>{
        const v = c.type==="year" ? AGG.recurringItemYearLumpValue(it,c.year) : AGG.recurringItemMonthValue(it,c.year,c.month);
        const colAttrs = c.type==="year" ? `data-col-type="year" data-year="${c.year}"` : `data-col-type="month" data-year="${c.year}" data-month="${c.month}"`;
        const cls = c.type==="year" ? "recur-year-col" : "";
        return `<td class="evo-col-val evo-val-cell ${cls} ${recValClass(v)}" data-section="${U.escHtml(sec.key)}" data-item="${U.escHtml(it.key)}" ${colAttrs}>${v ? recFmtVal(v) : "—"}</td>`;
      }).join("");
      return `
      <tr class="evo-item-row${collapsed?' hidden':''}" data-section-key="${U.escHtml(sec.key)}">
        <td class="evo-col-label" style="padding-left:22px;">${U.escHtml(it.label)}</td>
        <td class="evo-col-total evo-val-cell ${recValClass(itTotal)}" data-section="${U.escHtml(sec.key)}" data-item="${U.escHtml(it.key)}">${itTotal ? recFmtVal(itTotal) : "—"}</td>
        ${itCells}
      </tr>`;
    }).join("");
    return secRow + itemRows;
  }).join("");

  return `<table class="evo-table recur-table">${theadHtml}<tbody>${totalRowHtml}${bodyRows}</tbody></table>`;
}

function wireRecurrent(evoIndex, cfg){
  const tableWrap = document.querySelector("#view-recurrent .evo-table-wrap");
  if(tableWrap) U.enableDragScroll(tableWrap);

  const fromInput = document.getElementById("rec-from");
  const toInput = document.getElementById("rec-to");
  if(fromInput) fromInput.onchange = (e)=>{
    cfg.periodFrom = e.target.value || cfg.periodFrom;
    if(cfg.periodFrom>cfg.periodTo) cfg.periodTo = cfg.periodFrom;
    Store.saveSettings();
    renderRecurrent();
  };
  if(toInput) toInput.onchange = (e)=>{
    cfg.periodTo = e.target.value || cfg.periodTo;
    if(cfg.periodTo<cfg.periodFrom) cfg.periodFrom = cfg.periodTo;
    Store.saveSettings();
    renderRecurrent();
  };

  const expandBtn = document.getElementById("rec-expand-toggle");
  if(expandBtn) expandBtn.onclick = ()=>{
    // Réglage global persistant : repart d'un état homogène (tout ouvert ou tout fermé), en effaçant les
    // dépassements individuels précédents pour que chaque catégorie suive à nouveau ce réglage.
    cfg.groupsExpanded = !cfg.groupsExpanded;
    Store.saveSettings();
    recCollapsedSections = new Set();
    recSeenSectionKeys = new Set();
    renderRecurrent();
  };

  document.querySelectorAll(".evo-section-row[data-section-toggle]").forEach(row=>{
    row.querySelector(".evo-col-label").onclick = ()=>{
      const key = row.dataset.sectionToggle;
      if(recCollapsedSections.has(key)) recCollapsedSections.delete(key); else recCollapsedSections.add(key);
      renderRecurrent();
    };
  });

  document.querySelectorAll(".evo-val-cell").forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const opts = {};
      if(el.dataset.global!=null) opts.global = true;
      if(el.dataset.section!=null) opts.sectionKey = el.dataset.section;
      if(el.dataset.item!=null) opts.itemKey = el.dataset.item;
      if(el.dataset.colType!=null) opts.colType = el.dataset.colType;
      if(el.dataset.year!=null) opts.year = Number(el.dataset.year);
      if(el.dataset.month!=null) opts.month = Number(el.dataset.month);
      openRecurringTxnSheet(opts);
    };
  });
}

/* ---------------- Feuille de détail transactions ---------------- */
function txnMatchesRecurringTarget(t, opts, cfg){
  if(t.type==="Transfer") return false;
  const tr = t.transform;
  if(!tr || tr.mode==="same") return false;
  if(!opts.global){
    const cat = t.categorie || "(Non renseigné)";
    if(opts.sectionKey!=null && cat!==opts.sectionKey) return false;
    if(opts.itemKey!=null){
      const label = U.baseRemarque(t.remarque) || "(Sans titre)";
      if(label!==opts.itemKey) return false;
    }
  }
  if(opts.colType==="month") return tr.mode==="month" && tr.year===opts.year && tr.month===opts.month;
  if(opts.colType==="year") return tr.mode==="yearsplit" && tr.year===opts.year;
  // Colonne "Total" : même filtre de période que l'agrégation (mois calculé dans [periodFrom, periodTo])
  if(tr.mode==="month"){
    const ym = tr.year+"-"+U.pad2(tr.month+1);
    return ym>=cfg.periodFrom && ym<=cfg.periodTo;
  }
  if(tr.mode==="yearsplit"){
    const decYM = tr.year+"-12";
    return decYM>=cfg.periodFrom && decYM<=cfg.periodTo;
  }
  return false;
}
function openRecurringTxnSheet(opts){

    : opts.colType==="year" ? ("Année "+opts.year+" (montant non réparti)")
    : (cfg.periodFrom===cfg.periodTo ? recFmtYMLong(cfg.periodFrom) : recFmtYM(cfg.periodFrom)+" → "+recFmtYM(cfg.periodTo));

  const modal = document.getElementById("modal-detail");
  modal.innerHTML = `
    <div class="u-row-between-sm">
      <span class="u-title-lg">${U.escHtml(label)}</span>
      <button class="icon-btn" id="rectxn-close">${ICONS.close}</button>

    </div>
    <div class="u-scroll-56">
      ${rows.length===0 ? `<div class="u-empty-note">Aucune transaction.</div>` :
      rows.map(t=>`
        <div class="detail-row rectxn-row" data-txnid="${U.escHtml(t.id)}" style="align-items:center;cursor:pointer;">
          <span class="u-col-shrink">
            <span style="font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline;text-decoration-color:var(--divider);">${U.escHtml(t.remarque||t.categorie||"—")}</span>
            <span class="u-note-11">${U.fmtDateShort(t.date)}${t.groupe?" · "+U.escHtml(t.groupe):""}</span>
          </span>
          <span style="font-weight:700;font-size:13.5px;color:${t.montant<0?'var(--expense)':'var(--income)'};flex:0 0 auto;">${recFmtVal(t.montant)}</span>
        </div>
      `).join("")}

  `;
  document.getElementById("rectxn-close").onclick = ()=>APP.closeOverlay("overlay-detail");
  document.querySelectorAll(".rectxn-row[data-txnid]").forEach(el=>{

(function(){
"use strict";
const U = window.__SF_UTILS;

let drillYear = null;

let revSeenSectionKeys = new Set();
let mgrPerson = "moi";

const REV_PERSON_LABEL = {moi:"Moi", conjoint:"Ma femme"};

function revCfg(){ return Store.settings.revenus; }
function revFmtVal(n){ if(n==null||isNaN(n)) n=0; const sign=n>0?"+ ":(n<0?"- ":""); return sign+Math.round(Math.abs(n)).toLocaleString('fr-FR')+" €"; }
function revValClass(n){ return n<0?"neg":(n>0?"pos":""); }

/* Calcule par défaut la période la plus large couvrant les données déjà connues du module (transactions
   récurrentes, montants manuels déjà saisis, salaire "Ma femme" du Budget), pour ne rien masquer au
   premier affichage — même logique que Recurrent (cf. ensureRecurrentPeriod). */
function ensureRevenusPeriod(){
  const cfg = revCfg();
  if(cfg.periodFrom && cfg.periodTo) return;
  let minYM=null, maxYM=null;
  function consider(ym){ if(!ym) return; if(minYM==null||ym<minYM) minYM=ym; if(maxYM==null||ym>maxYM) maxYM=ym; }
  Store.transactions.forEach(t=>{
    if(t.type==="Transfer") return;
    const tr = t.transform;
    if(!tr || tr.mode==="same") return;
    consider(tr.mode==="month" ? (tr.year+"-"+U.pad2(tr.month+1)) : (tr.year+"-12"));
  });
  ["moi","conjoint"].forEach(p=>{
    (cfg[p].lines||[]).forEach(l=>{
      if(l.type==="manual" && l.values) Object.keys(l.values).forEach(consider);
    });
  });
  Object.keys(Store.settings.budget.salaryEntries||{}).forEach(ym=>{
    const e = Store.settings.budget.salaryEntries[ym];
    if(e && e.femme!=null) consider(ym);
  });
  const now = new Date();
  const nowYM = now.getFullYear()+"-"+U.pad2(now.getMonth()+1);

/* Index des transactions récurrentes (cf. AGG.buildRecurringIndex, onglet Récurrent), borné à la période

   du picker qui les propose. */
function revRecurringIndex(){
  const cfg = revCfg();
  const groupSet = (cfg.groupFilter && cfg.groupFilter.length) ? new Set(cfg.groupFilter) : null;
  return AGG.buildRecurringIndex(cfg.periodFrom, cfg.periodTo, groupSet);
}
function revRecurringSectionFor(index, categorie){ return index.sections.find(s=>s.key===categorie) || null; }
function revRecurringItemFor(index, categorie, label){
  const sec = revRecurringSectionFor(index, categorie);
  if(!sec) return null;
  return sec.items.find(it=>it.label===label) || null;
}

function revMonthsInRange(from, to){
  const [fy,fm] = from.split("-").map(Number);
  const [ty,tm] = to.split("-").map(Number);
  const arr=[]; let y=fy,m=fm,guard=0;
  while((y<ty || (y===ty&&m<=tm)) && guard<1200){ arr.push(y+"-"+U.pad2(m)); m++; if(m>12){m=1;y++;} guard++; }
  return arr;
}
function revYearsList(){
  const cfg = revCfg();
  const fy = Number(cfg.periodFrom.split("-")[0]), ty = Number(cfg.periodTo.split("-")[0]);
  const years=[]; for(let y=fy;y<=ty;y++) years.push(y); return years;
}

/* Valeur d'une ligne pour un mois donné ("YYYY-MM", mois calculé) :

     automatique et bidirectionnelle avec l'onglet Budget (cf. openRevValueEditor pour l'écriture)
   - récurrent : montant agrégé des transactions dont la Remarque porte le suffixe YY-MM, retrouvées via
     l'item (line.recurCategorie + line.recurLabel) dans l'index récurrent. La catégorie récurrente source
     est portée par la ligne elle-même (pas déduite de son emplacement) : ça permet à une ligne de transfert
     — qui n'a pas de "catégorie" parente — d'être aussi reliée à une transaction récurrente. */
function revLineMonthValue(line, ym, recIndex){
  if(line.type==="manual") return (line.values && line.values[ym]) || 0;
  if(line.type==="budgetSalary"){
    const e = (Store.settings.budget.salaryEntries||{})[ym];
    return (e && e.femme!=null) ? Number(e.femme) : 0;
  }
  const item = revRecurringItemFor(recIndex, line.recurCategorie, line.recurLabel);
  return item ? (item.values.get(ym)||0) : 0;
}
/* Montant "année" (suffixe YYYY seul, non réparti sur les mois — cf. buildRecurringIndex) : uniquement
   pertinent pour les lignes récurrentes, affiché dans la colonne spéciale après décembre (comme Récurrent). */
function revLineYearLump(line, year, recIndex){
  if(line.type!=="recurring") return 0;
  const item = revRecurringItemFor(recIndex, line.recurCategorie, line.recurLabel);
  return item ? (item.yearValues.get(String(year))||0) : 0;
}
/* Signe : multiplicateur +1/-1 propre à chaque ligne (surtout utile pour une ligne "récurrent", dont le
   montant est importé tel quel des transactions — permet de l'inverser sans devoir le faire à la source). */
function revLineSign(line){ return line.sign===-1 ? -1 : 1; }
/* col.type: "year" (vue non zoomée, total des 12 mois + lump, borné à la période) | "month" | "lump"
   (colonne spéciale après décembre en vue zoomée) */
function revLineColValue(line, col, recIndex){
  const sign = revLineSign(line);
  if(col.type==="year"){
    const cfg = revCfg();
    let sum=0;
    for(let m=1;m<=12;m++){
      const ym = col.year+"-"+U.pad2(m);
      if(ym<cfg.periodFrom || ym>cfg.periodTo) continue;
      sum += revLineMonthValue(line, ym, recIndex);
    }
    sum += revLineYearLump(line, col.year, recIndex);
    return sign*sum;
  }
  if(col.type==="lump") return sign*revLineYearLump(line, col.year, recIndex);
  return sign*revLineMonthValue(line, col.ym, recIndex);
}
function revLineTotalValue(line, recIndex){
  const sign = revLineSign(line);
  if(line.type==="recurring"){
    const item = revRecurringItemFor(recIndex, line.recurCategorie, line.recurLabel);
    return sign*(item ? AGG.recurringItemTotal(item) : 0);
  }
  const cfg = revCfg();
  return sign*revMonthsInRange(cfg.periodFrom, cfg.periodTo).reduce((s,ym)=> s+revLineMonthValue(line,ym,recIndex), 0);
}
function revLinesColValue(lines, col, recIndex){ return (lines||[]).reduce((s,l)=> s+revLineColValue(l,col,recIndex), 0); }
function revLinesTotalValue(lines, recIndex){ return (lines||[]).reduce((s,l)=> s+revLineTotalValue(l,recIndex), 0); }

/* "Avant transfert" = somme des lignes définies par l'utilisateur (manuelles, récurrentes ou salaire
   synchronisé), à plat — plus de regroupement par catégorie intermédiaire.
   "Transfert" = addition simple de "Vers" + "Depuis" — AUCUN signe structurel par bucket : chaque ligne
   compte pour sa valeur telle qu'affichée (montant × son propre signe, revLineSign), sans qu'un bucket
   "Vers"/"Depuis" n'impose automatiquement un sens. Si une ligne doit réduire le total, c'est à l'utilisateur
   de la basculer en signe négatif (bouton ± de la sheet de gestion) — jamais une convention implicite du
   bucket.
   "Après transfert" (= Avant + Transfert) est LE total de la personne, utilisé par la ligne "Personne" et
   par le grand Total — comme les deux transferts sont des miroirs exacts l'un de l'autre (cf.
   revSyncTransferLineToMirror), la somme des deux "Après transfert" égale toujours la somme des deux
   "Avant transfert" : les transferts ne font que redistribuer, jamais varier le total du couple. */
function revPersonBeforeColValue(person, col, recIndex){ return revLinesColValue(person.lines, col, recIndex); }
function revPersonBeforeTotalValue(person, recIndex){ return revLinesTotalValue(person.lines, recIndex); }
function revPersonTransferColValue(person, col, recIndex){ return revLinesColValue(person.transferOut,col,recIndex) + revLinesColValue(person.transferIn,col,recIndex); }
function revPersonTransferTotalValue(person, recIndex){ return revLinesTotalValue(person.transferOut,recIndex) + revLinesTotalValue(person.transferIn,recIndex); }
function revPersonColValue(person, col, recIndex){ return revPersonBeforeColValue(person,col,recIndex) + revPersonTransferColValue(person,col,recIndex); }
function revPersonTotalValue(person, recIndex){ return revPersonBeforeTotalValue(person,recIndex) + revPersonTransferTotalValue(person,recIndex); }

function revDrillColumnsFor(year, recIndex){
  const cols = Array.from({length:12}, (_,m)=>({type:"month", year, month:m, ym:year+"-"+U.pad2(m+1)}));
  const hasLump = recIndex.sections.some(sec=> sec.items.some(it=> (it.yearValues.get(String(year))||0)!==0));
  if(hasLump) cols.push({type:"lump", year});
  return cols;
}

/* Transferts : "transferOut" de moi (argent envoyé) est le miroir exact de "transferIn" de conjoint
   (argent reçu), et vice-versa — cf. demande "si je rajoute quelque chose dans un transfert, mettre le
   même à l'opposé chez elle". Les deux lignes miroir partagent le même id, ce qui permet de retrouver
   l'une à partir de l'autre sans table de correspondance séparée. */
function revMirrorOf(person, bucket){
  const otherPerson = person==="moi" ? "conjoint" : "moi";
  const otherBucket = bucket==="transferOut" ? "transferIn" : "transferOut";
  return {person: otherPerson, bucket: otherBucket};
}
/* Recopie type/label et montants (manuel) ou lien récurrent d'une ligne de transfert vers sa ligne miroir
   (créée si absente). Appelée après toute création/renommage/changement de signe/édition de montant sur une
   ligne de transferOut/transferIn. Le signe, lui, est recopié INVERSÉ (pas à l'identique) : "Transfert" est
   une addition pure de Vers + Depuis (cf. revPersonTransferColValue/TotalValue, aucun signe structurel de
   bucket) — c'est ce signe par ligne, opposé d'un côté à l'autre, qui fait qu'un même transfert réduit le
   total de qui l'envoie et augmente celui de qui le reçoit. Une ligne "Vers" prend par défaut le signe -1 à
   sa création (cf. openAddTransferLineChoice), sa ligne miroir "Depuis" prend alors +1 automatiquement ici,
   et inversement — l'utilisateur reste libre de inverser l'un ou l'autre via le bouton ± de la sheet de
   gestion, la propagation au miroir restant toujours l'inverse exact de ce qui vient d'être réglé. */
function revSyncTransferLineToMirror(person, bucket, line){
  const mirror = revMirrorOf(person, bucket);
  const cfg = revCfg();
  const arr = cfg[mirror.person][mirror.bucket] = cfg[mirror.person][mirror.bucket] || [];
  let mLine = arr.find(l=>l.id===line.id);
  if(!mLine){ mLine = {id: line.id}; arr.push(mLine); }
  mLine.type = line.type;
  mLine.label = line.label;
  mLine.sign = -revLineSign(line);
  if(line.type==="recurring"){
    mLine.recurCategorie = line.recurCategorie;
    mLine.recurLabel = line.recurLabel;
    delete mLine.values;
  } else {
    mLine.values = Object.assign({}, line.values||{});
    delete mLine.recurCategorie;
    delete mLine.recurLabel;
  }
}
function revRemoveTransferLineAndMirror(person, bucket, lineId){
  const cfg = revCfg();
  cfg[person][bucket] = (cfg[person][bucket]||[]).filter(l=>l.id!==lineId);
  const mirror = revMirrorOf(person, bucket);
  cfg[mirror.person][mirror.bucket] = (cfg[mirror.person][mirror.bucket]||[]).filter(l=>l.id!==lineId);
}

/* Toutes les clés de sections repliables (hors "personne", gérée séparément) pour une personne : la
   section "Avant transfert", la section "Transfert" + ses deux sous-blocs Vers/Depuis — plus de sous-clé par
   catégorie (niveau supprimé). Utilisé à la fois pour l'initialisation "replié par défaut" et pour "Tout
   déplier/replier". */
function revAllSectionKeysFor(cfg, p){
  return [p+"::avant", p+"::transfert", p+"::transfert::transferOut", p+"::transfert::transferIn"];
}

/* ---------------- Rendu principal ---------------- */
function renderRevenus(){
  const view = document.getElementById("view-revenus");
  if(Store.transactions.length===0){
    view.innerHTML = `<div class="section" style="padding-top:14px;"><div class="empty-state">${ICONS.inbox}<h3>Aucune donnée</h3><p>Importez vos données pour voir vos revenus.</p></div></div>`;
    return;
  }
  const cfg = revCfg();
  ensureRevenusPeriod();
  const recIndex = revRecurringIndex();

  ["moi","conjoint"].forEach(p=>{
    revAllSectionKeysFor(cfg, p).forEach(key=>{
      if(!revSeenSectionKeys.has(key)){
        if(!cfg.groupsExpanded) revCollapsedSections.add(key);
        revSeenSectionKeys.add(key);
      }
    });
  });

  const cols = drillYear!=null ? revDrillColumnsFor(drillYear, recIndex) : revYearsList().map(y=>({type:"year", year:y}));
  const allExpanded = !!cfg.groupsExpanded;
  const groupFilterCount = (cfg.groupFilter||[]).length;

  const headerHtml = `
    <div class="section" style="padding-top:14px;">
      <div style="font-size:12px;color:var(--text-sub);line-height:1.4;margin:0 4px 12px;">
        Répartition des revenus entre vous deux, mois calculé. Touchez une année pour voir le détail par mois ; touchez un montant souligné pour le modifier.
      </div>
      <div style="display:flex;align-items:center;gap:6px;background:var(--card);border-radius:100px;padding:7px 8px 7px 16px;margin:0 4px 12px;box-shadow:var(--shadow-1);">
        <span style="font-size:12px;font-weight:700;color:var(--text-sub);flex:0 0 auto;">Période</span>
        <input type="month" id="rev-from" value="${cfg.periodFrom}" class="u-tab-btn">
        <span class="u-faint-fixed">→</span>
        <input type="month" id="rev-to" value="${cfg.periodTo}" class="u-tab-btn">
      </div>
      <div style="display:flex;gap:8px;margin:0 4px 12px;flex-wrap:wrap;align-items:center;">
        <button type="button" class="btn btn-ghost btn-sm" id="rev-filter-btn">${ICONS.filter} Groupes${groupFilterCount?` (${groupFilterCount})`:""}</button>
        <button type="button" class="btn btn-ghost btn-sm" id="rev-manage-btn">${ICONS.edit} Gérer</button>
        <button type="button" class="txn-view-pill" id="rev-expand-toggle" style="margin-left:auto;">
          <span style="display:flex;transform:rotate(${allExpanded?90:-90}deg);">${ICONS.arrowLeft}</span>
          <span>${allExpanded?"Tout replier":"Tout déplier"}</span>
        </button>
      </div>
      ${drillYear!=null ? `<button type="button" class="btn btn-ghost btn-sm" id="rev-back-btn" style="margin:0 4px 12px;">${ICONS.arrowLeft} Retour aux années</button>` : ""}
    </div>
  `;

  const hasAnyLine = ["moi","conjoint"].some(p=>(cfg[p].lines||[]).length || (cfg[p].transferOut||[]).length || (cfg[p].transferIn||[]).length);
  const tableHtml = hasAnyLine
    ? buildRevenusTableHtml(cfg, recIndex, cols)
    : `<div class="empty-state" style="padding:32px 20px;">${ICONS.inbox}<h3>Aucune ligne configurée</h3><p>Touchez « Gérer » pour ajouter vos premières lignes de revenus.</p></div>`;

  view.innerHTML = headerHtml + `<div class="section" style="padding-top:0;padding-left:8px;padding-right:8px;">${hasAnyLine ? `<div class="evo-table-wrap">${tableHtml}</div>` : tableHtml}</div><div style="height:10px;"></div>`;
  wireRevenus(cfg, recIndex, cols);
}

function buildRevenusTableHtml(cfg, recIndex, cols){
  const theadHtml = `
    <thead><tr>
      <th class="evo-col-label">Revenus</th>
      <th class="evo-col-total">Total</th>
      ${cols.map(c=>{
        if(c.type==="year") return `<th class="evo-col-val evo-year-header" data-year="${c.year}">${c.year}</th>`;
        if(c.type==="lump") return `<th class="evo-col-val recur-year-col">${c.year}</th>`;
        return `<th class="evo-col-val">${U.MONTHS_FR_SHORT[c.month]}</th>`;
      }).join("")}
    </tr></thead>
  `;

  const grandTotal = ["moi","conjoint"].reduce((s,p)=> s+revPersonTotalValue(cfg[p], recIndex), 0);
  const totalRowHtml = `
    <tr class="evo-total-row">
      <td class="evo-col-label">Total</td>
      <td class="evo-col-total evo-val-cell ${revValClass(grandTotal)}">${grandTotal ? revFmtVal(grandTotal) : "—"}</td>
      ${cols.map(c=>{
        const v = ["moi","conjoint"].reduce((s,p)=> s+revPersonColValue(cfg[p], c, recIndex), 0);
        return `<td class="evo-col-val evo-val-cell ${c.type==='lump'?'recur-year-col':''} ${revValClass(v)}">${v ? revFmtVal(v) : "—"}</td>`;
      }).join("")}
    </tr>
  `;

  function rowCells(valueFn){
    return cols.map(c=>{
      const v = valueFn(c);
      return `<td class="evo-col-val evo-val-cell ${c.type==='lump'?'recur-year-col':''} ${revValClass(v)}">${v ? revFmtVal(v) : "—"}</td>`;
    }).join("");
  }
  function lineRowHtml(line, person, secKey, hidden, indent){
    const lTotal = revLineTotalValue(line, recIndex);
    const editable = line.type!=="recurring";
    const lCells = cols.map(c=>{
      const v = revLineColValue(line, c, recIndex);
      const canEdit = editable && (c.type==="month" || c.type==="year");
      const attrs = canEdit
        ? (c.type==="year"
            ? `data-edit-line="${U.escHtml(line.id)}" data-edit-person="${person}" data-edit-year="${c.year}"`
            : `data-edit-line="${U.escHtml(line.id)}" data-edit-person="${person}" data-edit-ym="${c.ym}"`)
        : "";
      return `<td class="evo-col-val evo-val-cell ${c.type==='lump'?'recur-year-col':''} ${canEdit?'rev-editable':''} ${revValClass(v)}" ${attrs}>${v ? revFmtVal(v) : "—"}</td>`;
    }).join("");
    const typeLabel = line.type==="recurring" ? " · récurrent" : (line.type==="budgetSalary" ? " · budget" : "");
    const signLabel = revLineSign(line)===-1 ? ` <span style="color:var(--expense);">(signe −)</span>` : "";
    return `
    <tr class="evo-item-row${hidden?' hidden':''}" data-sec-key="${U.escHtml(secKey)}">
      <td class="evo-col-label" style="padding-left:${indent}px;font-size:12px;">${U.escHtml(line.label)}<span style="color:var(--text-faint);">${typeLabel}</span>${signLabel}</td>
      <td class="evo-col-total evo-val-cell ${revValClass(lTotal)}">${lTotal ? revFmtVal(lTotal) : "—"}</td>
      ${lCells}
    </tr>`;
  }

  const personRows = ["moi","conjoint"].map(p=>{
    const person = cfg[p];
    const pTotal = revPersonTotalValue(person, recIndex);
    const pCollapsed = revCollapsedPersons.has(p);
    const pRow = `
      <tr class="evo-section-row rev-person-row" data-person-toggle="${p}">
        <td class="evo-col-label"><span class="evo-chev ${pCollapsed?'':'open'}">▸</span>${U.escHtml(REV_PERSON_LABEL[p])}</td>
        <td class="evo-col-total evo-val-cell ${revValClass(pTotal)}">${pTotal ? revFmtVal(pTotal) : "—"}</td>
        ${rowCells(c=> revPersonColValue(person, c, recIndex))}
      </tr>
    `;

    // "Avant transfert" — un seul niveau d'indentation pour tout ce qui n'est pas la personne (format
    // compact façon Récurrent : pas de retrait supplémentaire par ligne) ; ses lignes (manuelles,
    // récurrentes ou salaire synchronisé) apparaissent directement dessous, sans regroupement par catégorie.
    const avantKey = p+"::avant";
    const avantCollapsed = revCollapsedSections.has(avantKey);
    const avantTotal = revPersonBeforeTotalValue(person, recIndex);
    const avantRow = `
      <tr class="evo-section-row rev-cat-row${pCollapsed?' hidden':''}" data-sec-toggle="${U.escHtml(avantKey)}">
        <td class="evo-col-label" style="padding-left:22px;"><span class="evo-chev ${avantCollapsed?'':'open'}">▸</span>Avant transfert</td>
        <td class="evo-col-total evo-val-cell ${revValClass(avantTotal)}">${avantTotal ? revFmtVal(avantTotal) : "—"}</td>
        ${rowCells(c=> revPersonBeforeColValue(person,c,recIndex))}
      </tr>
    `;
    const avantHidden = pCollapsed || avantCollapsed;
    const avantLineRows = (person.lines||[]).map(line=> lineRowHtml(line, p, avantKey, avantHidden, 22)).join("");

    // "Transfert" (net) + sous-blocs "Vers"/"Depuis" — même indentation unique que ci-dessus.
    const transKey = p+"::transfert";
    const transCollapsed = revCollapsedSections.has(transKey);
    const transTotal = revPersonTransferTotalValue(person, recIndex);
    const transHidden = pCollapsed || transCollapsed;
    const transRow = `
      <tr class="evo-section-row rev-cat-row${pCollapsed?' hidden':''}" data-sec-toggle="${U.escHtml(transKey)}">
        <td class="evo-col-label" style="padding-left:22px;"><span class="evo-chev ${transCollapsed?'':'open'}">▸</span>Transfert</td>
        <td class="evo-col-total evo-val-cell ${revValClass(transTotal)}">${transTotal ? revFmtVal(transTotal) : "—"}</td>
        ${rowCells(c=> revPersonTransferColValue(person,c,recIndex))}
      </tr>
    `;
    const otherLabel = REV_PERSON_LABEL[p==="moi"?"conjoint":"moi"];
    function bucketBlock(bucket, label){
      const bucketKey = transKey+"::"+bucket;
      const bucketCollapsed = revCollapsedSections.has(bucketKey);
      const lines = person[bucket]||[];
      const bucketTotal = revLinesTotalValue(lines, recIndex);
      const bucketRow = `
        <tr class="evo-section-row rev-cat-row${transHidden?' hidden':''}" data-sec-toggle="${U.escHtml(bucketKey)}">
          <td class="evo-col-label" style="padding-left:22px;"><span class="evo-chev ${bucketCollapsed?'':'open'}">▸</span>${U.escHtml(label)}</td>
          <td class="evo-col-total evo-val-cell ${revValClass(bucketTotal)}">${bucketTotal ? revFmtVal(bucketTotal) : "—"}</td>
          ${rowCells(c=> revLinesColValue(lines,c,recIndex))}
        </tr>
      `;
      const lineHidden = transHidden || bucketCollapsed;
      const lineRows = lines.map(line=> lineRowHtml(line, p, bucketKey, lineHidden, 22)).join("");
      return bucketRow + lineRows;
    }
    const versBlock = bucketBlock("transferOut", "Vers "+otherLabel);
    const depuisBlock = bucketBlock("transferIn", "Depuis "+otherLabel);

    return pRow + avantRow + avantLineRows + transRow + versBlock + depuisBlock;
  }).join("");

  return `<table class="evo-table">${theadHtml}<tbody>${totalRowHtml}${personRows}</tbody></table>`;
}

function wireRevenus(cfg, recIndex, cols){
  const tableWrap = document.querySelector("#view-revenus .evo-table-wrap");
  if(tableWrap) U.enableDragScroll(tableWrap);

  const fromInput = document.getElementById("rev-from");
  const toInput = document.getElementById("rev-to");
  if(fromInput) fromInput.onchange = (e)=>{
    cfg.periodFrom = e.target.value || cfg.periodFrom;
    if(cfg.periodFrom>cfg.periodTo) cfg.periodTo = cfg.periodFrom;
    Store.saveSettings();
    drillYear = null;
    renderRevenus();
  };
  if(toInput) toInput.onchange = (e)=>{
    cfg.periodTo = e.target.value || cfg.periodTo;
    if(cfg.periodTo<cfg.periodFrom) cfg.periodFrom = cfg.periodTo;
    Store.saveSettings();
    drillYear = null;
    renderRevenus();
  };

  const backBtn = document.getElementById("rev-back-btn");
  if(backBtn) backBtn.onclick = ()=>{ drillYear = null; renderRevenus(); };

  const filterBtn = document.getElementById("rev-filter-btn");
  if(filterBtn) filterBtn.onclick = ()=> openRevFilterSheet();

  const manageBtn = document.getElementById("rev-manage-btn");
  if(manageBtn) manageBtn.onclick = ()=> openRevManager();

  const expandToggle = document.getElementById("rev-expand-toggle");
  if(expandToggle) expandToggle.onclick = ()=>{
    cfg.groupsExpanded = !cfg.groupsExpanded;
    Store.saveSettings();
    const allKeys = [];
    ["moi","conjoint"].forEach(p=> allKeys.push(...revAllSectionKeysFor(cfg, p)));
    if(cfg.groupsExpanded) allKeys.forEach(k=>revCollapsedSections.delete(k));
    else allKeys.forEach(k=>revCollapsedSections.add(k));
    renderRevenus();
  };

  document.querySelectorAll(".evo-year-header[data-year]").forEach(el=>{
    el.onclick = ()=>{ drillYear = Number(el.dataset.year); renderRevenus(); };
  });

  document.querySelectorAll("[data-person-toggle]").forEach(row=>{
    row.querySelector(".evo-col-label").onclick = ()=>{
      const p = row.dataset.personToggle;
      if(revCollapsedPersons.has(p)) revCollapsedPersons.delete(p); else revCollapsedPersons.add(p);
      renderRevenus();
    };
  });
  document.querySelectorAll("[data-sec-toggle]").forEach(row=>{
    row.querySelector(".evo-col-label").onclick = ()=>{
      const key = row.dataset.secToggle;
      if(revCollapsedSections.has(key)) revCollapsedSections.delete(key); else revCollapsedSections.add(key);
      renderRevenus();
    };
  });

  document.querySelectorAll(".rev-editable[data-edit-line]").forEach(el=>{
    el.onclick = ()=>{
      if(el.dataset.editYear!=null) openRevYearEditor(el.dataset.editPerson, el.dataset.editLine, Number(el.dataset.editYear));
      else openRevValueEditor(el.dataset.editPerson, el.dataset.editLine, el.dataset.editYm);
    };
  });
}

/* Clic sur le total annuel (vue non zoomée) : modale listant les 12 mois de l'année pour tout saisir
   d'un coup, sans avoir à zoomer puis toucher chaque mois individuellement. */
function openRevYearEditor(person, lineId, year){
  const found = findRevLine(person, lineId);
  if(!found) return;
  const line = found.line;
  const modal = document.getElementById("modal-confirm");
  function currentFor(ym){
    if(line.type==="budgetSalary"){
      const e = (Store.settings.budget.salaryEntries||{})[ym];
      return (e && e.femme!=null) ? e.femme : "";
    }
    return (line.values && line.values[ym]!=null) ? line.values[ym] : "";
  }
  const months = Array.from({length:12},(_,m)=> year+"-"+U.pad2(m+1));
  const rowsHtml = months.map((ym,i)=>{
    const val = currentFor(ym);
    return `
    <div class="detail-row" style="align-items:center;gap:8px;flex-wrap:nowrap;padding:7px 0;">
      <span style="flex:0 0 70px;font-size:12.5px;font-weight:600;">${U.MONTHS_FR[i]}</span>
      <input type="number" step="0.01" inputmode="decimal" class="search-mini rye-input" data-ym="${ym}" placeholder="0,00" value="${val!==""?val:""}" style="flex:1;min-width:0;margin:0;">
    </div>`;
  }).join("");
  modal.innerHTML = `
    <div style="font-weight:800;font-size:16.5px;margin-bottom:4px;">${U.escHtml(line.label)}</div>
    <div style="font-size:12.5px;color:var(--text-sub);margin-bottom:12px;">${year} · un mois par ligne, laisser vide pour 0</div>
    <div style="max-height:52vh;overflow-y:auto;">${rowsHtml}</div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button type="button" class="btn btn-ghost" style="flex:1;justify-content:center;" id="rye-cancel">Annuler</button>
      <button type="button" class="btn btn-primary" style="flex:1;justify-content:center;" id="rye-save">Enregistrer</button>
    </div>
  `;
  document.getElementById("rye-cancel").onclick = ()=>APP.closeOverlay("overlay-confirm");
  document.getElementById("rye-save").onclick = ()=>{
    modal.querySelectorAll(".rye-input").forEach(input=>{
      const ym = input.dataset.ym;
      const num = (input.value==null||input.value==="") ? 0 : Number(input.value);
      if(line.type==="budgetSalary"){
        Store.settings.budget.salaryEntries = Store.settings.budget.salaryEntries || {};
        const cur = Object.assign({}, Store.settings.budget.salaryEntries[ym]);
        cur.femme = num;
        Store.settings.budget.salaryEntries[ym] = cur;
      } else {
        line.values = line.values || {};
        if(num) line.values[ym] = num; else delete line.values[ym];
      }
    });
    if(line.type!=="budgetSalary" && (found.location==="transferOut" || found.location==="transferIn")){
      revSyncTransferLineToMirror(person, found.location, line);
    }
    Store.saveSettings();
    APP.closeOverlay("overlay-confirm");
    renderRevenus();
  };
  APP.openOverlay("overlay-confirm");
}
function findRevLine(person, lineId){
  const cfg = revCfg();
  const line = (cfg[person].lines||[]).find(l=>l.id===lineId);
  if(line) return {location:"lines", line};
  for(const bucket of ["transferOut","transferIn"]){
    const l2 = (cfg[person][bucket]||[]).find(l=>l.id===lineId);
    if(l2) return {location:bucket, line:l2};
  }
  return null;
}
/* Édition d'une cellule mensuelle. Pour une ligne "budgetSalary", écrit DIRECTEMENT dans
   Store.settings.budget.salaryEntries[ym].femme (même source que l'onglet Budget) — c'est ce qui assure la
   synchronisation bidirectionnelle sans duplication de données. Pour une ligne de transfert (transferOut/
   transferIn), répercute aussi la saisie sur sa ligne miroir chez l'autre personne (cf.
   revSyncTransferLineToMirror) — c'est ce qui assure "même chose à l'opposé".*/
function openRevValueEditor(person, lineId, ym){
  const found = findRevLine(person, lineId);
  if(!found) return;
  const line = found.line;
  const [y,m] = ym.split("-").map(Number);
  const label = line.label + " · " + U.MONTHS_FR[m-1] + " " + y;
  let current;
  if(line.type==="budgetSalary"){
    const e = (Store.settings.budget.salaryEntries||{})[ym];
    current = (e && e.femme!=null) ? e.femme : "";
  } else {
    current = (line.values && line.values[ym]!=null) ? line.values[ym] : "";
  }
  PICKER.openInlineEditor({
    title: label, inputType:"number", value: current, placeholder:"0,00",
    onSave: (val)=>{
      const num = (val==null||val==="") ? 0 : Number(val);
      if(line.type==="budgetSalary"){
        Store.settings.budget.salaryEntries = Store.settings.budget.salaryEntries || {};
        const cur = Object.assign({}, Store.settings.budget.salaryEntries[ym]);
        cur.femme = num;
        Store.settings.budget.salaryEntries[ym] = cur;
      } else {
        line.values = line.values || {};
        if(num) line.values[ym] = num; else delete line.values[ym];
        if(found.location==="transferOut" || found.location==="transferIn"){
          revSyncTransferLineToMirror(person, found.location, line);
        }
      }
      Store.saveSettings();
      renderRevenus();
    }
  });
}

/* ---------------- Filtre par groupe ---------------- */
function openRevFilterSheet(){

function renderRevFilterSheet(){
  const sheet = document.getElementById("sheet-revfilter");
  const cfg = revCfg();
  const {sections, flat, preSorted} = AGG.groupeHierarchyChrono(Store.transactions);
  const sectionNames = preSorted ? Array.from(sections.keys()) : Array.from(sections.keys()).sort((a,b)=>a.localeCompare(b,'fr'));
  const flatSorted = flat.slice().sort((a,b)=>a.base.localeCompare(b.base,'fr'));
  const selected = new Set(cfg.groupFilter||[]);
  const hasAny = sectionNames.length>0 || flatSorted.length>0;

  function sectionHtml(sup){
    const children = sections.get(sup);
    const totalCount = children.reduce((s,c)=>s+c.count,0);
    return `<div class="groupe-section" data-super="${U.escHtml(sup)}">
      <div class="check-item groupe-section-head ${selected.has(sup)?'selected':''}" data-val="${U.escHtml(sup)}">
        <span class="cbox">${ICONS.check}</span>
        <span class="lbl" style="font-weight:800;">${U.escHtml(sup)}</span>
        <span class="cnt">${totalCount}</span>
      </div>
      <div class="groupe-section-children">
        ${children.map(c=>`
          <div class="check-item groupe-child-item ${selected.has(c.base)?'selected':''}" data-val="${U.escHtml(c.base)}" data-childname="${U.escHtml(c.base)}">
            <span class="cbox">${ICONS.check}</span>
            <span class="lbl">${U.escHtml(c.base)}</span>
            <span class="cnt">${c.count}</span>
          </div>
        `).join("")}
      </div>
    </div>`;
  }
  const flatHtml = flatSorted.map(f=>`
    <div class="check-item groupe-flat-item ${selected.has(f.base)?'selected':''}" data-val="${U.escHtml(f.base)}">
      <span class="cbox">${ICONS.check}</span>
      <span class="lbl">${U.escHtml(f.base)}</span><span class="cnt">${f.count}</span>
    </div>
  `).join("");

  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h2>Filtrer par groupe</h2><button class="icon-btn" id="revfilter-close">${ICONS.close}</button></div>
    <div class="sheet-body">
      <div style="font-size:12px;color:var(--text-sub);margin-bottom:10px;">Limite les lignes reliées à des transactions récurrentes à ces groupes. Aucune sélection = tous les groupes.</div>
      ${!hasAny ? `<div style="padding:10px;color:var(--text-faint);font-size:13px;">Aucun groupe disponible</div>` : `
      <input type="text" class="search-mini" id="revfilter-search" placeholder="Rechercher…">
      <div class="check-list" style="max-height:none;" id="revfilter-list">
        ${sectionNames.map(sectionHtml).join("")}
        ${flatHtml}
      </div>`}
    </div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" id="revfilter-reset">Réinitialiser</button>
      <button class="btn btn-primary" id="revfilter-apply">Voir les résultats</button>
    </div>
  `;
  document.getElementById("revfilter-close").onclick = ()=>APP.closeOverlay("overlay-revfilter");
  document.querySelectorAll("#revfilter-list .check-item[data-val]").forEach(el=>{
    el.onclick = ()=>{
      const val = el.dataset.val;
      if(selected.has(val)) selected.delete(val); else selected.add(val);
      el.classList.toggle("selected");
    };
  });
  const search = document.getElementById("revfilter-search");
  if(search){
    search.oninput = ()=>{
      const q = U.normalize(search.value);
      document.querySelectorAll("#revfilter-list .groupe-section").forEach(sec=>{
        const supMatch = U.normalize(sec.dataset.super).includes(q);
        let anyChildMatch = false;
        sec.querySelectorAll(".groupe-child-item").forEach(ch=>{
          const match = !q || U.normalize(ch.dataset.childname).includes(q);
          ch.style.display = match ? "flex" : "none";
          if(match) anyChildMatch = true;
        });
        sec.style.display = (!q || supMatch || anyChildMatch) ? "" : "none";
      });
      document.querySelectorAll("#revfilter-list .groupe-flat-item").forEach(el=>{
        const match = !q || U.normalize(el.dataset.val).includes(q);
        el.style.display = match ? "flex" : "none";
      });
    };
  }
  document.getElementById("revfilter-reset").onclick = ()=>{
    cfg.groupFilter = [];
    Store.saveSettings();
    APP.closeOverlay("overlay-revfilter");
    renderRevenus();
  };
  document.getElementById("revfilter-apply").onclick = ()=>{
    cfg.groupFilter = Array.from(selected);
    Store.saveSettings();
    APP.closeOverlay("overlay-revfilter");
    renderRevenus();
  };
}

/* Sélection d'une transaction récurrente à relier à une ligne (lignes "Avant transfert" à plat ou bucket de
   transfert, aucun des deux n'ayant de catégorie propre) : demande d'abord la catégorie récurrente source,
   puis l'élément. onPick(recurCategorie, label) reçoit le choix final. */
function pickRecurringTransaction(onPick){
  const recIndex = revRecurringIndex();
  function pickItemIn(categorie){
    const sec = revRecurringSectionFor(recIndex, categorie);
    if(!sec || !sec.items.length){
      APP.showToast("Aucune transaction récurrente dans « "+categorie+" » sur la période sélectionnée");
      return;
    }
    PICKER.openPicker({
      title: "Choisir une transaction récurrente",
      options: sec.items.map(it=>it.label),
      noEmpty: true,
      onSelect: (label)=>{ if(label) onPick(categorie, label); }
    });
  }
  if(!recIndex.sections.length){
    APP.showToast("Aucune transaction récurrente sur la période sélectionnée");
    return;
  }
  PICKER.openPicker({
    title: "Choisir une catégorie",
    options: recIndex.sections.map(s=>s.key),
    noEmpty: true,
    onSelect: (categorie)=>{ if(categorie) pickItemIn(categorie); }
  });
}

function wireRevManager(){
  const cfg = revCfg();
  const person = cfg[mgrPerson];

  document.querySelectorAll("#revmgr-person-seg button").forEach(b=>{
    b.onclick = ()=>{ mgrPerson = b.dataset.p; renderRevManager(); };
  });

  const addLineBtn = document.getElementById("revmgr-add-line");
  if(addLineBtn) addLineBtn.onclick = ()=> openAddLineChoice(mgrPerson);

  document.querySelectorAll("[data-line-del]").forEach(btn=>{
    btn.onclick = ()=>{
      const lineId = btn.dataset.lineDel;
      APP.confirmAction({
        title: "Supprimer cette ligne ?",
        onConfirm: ()=>{
          person.lines = (person.lines||[]).filter(l=>l.id!==lineId);
          Store.saveSettings();
          renderRevManager();
        }
      });
    };
  });
  document.querySelectorAll("[data-line-rename]").forEach(btn=>{
    btn.onclick = ()=>{
      const lineId = btn.dataset.lineRename;
      const target = (person.lines||[]).find(l=>l.id===lineId);
      if(!target) return;
      PICKER.openInlineEditor({
        title: "Nom de la ligne", inputType:"text", value: target.label, placeholder:"Nom",
        onSave: (val)=>{
          const name = String(val||"").trim();
          if(!name) return;
          target.label = name;
          Store.saveSettings();
          renderRevManager();
        }
      });
    };
  });
  function moveLine(lineId, dir){
    const arr = person.lines||[];
    const i = arr.findIndex(l=>l.id===lineId);
    if(i<0) return;
    const j = i+dir;
    if(j<0 || j>=arr.length) return;
    const tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
    Store.saveSettings();
    renderRevManager();
  }
  document.querySelectorAll("[data-line-up]").forEach(btn=>{ btn.onclick = ()=> moveLine(btn.dataset.lineUp, -1); });
  document.querySelectorAll("[data-line-down]").forEach(btn=>{ btn.onclick = ()=> moveLine(btn.dataset.lineDown, 1); });
  document.querySelectorAll("[data-line-sign]").forEach(btn=>{
    btn.onclick = ()=>{
      const lineId = btn.dataset.lineSign;
      const target = (person.lines||[]).find(l=>l.id===lineId);
      if(!target) return;
      target.sign = revLineSign(target)===-1 ? 1 : -1;
      Store.saveSettings();
      renderRevManager();
    };
  });

  document.querySelectorAll("[data-add-transfer-line]").forEach(btn=>{
    btn.onclick = ()=> openAddTransferLineChoice(mgrPerson, btn.dataset.addTransferLine);
  });
  document.querySelectorAll("[data-tline-rename]").forEach(btn=>{
    btn.onclick = ()=>{
      const bucket = btn.dataset.tlineBucket;
      const lineId = btn.dataset.tlineRename;
      const line = (person[bucket]||[]).find(l=>l.id===lineId);
      if(!line) return;
      PICKER.openInlineEditor({
        title:"Nom de la ligne", inputType:"text", value:line.label, placeholder:"Nom",
        onSave: (val)=>{
          const name = String(val||"").trim();

window.__SF_REVENUS = {buildParamsPayloadPart(){

  if(mode==="replace" || isEmpty){

  });
  flat.sort((a,b)=>a.base.localeCompare(b.base,'fr'));

    // Les éléments non rattachés à un groupe sont regroupés sous un en-tête "Sans type" dédié,
    // cliquable comme les autres en-têtes pour tout sélectionner/désélectionner en bloc — il n'existe

    // des éléments qu'il contient (cf. wireNestedFilter → data-notypehead).
    const totalCount = flat.reduce((s,f)=>s+f.count,0);
    const allSelected = flat.every(f=>filterSet.has(f.base));
    html += `<div class="groupe-section" data-super="${U.escHtml(cfg.noGroupLabel)}">
      <div class="check-item groupe-section-head ${allSelected?'selected':''}" data-notypehead="1">
        <span class="cbox">${ICONS.check}</span>
        <span class="lbl" style="font-weight:800;">${U.escHtml(cfg.noGroupLabel)}</span>
        <span class="cnt">${totalCount}</span>

      <div class="groupe-section-children">
        ${flat.map(f=>`
          <div class="check-item groupe-child-item ${filterSet.has(f.base)?'selected':''}" data-val="${U.escHtml(f.base)}" data-childname="${U.escHtml(f.base)}">
            <span class="cbox">${ICONS.check}</span>
            <span class="lbl">${U.escHtml(f.base)}</span>
            <span class="cnt">${f.count}</span>
          </div>
        `).join("")}
      </div>

  } else {
    flat.forEach(f=>{

        <span class="cbox">${ICONS.check}</span>

function wireNestedFilter(kind){
  const cfg = NESTED_DIM_CONFIG[kind];
  const filterSet = F[kind];
  const list = document.getElementById(cfg.listId);
  if(!list) return;
  list.querySelectorAll(".check-item").forEach(el=>{
    el.onclick = ()=>{
      const val = el.dataset.val;
      if(filterSet.has(val)) filterSet.delete(val); else filterSet.add(val);
      el.classList.toggle("selected");
      F.persist();
      updateApplyButton();
    };
  });
  // En-tête "Sans type" : bascule en bloc tous les éléments non rattachés (cf. commentaire dans nestedFilterHtml).
  list.querySelectorAll("[data-notypehead]").forEach(head=>{
    head.onclick = ()=>{
      const section = head.closest(".groupe-section");
      const children = Array.from(section.querySelectorAll(".groupe-child-item"));
      const allSelected = children.length>0 && children.every(c=>filterSet.has(c.dataset.val));
      children.forEach(c=>{
        if(allSelected) filterSet.delete(c.dataset.val); else filterSet.add(c.dataset.val);
        c.classList.toggle("selected", !allSelected);
      });
      head.classList.toggle("selected", !allSelected);
      F.persist();
      updateApplyButton();
    };
  });
  const search = document.getElementById(cfg.searchId);
  if(search){
    search.oninput = ()=>{
      const q = U.normalize(search.value);
      list.querySelectorAll(".groupe-section").forEach(sec=>{
        const supMatch = U.normalize(sec.dataset.super).includes(q);
        let anyChildMatch = false;
        sec.querySelectorAll(".groupe-child-item").forEach(ch=>{
          const match = !q || U.normalize(ch.dataset.childname).includes(q);
          ch.style.display = match ? "flex" : "none";
          if(match) anyChildMatch = true;
        });
        sec.style.display = (!q || supMatch || anyChildMatch) ? "" : "none";
      });
      list.querySelectorAll(".groupe-flat-item").forEach(el=>{
        const match = !q || U.normalize(el.dataset.val).includes(q);
        el.style.display = match ? "flex" : "none";
      });
    };
  }
}

function handleFile(file){
  const statusEl = document.getElementById("import-status");
  statusEl.innerHTML = `<div style="text-align:center;color:var(--text-sub);font-size:13.5px;padding:14px;">Analyse du fichier…</div>`;
  const name = file.name.toLowerCase();
  if(name.endsWith(".json")){
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const obj = JSON.parse(e.target.result);
        const rawArr = Array.isArray(obj) ? obj : (obj.transactions || []);
        const txns = rawArr.map(t=>({...t, date:new Date(t.date)})).filter(t=>t.date && !isNaN(t.date));
        const params = (!Array.isArray(obj) && obj.params) ? obj.params : null;
        const santeItems = (!Array.isArray(obj) && Array.isArray(obj.santeItems)) ? obj.santeItems : null;
        const santeSettings = (!Array.isArray(obj) && obj.santeSettings) ? obj.santeSettings : null;
        parsedResult = {txns, skipped: rawArr.length-txns.length, total: rawArr.length, fileName: file.name, params, santeItems, santeSettings};
        renderImportSummary();
      }catch(err){
        statusEl.innerHTML = `<div style="color:var(--expense);font-size:13.5px;padding:10px;">Fichier JSON invalide : ${U.escHtml(err.message)}</div>`;
      }
    };
    reader.readAsText(file);
    return;
  }
  DATA.parseFile(file).then(res=>{
    parsedResult = {...res, fileName: file.name};
    proceedAfterParse();
  }).catch(err=>{
    statusEl.innerHTML = `<div style="color:var(--expense);font-size:13.5px;padding:10px;">Impossible de lire ce fichier : ${U.escHtml(err.message)}</div>`;
  });
}

/* Après analyse d'un fichier Excel/CSV : si des données existent déjà, aligne automatiquement les valeurs
   ne différant que par la casse/accents (Catégorie/Personne/Compte/Groupe) et détecte les valeurs
   véritablement nouvelles. S'il y en a, propose de les valider ou de les faire correspondre à un élément
   existant avant de continuer. Sans données existantes (premier import), tout serait "nouveau" par
   définition : on saute directement au résumé habituel. */
function proceedAfterParse(){
  if(Store.transactions.length>0 && parsedResult.txns && parsedResult.txns.length){
    const reconcile = DATA.buildReconciliation(parsedResult.txns);
    parsedResult.reconcile = reconcile;
    if(reconcile.newValues.length>0){ renderImportReconcile(); return; }
  }
  renderImportSummary();
}

function mergeRuleList(existing, incoming, sigFn){
  const existingSigs = new Set(existing.map(sigFn));
  let added = 0;
  incoming.forEach(r=>{
    const s = sigFn(r);
    if(!existingSigs.has(s)){ existing.push(r); existingSigs.add(s); added++; }
  });
  return added;
}

function applyParamsImport(params, mode){
  if(!params) return {rulesAdded:0, personRulesAdded:0, acctAdded:0};
  const groupRules = params.groupRules || [];
  const personRules = params.personRules || [];
  const accountTypes = params.accountTypes || {};
  const accountAcronyms = params.accountAcronyms || {};
  const accountTypeOrder = params.accountTypeOrder || [];
  const customBalances = params.customBalances || [];
  const decimalsImported = params.decimals;
  const groupKind = params.groupKind || {};
  const groupVoyageMonth = params.groupVoyageMonth || {};
  const groupDateRange = params.groupDateRange || {};
  const categoryTypeOverride = params.categoryTypeOverride || {};
  const budgetAdjustments = params.budgetAdjustments || [];
  const budgetSettings = params.budgetSettings || null;
  const salaryEntries = params.salaryEntries || null;
  const compareSettings = params.compareSettings || null;
  const comparePredefined = params.comparePredefined || null;
  const evolutionSettings = params.evolutionSettings || null;
  const revenus = params.revenus || null;
  const sheetsPresent = params.sheetsPresent || {};
  Store.settings.budget = Store.settings.budget || {};
  Store.settings.budget.compare = Store.settings.budget.compare || {enabled:false, mode:"period", periodFrom:null, periodTo:null, predefined:{}};
  Store.settings.evolution = Store.settings.evolution || {};
  if(!Store.settings.evolution.merges) Store.settings.evolution.merges = {};
  if(mode==="replace"){
    // Import "Remplacer" ciblé par onglet (Excel) : un onglet absent du classeur importé laisse le réglage
    // correspondant intact au lieu de le vider — seuls les onglets réellement présents écrasent l'existant.
    // Une sauvegarde JSON ou une synchro Gist n'a pas cette notion de "feuille absente" (pas de
    // sheetsPresent) et s'applique donc toujours intégralement.
    if(!params.sheetsPresent || sheetsPresent.parametres){
      Store.settings.groupAliasRules = groupRules.slice();
      Store.settings.personAliasRules = personRules.slice();
      Store.settings.accountTypes = Object.assign({}, accountTypes);
      Store.settings.accountAcronyms = Object.assign({}, accountAcronyms);
      Store.settings.groupKind = Object.assign({}, groupKind);
      Store.settings.groupVoyageMonth = Object.assign({}, groupVoyageMonth);
      Store.settings.groupDateRange = Object.assign({}, groupDateRange);
      Store.settings.categoryTypeOverride = Object.assign({}, categoryTypeOverride);
    }
    // Ordre des types de compte, décimales, soldes personnalisés : n'existent plus dans aucun onglet Excel
    // (Reglages_Generaux / Comptes_Soldes_Perso supprimés, § simplification Excel) — gérés uniquement via
    // JSON/Gist désormais, jamais touchés par un import Excel.
    if(!params.sheetsPresent){
      Store.settings.accountTypeOrder = accountTypeOrder.slice();
      if(decimalsImported===2 || decimalsImported===0) Store.settings.decimals = decimalsImported;
      Store.settings.customBalances = customBalances.map(cb=>({title: cb.title || "", accounts: (cb.accounts||[]).slice()}));
    }
    if(!params.sheetsPresent || sheetsPresent.budget){
      Store.settings.budget.adjustments = budgetAdjustments.slice();

    if(budgetSettings){
      // Ce bloc n'est plus jamais déclenché par un import Excel — l'onglet Budget_Reglages a été
      // entièrement supprimé (§ simplification Excel), Store.settings.budget n'est donc plus modifiable

      // budgetSettings). periodFrom/periodTo/mode/scope gardent leur repli sur la valeur actuelle si
      // absents de l'import, par cohérence avec le reste de ce bloc.
      Object.assign(Store.settings.budget, {
        mode: budgetSettings.mode || Store.settings.budget.mode,
        scope: budgetSettings.scope || Store.settings.budget.scope,
        startMonth: budgetSettings.startMonth,
        endMonth: budgetSettings.endMonth,
        mainGroup: budgetSettings.mainGroup,
        extraGroups: (budgetSettings.extraGroups || []).slice(),

        periodFrom: budgetSettings.periodFrom || Store.settings.budget.periodFrom,

        periodTo: compareSettings.periodTo || null,
        predefined: Object.assign({}, comparePredefined || {})
      };
    } else if(comparePredefined){

    }
    if(evolutionSettings){
      if(evolutionSettings.view) Store.settings.evolution.view = evolutionSettings.view;
      if(evolutionSettings.monthBasis) Store.settings.evolution.monthBasis = evolutionSettings.monthBasis;
      // Fusions de sections Évolution : n'existent plus dans aucun onglet Excel (Evolution_Fusions
      // supprimé), gérées uniquement via JSON/Gist désormais.
      if(!params.sheetsPresent && evolutionSettings.merges){
        Store.settings.evolution.merges = {

          categorie: (evolutionSettings.merges.categorie || []).slice(),
          personne: (evolutionSettings.merges.personne || []).slice(),

    if(revenus && (!params.sheetsPresent || sheetsPresent.revenus) && window.__SF_REVENUS){

    Store.normalizeSettings();

  }
  const existingGroup = Store.settings.groupAliasRules || [];
  const rulesAdded = mergeRuleList(existingGroup, groupRules, r=>[r.groupe,r.superGroupe,r.full||""].join("|"));
  Store.settings.groupAliasRules = existingGroup;

  const existingPerson = Store.settings.personAliasRules || [];

  // Ordre des types de compte / soldes personnalisés : préférences propres à un agencement d'écran —

  if((!Store.settings.accountTypeOrder || !Store.settings.accountTypeOrder.length) && accountTypeOrder.length){
    Store.settings.accountTypeOrder = accountTypeOrder.slice();
  }
  if((!Store.settings.customBalances || !Store.settings.customBalances.length) && customBalances.length){
    Store.settings.customBalances = customBalances.map(cb=>({title: cb.title || "", accounts: (cb.accounts||[]).slice()}));
  }

  Store.settings.groupKind = Object.assign({}, Store.settings.groupKind, groupKind);
  Store.settings.groupVoyageMonth = Object.assign({}, Store.settings.groupVoyageMonth, groupVoyageMonth);
  Store.settings.groupDateRange = Object.assign({}, Store.settings.groupDateRange, groupDateRange);
  Store.settings.categoryTypeOverride = Object.assign({}, Store.settings.categoryTypeOverride, categoryTypeOverride);

  // Fusions de sections Évolution : véritablement fusionnées (dédupliquées par nom+membres), comme les
  // règles de groupe/personne — la vue actuellement affichée (view/monthBasis), elle, n'est jamais touchée
  // par un import "Ajouter" (état d'affichage courant, pas une donnée à préserver entre appareils).
  if(evolutionSettings && evolutionSettings.merges){
    ["groupe","categorie","personne","compte"].forEach(dim=>{
      const existing = Store.settings.evolution.merges[dim] || (Store.settings.evolution.merges[dim] = []);
      const incoming = evolutionSettings.merges[dim] || [];
      mergeRuleList(existing, incoming, m=>[m.name, (m.members||[]).slice().sort().join(",")].join("|"));
    });
