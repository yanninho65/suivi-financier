/* ================= SYNCHRONISATION (GitHub Gist) =================
   Sauvegarde/récupération manuelle des données (transactions + paramètres) via un Gist GitHub privé,
   comme mécanisme de transfert entre appareils (alternative à l'export/import de fichier).
   Le jeton d'accès (scope "gist" uniquement recommandé) et l'ID du Gist sont stockés dans
   Store.settings.sync, en localStorage sur cet appareil — jamais transmis ailleurs qu'à l'API GitHub. */
(function(){
"use strict";
const U = window.__SF_UTILS;
const Store = window.__SF_STORE;
const APP = window.__SF_APP;
const ICONS = U.ICONS;

let syncing = false;
let lastError = null;

function getConfig(){ return Store.settings.sync || {}; }
/* "Configuré" = jeton présent. L'ID du Gist est optionnel : s'il manque, le premier
   "Sauvegarder" crée automatiquement un nouveau Gist secret et mémorise son ID. */
function isConfigured(){ return !!(getConfig().token); }

function saveConfig(token, gistId){
  Store.settings.sync = Object.assign({}, Store.settings.sync, {token: token.trim(), gistId: (gistId||"").trim()});
  Store.saveSettings();
}

/* Construit le même payload que la sauvegarde .json (§ exportBackup), sans le champ exportedAt
   dans le calcul de hash (il change à chaque appel et ne reflète pas un changement de données). */
function buildSyncPayload(){
  return {
    version: 2,
    exportedAt: new Date().toISOString(),
    transactions: Store.transactions.map(t=>({...t, date:t.date.toISOString()})),
    params: window.__SF_MENU.buildParamsPayload()
  };
}
function hashPayload(payload){
  const str = JSON.stringify(payload.transactions) + "|" + JSON.stringify(payload.params);
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i))|0; }
  return String(h);
}

/* "unconfigured" | "syncing" | "error" | "synced" | "unsynced" */
function computeStatus(){
  if(syncing) return "syncing";
  const c = getConfig();
  if(!c.token) return "unconfigured";
  if(lastError) return "error";
  if(!c.gistId || !c.lastSyncedHash) return "unsynced";
  return hashPayload(buildSyncPayload())===c.lastSyncedHash ? "synced" : "unsynced";
}

/* Récupère et parse le contenu JSON stocké dans le Gist distant. */
async function fetchRemotePayload(c){
  const res = await fetch("https://api.github.com/gists/"+encodeURIComponent(c.gistId), {
    headers: {"Authorization": "token "+c.token, "Accept": "application/vnd.github+json"}
  });
  if(!res.ok) throw new Error("Erreur GitHub (" + res.status + ")");
  const data = await res.json();
  const fname = c.filename || "suivi_financier_sync.json";
  const files = data.files || {};
  const file = files[fname] || Object.values(files)[0];
  if(!file) throw new Error("Aucun fichier trouvé dans ce Gist");
  let content = file.content;
  if(file.truncated) content = await fetch(file.raw_url).then(r=>r.text());
  return JSON.parse(content);
}

/* Envoie un payload donné vers le Gist (création si aucun gistId encore connu, sinon mise à jour).
   Met à jour Store.settings.sync (gistId/lastSyncedAt/lastSyncedHash) sur succès. Ne gère ni
   `syncing` ni les toasts — laissé aux appelants (pushToGist, smartSync, résolution de conflit). */
async function pushPayloadToGist(c, payload, hash){
  const filename = c.filename || "suivi_financier_sync.json";
  const creating = !c.gistId;
  const res = creating
    ? await fetch("https://api.github.com/gists", {
        method: "POST",
        headers: {
          "Authorization": "token "+c.token,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          description: "Suivi financier — sauvegarde synchronisée",
          public: false,
          files: {[filename]: {content: JSON.stringify(payload)}}
        })
      })
    : await fetch("https://api.github.com/gists/"+encodeURIComponent(c.gistId), {
        method: "PATCH",
        headers: {
          "Authorization": "token "+c.token,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({files: {[filename]: {content: JSON.stringify(payload)}}})
      });
  if(!res.ok){
    const txt = await res.text().catch(()=>"");
    throw new Error("Erreur GitHub (" + res.status + ")" + (txt ? " : " + txt.slice(0,200) : ""));
  }
  const data = await res.json();
  Store.settings.sync = Object.assign({}, Store.settings.sync, {
    gistId: creating ? data.id : c.gistId,
    lastSyncedAt: new Date().toISOString(),
    lastSyncedHash: hash
  });
  Store.saveSettings();
  return creating;
}

/* Remplace les transactions/paramètres locaux par ceux d'un payload distant déjà récupéré.
   Ne gère ni la sauvegarde IndexedDB (Store.saveTransactions), ni lastSyncedHash/At, ni le
   rafraîchissement d'écran — laissé aux appelants. */
function applyRemotePayloadLocally(payload){
  const txns = (payload.transactions||[]).map(t=>({...t, date:new Date(t.date)})).filter(t=>t.date && !isNaN(t.date));
  window.__SF_DATA.importTxns(txns, "replace");
  if(payload.params) window.__SF_IMPORT.applyParamsImport(payload.params, "replace");
  Store.normalizeSettings();
}

/* Sauvegarde FORCÉE vers le Gist (écrase le contenu distant avec l'état local actuel, quel que
   soit ce qu'il contenait). Utilisée par le bouton "Forcer la sauvegarde" et en résolution de
   conflit ; crée le Gist si aucun gistId n'est encore connu. */
async function pushToGist(){
  const c = getConfig();
  if(!c.token){ openSyncSheet(); return; }
  syncing = true; lastError = null; updateIndicator();
  try{
    const payload = buildSyncPayload();
    const hash = hashPayload(payload);
    const creating = await pushPayloadToGist(c, payload, hash);
    APP.showToast(creating ? "Gist créé et sauvegardé" : "Sauvegardé sur GitHub Gist");
  }catch(e){
    lastError = (e && e.message) ? e.message : String(e);
    APP.showToast("Échec de la sauvegarde : " + lastError);
  }finally{
    syncing = false;
    updateIndicator();
  }
}

/* Récupération FORCÉE depuis le Gist (écrase les données locales, quelles qu'elles soient).
   Utilisée par le bouton "Forcer la récupération" (après confirmation) et en résolution de conflit. */
async function pullFromGist(){
  const c = getConfig();
  if(!c.token || !c.gistId){ openSyncSheet(); return; }
  syncing = true; lastError = null; updateIndicator();
  try{
    const payload = await fetchRemotePayload(c);
    applyRemotePayloadLocally(payload);
    const newHash = hashPayload(buildSyncPayload());
    Store.settings.sync = Object.assign({}, Store.settings.sync, {lastSyncedAt: new Date().toISOString(), lastSyncedHash: newHash});
    Store.saveSettings();
    await Store.saveTransactions();
    APP.refreshCurrentTab();
    APP.showToast("Données récupérées depuis GitHub Gist");
  }catch(e){
    lastError = (e && e.message) ? e.message : String(e);
    APP.showToast("Échec de la récupération : " + lastError);
  }finally{
    syncing = false;
    updateIndicator();
  }
}

/* Synchronisation dans les deux sens (action de l'indicateur en haut et bouton principal de
   la feuille Synchronisation). Compare le hash local actuel, le hash distant, et le hash mémorisé
   lors de la dernière synchronisation réussie (`lastSyncedHash`) pour déterminer sans ambiguïté
   quel côté a changé :
   - seul le distant a changé depuis la dernière synchro → récupère automatiquement (le local n'a
     rien à perdre, rien n'a été modifié ici) ;
   - seul le local a changé → sauvegarde automatiquement (le distant n'a rien à perdre) ;
   - les deux ont changé indépendamment (ou identiques) → pas de fusion automatique possible avec
     un simple hash global : demande explicitement à l'utilisateur lequel garder. */
async function smartSync(){
  const c = getConfig();
  if(!c.token){ openSyncSheet(); return; }
  if(!c.gistId){ await pushToGist(); return; }
  syncing = true; lastError = null; updateIndicator();
  try{
    const localPayload = buildSyncPayload();
    const localHash = hashPayload(localPayload);
    const remotePayload = await fetchRemotePayload(c);
    const remoteHash = hashPayload(remotePayload);
    const lastHash = c.lastSyncedHash;

    if(remoteHash === localHash){
      Store.settings.sync = Object.assign({}, Store.settings.sync, {lastSyncedAt: new Date().toISOString(), lastSyncedHash: localHash});
      Store.saveSettings();
      APP.showToast("Déjà à jour");
      return;
    }
    const localChanged = localHash !== lastHash;
    const remoteChanged = remoteHash !== lastHash;
    if(remoteChanged && !localChanged){
      applyRemotePayloadLocally(remotePayload);
      const newHash = hashPayload(buildSyncPayload());
      Store.settings.sync = Object.assign({}, Store.settings.sync, {lastSyncedAt: new Date().toISOString(), lastSyncedHash: newHash});
      Store.saveSettings();
      await Store.saveTransactions();
      APP.refreshCurrentTab();
      APP.showToast("Données récupérées depuis GitHub Gist");
      return;
    }
    if(localChanged && !remoteChanged){
      await pushPayloadToGist(c, localPayload, localHash);
      APP.showToast("Sauvegardé sur GitHub Gist");
      return;
    }
    // Modifications des deux côtés (ou état de référence inconnu) : demander à l'utilisateur.
    showConflictModal(c, localPayload, localHash, remotePayload);
  }catch(e){
    lastError = (e && e.message) ? e.message : String(e);
    APP.showToast("Échec de la synchronisation : " + lastError);
  }finally{
    syncing = false;
    updateIndicator();
  }
}

function showConflictModal(c, localPayload, localHash, remotePayload){
  const modal = document.getElementById("modal-confirm");
  const rd = remotePayload.exportedAt ? new Date(remotePayload.exportedAt) : null;
  const remoteTxt = rd ? (U.fmtDateShort(rd)+" à "+U.pad2(rd.getHours())+":"+U.pad2(rd.getMinutes())) : "date inconnue";
  modal.innerHTML = `
    <h3 style="margin:0 0 8px;font-size:18px;">Modifications des deux côtés</h3>
    <p style="font-size:13.5px;color:var(--text-sub);line-height:1.5;margin:0 0 18px;">Cet appareil et le Gist ont chacun des changements depuis la dernière synchronisation (dernière écriture du Gist : ${remoteTxt}). Choisissez lequel garder — l'autre sera écrasé.</p>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <button class="btn btn-primary btn-block" id="conflict-keep-local">Garder cet appareil</button>
      <button class="btn btn-ghost btn-block" id="conflict-keep-remote">Utiliser le Gist</button>
      <button class="btn btn-ghost btn-block" id="conflict-cancel">Annuler</button>
    </div>
  `;
  document.getElementById("conflict-cancel").onclick = ()=>APP.closeOverlay("overlay-confirm");
  document.getElementById("conflict-keep-local").onclick = async ()=>{
    APP.closeOverlay("overlay-confirm");
    syncing = true; lastError = null; updateIndicator();
    try{
      await pushPayloadToGist(c, localPayload, localHash);
      APP.showToast("Sauvegardé sur GitHub Gist (a écrasé le Gist)");
    }catch(e){
      lastError = (e && e.message) ? e.message : String(e);
      APP.showToast("Échec de la sauvegarde : " + lastError);
    }finally{
      syncing = false; updateIndicator();
    }
  };
  document.getElementById("conflict-keep-remote").onclick = async ()=>{
    APP.closeOverlay("overlay-confirm");
    syncing = true; lastError = null; updateIndicator();
    try{
      applyRemotePayloadLocally(remotePayload);
      const newHash = hashPayload(buildSyncPayload());
      Store.settings.sync = Object.assign({}, Store.settings.sync, {lastSyncedAt: new Date().toISOString(), lastSyncedHash: newHash});
      Store.saveSettings();
      await Store.saveTransactions();
      APP.refreshCurrentTab();
      APP.showToast("Données récupérées depuis GitHub Gist (a écrasé cet appareil)");
    }catch(e){
      lastError = (e && e.message) ? e.message : String(e);
      APP.showToast("Échec de la récupération : " + lastError);
    }finally{
      syncing = false; updateIndicator();
    }
  };
  APP.openOverlay("overlay-confirm");
}

function confirmPull(){
  const modal = document.getElementById("modal-confirm");
  modal.innerHTML = `
    <h3 style="margin:0 0 8px;font-size:18px;">Forcer la récupération depuis GitHub Gist ?</h3>
    <p style="font-size:13.5px;color:var(--text-sub);line-height:1.5;margin:0 0 18px;">Les données actuellement sur cet appareil (${Store.transactions.length.toLocaleString('fr-FR')} transaction(s)) seront remplacées par celles du Gist, sans vérifier si cet appareil a aussi des changements récents. Préférez plutôt le bouton "Synchroniser" ci-dessus, qui gère les deux sens automatiquement.</p>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-ghost" style="flex:1;" id="syncpull-cancel">Annuler</button>
      <button class="btn btn-primary" style="flex:1;" id="syncpull-confirm">Récupérer</button>
    </div>
  `;
  document.getElementById("syncpull-cancel").onclick = ()=>APP.closeOverlay("overlay-confirm");
  document.getElementById("syncpull-confirm").onclick = ()=>{
    APP.closeOverlay("overlay-confirm");
    pullFromGist().then(()=>renderSyncSheet());
  };
  APP.openOverlay("overlay-confirm");
}

function statusMeta(){
  const st = computeStatus();
  return {
    unconfigured: {label:"Jeton non configuré", color:"var(--text-faint)"},
    syncing: {label:"Synchronisation en cours…", color:"var(--text-sub)"},
    error: {label:"Échec de la dernière synchronisation", color:"var(--expense)"},
    synced: {label:"Synchronisé", color:"var(--income)"},
    unsynced: {label:"Modifications non synchronisées", color:"var(--expense)"}
  }[st];
}

function maskToken(t){
  if(!t) return "";
  return t.length<=6 ? "••••••" : t.slice(0,4) + "•".repeat(Math.max(4,t.length-8)) + t.slice(-4);
}

function renderSyncSheet(){
  const sheet = document.getElementById("sheet-sync");
  if(!sheet) return;
  const c = getConfig();
  const configured = isConfigured();
  const meta = statusMeta();
  const lastTxt = c.lastSyncedAt ? (()=>{ const d=new Date(c.lastSyncedAt); return U.fmtDateShort(d)+" à "+U.pad2(d.getHours())+":"+U.pad2(d.getMinutes()); })() : "jamais";
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h2>Synchronisation</h2><button class="icon-btn" id="sync-close">${ICONS.close}</button></div>
    <div class="sheet-body">
      <div class="import-summary">
        Sauvegardez vos données (transactions et paramètres) sur un Gist GitHub privé pour les récupérer sur un autre appareil. Créez un jeton d'accès personnel avec uniquement le scope <b>gist</b> — il reste stocké localement sur cet appareil et n'est envoyé qu'à l'API GitHub.
      </div>
      ${configured ? `
      <div class="import-summary" style="margin-top:10px;border:1.5px solid ${meta.color};">
        <b style="color:${meta.color};">${meta.label}</b><br>Dernière synchronisation : ${lastTxt}
        ${lastError ? `<br><span style="color:var(--expense);font-size:12.5px;">${U.escHtml(lastError)}</span>` : ""}
      </div>
      <button class="btn btn-primary btn-block" id="sync-smart" style="margin-top:16px;">${ICONS.refreshCw} Synchroniser</button>
      ${!c.gistId ? `<div class="import-summary" style="margin-top:10px;">Aucun Gist enregistré pour l'instant : "Synchroniser" en créera un nouveau (secret) et mémorisera son ID automatiquement.</div>` : `
      <div class="field-label" style="margin-top:18px;">Actions manuelles (forcent un sens sans vérifier l'autre)</div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost" style="flex:1;" id="sync-pull">${ICONS.download} Forcer récupération</button>
        <button class="btn btn-ghost" style="flex:1;" id="sync-push">${ICONS.upload} Forcer sauvegarde</button>
      </div>`}` : ""}
      <div class="field-label" style="margin-top:20px;">${configured ? "Modifier la configuration" : "Configuration"}</div>
      <div class="card" style="padding:14px;">
        <div class="field-label" style="margin-top:0;">Jeton d'accès personnel (scope gist)</div>
        <input type="password" id="sync-token" class="search-mini" style="margin:0;" placeholder="ghp_…" autocomplete="off" value="${U.escHtml(c.token||"")}">
        <div class="field-label">ID du Gist</div>
        <input type="text" id="sync-gistid" class="search-mini" style="margin:0;" placeholder="Laisser vide pour créer un nouveau Gist" autocomplete="off" value="${U.escHtml(c.gistId||"")}">
        <div style="font-size:12px;color:var(--text-faint);margin-top:6px;line-height:1.5;">Laisse ce champ vide sur le premier appareil : le prochain "Synchroniser" crée le Gist et remplit l'ID ici. Sur un deuxième appareil, colle l'ID affiché sur le premier (visible ci-dessus une fois configuré, ou dans l'URL du Gist sur github.com).</div>
        <button class="btn btn-primary btn-block" id="sync-save-config" style="margin-top:14px;">Enregistrer la configuration</button>
      </div>
    </div>
  `;
  document.getElementById("sync-close").onclick = ()=>APP.closeOverlay("overlay-sync");
  document.getElementById("sync-save-config").onclick = ()=>{
    const token = document.getElementById("sync-token").value.trim();
    const gistId = document.getElementById("sync-gistid").value.trim();
    if(!token){ APP.showToast("Renseignez le jeton d'accès"); return; }
    lastError = null;
    saveConfig(token, gistId);
    APP.showToast("Configuration enregistrée");
    renderSyncSheet();
    updateIndicator();
  };
  if(configured){
    document.getElementById("sync-smart").onclick = ()=>{ smartSync().then(()=>renderSyncSheet()); };
    if(c.gistId){
      document.getElementById("sync-push").onclick = ()=>{ pushToGist().then(()=>renderSyncSheet()); };
      document.getElementById("sync-pull").onclick = confirmPull;
    }
  }
}

function openSyncSheet(){
  renderSyncSheet();
  APP.openOverlay("overlay-sync");
}

function updateIndicator(){
  const btn = document.getElementById("btn-sync");
  if(!btn) return;
  const st = computeStatus();
  const configured = isConfigured();
  let icon, color, title;
  if(st==="syncing"){ icon=ICONS.refreshCw; color="var(--text-sub)"; title="Synchronisation en cours…"; }
  else if(st==="unconfigured"){ icon=ICONS.cloud; color="var(--text-faint)"; title="Configurer la synchronisation"; }
  else if(st==="synced"){ icon=ICONS.cloudCheck; color="var(--income)"; title="Synchronisé — appuyez pour vérifier les mises à jour"; }
  else if(st==="error"){ icon=ICONS.alertTriangle; color="var(--expense)"; title="Échec — appuyez pour réessayer"; }
  else { icon=ICONS.alertTriangle; color="var(--expense)"; title="Non synchronisé — appuyez pour synchroniser"; }
  btn.innerHTML = icon;
  btn.style.color = color;
  btn.classList.toggle("sync-spin", st==="syncing");
  btn.title = title;
  btn.onclick = ()=>{
    if(st==="syncing") return;
    if(!configured){ openSyncSheet(); return; }
    smartSync();
  };
}

window.__SF_SYNC = {open: openSyncSheet, updateIndicator, pushToGist, pullFromGist, smartSync};
})();

/* ================= Générateur générique : gestion des alias (groupes / personnes) ================= */
function createAliasManager(cfg){

  /* Identifiant réel utilisé pour les règles (nom de base, sans le suffixe de date entre parenthèses) —

      return `<div class="check-item groupe-child-item ${isSel?'selected':''}" data-sel="${U.escHtml(realBase)}" style="cursor:pointer;">
        <span class="cbox">${ICONS.check}</span>
        <span class="lbl">${kindIconHtml(b.base)}${U.escHtml(b.base)} <span class="cnt" style="margin-left:6px;">${b.count}</span></span>
      </div>`;
    }
    return `<div class="check-item groupe-child-item" data-base="${U.escHtml(realBase)}" data-full="${U.escHtml(b.base)}" style="cursor:pointer;">
      <span class="lbl">${kindIconHtml(b.base)}${U.escHtml(b.base)} <span class="cnt" style="margin-left:6px;">${b.count}</span></span>
      <span style="color:var(--text-faint);flex:0 0 auto;">${ICONS.arrowLeft.replace('<svg ','<svg style="transform:rotate(180deg);width:16px;height:16px;" ')}</span>
    </div>`;
  }

  function flatRowHtml(b){
    const realBase = trueBase(b.base);
    const isSel = selected.has(realBase);
    if(selectMode){
      return `<div class="check-item ${isSel?'selected':''}" data-sel="${U.escHtml(realBase)}" style="cursor:pointer;">
        <span class="cbox">${ICONS.check}</span>
        <span class="lbl">${kindIconHtml(b.base)}${U.escHtml(b.base)} <span class="cnt" style="margin-left:6px;">${b.count}</span></span>
      </div>`;
    }
    return `<div class="check-item" data-base="${U.escHtml(realBase)}" data-full="${U.escHtml(b.base)}" style="cursor:pointer;">
      <span class="lbl">${kindIconHtml(b.base)}${U.escHtml(b.base)} <span class="cnt" style="margin-left:6px;">${b.count}</span></span>
    </div>`;
  }

  let openSections = new Set();

  function renderList(){
    const sheet = document.getElementById(cfg.sheetId);
    const prevBody = sheet.querySelector(".sheet-body");
    const prevScroll = prevBody ? prevBody.scrollTop : 0;
    sheet.querySelectorAll("details[data-sup]").forEach(d=>{
      if(d.open) openSections.add(d.dataset.sup); else openSections.delete(d.dataset.sup);
    });
    const {sections, flat} = cfg.hierarchyFn(Store.transactions);
    const q = U.normalize(searchTerm);
    const sectionNames = Array.from(sections.keys()).sort((a,b)=>a.localeCompare(b,'fr'));

    let sectionsHtml = sectionNames.map(sup=>{
      const children = sections.get(sup).filter(b=> !q || U.normalize(b.base).includes(q) || U.normalize(sup).includes(q));
      if(q && children.length===0) return "";
      const totalCount = sections.get(sup).reduce((s,c)=>s+c.count,0);
      const isOpen = openSections.has(sup) || (!!q && children.length>0);
      return `<details class="card" data-sup="${U.escHtml(sup)}" style="padding:0;margin-bottom:10px;" ${isOpen?'open':''}>
        <summary style="list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;">
          <span style="font-weight:800;font-size:14.5px;flex:1;">${U.escHtml(sup)}</span>
          <span style="color:var(--text-sub);font-size:12.5px;">${sections.get(sup).length} · ${totalCount}</span>
        </summary>
        <div style="padding:0 12px 12px;">${sections.get(sup).map(childRowHtml).join("")}</div>
      </details>`;
    }).join("");

    const flatFiltered = flat.filter(b=> !q || U.normalize(b.base).includes(q)).sort((a,b)=>a.base.localeCompare(b.base,'fr'));

    sheet.innerHTML = `
      <div class="sheet-handle"></div>
      <div class="sheet-head"><h2>${cfg.title}</h2><button class="icon-btn" id="am-close">${ICONS.close}</button></div>
      <div class="sheet-body">
        <div style="font-size:12.5px;color:var(--text-sub);margin-bottom:10px;line-height:1.5;">${cfg.helpText}</div>
        ${viewToggleHtml()}
        <div style="display:flex;gap:8px;margin-bottom:10px;">
          <input type="text" class="search-mini" id="am-search" style="margin-bottom:0;flex:1;" placeholder="Rechercher ${cfg.itemLabel}…" value="${U.escHtml(searchTerm)}">
          ${cfg.hasDates ? "" : `<button class="btn btn-ghost btn-sm" id="am-selectmode-btn" style="white-space:nowrap;">${selectMode ? "Terminer" : "Sélectionner"}</button>`}
        </div>
        ${sectionsHtml ? `<div class="field-label" style="margin-top:4px;">${cfg.superLabel.charAt(0).toUpperCase()+cfg.superLabel.slice(1)}s</div>${sectionsHtml}` : ""}
        <div class="field-label" style="margin-top:4px;">${sectionsHtml ? "Non classés" : "Tous les "+cfg.itemLabelPlural}</div>
        <div class="check-list" style="max-height:none;">
          ${flatFiltered.map(flatRowHtml).join("") || `<div style="padding:14px;color:var(--text-faint);font-size:13px;">Aucun élément non classé</div>`}
        </div>
        ${selectMode ? `<div style="height:70px;"></div>` : ""}
      </div>
      ${selectMode && selected.size>0 ? `
      <div class="sheet-foot">
        <button class="btn btn-ghost" id="am-clear-sel">${selected.size} sélectionné${selected.size>1?"s":""} · Effacer</button>
        <button class="btn btn-primary" id="am-bulk-move">Déplacer vers…</button>
      </div>` : ""}
    `;
    document.getElementById("am-close").onclick = ()=>APP.closeOverlay(cfg.overlayId);
    wireViewToggle();
    document.getElementById("am-search").oninput = (e)=>{ searchTerm = e.target.value; renderList(); };
    const selModeBtn = document.getElementById("am-selectmode-btn");
    if(selModeBtn) selModeBtn.onclick = ()=>{
      selectMode = !selectMode;
      if(!selectMode) selected.clear();
      renderList();
    };
    if(selectMode && !cfg.hasDates){
      document.querySelectorAll("[data-sel]").forEach(el=>{
        el.onclick = ()=>{
          const base = el.dataset.sel;
          if(selected.has(base)) selected.delete(base); else selected.add(base);
          renderList();
        };
      });
      const clearBtn = document.getElementById("am-clear-sel");
      if(clearBtn) clearBtn.onclick = ()=>{ selected.clear(); renderList(); };
      const moveBtn = document.getElementById("am-bulk-move");
      if(moveBtn) moveBtn.onclick = ()=>{ view="bulk"; renderBulk(); };
    } else {
      document.querySelectorAll("[data-base]").forEach(el=>{
        el.onclick = ()=>{ editingBase = el.dataset.base; editingFull = cfg.hasDates ? (el.dataset.full || null) : null; view="edit"; renderEdit(); };
      });
    }
    const newBody = sheet.querySelector(".sheet-body");
    if(newBody) newBody.scrollTop = prevScroll;
  }

  /* ---- Déplacement groupé : applique un même groupe de groupe / groupe de personnes à plusieurs éléments sélectionnés ---- */
  function renderBulk(){
    const sheet = document.getElementById(cfg.sheetId);
    const items = Array.from(selected).sort((a,b)=>a.localeCompare(b,'fr'));
    sheet.innerHTML = `
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <button class="icon-btn" id="am-back">${ICONS.arrowLeft}</button>
        <h2 style="flex:1;text-align:center;">Déplacer ${items.length} élément${items.length>1?"s":""}</h2>
        <button class="icon-btn" id="am-close">${ICONS.close}</button>
      </div>
      <div class="sheet-body">
        <div class="field-label" style="margin-top:0;">Éléments sélectionnés</div>
        <div class="chiprow" style="margin-bottom:18px;">
          ${items.map(b=>`<span class="chip-opt" style="cursor:default;">${U.escHtml(b)}</span>`).join("")}
        </div>
        <div class="field-label" style="margin-top:0;">Nom du ${cfg.superLabel}</div>
        ${datalistsHtml()}
        <input type="text" class="search-mini" id="am-bulk-super" list="am-super-list" placeholder="Nom du ${cfg.superLabel}">
        <div style="font-size:12px;color:var(--text-sub);margin-top:14px;line-height:1.4;">
          Cette action remplace les règles existantes des éléments sélectionnés par cette nouvelle affectation.
        </div>
      </div>
      <div class="sheet-foot">
        <button class="btn btn-ghost" id="am-bulk-cancel">Annuler</button>
        <button class="btn btn-primary" id="am-bulk-apply">Appliquer</button>
      </div>
    `;
    document.getElementById("am-close").onclick = ()=>APP.closeOverlay(cfg.overlayId);
    document.getElementById("am-back").onclick = ()=>{ view="list"; renderList(); };
    document.getElementById("am-bulk-cancel").onclick = ()=>{ view="list"; renderList(); };
    document.getElementById("am-bulk-apply").onclick = ()=>{
      const sg = document.getElementById("am-bulk-super").value.trim();
      if(!sg){ APP.showToast("Merci d'indiquer un nom de "+cfg.superLabel); return; }
      const selectedSet = new Set(items);
      const others = rules().filter(r=> !selectedSet.has(r[cfg.baseField]));
      const newRules = items.map(base=>({[cfg.baseField]:base, [cfg.superField]:sg}));
      Store.settings[cfg.settingsKey] = others.concat(newRules);
      Store.saveSettings();
      APP.showToast(items.length+" élément"+(items.length>1?"s déplacés":" déplacé")+" vers « "+sg+" »");
      selected.clear();
      selectMode = false;
      view="list"; renderList();
    };
  }

  function ruleRowHtml(rule, editableBase){
    const id = "amrow"+(rowSeq++);
    return `<div class="card" style="box-shadow:none;background:var(--card-alt);padding:12px;margin-bottom:10px;" data-rowid="${id}">
      ${editableBase ? `<input type="text" class="search-mini" style="margin-bottom:8px;" placeholder="${cfg.itemLabel} (nom exact)" list="am-base-list" data-field="base" value="${U.escHtml(rule.base||'')}">` : ""}
      <input type="text" class="search-mini" placeholder="Nom du ${cfg.superLabel}" list="am-super-list" data-field="super" value="${U.escHtml(rule.superName||'')}">
      <button class="btn btn-ghost btn-sm" data-del="${id}" style="margin-top:8px;color:var(--expense);">${ICONS.trash} Supprimer cette règle</button>
    </div>`;
  }
  function wireRowDeletes(){
    document.querySelectorAll("[data-del]").forEach(btn=>{
      btn.onclick = ()=>{
        APP.confirmAction({
          title:"Supprimer cette règle ?",
          text:"Cette action est définitive une fois enregistrée.",
          confirmLabel:"Supprimer",
          onConfirm:()=>{
            const card = document.querySelector(`[data-rowid="${btn.dataset.del}"]`);
            if(card) card.remove();
          }
        });
      };
    });
  }
  function datalistsHtml(){
    return `<datalist id="am-super-list">${existingSuperNames().map(n=>`<option value="${U.escHtml(n)}">`).join("")}</datalist>
      <datalist id="am-base-list">${existingBaseNames().map(n=>`<option value="${U.escHtml(n)}">`).join("")}</datalist>`;
  }

  function kindSectionHtml(){
    if(!cfg.showKind) return "";
    const key = editingFull || editingBase;
    const kind = AGG.getGroupKind(key);
    const voyMonth = AGG.getGroupVoyageMonth(key) || "";
    return `
      <div class="field-label" style="margin-top:0;">Type de groupe (utilisé par l'onglet Budget)</div>
      <div class="seg" id="am-kind-seg" style="margin-bottom:${kind==='voyage'?'10px':'18px'};">
        <button data-k="quotidien" class="${kind==='quotidien'?'active':''}">Vie quotidienne</button>
        <button data-k="voyage" class="${kind==='voyage'?'active':''}">Voyage</button>
      </div>
      <div id="am-voymonth-wrap" style="display:${kind==='voyage'?'block':'none'};margin-bottom:18px;">
        <div style="font-size:12.5px;color:var(--text-sub);margin-bottom:6px;line-height:1.4;">Mois auquel affecter les dépenses de ce groupe dans le budget (sinon le mois réel de chaque dépense est utilisé).</div>
        <input type="month" class="search-mini" id="am-voymonth-input" value="${U.escHtml(voyMonth)}">
      </div>
    `;
  }
  function wireKindSection(){
    if(!cfg.showKind) return;
    document.querySelectorAll("#am-kind-seg button").forEach(b=>{
      b.onclick = ()=>{
        document.querySelectorAll("#am-kind-seg button").forEach(x=>x.classList.remove("active"));
        b.classList.add("active");
        document.getElementById("am-voymonth-wrap").style.display = b.dataset.k==="voyage" ? "block" : "none";
      };
    });
  }
  function saveKindSection(){
    if(!cfg.showKind) return;
    const key = editingFull || editingBase;
    const active = document.querySelector("#am-kind-seg button.active");
    const kind = active ? active.dataset.k : "quotidien";
    Store.settings.groupKind = Store.settings.groupKind || {};
    Store.settings.groupVoyageMonth = Store.settings.groupVoyageMonth || {};
    if(kind==="voyage"){
      Store.settings.groupKind[key] = "voyage";
      const m = document.getElementById("am-voymonth-input").value || null;
      if(m) Store.settings.groupVoyageMonth[key] = m; else delete Store.settings.groupVoyageMonth[key];
    } else {
      delete Store.settings.groupKind[key];
      delete Store.settings.groupVoyageMonth[key];
    }
  }

  /* ---- Dates de début/fin d'un groupe (tous types confondus) : nombre de jours + moyennes/jour ---- */
  function dayStatsPreview(key, dateFrom, dateTo){
    if(!dateFrom || !dateTo) return null;
    const from = new Date(dateFrom+"T00:00:00");
    const to = new Date(dateTo+"T00:00:00");
    const days = Math.round((to-from)/86400000) + 1;
    if(days<=0) return null;
    let income=0, expense=0;
    Store.transactions.forEach(t=>{
      if(t.type==="Transfer") return;
      if(t.groupe !== key) return;
      if(t.type==="Income") income += t.montant; else expense += t.montant;
    });
    return {days, income, expense, total: income+expense,
      incomePerDay: income/days, expensePerDay: expense/days, totalPerDay: (income+expense)/days};
  }
  function dayStatsHtml(stats){
    if(!stats) return `<div style="font-size:12px;color:var(--text-faint);">Renseignez les deux dates pour voir le nombre de jours et les moyennes.</div>`;
    return `<div class="card" style="box-shadow:none;background:var(--card-alt);padding:4px 14px;">
      <div class="detail-row"><span>Nombre de jours</span><span>${stats.days}</span></div>
      <div class="detail-row"><span>Revenus / jour</span><span style="color:var(--income);">${U.fmtMoney(stats.incomePerDay)}</span></div>
      <div class="detail-row"><span>Dépenses / jour</span><span style="color:var(--expense);">${U.fmtMoney(Math.abs(stats.expensePerDay))}</span></div>
      <div class="detail-row"><span>Total / jour</span><span style="color:${stats.totalPerDay<0?'var(--expense)':'var(--income)'}">${U.fmtMoneySigned(stats.totalPerDay)}</span></div>
    </div>`;
  }
  function dateRangeSectionHtml(){
    if(!cfg.showKind) return "";
    const key = editingFull || editingBase;
    const range = AGG.getGroupDateRange(key) || {};
    const stats = dayStatsPreview(key, range.dateFrom||"", range.dateTo||"");
    return `
      <div class="field-label" style="margin-top:0;">Dates de début et de fin</div>
      <div style="font-size:12.5px;color:var(--text-sub);margin-bottom:8px;line-height:1.4;">Disponibles pour tous les groupes. Utilisées pour calculer le nombre de jours et les moyennes par jour (dépenses, revenus, total).</div>
      <div class="daterange" style="margin-bottom:10px;">
        <input type="date" class="search-mini" id="am-daterange-from" value="${U.escHtml(range.dateFrom||'')}">
        <input type="date" class="search-mini" id="am-daterange-to" value="${U.escHtml(range.dateTo||'')}">
      </div>
      <div id="am-daystats" style="margin-bottom:18px;">${dayStatsHtml(stats)}</div>
    `;
  }
  function wireDateRangeSection(){
    if(!cfg.showKind) return;
    const key = editingFull || editingBase;
    const update = ()=>{
      const df = document.getElementById("am-daterange-from").value;
      const dt = document.getElementById("am-daterange-to").value;
      const stats = dayStatsPreview(key, df, dt);
      document.getElementById("am-daystats").innerHTML = dayStatsHtml(stats);
    };
    const fromEl = document.getElementById("am-daterange-from");
    const toEl = document.getElementById("am-daterange-to");
    if(fromEl) fromEl.onchange = update;
    if(toEl) toEl.onchange = update;
  }
  function saveDateRangeSection(){
    if(!cfg.showKind) return;
    const key = editingFull || editingBase;
    const df = document.getElementById("am-daterange-from").value || null;
    const dt = document.getElementById("am-daterange-to").value || null;
    Store.settings.groupDateRange = Store.settings.groupDateRange || {};
    if(df && dt) Store.settings.groupDateRange[key] = {dateFrom: df, dateTo: dt};
    else delete Store.settings.groupDateRange[key];
  }

  function renderEdit(){
    const sheet = document.getElementById(cfg.sheetId);
    const isDatedOccurrence = !!(cfg.hasDates && editingFull && editingFull !== editingBase);
    let range = null;
    if(isDatedOccurrence){
      const txns = Store.transactions.filter(t=>t.groupe===editingFull);
      if(txns.length){
        let min=txns[0].date, max=txns[0].date;
        txns.forEach(t=>{ if(t.date<min) min=t.date; if(t.date>max) max=t.date; });
        range = {from:U.toISO(min), to:U.toISO(max), sampleDate:min};
      }
    }
    const currentRule = cfg.hasDates ? AGG.findGroupAliasRule(editingBase, editingFull) : (rulesForBase(editingBase)[0]||null);
    const currentValue = currentRule ? (currentRule[cfg.superField]||"") : "";
    const currentIsGlobalOther = currentRule ? (isDatedOccurrence && !currentRule.full) : false;

    sheet.innerHTML = `
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <button class="icon-btn" id="am-back">${ICONS.arrowLeft}</button>
        <h2 style="flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${U.escHtml(editingFull || editingBase)}</h2>
        <button class="icon-btn" id="am-close">${ICONS.close}</button>
      </div>
      <div class="sheet-body">
        ${kindSectionHtml()}
        ${range ? `<div style="font-size:12px;color:var(--text-sub);margin-bottom:14px;line-height:1.4;">Ce groupe couvre les transactions du ${U.fmtDateShort(new Date(range.from))} au ${U.fmtDateShort(new Date(range.to))}.</div>` : ""}
        <div class="field-label" style="margin-top:0;">${cfg.superLabel.charAt(0).toUpperCase()+cfg.superLabel.slice(1)}</div>
        ${datalistsHtml()}
        <input type="text" class="search-mini" id="am-super-input" list="am-super-list" placeholder="Nom du ${cfg.superLabel}" value="${U.escHtml(currentValue)}" style="margin-bottom:6px;">
        ${currentRule && currentIsGlobalOther ? `<div style="font-size:12px;color:var(--text-sub);margin-bottom:12px;line-height:1.4;">Actuellement rattaché via une ancienne règle qui s'applique à toutes les périodes de « ${U.escHtml(editingBase)} » (importée avant cette version). Enregistrer ici crée une règle spécifique à cette occurrence uniquement, sans toucher à l'ancienne règle ni aux autres occurrences.</div>` : ""}
        ${dateRangeSectionHtml()}
      </div>
      <div class="sheet-foot">
        <button class="btn btn-ghost" id="am-cancel">Annuler</button>
        <button class="btn btn-primary" id="am-save">Enregistrer</button>
      </div>
    `;
    document.getElementById("am-close").onclick = ()=>APP.closeOverlay(cfg.overlayId);
    document.getElementById("am-back").onclick = ()=>{ view="list"; renderList(); };
    document.getElementById("am-cancel").onclick = ()=>{ view="list"; renderList(); };
    wireKindSection();
    wireDateRangeSection();
    document.getElementById("am-save").onclick = ()=>{
      const sg = document.getElementById("am-super-input").value.trim();
      const all = rules();
      const keepOthers = all.filter(r=>{
        if(!cfg.hasDates) return r[cfg.baseField] !== editingBase;
        if(isDatedOccurrence){
          // Occurrence datée : on ne retire que l'éventuelle règle EXACTE déjà existante pour cette
          // occurrence précise (comparaison stricte sur le libellé complet) — jamais une règle base
          // générique, même si elle s'applique aussi à ce nom de base, pour ne jamais affecter une autre
          // occurrence du même nom de base.
          return r.full !== editingFull;
        }
        // Occurrence sans suffixe de date : règle globale classique par nom de base (comportement inchangé).
        return !(r[cfg.baseField]===editingBase && !r.full);
      });
      if(sg){
        const entry = {[cfg.baseField]: editingBase, [cfg.superField]: sg};
        if(cfg.hasDates && isDatedOccurrence) entry.full = editingFull;
        keepOthers.push(entry);
      }
      Store.settings[cfg.settingsKey] = keepOthers;
      saveKindSection();
      saveDateRangeSection();
      Store.saveSettings();
      APP.showToast("Mis à jour");
      view="list"; renderList();
    };
  }

  /* "Toutes les règles" : édition libre de toutes les règles à la fois (réorganisation manuelle complète) */
  function renderAll(){
    const sheet = document.getElementById(cfg.sheetId);
    const rls = rules().filter(r=>!r.full).map(r=>({base:r[cfg.baseField], superName:r[cfg.superField]}));
    const occurrenceRulesCount = rules().filter(r=>r.full).length;
    sheet.innerHTML = `
      <div class="sheet-handle"></div>
      <div class="sheet-head"><h2>${cfg.title}</h2><button class="icon-btn" id="am-close">${ICONS.close}</button></div>
      <div class="sheet-body">
        <div style="font-size:12.5px;color:var(--text-sub);margin-bottom:10px;line-height:1.5;">
          Toutes les règles enregistrées. Modifiez ou supprimez librement, ou ajoutez-en de nouvelles, puis enregistrez.
          ${occurrenceRulesCount ? ` ${occurrenceRulesCount} règle${occurrenceRulesCount>1?"s":""} propre${occurrenceRulesCount>1?"s":""} à une occurrence datée précise ${occurrenceRulesCount>1?"ne sont":"n'est"} pas modifiable${occurrenceRulesCount>1?"s":""} ici (pour ne jamais risquer de la transformer en règle globale) — utilisez « Par ${cfg.superLabel} » pour ces occurrences.` : ""}
        </div>
        ${viewToggleHtml()}
        ${datalistsHtml()}
        <div id="am-rows">${rls.length ? rls.map(r=>ruleRowHtml(r,true)).join("") : ""}</div>
        <button class="btn btn-ghost btn-block" id="am-add-row">+ Ajouter une règle</button>
      </div>
      <div class="sheet-foot">
        <button class="btn btn-ghost" id="am-cancel">Annuler</button>
        <button class="btn btn-primary" id="am-save">Enregistrer tout</button>
      </div>
    `;
    document.getElementById("am-close").onclick = ()=>APP.closeOverlay(cfg.overlayId);
    wireViewToggle();
    wireRowDeletes();
    document.getElementById("am-add-row").onclick = ()=>{
      document.getElementById("am-rows").insertAdjacentHTML("beforeend", ruleRowHtml({base:"",superName:""}, true));
      wireRowDeletes();
    };
    document.getElementById("am-cancel").onclick = ()=>{ view="list"; renderList(); };
    document.getElementById("am-save").onclick = ()=>{
      const rows = Array.from(document.querySelectorAll("#am-rows > .card"));
      const newRules = [];
      rows.forEach(row=>{
        const baseInput = row.querySelector('[data-field="base"]');
        const bs = baseInput ? baseInput.value.trim() : "";
        const sg = row.querySelector('[data-field="super"]').value.trim();
        const entry = {[cfg.baseField]:bs, [cfg.superField]:sg};
        if(bs && sg) newRules.push(entry);
      });
      // Les règles propres à une occurrence datée précise (`full`) ne passent jamais par ce tableau brut :
      // on les préserve telles quelles pour ne jamais les rétrograder silencieusement en règle globale.
      const preserved = rules().filter(r=>r.full);
      Store.settings[cfg.settingsKey] = newRules.concat(preserved);
      Store.saveSettings();
      APP.showToast("Règles enregistrées ("+newRules.length+")");
      renderAll();
    };
  }

  function render(){
    if(view==="all") renderAll();
    else if(view==="edit") renderEdit();
    else if(view==="bulk") renderBulk();
    else renderList();
  }

  function open(){
    view="list"; searchTerm=""; selectMode=false; selected.clear(); openSections.clear(); editingBase=null; editingFull=null;
    renderList();
    APP.openOverlay(cfg.overlayId);
  }
  return {open};
}

/* ================= GÉRER LES TYPES DE COMPTE ================= */
(function(){
"use strict";
const U = window.__SF_UTILS;
const Store = window.__SF_STORE;
const AGG = window.__SF_AGG;
const APP = window.__SF_APP;
const ICONS = U.ICONS;

function distinctAccountTypeValues(){
  const set = new Set(["Courant","Épargne"]);
  Object.values(Store.settings.accountTypes||{}).forEach(v=>{ if(v) set.add(v); });
  return Array.from(set);
}

function renderAcctType(){
  const sheet = document.getElementById("sheet-accttype");
  const comptes = AGG.distinctValues(Store.transactions, "compte");
  const typeOptions = distinctAccountTypeValues();
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h2>Types de compte</h2><button class="icon-btn" id="at-close">${ICONS.close}</button></div>
    <div class="sheet-body">
      <div style="font-size:12.5px;color:var(--text-sub);margin-bottom:10px;line-height:1.5;">
        Indiquez le type de chaque compte (Courant, Épargne, ou un autre type de votre choix) — utilisé pour regrouper vos comptes dans les listes — ainsi qu'un acronyme court, affiché en badge sur chaque transaction dans l'onglet Transactions (par défaut, dérivé automatiquement des initiales du nom).
      </div>
      <datalist id="at-type-list">${typeOptions.map(t=>`<option value="${U.escHtml(t)}">`).join("")}</datalist>
      <div class="card" style="padding:4px 6px;">
        ${comptes.map(c=>{
          const current = AGG.getAccountTypeDisplay(c.value);
          const currentAcronym = (Store.settings.accountAcronyms||{})[c.value] || "";
          return `
          <div class="rowline" data-compte="${U.escHtml(c.value)}" style="flex-direction:column;align-items:stretch;gap:8px;">
            <span style="font-weight:600;font-size:14px;">${U.escHtml(c.value)}</span>
            <div style="display:flex;gap:8px;align-items:center;">
              <div class="chiprow" data-quickchips style="flex:0 0 auto;">
                <div class="chip-opt ${current==='Courant'?'selected':''}" data-v="Courant">Courant</div>
                <div class="chip-opt ${current==='Épargne'?'selected':''}" data-v="Épargne">Épargne</div>
              </div>
              <input type="text" class="search-mini" style="margin:0;flex:1;" list="at-type-list" data-type-input placeholder="Autre type…" value="${U.escHtml(current)}">
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
              <span style="font-size:11.5px;color:var(--text-sub);flex:0 0 auto;">Acronyme</span>
              <input type="text" class="search-mini" style="margin:0;flex:1;text-transform:uppercase;" maxlength="4" data-acronym-input placeholder="${U.escHtml(AGG.getAccountAcronym(c.value))}" value="${U.escHtml(currentAcronym)}">
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>
  `;
  document.getElementById("at-close").onclick = ()=>APP.closeOverlay("overlay-accttype");
  function setType(row, value){
    const compte = row.dataset.compte;
    Store.settings.accountTypes = Store.settings.accountTypes || {};
    Store.settings.accountTypes[compte] = value;
    Store.saveSettings();
    row.querySelector('[data-type-input]').value = value;
    row.querySelectorAll('[data-quickchips] .chip-opt').forEach(chip=>{
      chip.classList.toggle('selected', chip.dataset.v===value);
    });
  }
  function setAcronym(row, value){
    const compte = row.dataset.compte;
    Store.settings.accountAcronyms = Store.settings.accountAcronyms || {};
    const v = value.trim().toUpperCase().slice(0,4);
    if(v) Store.settings.accountAcronyms[compte] = v;
    else delete Store.settings.accountAcronyms[compte];
    Store.saveSettings();
    row.querySelector('[data-acronym-input]').value = v;
  }
  document.querySelectorAll("#sheet-accttype [data-compte]").forEach(row=>{
    row.querySelectorAll('[data-quickchips] .chip-opt').forEach(chip=>{
      chip.onclick = ()=> setType(row, chip.dataset.v);
    });
    const input = row.querySelector('[data-type-input]');
    input.onchange = ()=>{
      const v = input.value.trim();
      if(v) setType(row, v);
    };
    const acronymInput = row.querySelector('[data-acronym-input]');
    acronymInput.onchange = ()=> setAcronym(row, acronymInput.value);
  });
}
function openAcctType(){
  renderAcctType();
  APP.openOverlay("overlay-accttype");
}
window.__SF_ACCTTYPE = {open: openAcctType};
})();
/* ================= GÉRER LES CATÉGORIES (classification Revenus / Dépenses) ================= */
(function(){
"use strict";
const U = window.__SF_UTILS;
const Store = window.__SF_STORE;
const AGG = window.__SF_AGG;
const APP = window.__SF_APP;
const ICONS = U.ICONS;

let selectMode = false;
let selected = new Set();

function renderCatMgr(){
  const sheet = document.getElementById("sheet-catmgr");
  const items = AGG.distinctValuesCategorieSorted(Store.transactions); // [{value,count,kind}]
  const overrides = Store.settings.categoryTypeOverride || {};

  const rowHtml = it=>{
    const isOverridden = !!overrides[it.value];
    const isSel = selected.has(it.value);
    if(selectMode){
      return `<div class="check-item ${isSel?'selected':''}" data-sel="${U.escHtml(it.value)}" style="cursor:pointer;">
        <span class="cbox">${ICONS.check}</span>
        <span class="lbl">${U.escHtml(it.value)}${isOverridden?' <span style="color:var(--primary);font-weight:700;">·</span>':''}</span>
        <span class="cnt">${it.count}</span>
      </div>`;
    }
    return `<div class="check-item" data-base="${U.escHtml(it.value)}" style="cursor:default;">
      <span class="lbl">${U.escHtml(it.value)}${isOverridden?' <span style="color:var(--primary);font-weight:700;font-size:11px;"> (manuel)</span>':''}</span>
      <span class="cnt">${it.count}</span>
    </div>`;
  };
  const inc = items.filter(i=>i.kind==="Income");
  const exp = items.filter(i=>i.kind==="Expense");

  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h2>Gérer les catégories</h2><button class="icon-btn" id="cm-close">${ICONS.close}</button></div>
    <div class="sheet-body">
      <div style="font-size:12.5px;color:var(--text-sub);margin-bottom:10px;line-height:1.5;">
        Une catégorie est classée Revenus ou Dépenses automatiquement selon vos transactions. Sélectionnez-en plusieurs pour forcer manuellement leur classement (utile pour l'affichage groupé Revenus/Dépenses).
      </div>
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <div style="flex:1;"></div>
        <button class="btn btn-ghost btn-sm" id="cm-selectmode-btn">${selectMode ? "Terminer" : "Sélectionner"}</button>
      </div>
      <div class="field-label" style="margin-top:0;">Revenus</div>
      <div class="check-list" style="max-height:none;">
        ${inc.length ? inc.map(rowHtml).join("") : `<div style="padding:14px;color:var(--text-faint);font-size:13px;">Aucune</div>`}
      </div>
      <div class="field-label">Dépenses</div>
      <div class="check-list" style="max-height:none;">
        ${exp.length ? exp.map(rowHtml).join("") : `<div style="padding:14px;color:var(--text-faint);font-size:13px;">Aucune</div>`}
      </div>
      ${selectMode ? `<div style="height:70px;"></div>` : ""}
    </div>
    ${selectMode && selected.size>0 ? `
    <div class="sheet-foot" style="flex-wrap:wrap;">
      <button class="btn btn-ghost" id="cm-clear-sel" style="flex:1 1 100%;">${selected.size} sélectionnée${selected.size>1?"s":""} · Effacer</button>
      <button class="btn btn-primary" id="cm-mark-income" style="flex:1;">Marquer Revenus</button>
      <button class="btn btn-primary" id="cm-mark-expense" style="flex:1;">Marquer Dépenses</button>
    </div>` : ""}
  `;
  document.getElementById("cm-close").onclick = ()=>APP.closeOverlay("overlay-catmgr");
  document.getElementById("cm-selectmode-btn").onclick = ()=>{
    selectMode = !selectMode;
    if(!selectMode) selected.clear();
    renderCatMgr();
  };
  if(selectMode){
    document.querySelectorAll("#sheet-catmgr [data-sel]").forEach(el=>{
      el.onclick = ()=>{
        const v = el.dataset.sel;
        if(selected.has(v)) selected.delete(v); else selected.add(v);
        renderCatMgr();
      };
    });
    const clearBtn = document.getElementById("cm-clear-sel");
    if(clearBtn) clearBtn.onclick = ()=>{ selected.clear(); renderCatMgr(); };
    const applyType = (type)=>{
      Store.settings.categoryTypeOverride = Store.settings.categoryTypeOverride || {};
      selected.forEach(v=>{ Store.settings.categoryTypeOverride[v] = type; });
      Store.saveSettings();
      APP.showToast(selected.size+" catégorie"+(selected.size>1?"s marquées":" marquée")+" "+(type==="Income"?"Revenus":"Dépenses"));
      selected.clear();
      selectMode = false;
      renderCatMgr();
      APP.refreshCurrentTab();
    };
    const incBtn = document.getElementById("cm-mark-income");
    if(incBtn) incBtn.onclick = ()=> applyType("Income");
    const expBtn = document.getElementById("cm-mark-expense");
    if(expBtn) expBtn.onclick = ()=> applyType("Expense");
  }
}
function openCatMgr(){
  selectMode = false; selected.clear();
  renderCatMgr();
  APP.openOverlay("overlay-catmgr");
}
window.__SF_CATMGR = {open: openCatMgr};
})();
(function(){
"use strict";
const Store = window.__SF_STORE;
const APP = window.__SF_APP;

async function init(){
  document.getElementById("app").innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:60vh;color:#9AA0AC;font-size:14px;">Chargement…</div>`;
  await Store.load();
  window.__SF_FILTERS.restore();
  APP.buildShell();
  APP.refreshCurrentTab();

  const mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
  if(mq && mq.addEventListener){
    mq.addEventListener("change", ()=>{
      if(Store.settings.theme==="auto"){
        document.documentElement.removeAttribute("data-theme");
        if(mq.matches) document.documentElement.setAttribute("data-theme","dark");
        APP.updateThemeColorMeta();
        APP.refreshCurrentTab();
      }
    });
  }
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
})();

</script>
